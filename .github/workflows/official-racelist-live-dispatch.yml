name: Official racelist raw source observation (research only)
on:
  # One-off evidence observation: this workflow file's first merge on 2026-11-03.
  # The in-job JST date gate rejects all other calendar dates.
  push:
    branches: [main]
    paths: ['.github/workflows/official-racelist-live-dispatch.yml']
  workflow_dispatch:
    inputs:
      race_code:
        description: 'Exact YYYYMMDDJJRR race code for current JST day'
        required: true
        type: string
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture official racecard raw bytes with immutable timestamp
        env:
          RACE_CODE: ${{ github.event_name == 'push' && '202611030212' || inputs.race_code }}
        run: |
          python - <<'PY'
          import json, os, re
          from datetime import datetime
          from pathlib import Path
          from research_model import JST
          from scripts.capture_official_racelist_receipt import capture
          code = os.environ["RACE_CODE"]
          if not re.fullmatch(r"20[0-9]{10}", code) or code[:8] != datetime.now(JST).strftime("%Y%m%d"):
              raise SystemExit("invalid or noncurrent JST race code")
          report = capture(code, "evidence", "racelist" + os.environ["GITHUB_RUN_ID"])
          Path("reports").mkdir(exist_ok=True)
          Path("reports/racelist.json").write_text(json.dumps(report, ensure_ascii=False, indent=2))
          print(json.dumps(report, ensure_ascii=False))
          if report["status"] != "official_racelist_html_observed_research_only":
              raise SystemExit("official racecard capture failed")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-racelist-original-${{ github.run_id }}
          path: |
            evidence/
            reports/
          retention-days: 14
          if-no-files-found: warn
