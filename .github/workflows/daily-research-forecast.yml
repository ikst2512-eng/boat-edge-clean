name: Daily research forecast capture
on:
  schedule:
    # 08:10 / 08:35 / 09:00 JST = previous-day 23:10 / 23:35 / same-day 00:00 UTC
    - cron: '10,35 23 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-research-forecast
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect research-only forecasts from published cards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p capture-evidence
          python collect_research_daily.py 2>&1 | tee capture-evidence/collection.log
      - name: Persist research-only snapshots to Git
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "run_id=$GITHUB_RUN_ID checkout_sha=$GITHUB_SHA"
            if [ ! -d research_snapshots ]; then
              echo 'No research forecast files produced'
            else
              git add -- research_snapshots/
              # Only newly added twelve-digit race JSON files are allowed.
              if git diff --cached --name-only --diff-filter=ACDMRTUX -- research_snapshots/ | grep -q .; then
                echo 'ERROR: existing research snapshot changed or deleted' >&2
                exit 1
              fi
              if git diff --cached --name-only --diff-filter=A -- research_snapshots/ | grep -Ev '^research_snapshots/[0-9]{12}[.]json$' | grep -q .; then
                echo 'ERROR: invalid research snapshot path' >&2
                exit 1
              fi
              if git diff --cached --quiet; then
                echo 'No new cutoff-eligible research forecasts'
              else
                mkdir -p capture-evidence/new-snapshots
                while IFS= read -r -d '' file; do
                  cp -- "$file" "capture-evidence/new-snapshots/$(basename "$file")"
                done < <(git diff --cached --name-only --diff-filter=A -z -- research_snapshots/)
                (cd capture-evidence/new-snapshots && sha256sum -- *.json) > capture-evidence/snapshot-sha256.txt
                git -c user.name='research-capture-bot' -c user.email='research-capture-bot@users.noreply.github.com' commit -m 'Archive research forecasts captured before cutoff'
                git push
              fi
            fi
          } 2>&1 | tee capture-evidence/persistence.log
      - name: Preserve collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-research-collection-${{ github.run_id }}
          path: |
            capture-evidence/collection.log
            capture-evidence/persistence.log
            capture-evidence/new-snapshots/*.json
            capture-evidence/snapshot-sha256.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Publish diagnostic summary
        if: always()
        shell: bash
        run: |
          echo '## Research-only daily collection' >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Git SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo '- Output: daily-research-collection artifact (30 days)' >> "$GITHUB_STEP_SUMMARY"
          echo '- Research only: not formal Fresh validation or site publication proof' >> "$GITHUB_STEP_SUMMARY"
