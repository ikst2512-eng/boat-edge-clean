name: Research-only all-mode scenario bridge CI

on:
  pull_request:
    paths:
      - 'scenario_four_mode_bridge.py'
      - 'test_scenario_four_mode_bridge.py'
      - 'scenario_first_head_research.py'
      - 'test_scenario_first_head_research.py'
      - 'scenario_feature_effect_probe.py'
      - 'test_scenario_feature_effect_probe.py'
      - 'scenario_official_exhibition_projection.py'
      - 'test_scenario_official_exhibition_projection.py'
      - 'scenario_exhibition_all_mode_runner.py'
      - 'test_scenario_exhibition_all_mode_runner.py'
      - 'scenario_official_pair_research_input.py'
      - 'scenario_actual_pair_four_mode_replay.py'
      - 'test_scenario_official_pair_research_input.py'
      - '.github/workflows/scenario-official-pair-real-inject-once.yml'
      - 'scenario_mode_specific_exhibition_end_to_end.py'
      - 'scenario_archived_rates_ablation.py'
      - 'scenario_future_three_original_gateway.py'
      - 'scenario_future_local_candidate_handoff.py'
      - 'scenario_future_github_research_adapter.py'
      - 'scenario_future_archived_receipts_to_candidate.py'
      - 'test_scenario_future_archived_receipts_to_candidate.py'
      - 'scenario_official_st_intake_diagnostic.py'
      - 'scenario_flagged_st_feature_study.py'
      - 'test_scenario_flagged_st_feature_study.py'
      - 'scenario_signed_st_four_mode_shadow.py'
      - 'test_scenario_signed_st_four_mode_shadow.py'
      - 'scenario_signed_st_official_input_adapter.py'
      - 'scenario_signed_st_racelist_rates.py'
      - 'scenario_signed_st_registered_shadow.py'
      - 'test_scenario_signed_st_registered_shadow.py'
      - 'scenario_signed_st_future_pre_t12_handoff.py'
      - 'test_scenario_signed_st_future_pre_t12_handoff.py'
      - 'scenario_signed_st_future_pre_t12_cli.py'
      - 'test_scenario_signed_st_future_pre_t12_cli.py'
      - 'scenario_signed_st_cross_ledger_audit.py'
      - 'test_scenario_signed_st_cross_ledger_audit.py'
      - 'scenario_signed_st_source_remote_witness.py'
      - 'test_scenario_signed_st_source_remote_witness.py'
      - 'scenario_signed_st_F_remote_candidate_witness.py'
      - 'test_scenario_signed_st_F_remote_candidate_witness.py'
      - 'scenario_escape_prior_first_head_sensitivity.py'
      - 'test_scenario_escape_prior_first_head_sensitivity.py'
      - 'scenario_exhibition_course_head_research.py'
      - 'test_scenario_exhibition_course_head_research.py'
      - 'scenario_official_K_training_roster_bridge.py'
      - 'test_scenario_official_K_training_roster_bridge.py'
      - 'research/signed_F_four_mode_future_protocol_20261111.json'
      - 'research/flagged_st_signed_feature_feasibility_20261111.json'
      - 'test_scenario_official_st_intake_diagnostic.py'
      - 'test_scenario_future_github_research_adapter.py'
      - 'test_scenario_future_local_candidate_handoff.py'
      - 'research/four_mode_triple_source_forward_protocol_20261110.json'
      - 'test_scenario_future_protocol_freeze.py'
      - 'scenario_official_racelist_rates.py'
      - 'test_scenario_official_racelist_rates.py'
      - 'test_scenario_future_three_original_gateway.py'
      - 'test_scenario_archived_rates_ablation.py'
      - '.github/workflows/scenario-official-pair-real-inject-once.yml'
      - 'test_scenario_mode_specific_exhibition_end_to_end.py'
      - 'docs/research/scenario_all_mode_bridge_1708.md'
      - '.github/workflows/scenario-four-mode-bridge-pr.yml'

permissions:
  contents: read

jobs:
  scenario-bridge:
    runs-on: ubuntu-latest
    steps:
      # This Nov10 preregistered study pins TEN source Git blobs.
      # Default pull_request checkout tests GitHub's synthetic merge commit,
      # which now includes production/main T12 fixes to research_model.py.
      # Testing that merge would silently substitute a different model and
      # fail the study's immutable-method guard. Checkout the exact PR head.
      # This CI therefore verifies the FROZEN research only, not compatibility
      # with the latest production main (assess separately before any merge).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Confirm exact registered research head and model blob
        env:
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PR_HEAD"
          test "$(git hash-object research_model.py)" = "19137116f8ec79d467f73c57c537a9a95f50110d"
          echo "FROZEN_RESEARCH_PR_HEAD=$EXPECTED_PR_HEAD"
          echo "COMPATIBILITY_WITH_UPDATED_MAIN_NOT_CERTIFIED"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check scenario bridge safety and all four mode contracts
        run: python -m unittest -v test_scenario_four_mode_bridge test_scenario_first_head_research test_scenario_feature_effect_probe test_scenario_official_exhibition_projection test_scenario_official_pair_research_input test_scenario_archived_rates_ablation test_scenario_future_three_original_gateway test_scenario_official_racelist_rates test_scenario_future_protocol_freeze test_scenario_future_local_candidate_handoff test_scenario_future_github_research_adapter test_scenario_future_archived_receipts_to_candidate test_scenario_official_st_intake_diagnostic test_scenario_flagged_st_feature_study test_scenario_signed_st_four_mode_shadow test_scenario_signed_st_registered_shadow test_scenario_signed_st_future_pre_t12_handoff test_scenario_signed_st_future_pre_t12_cli test_scenario_signed_st_cross_ledger_audit test_scenario_signed_st_source_remote_witness test_scenario_signed_st_F_remote_candidate_witness test_scenario_escape_prior_first_head_sensitivity test_scenario_exhibition_course_head_research test_scenario_official_K_training_roster_bridge
      - name: Materialize pinned existing #1698 conditional lab for integration (read-only)
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin e152b57033f825e02343b004a9c013a8998f9954
          mkdir -p "$RUNNER_TEMP/position1698"
          git show e152b57033f825e02343b004a9c013a8998f9954:position_sensitive_conditioned_lab.py > "$RUNNER_TEMP/position1698/position_sensitive_conditioned_lab.py"
          test "$(git hash-object "$RUNNER_TEMP/position1698/position_sensitive_conditioned_lab.py")" = "0019978a4e27a1235d0b466c11f514bd7105f261"
      - name: Confirm reused #1693 raw semantic replayer has EXACT reviewed code identity
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin d93349e4855d6dc1026dfad1795a99632d7e9a35
          mkdir -p "$RUNNER_TEMP/semantic1693"
          git show d93349e4855d6dc1026dfad1795a99632d7e9a35:four_mode_official_raw_semantic_replay.py > "$RUNNER_TEMP/semantic1693/four_mode_official_raw_semantic_replay.py"
          test "$(git hash-object "$RUNNER_TEMP/semantic1693/four_mode_official_raw_semantic_replay.py")" = "2f5af32201e3060c57b5a999f0389ce67c3046cb"
          git show d93349e4855d6dc1026dfad1795a99632d7e9a35:four_mode_official_future_lineage_preflight.py > "$RUNNER_TEMP/semantic1693/four_mode_official_future_lineage_preflight.py"
          test "$(git hash-object "$RUNNER_TEMP/semantic1693/four_mode_official_future_lineage_preflight.py")" = "88caa6ee3b324df58e60397d74055a075a8de6a9"
      - name: Verify source bridge rejects two REAL incomplete triple archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/13749433042/zip" \
            --output "$RUNNER_TEMP/real-triple-incomplete-bridge.zip"
          echo "7eddf4704635613f7d8cb18a03f07bcc1f9037efafb52ee26a3723b333a30354  $RUNNER_TEMP/real-triple-incomplete-bridge.zip" | sha256sum --check --status
          python - <<'PY'
          import json,os
          from pathlib import Path
          from zipfile import ZipFile
          from scenario_future_archived_receipts_to_candidate import build_archive_bundle
          from scripts.audit_three_official_t12_originals import audit_three_originals
          tmp=Path(os.environ["RUNNER_TEMP"])
          unpack=tmp/"real-triple-incomplete-bridge"
          with ZipFile(tmp/"real-triple-incomplete-bridge.zip") as zipped:
              assert zipped.testzip() is None
              names=zipped.namelist()
              assert len(names)==len(set(names))==28
              assert all(not p.startswith("/") and ".." not in Path(p).parts
                         for p in names)
              zipped.extractall(unpack)
          count=0
          for race in ("202611101207","202611100708"):
              base=unpack/"official_joint_evidence"/"observations"
              day=race[:8]
              dirs=[base/(kind+"_run42786724704")/day/race
                    for kind in ("card","before","odds")]
              audit=audit_three_originals(*dirs)
              assert audit["three_originals_hash_verified"] is True
              assert audit["all_research_components_observed_by_t12"] is False
              assert audit["missing_components"]
              called=[]
              def forbidden_parser(*args):
                  called.append("unexpected-parser")
                  raise AssertionError("source bridge must reject before math")
              try:
                  build_archive_bundle(
                      *dirs,"2026-11-11T15:07:00+09:00",
                      before_parser=forbidden_parser)
              except ValueError as exc:
                  assert str(exc)=="three_official_T12_originals_incomplete",str(exc)
              else:
                  raise AssertionError("REAL_INCOMPLETE_SOURCE_GENERATED_CANDIDATE")
              assert not called
              count+=1
          assert count==2
          print(json.dumps({
              "real_archives_preflight_rejected":count,
              "same_race_raw_original_hashes_verified":True,
              "new_four_mode_candidate_generated":0,
              "independent_remote_first_receipt_verified":False,
              "formal":False,
          },sort_keys=True))
          PY
      # Historical *input-only* contract test. No prediction generation, no
      # retrospective candidate, no Git publication or prospective scoring.
      - name: Recheck one GENUINE complete official triple through frozen parsers (input only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/13849470485/zip" \
            --output "$RUNNER_TEMP/real-triple-complete-input-only.zip"
          echo "e4ff7c2f080ef526a74c036fc829153e8965903a83ab488ed3b134a5c10edef6  $RUNNER_TEMP/real-triple-complete-input-only.zip" | sha256sum --check --status
          python - <<'PY'
          import hashlib, importlib.util, json, os, stat, sys
          from pathlib import Path
          from zipfile import ZipFile
          from scripts.audit_three_official_t12_originals import audit_three_originals
          from scenario_future_archived_receipts_to_candidate import build_archive_bundle
          from scenario_future_local_candidate_handoff import _git_blob_sha1
          tmp=Path(os.environ["RUNNER_TEMP"])
          archive=tmp/"real-triple-complete-input-only.zip"
          unpack=tmp/"real-triple-complete-input-only"
          unpack.mkdir(exist_ok=False)
          with ZipFile(archive) as zipped:
              assert zipped.testzip() is None
              infos=zipped.infolist()
              names=[i.filename for i in infos]
              assert len(names)==len(set(names)) and len(names)<100
              assert all(not i.filename.startswith("/") and ".." not in Path(i.filename).parts
                         and not stat.S_ISLNK(i.external_attr >> 16) for i in infos)
              zipped.extractall(unpack)
          # This is the already-ended Nov11 Shimonoseki 11R. Never publish
          # a result-after-the-fact candidate or count it in the 300+300 study.
          race="202611111911"
          base=unpack/"official_joint_evidence"/"observations"
          groups=[]
          for prefix in ("racelist_","before_","odds_"):
              found=sorted(base.glob(prefix+"*/"+race[:8]+"/"+race))
              assert len(found)==1,(prefix,found)
              groups.append(found[0])
          audit=audit_three_originals(*groups)
          assert audit["race_code"]==race
          assert audit["three_originals_hash_verified"] is True
          assert audit["all_research_components_observed_by_t12"] is True
          assert audit["missing_components"]==[]
          assert len(audit["component_checks"])==12
          assert all(x is True for x in audit["component_checks"].values())
          from scenario_official_st_intake_diagnostic import diagnose_archived_triple
          intake=diagnose_archived_triple(*groups)
          assert intake["source_complete_12_of_12"] is True
          assert intake["classification"]=="complete_three_originals_F_L_ST_rejected_by_frozen_parser"
          assert intake["flagged_st_count"]==5
          assert intake["model_executed"] is False and intake["formal"] is False
          print("FROZEN_ST_INTAKE_REAL_5_FLAG_DIAGNOSTIC "+json.dumps(intake,sort_keys=True))
          from scenario_flagged_st_feature_study import encode_archived_triple
          signed=encode_archived_triple(*groups)
          assert signed["flag_F_count"]==5
          assert signed["flag_L_count"]==0
          assert signed["numeric_display_count"]==1
          assert [r["signed_st_seconds_decimal_string"] for r in signed["exhibition_st_by_boat"]]==[
              "-0.05","-0.11","0.10","-0.02","-0.04","-0.03"]
          assert signed["model_executed"] is False and signed["formal"] is False
          from scenario_signed_st_official_input_adapter import extract_archived_signed_F_input
          try:
              verified_input=extract_archived_signed_F_input(*groups)
          except ValueError as exc:
              if str(exc)=="official_rate_or_start_out_of_bounds":
                  from html import unescape
                  from scenario_official_racelist_rates import ROW, THREE, ST, _CellText
                  raw=(groups[0]/"racelist.html").read_bytes()
                  rows=[]
                  for match in ROW.finditer(unescape(raw.decode("utf-8","replace"))):
                      cells=_CellText()
                      cells.feed("<tr>"+match.group("cells")+"</tr>")
                      cells.close()
                      if len(cells.cells)>=5:
                          national=THREE.fullmatch(cells.cells[3]["text"])
                          local=THREE.fullmatch(cells.cells[4]["text"])
                          start=ST.fullmatch(cells.cells[2]["text"])
                          rows.append({
                              "boat":match.group(1),
                              "national_3":list(national.groups()) if national else None,
                              "local_3":list(local.groups()) if local else None,
                              "average_ST":start.group(1) if start else None,
                          })
                  print("REAL_OFFICIAL_RATE_RANGE_PROBE "+json.dumps({
                      "race_code":race,"official_original_rows":rows,
                      "source_error":str(exc),"forecast_generated":False,
                      "formal":False},sort_keys=True))
              raise
          assert verified_input["independent_original_component_checks"]==12
          assert len(verified_input["six_official_racelist_national_win_rates"])==6
          assert len(verified_input["six_official_exhibition_times_s"])==6
          assert verified_input["signed_F_feature"]["vector_sha256"]==signed["vector_sha256"]
          assert verified_input["model_executed"] is False
          assert verified_input["candidate_created"] is False
          # One pure post-event mathematical regression of the F-aware
          # REGISTERED shadow. It never publishes a historical prediction.
          sys.path.insert(0,str(tmp/"position1698"))
          from position_sensitive_conditioned_lab import experimental_conditional_board
          from scenario_signed_st_registered_shadow import archived_signed_F_four_mode_math_only
          shadow=archived_signed_F_four_mode_math_only(
              *groups,experimental_conditional_board)
          assert shadow["registered_method_sources_checked_locally"] is True
          assert shadow["actual_original_source_race_card_beforeinfo_odds120_reparsed"] is True
          assert shadow["historical_archive_replay_not_predeadline_forecast"] is True
          assert shadow["prospective_candidate_generated"] is False
          assert shadow["results_or_payouts_read"] is False
          assert shadow["formal"] is False and shadow["promotion_allowed"] is False
          from datetime import datetime, timezone, timedelta
          from scenario_signed_st_future_pre_t12_handoff import run_one_shot_unpublished
          try:
              run_one_shot_unpublished(
                  *groups,experimental_conditional_board,
                  lambda:datetime.now(timezone(timedelta(hours=9))))
          except ValueError as exc:
              assert str(exc)=="signed_F_future_T12_cutoff_or_current_clock_failed",str(exc)
          else:
              raise AssertionError("HISTORICAL_20261111_RACE_CANNOT_BECOME_FUTURE_F_CANDIDATE")
          # Exercise the REAL operator entrypoint as a separate process.
          # It uses current OS time, no injectable date flag and no writer.
          import subprocess
          operator=subprocess.run([
              sys.executable,"scenario_signed_st_future_pre_t12_cli.py",
              "--card-dir",str(groups[0]),
              "--before-dir",str(groups[1]),
              "--odds-dir",str(groups[2]),
              "--pinned-1698-file",str(tmp/"position1698"/"position_sensitive_conditioned_lab.py"),
          ],capture_output=True,text=True,timeout=20)
          assert operator.returncode!=0,operator.stdout
          assert "signed_F_future_T12_cutoff_or_current_clock_failed" in operator.stderr
          assert operator.stdout.strip()=="",operator.stdout
          print("REAL_HISTORICAL_F_RACE_REJECTED_BY_ACTUAL_CLOCK_OPERATOR "+json.dumps({
              "race_code":race,"operator_exit_nonzero":True,
              "candidate_stdout_empty":True,"Git_written":False,"formal":False},sort_keys=True))
          print("REAL_ARCHIVED_F_MATH_VALID_BUT_FUTURE_T12_HANDOFF_DENIED "+json.dumps({
              "race_code":race,"historical_replay_only":True,
              "candidate_created":False,"Git_written":False,"formal":False},sort_keys=True))
          assert {name:len(x["tickets"]) for name,x in shadow["math_4_modes_signed_F"].items()}=={
              "narrow":5,"hit":10,"balance":16,"hole":22}
          assert {name:len(x["tickets"]) for name,x in shadow["math_4_modes_ST_zero_control"].items()}=={
              "narrow":5,"hit":10,"balance":16,"hole":22}
          print("REAL_F_SIGNED_REGISTERED_4MODE_ARCHIVE_MATH_ONLY "+json.dumps({
              "race_code":race,
              "F_count":shadow["F_boats"],
              "input_sha256":shadow["signed_feature_vector_sha256"],
              "official_originals":shadow["source_original_sha256"],
              "signed_mode_board_sha256":{
                  k:v["full_120_mixture_sha256"] for k,v in shadow["math_4_modes_signed_F"].items()},
              "control_mode_board_sha256":{
                  k:v["full_120_mixture_sha256"] for k,v in shadow["math_4_modes_ST_zero_control"].items()},
              "candidate_created":False,"formal":False,"results_read":False},sort_keys=True))
          print("FROZEN_F_REAL_SIX_RACER_MODEL_INPUT_ONLY_PASS "+json.dumps({
              "race_code":race,"national_rates":verified_input["six_official_racelist_national_win_rates"],
              "six_exhibition_times_s":verified_input["six_official_exhibition_times_s"],
              "all_real_sources_sha256":verified_input["source_sha256"],
              "model_executed":False,"candidate_created":False,"formal":False},sort_keys=True))
          print("REAL_F_ST_SIGNED_FEATURE_ONLY_5_FLAG_PASS "+json.dumps({
              "race_code":race,"F":signed["flag_F_count"],
              "L":signed["flag_L_count"],
              "source_sha256":signed["beforeinfo_source_sha256"],
              "vector_sha256":signed["vector_sha256"],
              "model_executed":signed["model_executed"],
              "formal":signed["formal"]},sort_keys=True))
          # The pinned replay imports its pinned preflight as a sibling module.
          sys.path.insert(0,str(tmp/"semantic1693"))
          frozen_parser=tmp/"semantic1693"/"four_mode_official_raw_semantic_replay.py"
          assert _git_blob_sha1(frozen_parser.read_bytes())=="2f5af32201e3060c57b5a999f0389ce67c3046cb"
          spec=importlib.util.spec_from_file_location("real_source_only_semantic1693",str(frozen_parser))
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          # Complete raw-source evidence does not imply model eligibility.
          # The frozen #1693 parser deliberately refuses F/L exhibition ST.
          # This real race contains F.05 / F.11 / F.02 / F.04 / F.03,
          # so fail CLOSED rather than rewriting the registered selector.
          try:
              build_archive_bundle(
                  *groups,"2026-11-11T19:52:58.374593+09:00",
                  before_parser=module._beforeinfo_features)
          except ValueError as exc:
              assert str(exc)=="official_start_flagged_or_ambiguous_st",str(exc)
          else:
              raise AssertionError("FLAGGED_OFFICIAL_ST_MUST_NOT_GENERATE_MODEL_INPUT")
          print("REAL_COMPLETE_OFFICIAL_TRIPLE_FLAGGED_ST_REJECTED "+json.dumps({
              "race_code":race,"raw_source_components":12,
              "source_complete_but_frozen_parser_ineligible":True,
              "rejection":"official_start_flagged_or_ambiguous_st",
              "research_model_executed":False,
              "retrospective_candidate_generated":False,
              "Git_written":False,"prospective_samples_admitted":0,
              "formal":False,"accuracy_improvement_proven":False},sort_keys=True))
          PY
      # Independent second real 12/12-source-complete observation; again
      # no past forecast reconstruction, outcome reader or Git writer.
      - name: Distinguish complete official source from F-ST-ineligible fixed model (second real race)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/13847911947/zip" \
            --output "$RUNNER_TEMP/real-triple-second-f-st.zip"
          echo "518f04ca8fa674ff11d73d81e393c86d16dd2ef65afcf5f34e2a53a65aa6012b  $RUNNER_TEMP/real-triple-second-f-st.zip" | sha256sum --check --status
          python - <<'PY'
          import importlib.util,json,os,stat,sys
          from pathlib import Path
          from zipfile import ZipFile
          from scripts.audit_three_official_t12_originals import audit_three_originals
          from scenario_future_archived_receipts_to_candidate import build_archive_bundle
          from scenario_future_local_candidate_handoff import _git_blob_sha1
          tmp=Path(os.environ["RUNNER_TEMP"])
          archive=tmp/"real-triple-second-f-st.zip"
          unpack=tmp/"real-triple-second-f-st"
          unpack.mkdir(exist_ok=False)
          with ZipFile(archive) as zipped:
              assert zipped.testzip() is None
              infos=zipped.infolist()
              names=[i.filename for i in infos]
              assert len(names)==len(set(names)) and len(names)<100
              assert all(not i.filename.startswith("/") and ".." not in Path(i.filename).parts
                         and not stat.S_ISLNK(i.external_attr >> 16) for i in infos)
              zipped.extractall(unpack)
          race="202611110711"
          base=unpack/"official_joint_evidence"/"observations"
          groups=[]
          for prefix in ("racelist_","before_","odds_"):
              matches=sorted(base.glob(prefix+"*/"+race[:8]+"/"+race))
              assert len(matches)==1,(prefix,matches)
              groups.append(matches[0])
          report=audit_three_originals(*groups)
          assert report["race_code"]==race
          assert report["three_originals_hash_verified"] is True
          assert report["all_research_components_observed_by_t12"] is True
          assert len(report["component_checks"])==12
          assert all(v is True for v in report["component_checks"].values())
          assert report["missing_components"]==[]
