                throw Error('candidate_history_count_mismatch_'+JSON.stringify(evidence));
              await page.locator('#candidateCards > details.candidate-history-card').first().locator('summary').click();
              if(!(await page.locator('#candidateCards > details.candidate-history-card').first().locator('.candidate-tickets').first().innerText()).includes('-'))
                throw Error('candidate_saved_tickets_missing');
              // Independently saved payout / confirmed finish is part of the
              // user's actual retained-history workflow, not a sample/mock.
              const payoutPage=new URL('candidates.html?date=2026-11-10',process.env.PAGE_URL).href;
              const loaded=await page.goto(payoutPage,{waitUntil:'domcontentloaded',timeout:30000});
              if(!loaded||loaded.status()!==200)throw Error('candidate_payout_page_http_'+loaded?.status());
              await page.locator('#candidateHistoryFilters [data-candidate-filter="all"]').click({timeout:30000});
              const paidCode='202611100401';
              const paidSelector='#candidateCards > details.candidate-history-card[data-race-code="'+paidCode+'"]';
              await page.waitForFunction(code=>{
                const row=document.querySelector('#candidateCards > details.candidate-history-card[data-race-code="'+code+'"]');
                return Boolean(row)&&document.querySelector('#candidateStatus')?.textContent?.includes('払戻照合済み ');
              },paidCode,{timeout:30000});
              const paid=page.locator(paidSelector);
              await paid.locator('summary').click();
              const payoutEvidence=await paid.evaluate(el=>({
                raceCode:el.dataset.raceCode,summary:el.querySelector('summary')?.textContent,
                amount:[...el.querySelectorAll('.candidate-detail p')].map(n=>n.textContent)
                  .find(x=>x.includes('3連単払戻：'))||'',
                researchDisclaimer:el.querySelector('.candidate-detail')?.textContent?.includes('正式認定')||false
              }));
              if(payoutEvidence.raceCode!==paidCode||
                 !payoutEvidence.summary.includes('確定 1-5-2')||
                 !payoutEvidence.amount.includes('8,910円（100円あたり・独立保存原本照合済み）')||
                 !payoutEvidence.researchDisclaimer)
                throw Error('candidate_saved_payout_public_mismatch_'+JSON.stringify(payoutEvidence));
              if(errors.length)throw Error('candidate_page_js_errors_'+errors.join(';').slice(0,300));
              console.log('CLEAN_CANDIDATE_PAYOUT_PUBLIC_PASS',JSON.stringify(payoutEvidence));
              // Verify ALL independently matched Nov 11 payouts visible in the actual
              // published archive, not merely the dispatch or an older sample row.
              // The expected set is built from immutable Git sources during staging.
              const todayManifest=JSON.parse(fs.readFileSync('public/candidate_history/20261111.json','utf8'));
              const paidRows=todayManifest.races.filter(r=>r.payout_status==='verified_independent');
              if(paidRows.length!==todayManifest.payout_verified_count||paidRows.length<34)
                throw Error('nov11_payout_source_set_incomplete_'+JSON.stringify({verified:paidRows.length,declared:todayManifest.payout_verified_count}));
              const todayUrl=new URL('candidates.html?date=2026-11-11',process.env.PAGE_URL).href;
              const todayResponse=await page.goto(todayUrl,{waitUntil:'domcontentloaded',timeout:30000});
              if(!todayResponse||todayResponse.status()!==200)throw Error('nov11_candidate_http_'+todayResponse?.status());
              await page.waitForFunction(()=>document.querySelector('#candidateStatus')?.textContent?.startsWith('保存候補 '),null,{timeout:30000});
              await page.locator('#candidateHistoryFilters [data-candidate-filter="all"]').click();
              const publicToday=await page.evaluate(()=>({
                status:document.querySelector('#candidateStatus')?.textContent?.trim()||'',
                rows:[...document.querySelectorAll('#candidateCards > details.candidate-history-card')].map(n=>({
                  code:n.dataset.raceCode,summary:n.querySelector('summary')?.textContent||'',
                  detail:n.querySelector('.candidate-detail')?.textContent||''
                }))
              }));
              if(publicToday.rows.length!==todayManifest.candidate_count||
                 !publicToday.status.includes('払戻照合済み '+paidRows.length+'件'))
                throw Error('nov11_payout_public_counts_mismatch_'+JSON.stringify({source:todayManifest.candidate_count,public:publicToday.rows.length,status:publicToday.status}));
              const byCode=new Map(publicToday.rows.map(r=>[r.code,r]));
              for(const source of paidRows){
                const displayed=byCode.get(source.race_code);
                const yen=source.payout_yen_per_100.toLocaleString('ja-JP');
                const expectedAmount='3連単払戻：'+yen+'円（100円あたり・独立保存原本照合済み）';
                if(!displayed||!displayed.summary.includes('確定 '+source.finish)||
                   !displayed.detail.includes(expectedAmount))
                  throw Error('nov11_payout_public_row_mismatch_'+source.race_code);
              }
              if(errors.length)throw Error('nov11_candidate_page_js_errors_'+errors.join(';').slice(0,300));
              console.log('CLEAN_NOV11_PAYOUT_PUBLIC_PASS',JSON.stringify({day:'20261111',archiveRows:publicToday.rows.length,payoutsMatched:paidRows.length,scope:'published Pages DOM vs build-time independently verified Git manifest'}));
              console.log('CLEAN_CANDIDATE_PUBLIC_DISPLAY',JSON.stringify(evidence));
              summary('Published stored candidate archive: **'+(evidence.count>6?'DISPLAY_OBSERVED':'ZERO_OR_UNVERIFIED')+
                '** '+JSON.stringify(evidence).slice(0,1100));
            }catch(e){
              console.error('CLEAN_CANDIDATE_PUBLIC_UNVERIFIED',e.message);
              summary('Real JST-day candidate page: **UNVERIFIED** '+String(e.message).replace(/[\r\n]/g,' ').slice(0,280));
              throw e;
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Inspect real six-boat exhibition against independent CSV (diagnostic)
        timeout-minutes: 4
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node - <<'JS'
          const {chromium}=require('playwright');
          const parse=line=>{let a=[],s='',q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){s+='"';i++}else q=!q;}else if(c===','&&!q){a.push(s);s='';}else s+=c;}a.push(s);return a;};
          (async()=>{
            const browser=await chromium.launch({headless:true}),reports=[];
            try{
              const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              for(const [day,venue,race] of [['2026-10-28','01',1],['2026-10-31','07',8],['2026-11-02','19',5],['2026-11-03','19',11]]){
                const code=day.replaceAll('-','')+venue+String(race).padStart(2,'0');
                const report={code,state:'unverified'};
                try{
                  const csvUrl='https://boatracecsv.github.io/data/previews/original_exhibition/'+day.replaceAll('-','/')+'.csv';
                  const csv=await page.request.get(csvUrl,{timeout:15000});
                  if(csv.status()!==200){report.reason='csv_http_'+csv.status();reports.push(report);continue;}
                  const raw=(await csv.text()).replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean).map(parse),head=raw.shift()||[];
                  if(new Set(head).size!==head.length)throw Error('DUPLICATE_HEADER');
                  const pos=Object.fromEntries(head.map((h,i)=>[h,i]));
                  const rows=raw.filter(x=>x[pos['レースコード']]===code);
                  if(rows.length===0){report.reason='csv_race_absent';reports.push(report);continue;}
                  if(rows.length!==1)throw Error('DUPLICATE_RACE');
                  const row=rows[0],count=Number(row[pos['計測数']]);
                  if(!Number.isInteger(count)||count<1||count>3)throw Error('INVALID_COUNT');
                  const url=new URL(process.env.PAGE_URL);
                  for(const [k,v] of [['date',day],['venue',venue],['race',String(race)],['view','exhibit']])url.searchParams.set(k,v);
                  const response=await page.goto(url.href,{waitUntil:'domcontentloaded',timeout:30000});
                  if(response?.status()!==200)throw Error('PAGE_HTTP_'+response?.status());
                  await page.evaluate(()=>{setView('exhibit');render()});
                  const stage=async()=>page.evaluate(()=>({key:sameRaceKey(),view:activeView,cardStatus:document.querySelector('#raceDataStatus')?.textContent,boats:document.querySelectorAll('#exhibitionGrid .exhibition-boat').length,originalStatus:document.querySelector('#originalExhibitionStatus')?.textContent||'missing'}));
                  try{await page.waitForFunction(()=>document.querySelectorAll('#exhibitionGrid .exhibition-boat').length===6,null,{timeout:16000});}catch(e){throw Error('NO_SIX_CARD_LAYOUT '+JSON.stringify(await stage()));}
                  try{await page.waitForFunction(()=>/6艇分|元データを取得・検証できません|未配信/.test(document.querySelector('#originalExhibitionStatus')?.textContent||''),null,{timeout:16000});}catch(e){throw Error('ORIGINAL_NOT_FINISHED '+JSON.stringify(await stage()));}
                  const got=await page.evaluate(()=>({
                    key:sameRaceKey(),status:document.querySelector('#originalExhibitionStatus').textContent,
                    boats:[...document.querySelectorAll('#exhibitionGrid .exhibition-boat')].map(c=>({
                      lane:Number(c.querySelector('.lane-badge')?.textContent),
                      official:c.querySelectorAll('.exhibition-metric').length,
                      original:[...c.querySelectorAll('.exhibition-original-metric')].map(x=>[x.querySelector('span')?.textContent,x.querySelector('strong')?.textContent])
                    }))
                  }));
                  if(got.key!==day.replaceAll('-','')+'-'+venue+'-'+String(race).padStart(2,'0'))throw Error('RACE_KEY');
                  if(got.boats.length!==6||got.boats.some((b,i)=>b.lane!==i+1||b.official!==5||b.original.length!==count))throw Error('SIX_BOAT_METRICS');
                  for(let lane=1;lane<=6;lane++)for(let k=1;k<=count;k++){
                    const label=row[pos['計測項目'+k]]?.trim(),ix=pos['艇'+lane+'_値'+k];
                    if(!label||!Number.isInteger(ix))throw Error('CSV_COLUMN_'+lane+'_'+k);
                    const expected=(row[ix]||'').trim()||'—',shown=got.boats[lane-1].original[k-1];
                    if(shown[0]!==label||shown[1]!==expected)throw Error('LANE_MISMATCH_'+lane+'_'+k);
                  }
                  report.state='six_boats_match_original_csv';report.metrics=count;
                }catch(e){report.state='mismatch';report.reason=String(e.message||e)}
                reports.push(report);console.log('PUBLIC_EXHIBITION_CASE',JSON.stringify(report));
              }
              const matched=reports.filter(x=>x.state==='six_boats_match_original_csv').length;
              const failed=reports.filter(x=>x.state==='mismatch').length;
              console.log('PUBLIC_EXHIBITION_SUMMARY',JSON.stringify({matched,failed,reports}));
              require('node:fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Public 6-boat original CSV alignment: '+matched+' matched, '+failed+' mismatches, '+(reports.length-matched-failed)+' source-unverified\n');
              if(failed||matched<1)throw Error('LIVE_EXHIBITION_NOT_FULLY_VERIFIED');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Audit all scheduled venues against archived real exhibition CSV (diagnostic)
        timeout-minutes: 2
        continue-on-error: true
        run: |
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          function csv(line){let arr=[],part='',quoted=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(quoted&&line[i+1]==='"'){part+='"';i++}else quoted=!quoted;}else if(ch===','&&!quoted){arr.push(part);part='';}else part+=ch;}arr.push(part);return arr}
          (async()=>{
            const snapshot=JSON.parse(fs.readFileSync('schedule_snapshots/20261110.json','utf8'));
            assert.equal(snapshot.date,'2026-11-10');
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage();
              const url='https://boatracecsv.github.io/data/previews/original_exhibition/2026/11/10.csv';
              const response=await page.request.get(url,{timeout:25000});
              assert.equal(response.status(),200,'independent CSV unavailable');
              const lines=(await response.text()).replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean).map(csv);
              const names=lines.shift();assert.equal(names.length,34,'source schema: 10 metadata columns plus six sets of four boat fields');
              const col=Object.fromEntries(names.map((name,i)=>[name,i]));
              assert.equal(Object.keys(col).length,names.length,'duplicated source fields');
              const entries=new Map();
              let emptyValues=0,observedValues=0;
              const incompleteRaces=new Set(),deadlineDrifts=[];
              for(const row of lines){
                assert.equal(row.length,names.length,'truncated CSV row');
                const code=row[col['レースコード']];
                assert.match(code,/^20261110\d{4}$/);
                assert.ok(!entries.has(code),'duplicated race '+code);
                const count=Number(row[col['計測数']]);
                assert.ok(Number.isInteger(count)&&count>=1&&count<=3,'invalid measurement count '+code);
                for(let lane=1;lane<=6;lane++){
                  assert.ok(row[col['艇'+lane+'_選手名']]?.trim(),'racer missing '+code+' lane '+lane);
                  for(let k=1;k<=count;k++){
                    const label=row[col['計測項目'+k]],value=row[col['艇'+lane+'_値'+k]];
                    assert.ok(label?.trim()&&value!==undefined,'invalid metric schema '+code+' lane '+lane+' metric '+k);
                    if(value.trim()===''){emptyValues++;incompleteRaces.add(code)}else observedValues++;
                  }
                }
                entries.set(code,row);
              }
              const planned=new Set();
              for(const venue of snapshot.venues){
                const jcd=String(venue.jcd).padStart(2,'0');
                for(const race of venue.races){
                  const code='20261110'+jcd+String(race.race_no).padStart(2,'0');
                  assert.ok(!planned.has(code),'duplicate scheduled race '+code);
                  planned.add(code);
                  const row=entries.get(code);
                  assert.ok(row,'scheduled race absent '+code);
                  assert.equal(Number(row[col['レース場']]),Number(jcd),'venue mismatch '+code);
                  assert.equal(Number(String(row[col['レース回']]).replace(/R$/i,'')),Number(race.race_no),'race mismatch '+code);
                  if(row[col['締切時刻']]!==race.deadline)deadlineDrifts.push({code,schedule:race.deadline,csv:row[col['締切時刻']]});
                }
              }
              assert.equal(entries.size,planned.size,'unexpected/missing source races');
              assert.equal(snapshot.venues.length,13,'observed venue cohort has changed');
              assert.equal(planned.size,156,'observed scheduled count has changed');
