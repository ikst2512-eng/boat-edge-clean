name: Official prerace raw probe (isolated)
on:
  push:
    branches:
      - fix/clean-official-preview-integrity-20261027
    paths:
      - .github/workflows/official-prerace-probe.yml
  workflow_dispatch:
    inputs:
      race_key:
        description: 'Race key YYYYMMDD-JCD-RNO'
        required: true
        type: string
      verified_deadline:
        description: 'Manually verified official JST deadline ISO8601, e.g. 2026-10-27T15:00:00+09:00'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: clean-official-prerace-probe
  cancel-in-progress: false
jobs:
  connectivity:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/fix/clean-official-preview-integrity-20261027' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check official homepage connectivity only
        shell: bash
        run: |
          set -eu
          # Homepage HEAD request; never query race, previews or results.
          curl --head --fail --max-time 12 --silent --show-error https://www.boatrace.jp/ > /dev/null
          echo 'Official homepage HEAD succeeded' >> "$GITHUB_STEP_SUMMARY"
  capture:
    # Branch-only opt-in: both repository variables must be explicitly set.
    # Ordinary pushes and pull requests do not fetch any race data.
    if: ${{ github.ref == 'refs/heads/fix/clean-official-preview-integrity-20261027' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.CLEAN_PRERACE_PROBE_RACE_KEY != '' && vars.CLEAN_PRERACE_PROBE_VERIFIED_DEADLINE != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Capture audited HTML (never update site or Fresh)
        env:
          RACE_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.race_key || vars.CLEAN_PRERACE_PROBE_RACE_KEY }}
          VERIFIED_DEADLINE: ${{ github.event_name == 'workflow_dispatch' && inputs.verified_deadline || vars.CLEAN_PRERACE_PROBE_VERIFIED_DEADLINE }}
        run: |
          python3 run_official_prerace_probe.py --race-key "$RACE_KEY" --deadline "$VERIFIED_DEADLINE" --directory "$RUNNER_TEMP/prerace-evidence" > "$RUNNER_TEMP/probe.json"
          cat "$RUNNER_TEMP/probe.json"
      - name: Upload isolated research evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: prerace-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/prerace-evidence/
          if-no-files-found: error
          retention-days: 7
