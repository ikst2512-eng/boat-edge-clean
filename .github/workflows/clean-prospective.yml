name: CLEAN prospective pre-cutoff capture
on:
  schedule:
    - cron: '45 22 * * *'
    - cron: '0,15,30,45 23 * * *'
    - cron: '0,15,30,45 0-11 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - collect_clean_prospective.py
      - test_collect_clean_prospective.py
      - .github/workflows/clean-prospective.yml
  push:
    branches: [main]
    paths:
      - collect_clean_prospective.py
      - test_collect_clean_prospective.py
      - .github/workflows/clean-prospective.yml
permissions:
  contents: write
concurrency:
  group: clean-prospective-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest -v test_collect_clean_prospective
      - name: Capture if public race cards are already published
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          hour=$(TZ=Asia/Tokyo date +%H)
          if [ "$hour" -lt 6 ]; then
            echo 'Daily source not yet published (JST preopening window)'
            exit 0
          fi
          mkdir -p test-results
          python collect_clean_prospective.py 2>&1 | tee test-results/prospective-capture.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Freeze immutable candidate evidence
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d prospective_predictions ]; then
            echo 'No eligible pre-cutoff candidates'
            exit 0
          fi
          git add -- prospective_predictions/
          if git diff --cached --name-only --diff-filter=CDMRTUX -- prospective_predictions/ | grep -q .; then
            echo 'Existing prospective prediction modification prohibited' >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          python - <<'PY'
          import json,subprocess
          from datetime import datetime,timedelta,timezone
          files=subprocess.check_output(['git','diff','--cached','--name-only','--diff-filter=A','--','prospective_predictions/'],text=True).splitlines()
          if not files: raise SystemExit('No newly staged records')
          kept=0
          excluded=0
          for path in files:
              rec=json.load(open(path,encoding='utf-8'))
              deadline=datetime.fromisoformat(rec['source_deadline_jst'])
              cutoff=datetime.fromisoformat(rec['cutoff_jst'])
              source_times=[datetime.fromisoformat(rec[k]) for k in ('source_title_received_jst','source_cards_received_jst','generated_at')]
              if deadline-cutoff!=timedelta(minutes=12) or max(source_times)>=cutoff or rec['formal'] or rec['scoring']:
                  raise SystemExit('Malformed prospective candidate: '+path)
              # Reserve 90 seconds for the Git push/receipt. Never backdate a stale candidate.
              if datetime.now(timezone.utc)>=cutoff-timedelta(seconds=90):
                  subprocess.run(['git','reset','-q','--',path],check=True)
                  excluded+=1
              else:
                  kept+=1
          print(json.dumps({'eligible_for_commit':kept,'excluded_near_cutoff':excluded}))
          PY
          if git diff --cached --quiet; then
            echo 'No safe candidate remains for this run'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: freeze prospective pre-cutoff candidates (not yet formal)'
          git push origin HEAD:main
      - name: Archive prospective capture diagnostics
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: clean-prospective-capture-${{ github.run_id }}
          path: test-results/prospective-capture.log
          if-no-files-found: warn
          retention-days: 30
