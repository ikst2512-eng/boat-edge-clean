<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c2340"><title>BOAT EDGE CLEAN｜全国24場</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#162942;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}header{background:#0b2342;color:white;padding:18px 14px}main,header>div{max-width:900px;margin:auto}main{padding:15px}.logo{font-size:23px;font-weight:900}header small{color:#bacde3}.box{background:white;border:1px solid #dce4ee;border-radius:13px;padding:15px;margin-bottom:14px}h1{font-size:20px;margin:0 0 12px}h2{font-size:18px;margin:0 0 12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid button{text-align:left;padding:13px 11px;min-height:48px;font-size:15px}.races{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}button{background:white;color:#174066;border:1px solid #cbd9e8;border-radius:9px;padding:12px 4px;font-weight:700;cursor:pointer}button.on{background:#155eae;border-color:#155eae;color:white}button:focus-visible{outline:3px solid #7ab8ff}input{border:1px solid #cbd9e8;border-radius:8px;padding:10px;font-size:16px}.muted{font-size:12px;color:#65788e}.chosen{background:#eaf3fd;padding:13px;border-radius:9px;margin-bottom:12px;font-weight:700}.link{display:inline-block;background:#165eac;color:white;text-decoration:none;border-radius:9px;padding:13px 17px;font-weight:700}footer{text-align:center;font-size:12px;color:#7a889a;padding:20px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.races{grid-template-columns:repeat(12,1fr)}}@media(max-width:340px){.grid{grid-template-columns:repeat(2,1fr)}}.prediction-tabs{display:flex;gap:8px;margin-bottom:14px}.prediction-tabs button{flex:1}.prediction-rows{display:grid;gap:8px}.prediction-row{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:9px;background:#edf5ff;border:1px solid #d4e5f7}.prediction-rank{font-size:12px;color:#56718e}.prediction-ticket{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}</style></head><body><header><div><div class="logo">BOAT EDGE <span style="color:#6bc8ff">CLEAN</span></div><small>全国24場から選べるボートレース情報</small></div></header><main><section class="box"><h1>開催場を選ぶ</h1><div class="row"><button id="prev">前日</button><input type="date" id="day" aria-label="開催日"><button id="today">今日</button><button id="next">翌日</button></div><p class="muted">全国24場を番号順に一覧表示しています。場をタップしてレースを選択してください。</p><div class="grid" id="venues"></div></section><section class="box"><h2 id="raceTitle">レースを選ぶ</h2><div class="races" id="races"></div></section><section class="box" id="forecast"><h2>3連単予想 <span class="muted">Top3 / Top5 / Top10</span></h2><div class="prediction-tabs" role="group" aria-label="予想点数"><button type="button" data-top="3" class="on">Top3</button><button type="button" data-top="5">Top5</button><button type="button" data-top="10">Top10</button></div><p id="predictionStatus" class="muted" role="status">選択したレースの予想データを確認中…</p><div id="predictionRows" class="prediction-rows"></div></section></main><footer>BOAT EDGE CLEAN｜独立サイト試験公開版</footer><script>const names=['桐生','戸田','江戸川','平和島','多摩川','浜名湖','蒲郡','常滑','津','三国','びわこ','住之江','尼崎','鳴門','丸亀','児島','宮島','徳山','下関','若松','芦屋','福岡','唐津','大村'];const s={date:'',venue:0,race:1};const p=x=>String(x).padStart(2,'0'),fmt=d=>[d.getFullYear(),p(d.getMonth()+1),p(d.getDate())].join('-');function jst(){return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Tokyo'}))}s.date=fmt(jst());const day=document.getElementById('day'),vb=document.getElementById('venues'),rb=document.getElementById('races');names.forEach((n,i)=>{let b=document.createElement('button');b.textContent=p(i+1)+'　'+n;b.addEventListener('click',()=>{s.venue=i;s.race=1;render()});vb.append(b)});for(let i=1;i<=12;i++){let b=document.createElement('button');b.textContent=i+'R';b.addEventListener('click',()=>{s.race=i;render()});rb.append(b)}function render(){day.value=s.date;[...vb.children].forEach((b,i)=>{b.classList.toggle('on',s.venue===i);b.setAttribute('aria-pressed',s.venue===i)});[...rb.children].forEach((b,i)=>{b.classList.toggle('on',s.race===i+1);b.setAttribute('aria-pressed',s.race===i+1)});document.getElementById('raceTitle').textContent=names[s.venue]+' のレース';document.getElementById('selected').textContent=s.date+'　'+names[s.venue]+'　'+s.race+'R';loadPredictions()}day.addEventListener('change',()=>{if(/^\d{4}-\d{2}-\d{2}$/.test(day.value)){s.date=day.value;render()}});for(let [id,n] of [['prev',-1],['next',1]])document.getElementById(id).addEventListener('click',()=>{let d=new Date(s.date+'T12:00:00');d.setDate(d.getDate()+n);s.date=fmt(d);render()});document.getElementById('today').addEventListener('click',()=>{s.date=fmt(jst());render()});let predictionTickets=[],selectedTop=3;document.querySelectorAll('[data-top]').forEach(button=>button.addEventListener('click',()=>{selectedTop=Number(button.dataset.top);document.querySelectorAll('[data-top]').forEach(b=>b.classList.toggle('on',b===button));drawPredictions()}));function drawPredictions(){const root=document.getElementById('predictionRows');root.replaceChildren();predictionTickets.slice(0,selectedTop).forEach((ticket,index)=>{const row=document.createElement('div');row.className='prediction-row';const left=document.createElement('div');const rank=document.createElement('div');rank.className='prediction-rank';rank.textContent='予想 '+(index+1)+'位';const combo=document.createElement('div');combo.className='prediction-ticket';combo.textContent=ticket;left.append(rank,combo);const odds=document.createElement('div');odds.className='prediction-odds';odds.textContent='';row.append(left,odds);root.append(row)})}const validTicket=t=>typeof t==='string'&&/^[1-6]-[1-6]-[1-6]$/.test(t)&&new Set(t.split('-')).size===3;
function verifiedTicketArray(a){return Array.isArray(a)&&a.length===10&&a.every(validTicket)&&new Set(a).size===10}
const EDGE_BASE='https://api.github.com/repos/ikst2512-eng/boat-edge';
const EDGE_RAW='https://raw.githubusercontent.com/ikst2512-eng/boat-edge';
async function edgeJson(url){const r=await fetch(url,{cache:'no-store',headers:{'Accept':'application/vnd.github+json'}});if(!r.ok)throw Error('SOURCE_HTTP_'+r.status);return r.json()}
function sameRaceKey(){return s.date.replaceAll('-','')+'-'+p(s.venue+1)+'-'+p(s.race)}
async function verifiedStoredPrediction(key){
 const path='data/site_prediction_snapshots/'+key+'.json';
 const commits=await edgeJson(EDGE_BASE+'/commits?path='+encodeURIComponent(path)+'&per_page=100');
 if(!Array.isArray(commits)||!commits.length||commits.length===100)throw Error('FIRST_COMMIT_UNCONFIRMED');
 const earliest=commits[commits.length-1];
 const commit=await edgeJson(EDGE_BASE+'/commits/'+encodeURIComponent(earliest.sha));
 const file=commit.files&&commit.files.find(f=>f.filename===path);
 if(!file||file.status!=='added')throw Error('FIRST_ADD_UNCONFIRMED');
 const [firstRes,currentRes]=await Promise.all([
   fetch(EDGE_RAW+'/'+earliest.sha+'/'+path,{cache:'no-store'}),
   fetch(EDGE_RAW+'/main/'+path,{cache:'no-store'})
 ]);
 if(!firstRes.ok||!currentRes.ok)throw Error('SNAPSHOT_UNAVAILABLE');
 const [firstText,currentText]=await Promise.all([firstRes.text(),currentRes.text()]);
 if(firstText!==currentText)throw Error('SNAPSHOT_CHANGED_SINCE_FIRST_ADD');
 const raw=JSON.parse(firstText);
 if(raw.race_key!==key||raw.schema_version!=='boat-edge-server-site-final-v123'||raw.prediction_kind!=='SITE_REFERENCE_V122'||raw.venue_code!==p(s.venue+1)||Number(raw.race_no)!==s.race)throw Error('RACE_OR_MODEL_MISMATCH');
 if(raw.guards?.results_seen!==false||raw.guards?.unlock!==false||raw.guards?.scoring!==false)throw Error('UNSAFE_SOURCE');
 if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(raw.deadline))throw Error('DEADLINE_INVALID');
 const limit=Date.parse(s.date+'T'+raw.deadline+':00+09:00'),saved=Date.parse(raw.first_saved_at),added=Date.parse(commit.commit?.committer?.date);
 if(![limit,saved,added].every(Number.isFinite)||saved>added||added>=limit||limit-saved<120000||limit-saved>600000||limit-added<120000||limit-added>600000)throw Error('FREEZE_TIME_NOT_PROVEN');
 const mode=raw.default_display_mode;
 if(mode!=='tail'||!verifiedTicketArray(raw.modes?.[mode]?.tickets?.map(t=>t.combo)))throw Error('PREDICTIONS_INVALID');
 const tickets=raw.modes[mode].tickets.map(t=>t.combo);
 return {tickets,version:raw.prediction_kind+' / '+raw.mode_policy,created:raw.first_saved_at,proof:earliest.sha.slice(0,12)};
}
async function loadPredictions(){
 const token=(window.predictionRequestId||0)+1;window.predictionRequestId=token;
 predictionTickets=[];drawPredictions();
 const label=document.getElementById('predictionStatus');
 label.textContent='既存モデルの保存予想と初回Git記録を照合中…';
 const key=sameRaceKey();
 try{
  const confirmed=await verifiedStoredPrediction(key);
  if(token!==window.predictionRequestId||sameRaceKey()!==key)return;
  predictionTickets=confirmed.tickets;
  label.textContent='保存予想（初回Git記録照合済）｜'+confirmed.version+'｜保存 '+confirmed.created+'｜根拠 '+confirmed.proof;
  drawPredictions();
 }catch(e){
  if(token!==window.predictionRequestId)return;
  try{
   const r=await fetch('/api/predictions?hd='+s.date.replaceAll('-','')+'&jcd='+p(s.venue+1)+'&rno='+s.race,{cache:'no-store'});
   const data=await r.json();
   if(token!==window.predictionRequestId||sameRaceKey()!==key)return;
   if(r.ok&&data.ok&&data.status==='research'&&verifiedTicketArray(data.predictions)){
    predictionTickets=data.predictions;
    label.textContent='研究予想（未検証・回収率未確認）｜全国勝率モデル｜'+data.generated_at;
    drawPredictions();return;
   }
  }catch(_){} 
  label.textContent=e.message==='SOURCE_HTTP_404'||e.message==='SNAPSHOT_UNAVAILABLE'||e.message==='FIRST_COMMIT_UNCONFIRMED'?'このレースの保存予想は未確認です。':'予想の原本・締切前保存証拠を確認できないため、買い目を表示しません。';
 }
};render();</script></body></html>
