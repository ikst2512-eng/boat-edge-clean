name: AI repair proposal (manual and review-gated)
on:
  # Always run free safety unit tests for audit code pushes as well as PRs.
  push:
    paths:
      - ai_repair_agent.py
      - test_ai_repair_agent.py
      - .github/workflows/ai-repair-proposal.yml
  pull_request:
    paths:
      - ai_repair_agent.py
      - test_ai_repair_agent.py
      - .github/workflows/ai-repair-proposal.yml
  workflow_dispatch:
    inputs:
      issue:
        description: '具体的なUI/ナビゲーション不具合。予想ロジック変更は禁止'
        required: true
        default: 'Inspect navigation.js for a demonstrable UI/navigation issue. Only propose an exact safe fix if evidence supports it. Do not change prediction logic, data capture or tests.'
        type: string
      dry_run:
        description: '無料の証拠ZIP動作確認。AI API呼出し・修正案作成なし'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
# Prevent concurrent manual AI calls from spending quota or racing on PR branches.
concurrency:
  group: gemini-ai-repair-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_ai_repair_agent
  propose:
    needs: tests
    if: github.event_name == 'workflow_dispatch' # Manual only; no scheduled paid calls
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Refuse AI repair dispatch outside main
        env:
          DISPATCH_REF: ${{ github.ref }}
        shell: bash
        run: |
          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "::error::AI repair proposals must be dispatched from main."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test patch guardrails
        run: python -m unittest -v test_ai_repair_agent
      - name: Refuse stale main before paid AI request
        # A no-op receipt must not fail when unrelated commits advance main.
        # Real Gemini requests still reject stale or displaced checkouts.
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          live_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ -z "$checked_out" || -z "$live_main" || "$checked_out" != "$GITHUB_SHA" || "$live_main" != "$GITHUB_SHA" ]]; then
            echo "::error::main moved since dispatch, or checkout differs; refusing AI request."
            exit 1
          fi
      - name: Require configured AI credential
        if: ${{ !inputs.dry_run }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is not configured in GitHub Actions secrets. No AI request was made."
            exit 1
          fi
          echo "Gemini API credential is present (value is never printed)."
      - name: Request a small AI UI repair (optional API)
        if: ${{ !inputs.dry_run }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          AI_ISSUE: ${{ inputs.issue }}
        run: python ai_repair_agent.py --issue "$AI_ISSUE"
      - name: Write no-cost dry-run receipt (no model call, no code patch)
        if: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = {
              "status": "no_safe_patch",
              "dry_run": True,
              "changed_files": [],
              "file_sha256": {},
              "reason": "Manual GitHub Actions workflow dry run: no AI invoked.",
              "suggested_tests": "Validate authentic run ID, jobs, artifact ID, ZIP SHA-256 and JSON receipt.",
              "production_change_allowed": False,
          }
          Path('ai_repair_proposal.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8')
          print("FREE_DRY_RUN_NO_AI_OR_PATCH", report["status"])
          PY
      - name: Summarize Gemini response without exposing source
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path("ai_repair_proposal.json").read_text(encoding="utf-8"))
          status=report.get("status","unknown")
          files=report.get("changed_files",[])
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as summary:
              summary.write("### AI repair proposal or free dry-run receipt\n")
              if report.get('dry_run') is True:
                  summary.write("- Mode: FREE_DRY_RUN_NO_AI_OR_PATCH (not an AI-generated proposal)\n")
              summary.write(f"- Status: `{status}`\n")
              summary.write(f"- Changed files: {len(files)}\n")
              summary.write("- Automatic merge: disabled\n")
              if status=="no_safe_patch":
                  summary.write("- Outcome: Gemini returned no safe, exact-match changes; no PR expected.\n")
          print("AI workflow status:",status,"changed files:",len(files))
          PY
      - name: Validate AI report against actual tracked diff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          report = json.loads(Path('ai_repair_proposal.json').read_text(encoding='utf-8'))
          # The publish step commits staged changes too. Reject pre-staged files,
          # which would otherwise bypass this unstaged-diff allowlist check.
          subprocess.run(['git', 'diff', '--cached', '--quiet'], check=True)
          actual = subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=ACDMRTUXB'],
              text=True).splitlines()
          allowed = {'index.html', 'navigation.js', 'secondary_navigation.js'}
          claimed = report.get('changed_files')
          status = report.get('status')
          if (report.get('production_change_allowed') is not False
                  or not isinstance(claimed, list)
                  or any(not isinstance(path, str) for path in claimed)
                  or not 0 <= len(claimed) <= 2
                  or len(claimed) != len(set(claimed))
                  or any(path not in allowed for path in actual + claimed)
                  or sorted(claimed) != sorted(actual)
                  or (status == 'proposed') != bool(actual)
                  or status not in ('proposed', 'no_safe_patch')):
              raise SystemExit('AI proposal report/diff mismatch; refusing publication')
          print('AI proposal report/diff validated:', status, len(actual))
          PY
          if git diff --quiet; then
            echo 'No safe patch proposed'
            exit 0
          fi
          # UI tests must not silently alter the AI-reviewed patch.
          before_diff="$(git diff --binary | sha256sum | cut -d' ' -f1)"
          python -m unittest -v tests.test_navigation_contract
          node tests/site-regression.cjs
          git diff --check
          after_diff="$(git diff --binary | sha256sum | cut -d' ' -f1)"
          if [[ "$before_diff" != "$after_diff" ]]; then
            echo "::error::UI tests modified the AI repair diff; refusing publication."
            exit 1
          fi
      - name: Refuse stale main before publishing AI draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          base_sha="$(git rev-parse HEAD)"
          live_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ -z "$base_sha" || -z "$live_main" || "$base_sha" != "$live_main" ]]; then
            echo "::error::main changed while generating AI repair; refusing stale draft."
            exit 1
          fi
      - name: Publish reviewed-by-CI patch as draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          AI_ISSUE: ${{ inputs.issue }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --cached --quiet; then
            echo "::error::Unexpected staged changes before AI repair publication."
            exit 1
          fi
          if git diff --quiet; then echo 'No repair to publish'; exit 0; fi
          branch="ai/repair-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html navigation.js secondary_navigation.js
          # Compare the exact staged bytes to the recorded AI evidence before push.
          python - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          from pathlib import Path

          report = json.loads(Path('ai_repair_proposal.json').read_text(encoding='utf-8'))
          expected = report.get('file_sha256')
          claimed = report.get('changed_files')
          changed = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-status'], text=True).splitlines()
          entries = [line.split('\t') for line in changed]
          allowed = {'index.html', 'navigation.js', 'secondary_navigation.js'}
          if (report.get('status') != 'proposed' or
              report.get('production_change_allowed') is not False or
              not isinstance(claimed, list) or not claimed or
              not 1 <= len(claimed) <= 2 or
              len(set(claimed)) != len(claimed) or
              any(name not in allowed for name in claimed) or
              not isinstance(expected, dict) or set(expected) != set(claimed) or
              any(len(entry) != 2 or entry[0] != 'M' for entry in entries) or
              sorted(entry[1] for entry in entries) != sorted(claimed)):
              raise SystemExit('Staged AI patch does not match proposal evidence')
          for name in claimed:
              digest = expected[name]
              # git commit uses index blobs, not working-tree files.
              staged_bytes = subprocess.check_output(['git', 'show', ':' + name])
              indexed_mode = subprocess.check_output(
                  ['git', 'ls-files', '--stage', '--', name],
                  text=True).split()
              if (not isinstance(digest, str) or
                  not re.fullmatch(r'[a-f0-9]{64}', digest) or
                  not indexed_mode or indexed_mode[0] != '100644' or
                  hashlib.sha256(staged_bytes).hexdigest() != digest or
                  hashlib.sha256(Path(name).read_bytes()).hexdigest() != digest):
                  raise SystemExit('Staged AI content SHA-256 or file mode mismatch')
          print('Validated staged AI files against proposal:', len(claimed))
          PY
          git commit -m "AI: propose narrow UI repair for review"
          # Recheck the actual commit tree, not just the pre-commit index.
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          report = json.loads(Path('ai_repair_proposal.json').read_text(encoding='utf-8'))
          claimed = report.get('changed_files')
          digests = report.get('file_sha256')
          parents = subprocess.check_output(
              ['git', 'rev-list', '--parents', '-n', '1', 'HEAD'], text=True).split()
          changes = subprocess.check_output(
              ['git', 'diff-tree', '--no-commit-id', '--name-status', '-r', 'HEAD'],
              text=True).splitlines()
          entries = [line.split('\t') for line in changes]
          if (len(parents) != 2 or parents[1] != os.environ.get('GITHUB_SHA') or
              not isinstance(claimed, list) or not claimed or
              not isinstance(digests, dict) or set(digests) != set(claimed) or
              any(len(entry) != 2 or entry[0] != 'M' for entry in entries) or
              sorted(entry[1] for entry in entries) != sorted(claimed)):
              raise SystemExit('AI commit tree differs from validated proposal')
          for name in claimed:
              digest = digests[name]
              tree_mode = subprocess.check_output(
                  ['git', 'ls-tree', 'HEAD', '--', name], text=True).split()
              data = subprocess.check_output(['git', 'show', 'HEAD:' + name])
              if (not isinstance(digest, str) or
                  not re.fullmatch(r'[a-f0-9]{64}', digest) or
                  not tree_mode or tree_mode[0] != '100644' or
                  hashlib.sha256(data).hexdigest() != digest):
                  raise SystemExit('Committed AI patch SHA-256 or mode mismatch')
          print('AI committed tree validated:', len(claimed))
          PY
          # main can advance after the earlier stale-base check and tests.
          # Refuse to push a stale AI proposal even if the commit itself is valid.
          live_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          committed_base="$(git rev-parse HEAD^)"
          if [[ -z "$live_main" || "$live_main" != "$committed_base" || "$committed_base" != "$GITHUB_SHA" ]]; then
            echo "::error::main advanced before AI draft push; refusing stale candidate."
            exit 1
          fi
          # checkout uses persist-credentials:false; explicitly authorize only this publish step.
          gh auth setup-git
          git -c credential.helper='!gh auth git-credential' push origin "HEAD:$branch"
          # Bind the archived AI evidence to the precise published branch and commit.
          AI_PUBLISHED_BRANCH="$branch" AI_PUBLISHED_SHA="$(git rev-parse HEAD)" \
          AI_PUBLISHED_BASE="$(git rev-parse HEAD^)" python - <<'PY'
          import json, os, re
          from pathlib import Path
          path = Path('ai_repair_proposal.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          if (report.get('status') != 'proposed' or
              not re.fullmatch(r'ai/repair-[0-9]+', os.environ['AI_PUBLISHED_BRANCH']) or
              not re.fullmatch(r'[a-f0-9]{40}', os.environ['AI_PUBLISHED_SHA']) or
              not re.fullmatch(r'[a-f0-9]{40}', os.environ['AI_PUBLISHED_BASE'])):
              raise SystemExit('Cannot bind non-proposed AI report to published commit')
          report['published_branch'] = os.environ['AI_PUBLISHED_BRANCH']
          report['published_head_sha'] = os.environ['AI_PUBLISHED_SHA']
          report['published_base_sha'] = os.environ['AI_PUBLISHED_BASE']
          path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          # Some repositories disable PR creation by GitHub Actions even with
          # pull-requests:write. Keep the reviewed patch branch available.
          # A repository policy rejection has a manual-review fallback.
          # Do not hide API failures or network errors as successful publication.
          pr_error="$(mktemp)"
          if gh pr create --draft --base main --head "$branch" --title "AI proposed UI repair (manual review required)" --body "AI-generated, untrusted code suggestion. Issue: ${AI_ISSUE}. Tests executed: navigation contract and site regression. **No automatic merge, deploy, or model changes.** Review patch and CI before approval." 2>"$pr_error"; then
            echo "AI draft PR created"
            echo "### Review-ready draft PR created" >> "$GITHUB_STEP_SUMMARY"
          elif grep -Fq 'GitHub Actions is not permitted to create or approve pull requests' "$pr_error"; then
            echo "::warning::Repository policy prohibits Actions from creating PRs; reviewed patch branch is preserved."
            echo "### AI patch created; manual draft PR needed" >> "$GITHUB_STEP_SUMMARY"
            echo "AI patch branch: $branch" >> "$GITHUB_STEP_SUMMARY"
            echo "Open a draft PR: https://github.com/${GITHUB_REPOSITORY}/pull/new/$branch" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Draft PR publication failed for a reason other than repository Actions policy."
            echo "Patch branch remains available: $branch"
            exit 1
          fi
      - name: Archive proposal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-repair-proposal-${{ github.run_id }}
          path: ai_repair_proposal.json
          # The independent reviewer requires this exact artifact. Missing
          # evidence is a failed proposal run, not a successful warning.
          if-no-files-found: error
          retention-days: 30
  free_artifact_smoke:
    name: Free evidence ZIP smoke (push only; no AI)
    if: github.event_name == 'push'
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Emit no-AI push smoke receipt
        shell: bash
        env:
          SMOKE_HEAD_SHA: ${{ github.sha }}
          SMOKE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          head = os.environ['SMOKE_HEAD_SHA']
          run = os.environ['SMOKE_RUN_ID']
          if not re.fullmatch(r'[0-9a-f]{40}', head) or not re.fullmatch(r'[1-9][0-9]*', run):
              raise SystemExit('Invalid smoke workflow head or run ID')
          receipt = {
              'status': 'no_safe_patch',
              'dry_run': True,
              'smoke_origin': 'push',
              'run_id': run,
              'head_sha': head,
              'changed_files': [],
              'file_sha256': {},
              'reason': 'Free CI artifact plumbing test; Gemini was never called.',
              'suggested_tests': 'Verify actual GitHub run/job, artifact ID, ZIP digest and report.',
              'production_change_allowed': False,
          }
          Path('ai_repair_proposal.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print('FREE_PUSH_ARTIFACT_SMOKE_NO_AI', run, head)
          PY
      - name: Upload free smoke evidence ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ai-repair-free-smoke-${{ github.run_id }}
          path: ai_repair_proposal.json
          if-no-files-found: error
          retention-days: 7
