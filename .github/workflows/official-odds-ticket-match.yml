name: Official odds ticket mapping checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/official-odds-ticket-match.cjs'
      - '.github/workflows/official-odds-ticket-match.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/official-odds-ticket-match.cjs'
      - '.github/workflows/official-odds-ticket-match.yml'
jobs:
  ticket-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/official-odds-ticket-match.cjs
