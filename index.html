<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c2340"><title>BOAT EDGE CLEAN｜全国24場</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#162942;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}header{background:#0b2342;color:white;padding:18px 14px}main,header>div{max-width:900px;margin:auto}main{padding:15px}.logo{font-size:23px;font-weight:900}header small{color:#bacde3}.box{background:white;border:1px solid #dce4ee;border-radius:13px;padding:15px;margin-bottom:14px}h1{font-size:20px;margin:0 0 12px}h2{font-size:18px;margin:0 0 12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid button{text-align:left;padding:13px 11px;min-height:48px;font-size:15px}.races{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}button{background:white;color:#174066;border:1px solid #cbd9e8;border-radius:9px;padding:12px 4px;font-weight:700;cursor:pointer}button.on{background:#155eae;border-color:#155eae;color:white}button:focus-visible{outline:3px solid #7ab8ff}input{border:1px solid #cbd9e8;border-radius:8px;padding:10px;font-size:16px}.muted{font-size:12px;color:#65788e}.chosen{background:#eaf3fd;padding:13px;border-radius:9px;margin-bottom:12px;font-weight:700}.link{display:inline-block;background:#165eac;color:white;text-decoration:none;border-radius:9px;padding:13px 17px;font-weight:700}.empty{padding:20px;border:1px dashed #c7d4e3;border-radius:9px;text-align:center;color:#63758a}footer{text-align:center;font-size:12px;color:#7a889a;padding:20px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.races{grid-template-columns:repeat(12,1fr)}}@media(max-width:340px){.grid{grid-template-columns:repeat(2,1fr)}}.links{display:flex;gap:9px;flex-wrap:wrap}.links .link{flex:1;min-width:120px;text-align:center}.link.secondary{background:#e8f0f8;color:#114f8d}.venueNote{margin-top:8px}.odds-group{margin-top:18px}.odds-heading{font-size:15px;margin:0 0 8px;padding:9px 12px;border-radius:8px;background:#eef3f9;border-left:5px solid #60758f}.boat-1{border-color:#dee0e4}.boat-2{border-color:#283b59}.boat-3{border-color:#e35050}.boat-4{border-color:#348bd1}.boat-5{border-color:#e4bd29}.boat-6{border-color:#58a55b}.odds-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.odds-cell{margin:0;padding:10px 8px;font-size:14px;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;align-items:center;gap:5px}.odds-cell strong{font-size:14px;color:#133f70;white-space:nowrap}@media(min-width:700px){.odds-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}</style></head><body><header><div><div class="logo">BOAT EDGE <span style="color:#6bc8ff">CLEAN</span></div><small>全国24場から選べるボートレース情報</small></div></header><main><section class="box"><h1>開催場を選ぶ</h1><div class="row"><button id="prev">前日</button><input type="date" id="day" aria-label="開催日"><button id="today">今日</button><button id="next">翌日</button></div><p class="muted">全国24場を番号順に一覧表示しています。場をタップしてレースを選択してください。</p><div class="grid" id="venues"></div></section><section class="box"><h2 id="raceTitle">レースを選ぶ</h2><div class="races" id="races"></div></section><section class="box"><h2>レース情報</h2><div id="selected" class="chosen" aria-live="polite"></div><button class="link" id="refresh" type="button">オッズ更新</button><p id="oddsStatus" class="muted" role="status" aria-live="polite">レースを選んで更新してください。</p><div id="oddsData"></div></section><section class="box"><h2>予想 Top3 / Top5 / Top10</h2><div class="empty">公開できる検証済み予想はまだありません。</div></section><section class="box"><h2>信頼度の高いおすすめレース</h2><div class="empty">掲載基準を満たしたレースはまだありません。</div></section></main><footer>BOAT EDGE CLEAN｜独立サイト試験公開版</footer><script>const names=['桐生','戸田','江戸川','平和島','多摩川','浜名湖','蒲郡','常滑','津','三国','びわこ','住之江','尼崎','鳴門','丸亀','児島','宮島','徳山','下関','若松','芦屋','福岡','唐津','大村'];const s={date:'',venue:0,race:1};const p=x=>String(x).padStart(2,'0'),fmt=d=>[d.getFullYear(),p(d.getMonth()+1),p(d.getDate())].join('-');function jst(){return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Tokyo'}))}s.date=fmt(jst());const day=document.getElementById('day'),vb=document.getElementById('venues'),rb=document.getElementById('races');names.forEach((n,i)=>{let b=document.createElement('button');b.textContent=p(i+1)+'　'+n;b.addEventListener('click',()=>{s.venue=i;s.race=1;render()});vb.append(b)});for(let i=1;i<=12;i++){let b=document.createElement('button');b.textContent=i+'R';b.addEventListener('click',()=>{s.race=i;render()});rb.append(b)}function render(){day.value=s.date;[...vb.children].forEach((b,i)=>{b.classList.toggle('on',s.venue===i);b.setAttribute('aria-pressed',s.venue===i)});[...rb.children].forEach((b,i)=>{b.classList.toggle('on',s.race===i+1);b.setAttribute('aria-pressed',s.race===i+1)});document.getElementById('raceTitle').textContent=names[s.venue]+' のレース';document.getElementById('selected').textContent=s.date+'　'+names[s.venue]+'　'+s.race+'R';document.getElementById('oddsData').textContent='';document.getElementById('oddsStatus').textContent='レースを選んで更新してください。';document.getElementById('refresh').disabled=false;window.oddsRequestId=(window.oddsRequestId||0)+1}day.addEventListener('change',()=>{if(/^\d{4}-\d{2}-\d{2}$/.test(day.value)){s.date=day.value;render()}});for(let [id,n] of [['prev',-1],['next',1]])document.getElementById(id).addEventListener('click',()=>{let d=new Date(s.date+'T12:00:00');d.setDate(d.getDate()+n);s.date=fmt(d);render()});document.getElementById('today').addEventListener('click',()=>{s.date=fmt(jst());render()});render();let lastClick=0;document.getElementById('refresh').addEventListener('click',async()=>{const current=++window.oddsRequestId;const status=document.getElementById('oddsStatus'),output=document.getElementById('oddsData'),button=document.getElementById('refresh');const now=Date.now();if(now-lastClick<1000)return;lastClick=now;button.disabled=true;status.textContent='オッズを取得中…';output.textContent='';try{const url='/api/odds?hd='+s.date.replaceAll('-','')+'&jcd='+p(s.venue+1)+'&rno='+s.race;const response=await fetch(url,{cache:'no-store'});const data=await response.json();if(current!==window.oddsRequestId)return;if(!response.ok||!data.ok){status.textContent=data.message||'オッズを取得できませんでした。';return}status.textContent='取得時刻（日本時間）: '+new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(data.fetched_at))+' / '+Object.keys(data.odds).length+'通り';const heading=document.createElement('div');heading.className='muted';heading.textContent='3連単（1着→2着→3着）｜1着ごと20通り';heading.style.marginTop='12px';output.append(heading);for(let first=1;first<=6;first++){const section=document.createElement('section');section.className='odds-group';const label=document.createElement('h3');label.textContent=first+'号艇 1着';label.className='odds-heading boat-'+first;section.append(label);const table=document.createElement('div');table.className='odds-grid';Object.entries(data.odds).filter(([ticket])=>ticket.startsWith(first+'-')).sort((a,b)=>{const x=a[0].split('-').map(Number),y=b[0].split('-').map(Number);return x[1]-y[1]||x[2]-y[2]}).forEach(([ticket,value])=>{const cell=document.createElement('div');cell.className='chosen odds-cell';const oddsText=document.createElement('strong');oddsText.textContent=Number(value).toLocaleString('ja-JP',{maximumFractionDigits:1})+'倍';cell.textContent=ticket;cell.append(oddsText);table.append(cell)});section.append(table);output.append(section)}}catch(e){if(current===window.oddsRequestId)status.textContent='通信できませんでした。再度更新してください。'}finally{if(current===window.oddsRequestId)button.disabled=false}});</script></body></html>
