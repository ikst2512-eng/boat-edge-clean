<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>検証ノート｜BOAT EDGE CLEAN</title><style>body{margin:0;background:#f3f6fb;color:#172e49;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}header{background:#10345b;color:#fff;padding:14px}header a{color:#e5f4ff}main{max-width:850px;margin:auto;padding:12px}.panel{background:white;border:1px solid #d8e3ee;padding:16px;border-radius:11px;margin:10px 0}h1{font-size:22px}h2{font-size:17px}p{line-height:1.65}.muted{color:#5d7085;font-size:13px}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{border:1px solid #dce6ee;border-radius:8px;padding:12px}.number{font-size:25px;font-weight:800}.tag{display:inline-block;border-radius:5px;padding:3px 7px;background:#e9f2fc;font-size:12px}li{margin:10px 0}@media(max-width:360px){.metrics{grid-template-columns:1fr}}</style></head><body><header><strong>BOAT EDGE CLEAN</strong>　<a href="/forecast">予想に戻る</a>　<a href="/selection">並行検証</a></header><main><section class="panel"><h1>検証ノート</h1><p>確定結果と締切前の保存予想から分かったことを掲載。予想は全レース掲載し、信頼度70%以上は購入候補の研究として別集計します。</p><p class="muted">確証がない仮説は実績として掲載しません。以下は購入推奨ではなく想定購入の研究結果です。</p><p id="status" role="status">確認中…</p></section><section class="panel"><h2>確定履歴の比較</h2><div id="metrics" class="metrics"></div><p id="coverage" class="muted"></p></section><section class="panel"><h2>検証で分かったこと・残る課題</h2><ul id="findings"></ul></section><section class="panel"><h2>日付別の確認状況</h2><div id="days"></div><p class="muted">日付別表示は直近の検証済み24件の内訳であり、1日全レースの集計ではありません。</p></section></main><script>function el(tag,value){const n=document.createElement(tag);n.textContent=value;return n}function metric(parent,title,value){const b=el('div','');b.className='metric';b.append(el('div',title));const v=el('div',value);v.className='number';b.append(v);parent.append(b)}async function run(){try{const r=await fetch('/api/daily-findings',{cache:'no-store',signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error('データ取得不可');const d=await r.json();if(d.schema!=='CLEAN_DAILY_FINDINGS_V1'||d.minimum_confidence!==0.7)throw Error('データ形式が一致しません');const m=document.getElementById('metrics');metric(m,'全レース的中率',d.all_races.hit_rate_pct+'%');metric(m,'70%以上の的中率',d.confidence_70.hit_rate_pct+'%');metric(m,'全レース回収率',d.all_races.roi_pct+'%');metric(m,'70%以上の回収率',d.confidence_70.roi_pct+'%');document.getElementById('coverage').textContent='検証済み '+d.latest_verified_sample+'件／70%以上 '+d.confidence_70.races+'件／ルール確定後 '+d.post_policy_verified_races+'件';for(const x of d.findings){const li=el('li',x.kind+'：'+x.text);document.getElementById('findings').append(li)}for(const x of d.recent_days){document.getElementById('days').append(el('p',x.date+'：直近の照合 '+x.sampled_verified_races+'件（70%以上 '+x.candidate_races+'件／見送り '+x.skipped_races+'件）'))}document.getElementById('status').textContent='確認済みデータを表示中'}catch(e){document.getElementById('status').textContent='検証データを確認できません。未確認の内容は掲載しません。'}}run();</script></body></html>
