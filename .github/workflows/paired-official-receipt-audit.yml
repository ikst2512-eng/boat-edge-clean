name: Paired original official receipts audit tests
on:
  pull_request:
    paths:
      - scripts/audit_joint_official_receipts.py
      - tests/test_audit_joint_official_receipts.py
      - .github/workflows/paired-official-receipt-audit.yml
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_audit_joint_official_receipts.py' -v
