name: Archived late preview evidence report
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_late_preview_evidence.py'
      - 'scripts/export_late_preview_audit.py'
      - 'late_preview_evidence/**'
      - '.github/workflows/archived-late-preview-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify archived data and generate evidence-status report
        run: |
          python -m unittest discover -s tests -p 'test_audit_late_preview_evidence.py' -v
          python -m unittest discover -s tests -p 'test_export_late_preview_audit.py' -v
          python -m scripts.export_late_preview_audit --root late_preview_evidence --output audit_output/late_preview_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: late-preview-audit-report
          path: audit_output/late_preview_audit.json
          if-no-files-found: error
          retention-days: 14
