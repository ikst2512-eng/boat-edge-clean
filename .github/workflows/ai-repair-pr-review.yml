name: Validate AI repair draft PR
on:
  # Always run free safety unit tests for audit code pushes as well as PRs.
  push:
    paths:
      - .github/workflows/ai-repair-pr-review.yml
      - test_ai_repair_pr_review.py
  pull_request:
    paths:
      - .github/workflows/ai-repair-pr-review.yml
      - test_ai_repair_pr_review.py
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'AI修正の下書きPR番号'
        required: true
        type: number
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/ai-repair-pr-review.yml"); puts "workflow YAML parsed"'
      - run: python -m unittest -v test_ai_repair_pr_review
  verify:
    if: github.event_name == 'workflow_dispatch'
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify candidate PR is draft and from local AI branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::AI repair PR review must run from main."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          head_sha="$(python - <<'PY'
          import json,os,re
          from pathlib import Path
          p=json.loads(Path('/tmp/pr.json').read_text())
          if (p['state']!='open' or not p['draft'] or
              p['head']['repo']['full_name']!=os.environ['GITHUB_REPOSITORY'] or
              not re.fullmatch(r'ai/repair-[0-9]+', p['head']['ref']) or
              p['base']['ref']!='main' or p['commits']!=1):
              raise SystemExit('Not a one-commit local AI draft PR against main')
          print(p['head']['sha'])
          PY
          )"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${head_sha}" > /tmp/head-commit.json
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" > /tmp/main-ref.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path('/tmp/pr.json').read_text())
          commit=json.loads(Path('/tmp/head-commit.json').read_text())
          main=json.loads(Path('/tmp/main-ref.json').read_text())['object']['sha']
          parents=commit.get('parents',[])
          if (len(parents)!=1 or parents[0].get('sha')!=main or
              p['base']['sha']!=main or commit.get('sha')!=p['head']['sha']):
              raise SystemExit('AI draft PR is stale or not a direct child of current main')
          bot = 'github-actions[bot]'
          expected_message = 'AI: propose narrow UI repair for review'
          if (commit.get('commit', {}).get('message') != expected_message or
              commit.get('author', {}).get('login') != bot or
              commit.get('committer', {}).get('login') != bot):
              raise SystemExit('AI draft PR commit does not match AI publication signature')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('sha='+p['head']['sha']+'\n')
              f.write('main_sha='+main+'\n')
          PY
      - name: Verify completed AI proposal workflow provenance
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CHECKED_MAIN_SHA: ${{ steps.pr.outputs.main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(python - <<'PY'
          import json, re
          from pathlib import Path
          p = json.loads(Path('/tmp/pr.json').read_text())
          match = re.fullmatch(r'ai/repair-([0-9]+)', p['head']['ref'])
          if match is None:
              raise SystemExit('Invalid AI proposal workflow run ID')
          print(match.group(1))
          PY
          )"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > /tmp/ai-proposal-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > /tmp/ai-proposal-jobs.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads(Path('/tmp/ai-proposal-run.json').read_text())
          pr = json.loads(Path('/tmp/pr.json').read_text())
          expected_id = int(pr['head']['ref'].split('-')[-1])
          expected_path = '.github/workflows/ai-repair-proposal.yml'
          jobs_response = json.loads(Path('/tmp/ai-proposal-jobs.json').read_text())
          jobs = jobs_response.get('jobs') if isinstance(jobs_response, dict) else None
          # The API returns one page here. Never accept partial provenance.
          if (not isinstance(jobs, list) or
              jobs_response.get('total_count') != len(jobs)):
              raise SystemExit('Originating AI proposal jobs response is incomplete')
          propose_jobs = [job for job in jobs if isinstance(job, dict) and job.get('name') == 'propose']
          if (len(propose_jobs) != 1 or propose_jobs[0].get('status') != 'completed' or
              propose_jobs[0].get('conclusion') != 'success'):
              raise SystemExit('Originating AI proposal job did not complete successfully')
          if (run.get('id') != expected_id or
              run.get('event') != 'workflow_dispatch' or
              run.get('path') != expected_path or
              run.get('head_branch') != 'main' or
              run.get('head_sha') != os.environ['CHECKED_MAIN_SHA'] or
              run.get('status') != 'completed' or
              run.get('conclusion') != 'success' or
              run.get('repository', {}).get('full_name') != os.environ['GITHUB_REPOSITORY']):
              raise SystemExit('AI draft PR is not backed by a completed successful proposal workflow')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify checked-out candidate commit is the approved SHA
        env:
          EXPECTED_PR_SHA: ${{ steps.pr.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ -z "$EXPECTED_PR_SHA" || "$actual_sha" != "$EXPECTED_PR_SHA" ]]; then
            echo "::error::Candidate checkout does not match validated draft PR commit."
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "::error::Candidate checkout is not pristine."
            exit 1
          fi
      - name: Validate changed-file allowlist
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" > /tmp/changed.json
          python - <<'PY'
          import json
          from pathlib import Path
          files=json.loads(Path('/tmp/changed.json').read_text())
          allowed={'index.html','navigation.js','secondary_navigation.js'}
          # AI proposer caps suggestions at two exact replacements.
          if not files or len(files)>2:
              raise SystemExit('Invalid AI repair file count')
          for file in files:
              if file['filename'] not in allowed or file['status'] not in ('modified',):
                  raise SystemExit('Unexpected AI repair file: '+file['filename'])
          PY
      - name: Match proposed PR to originating AI report artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(python - <<'PY'
          import json, re
          from pathlib import Path
          pr = json.loads(Path('/tmp/pr.json').read_text())
          match = re.fullmatch(r'ai/repair-([0-9]+)', pr['head']['ref'])
          if not match:
              raise SystemExit('Missing originating AI run ID')
          print(match.group(1))
          PY
          )"
          mkdir -p /tmp/ai-source-evidence
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name "ai-repair-proposal-${run_id}" --dir /tmp/ai-source-evidence
          python - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          from pathlib import Path

          report = json.loads(Path('/tmp/ai-source-evidence/ai_repair_proposal.json').read_text(encoding='utf-8'))
          source_pr = json.loads(Path('/tmp/pr.json').read_text(encoding='utf-8'))
          changed = json.loads(Path('/tmp/changed.json').read_text(encoding='utf-8'))
          allowed = {'index.html', 'navigation.js', 'secondary_navigation.js'}
          claimed = report.get('changed_files')
          digests = report.get('file_sha256')
          filenames = [entry['filename'] for entry in changed]
          if (report.get('status') != 'proposed' or
              report.get('published_branch') != source_pr['head']['ref'] or
              report.get('published_head_sha') != source_pr['head']['sha'] or
              report.get('published_base_sha') != source_pr['base']['sha'] or
              report.get('production_change_allowed') is not False or
              not isinstance(claimed, list) or not claimed or len(claimed)>2 or
              any(not isinstance(name, str) or name not in allowed for name in claimed) or
              len(set(claimed)) != len(claimed) or
              sorted(filenames) != sorted(claimed) or
              not isinstance(digests, dict) or set(digests) != set(claimed) or
              any(not isinstance(value, str) or not re.fullmatch(r'[a-f0-9]{64}', value)
                  for value in digests.values()) or
              any(entry.get('status') != 'modified' for entry in changed)):
              raise SystemExit('AI candidate PR does not match the originating proposal evidence')
          for name in claimed:
              # An identical byte digest must not hide a symlink or mode change.
              tree_entry = subprocess.check_output(
                  ['git', 'ls-tree', 'HEAD', '--', name], text=True).split()
              if (len(tree_entry) != 4 or tree_entry[0] != '100644' or
                  tree_entry[1] != 'blob' or Path(name).is_symlink() or
                  hashlib.sha256(Path(name).read_bytes()).hexdigest() != digests[name]):
                  raise SystemExit('AI candidate file bytes or Git mode differ from the originating proposal')
          print('AI artifact SHA-256 matches candidate draft files:', len(claimed))
          PY
      - name: Re-run independent UI and navigation tests
        shell: bash
        run: |
          set -euo pipefail
          # The candidate checkout must be pristine before and after tests.
          # This check also rejects staged or newly tracked modifications.
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "::error::Candidate checkout already differs from the selected PR commit."
            exit 1
          fi
          python -m unittest -v tests.test_navigation_contract test_ai_repair_agent
          node tests/site-regression.cjs
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "::error::Independent tests modified tracked candidate files."
            exit 1
          fi
      - name: Check PR head did not change during validation
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CHECKED_SHA: ${{ steps.pr.outputs.sha }}
          CHECKED_MAIN_SHA: ${{ steps.pr.outputs.main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/final-ai-pr.json
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          pr = json.loads(Path('/tmp/final-ai-pr.json').read_text())
          if (pr.get('state') != 'open' or pr.get('draft') is not True or
              pr.get('head', {}).get('sha') != os.environ['CHECKED_SHA'] or
              pr.get('head', {}).get('repo', {}).get('full_name') != os.environ['GITHUB_REPOSITORY'] or
              not re.fullmatch(r'ai/repair-[0-9]+', pr.get('head', {}).get('ref', '')) or
              pr.get('base', {}).get('ref') != 'main' or
              pr.get('base', {}).get('sha') != os.environ['CHECKED_MAIN_SHA'] or
              pr.get('commits') != 1):
              raise SystemExit('AI draft PR changed during validation; rerun all checks')
          PY
          main_now="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ -z "$main_now" || "$main_now" != "${CHECKED_MAIN_SHA}" ]]; then
            echo "::error::main changed during AI PR validation; rerun against the new base."
            exit 1
          fi
      - name: Review note
        run: echo 'Tests passed on the selected draft PR commit. Human review is still required; this does not authorize merge.'
