name: Cross-model content audit
on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *'
  pull_request:
    paths:
      - 'scripts/cross_model_content_audit.py'
      - 'test_cross_model_content_audit.py'
      - '.github/workflows/cross-model-content-audit-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/cross_model_content_audit.py'
      - 'test_cross_model_content_audit.py'
      - '.github/workflows/cross-model-content-audit-tests.yml'
jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate syntax
        run: python -m py_compile scripts/cross_model_content_audit.py test_cross_model_content_audit.py
      - name: Run isolated unit tests
        run: python -m unittest -v test_cross_model_content_audit.py
  audit-evidence:
    if: github.event_name != 'pull_request'
    needs: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inventory immutable source trees
        env:
          GH_TOKEN: ${{ secrets.LEGACY_READ_TOKEN || github.token }}
        run: python scripts/legacy_race_crosswalk.py --output crosswalk.json
      - name: Compare all matching race prediction originals without modifying either repository
        env:
          GH_TOKEN: ${{ secrets.LEGACY_READ_TOKEN || github.token }}
        run: python scripts/cross_model_content_audit.py --crosswalk crosswalk.json --output cross_model_audit.json
      - name: Produce summary for manual review
        run: |
          python - <<'PY'
          import json, os
          from collections import Counter
          data = json.load(open("cross_model_audit.json"))
          counts = Counter(r["decision"] for r in data["races"])
          lines = [
              "## Legacy/CLEAN read-only race content audit",
              "",
              f"- Matched race IDs: {data['matched_race_count']}",
              f"- Race IDs with blobs read from both sides: {data['content_read_race_count']}",
              f"- Race IDs with top-10 comparisons: {data['compared_race_count']}",
              f"- Missing comparable evidence: {data['no_comparable_evidence_count']}",
              f"- Fetch failures: {data['unresolved_count']}",
              "- Automatic import/deletion: forbidden",
              "",
              "### Decisions (not deletion permissions)",
          ] + [f"- {k}: {v}" for k,v in sorted(counts.items())]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
      - name: Fail closed if comparison incomplete
        run: |
          python - <<'PY'
          import json
          d = json.load(open("cross_model_audit.json"))
          if (not d["matched_race_count"] or d["unresolved_count"] or not d["content_read_race_count"] or d["compared_race_count"] != d["content_read_race_count"]):
              raise SystemExit(
                  f"Audit incomplete: matched={d['matched_race_count']} "
                  f"top10-compared={d['compared_race_count']} "
                  f"no-evidence={d['no_comparable_evidence_count']} "
                  f"fetch-errors={d['unresolved_count']}; no deletion permitted"
              )
          PY
      - name: Preserve comparison evidence for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-model-audit-evidence
          path: |
            crosswalk.json
            cross_model_audit.json
          if-no-files-found: warn
          retention-days: 30
      - name: Record audit outcome in tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          lines = ["### Cross-model content audit execution",
                   f"Run: {os.environ['WORKFLOW_URL']}",
                   f"Commit: ${{ github.sha }}",
                   "Data is read-only. No prediction import or legacy deletion is authorized."]
          crosswalk = Path("crosswalk.json")
          audit = Path("cross_model_audit.json")
          if crosswalk.exists():
              d = json.loads(crosswalk.read_text())
              lines.append(f"- Crosswalk matched race IDs: {d.get('matched_race_count', 'UNKNOWN')}")
          else:
              lines.append("- Crosswalk missing: source tree inventory failed or was not executed")
          if audit.exists():
              d = json.loads(audit.read_text())
              for k in ("matched_race_count", "content_read_race_count", "compared_race_count",
                        "tickets_uncomparable_count", "no_comparable_evidence_count", "unresolved_count"):
                  lines.append(f"- {k}: {d.get(k, 'UNKNOWN')}")
              lines.append("- Classification: " + ("INCOMPLETE" if
                  not d.get("matched_race_count") or
                  d.get("compared_race_count") != d.get("matched_race_count") or
                  d.get("unresolved_count") else "TOP10_COMPARISON_COVERED (not deletion approval)"))
          else:
              lines.append("- Audit JSON missing: comparison failed or was not executed")
          Path("audit_issue_comment.md").write_text("\n".join(lines) + "\n")
          PY
          gh issue comment 329 --repo "${{ github.repository }}" --body-file audit_issue_comment.md
