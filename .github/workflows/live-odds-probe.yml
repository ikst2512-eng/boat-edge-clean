name: Live odds API probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/live-odds-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe deployed API and print result
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking health endpoint"
          curl --retry 3 --retry-delay 5 --max-time 65 -sS -o /tmp/health -w "health_http=%{http_code}\n" "https://boat-edge-clean.onrender.com/healthz"
          cat /tmp/health; echo
          echo "Checking live odds API response"
          curl --max-time 45 -sS -o /tmp/odds.json -w "odds_http=%{http_code}\n" "https://boat-edge-clean.onrender.com/api/odds?hd=20261022&jcd=12&rno=1"
          python -m json.tool /tmp/odds.json | head -c 1400
          echo
