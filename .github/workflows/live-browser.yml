name: CLEAN live browser smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      # Re-test public Pages/Render when release-critical UI or CORS code changes.
      - index.html
      - navigation.js
      - server.py
      - tests/live-racecard-navigation.cjs
      - tests/live-verified-payout.cjs
      - tests/live-archived-forecast.cjs
      - tests/webkit-history-regression.cjs
      - tests/render-http-reachability.sh
      - .github/workflows/live-browser.yml
  schedule:
    - cron: '25 1 * * *'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture Render connection timing (non-gating diagnostic)
        shell: bash
        run: |
          set -o pipefail
          bash tests/render-http-reachability.sh 2>&1 | tee render-reachability.log
      - name: Install browser runner
        timeout-minutes: 12
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps --only-shell chromium
          npx playwright install --with-deps webkit
      - name: Check Draft-only WebKit navigation history (offline, no Render calls)
        shell: bash
        run: node tests/webkit-history-regression.cjs
      - name: Test real published Pages and Render API
        shell: bash
        run: |
          set -o pipefail
          node tests/live-racecard-navigation.cjs 2>&1 | tee browser-smoke.log
          node tests/live-verified-payout.cjs 2>&1 | tee -a browser-smoke.log
          node tests/live-archived-forecast.cjs 2>&1 | tee -a browser-smoke.log
      # Existing read-only WebKit/Chromium mobile check; not physical iPhone Safari.
      # Distinct from the Pages->Render CORS release gate.
      - name: Verify iPhone-size WebKit four-mode forecast, odds and race switching
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/smoke_four_mode_mobile.cjs 2>&1 | tee mobile-webkit-smoke.log
      # Browser-engine-specific four-tab assertions on the public Pages UI.
      # PR-simulated CORS is NOT equivalent to production cross-origin success.
      - name: Verify public four tabs with WebKit (simulated CORS clearly labeled)
        if: ${{ success() || failure() }}
        shell: bash
        env:
          BROWSER_ENGINE: webkit
        run: |
          set -o pipefail
          node tests/live-archived-forecast.cjs 2>&1 | tee webkit-public-tabs.log
      - name: Preserve browser test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-browser-pages-${{ github.run_id }}
          path: |
            browser-smoke.log
            render-reachability.log
            mobile-webkit-smoke.log
            webkit-public-tabs.log
            test-results/
          if-no-files-found: warn
      # A later data-driven redeploy may make browser tests green after a genuine cold-wake outage.
      # Preserve all logs first, then fail this job if the initial live /healthz probe failed.
      - name: Gate HTTP transport independently of late browser recovery
        if: always()
        shell: bash
        run: |
          if ! grep -Eq '^RENDER_DIAG_RELEASE_GATES health_http=pass([[:space:]]|$)' render-reachability.log; then
            echo '::error::Render /healthz was not HTTP 200 during the initial transport diagnostic; late browser success or data-only redeploy cannot erase this outage.'
            grep -E '^RENDER_DIAG_(PROBE name=health-|RELEASE_GATES )' render-reachability.log || true
            exit 1
          fi
          echo 'PASS_INITIAL_RENDER_HTTP_TRANSPORT_ONLY: live CORS, predeadline exhibition and idle-wake stability require separate proof.'
