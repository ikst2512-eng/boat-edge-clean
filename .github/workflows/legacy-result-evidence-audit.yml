name: Audit legacy CLEAN result evidence (read-only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/archive_legacy_p0_originals.py
      - tests/test_archive_legacy_p0_originals.py
      - .github/workflows/legacy-result-evidence-audit.yml
  push:
    branches: [main]
    paths:
      - scripts/legacy_race_crosswalk.py
      - scripts/legacy_result_compare.py
      - scripts/legacy_payout_evidence.py
      - scripts/verify_legacy_evidence_links.py
      - scripts/verify_legacy_blob_readback.py
      - scripts/archive_legacy_result_originals.py
      - tests/test_legacy_blob_readback.py
      - tests/test_legacy_result_compare.py
      - tests/test_legacy_payout_evidence.py
      - .github/workflows/legacy-result-evidence-audit.yml
permissions:
  contents: read
jobs:
  audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest -v tests/test_legacy_result_compare.py tests/test_legacy_payout_evidence.py tests/test_legacy_blob_readback.py
      - name: Build pinned race inventory
        run: python scripts/legacy_race_crosswalk.py --output audit_out/crosswalk.json
      - name: Compare every eligible confirmed result
        run: python scripts/legacy_result_compare.py --crosswalk audit_out/crosswalk.json --output audit_out/results.json
      - name: Build isolated payout evidence ledger
        run: python scripts/legacy_payout_evidence.py --comparison audit_out/results.json --output audit_out/payouts.json
      - name: Verify payout/result manifest links
        run: python scripts/verify_legacy_evidence_links.py --comparison audit_out/results.json --payouts audit_out/payouts.json --output audit_out/verification.json
      - name: Read back original legacy Git blobs and verify SHA-256
        run: python -m scripts.verify_legacy_blob_readback --comparison audit_out/results.json --output audit_out/legacy_blob_readback.json
      - name: Archive originals and test restore
        run: python -m scripts.archive_legacy_result_originals --comparison audit_out/results.json --archive audit_out/legacy_result_originals.tar.gz --report audit_out/restore.json
      - name: Publish machine-readable outcome
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("audit_out/results.json")
          if p.is_file():
              x = json.loads(p.read_text())
              with open(Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), 'a') as f:
                  f.write("## Legacy vs CLEAN result audit\n\n")
                  f.write(f"Compared: {x['compared']}\n\n")
                  for state, count in sorted(x['summary'].items()):
                      f.write(f"- {state}: {count}\n")
                  f.write("\nNo prediction provenance, restoration or deletion authorization is asserted.\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-clean-result-evidence
          path: |
            audit_out/*.json
            audit_out/legacy_result_originals.tar.gz
          if-no-files-found: warn
          retention-days: 90

  p0-original-byte-preservation:
    # Independent archive-only job; no predictions, UI, writes to legacy,
    # workflow duplication, or changes to the existing result audit steps.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test fail-closed P0 original preservation
        run: python -m unittest discover -s tests -p 'test_archive_legacy_p0_originals.py' -v
      - name: Fetch pinned old Git commit into temporary read-only clone
        run: |
          git init -q "${{ runner.temp }}/boat-edge-legacy"
          git -C "${{ runner.temp }}/boat-edge-legacy" remote add origin https://github.com/ikst2512-eng/boat-edge.git
          git -C "${{ runner.temp }}/boat-edge-legacy" -c protocol.version=2 fetch --depth=1 origin f38204105a979aa6ef5293d1b9cad854056faadd
          test "$(git -C "${{ runner.temp }}/boat-edge-legacy" rev-parse --verify 'f38204105a979aa6ef5293d1b9cad854056faadd^{commit}')" = 'f38204105a979aa6ef5293d1b9cad854056faadd'
      - name: Archive and read back all 5578 pinned P0 original bytes
        run: |
          python -m scripts.archive_legacy_p0_originals \
            --legacy-repo "${{ runner.temp }}/boat-edge-legacy" \
            --out "legacy_p0_archive/p0-5578-originals.zip" \
            --receipt "legacy_p0_archive/p0-5578-receipt.json" \
            --execute
      - name: Upload P0 archive for independent offsite transfer and restore
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-p0-original-bytes-${{ github.run_id }}
          path: legacy_p0_archive/
          if-no-files-found: warn
          retention-days: 90
