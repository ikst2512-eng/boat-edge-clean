name: Check real live predeadline racecard
on:
  pull_request:
    paths:
      - scripts/verify_live_racecard_e2e.py
      - .github/workflows/live-racecard-e2e.yml
      - clean_racecard.py
  workflow_dispatch:
  schedule:
    # Sample multiple Japan racing windows, including pre-evening races.
    - cron: '30 3,5,7,9 * * *'
permissions:
  contents: read
jobs:
  syntax:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile scripts/verify_live_racecard_e2e.py
  historical-production-smoke:
    # Unlike the time-dependent live-race job, this performs a real HTTP check
    # on pull requests even when no upcoming race is available.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify six distinct racers in historical Render racecard
        shell: bash
        run: |
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen
          url = "https://boat-edge-clean.onrender.com/api/clean-racecard?hd=20261031&jcd=09&rno=12"
          with urlopen(Request(url, headers={"User-Agent": "CLEAN-history-smoke/1.0"}), timeout=35) as response:
              assert response.status == 200, f"HTTP {response.status}"
              data = json.load(response)
          assert data.get("race_key") == "20261031-09-12", "wrong race returned"
          assert data.get("meta", {}).get("historical_reference_only") is True, "not marked historical"
          racers = data.get("racers") or []
          assert len(racers) == 6, f"expected six racers, got {len(racers)}"
          assert sorted(r["lane"] for r in racers) == [1, 2, 3, 4, 5, 6], "lane mismatch"
          ids = [r["registration_no"] for r in racers]
          assert len(set(ids)) == 6 and all(len(str(v)) == 4 for v in ids), "invalid registrations"
          assert data.get("source_audit", {}).get("race_card", {}).get("status") == "ok", "source audit missing"
          print("HISTORICAL_RENDER_SIX_RACER_SMOKE_PASS", data["race_key"], data["meta"]["source"])
          PY
  historical-result-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify confirmed result independently via CLEAN production
        shell: bash
        run: |
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen
          url="https://boat-edge-clean.onrender.com/api/clean-result?hd=20261031&jcd=09&rno=12"
          with urlopen(Request(url,headers={"User-Agent":"CLEAN-result-smoke/1.0"}),timeout=35) as response:
              assert response.status==200, f"HTTP {response.status}"
              result=json.load(response)
          assert result.get("race_code")=="202610310912", "wrong race"
          assert result.get("ok") is True and result.get("status")=="confirmed"
          order=result.get("finish_order")
          assert isinstance(order,list) and len(order)==3 and len(set(order))==3
          assert all(type(v) is int and 1<=v<=6 for v in order)
          assert str(result.get("source_url","")).startswith("https://")
          assert result.get("confirmed_at_jst") and result.get("collected_at_jst")
          print("HISTORICAL_CLEAN_CONFIRMED_RESULT_PASS", result["race_code"], order)
          PY
  e2e-live-race:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify real scheduled race through live Render API
        run: python scripts/verify_live_racecard_e2e.py
