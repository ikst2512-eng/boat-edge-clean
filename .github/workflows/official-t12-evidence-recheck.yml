name: Official T12 evidence recheck (research only)
on:
  pull_request:
    paths:
      - 'scripts/audit_official_t12_evidence.py'
      - 'tests/test_audit_official_t12_evidence.py'
      - '.github/workflows/official-t12-evidence-recheck.yml'
permissions:
  contents: read
jobs:
  evidence-recheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_audit_official_t12_evidence.py' -v
