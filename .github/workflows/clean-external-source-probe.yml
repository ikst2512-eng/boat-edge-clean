name: CLEAN external source diagnostic
on:
  pull_request:
    paths:
      - clean_live_source_probe.py
      - .github/workflows/clean-external-source-probe.yml
  workflow_dispatch:
    inputs:
      date:
        description: Race date YYYYMMDD
        required: true
        type: string
      venue:
        description: Venue code 01-24
        required: true
        type: string
      race:
        description: Race number 1-12
        required: true
        type: string
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe external sources without storing response payloads
        env:
          RACE_DATE: ${{ inputs.date || '20261026' }}
          VENUE: ${{ inputs.venue || '21' }}
          RACE: ${{ inputs.race || '1' }}
        run: |
          python clean_live_source_probe.py --date "$RACE_DATE" --venue "$VENUE" --race "$RACE" --output source-probe-report.json
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python clean_live_source_probe.py --date "$RACE_DATE" --venue "$VENUE" --race 2 --output source-probe-race2.json
            python clean_live_source_probe.py --date "$RACE_DATE" --venue 01 --race 1 --output source-probe-venue01.json
            python clean_live_source_probe.py --date 20261025 --venue 21 --race 1 --output source-probe-prior-day.json
          fi
      - name: Preserve diagnostic metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-source-diagnostic-${{ github.run_id }}
          path: |
            source-probe-report.json
            source-probe-race2.json
            source-probe-venue01.json
            source-probe-prior-day.json
          if-no-files-found: warn
          retention-days: 14
