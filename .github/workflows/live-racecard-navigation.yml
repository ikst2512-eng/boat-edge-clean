name: CLEAN published racecard and navigation browser check
on:
  pull_request:
    paths:
      - tests/live-racecard-navigation.cjs
      - .github/workflows/live-racecard-navigation.yml
  workflow_dispatch:
  schedule:
    # UTC -> JST: 12:15, 14:15, 16:15, 18:15.
    - cron: '15 3,5,7,9 * * *'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps --only-shell chromium
      - name: Inspect real live racecard API and navigate published Pages
        run: node tests/live-racecard-navigation.cjs
