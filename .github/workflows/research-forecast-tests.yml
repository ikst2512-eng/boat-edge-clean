name: Research forecast checks
on:
  push:
    paths:
      - 'research_model.py'
      - 'server.py'
      - 'test_research_model.py'
      - 'test_research_model_provenance.py'
      - 'test_research_persistence.py'
      - 'collect_research_daily.py'
      - 'test_collect_research_daily.py'
      - 'test_research_source_digests.py'
      - 'scripts/audit_research_outcomes.py'
      - 'scripts/verify_research_git_first_add.py'
      - 'tests/**'
      - '.github/workflows/research-forecast-tests.yml'
  pull_request:
    paths:
      - 'research_model.py'
      - 'server.py'
      - 'test_research_model.py'
      - 'test_research_model_provenance.py'
      - 'test_research_persistence.py'
      - 'collect_research_daily.py'
      - 'test_collect_research_daily.py'
      - 'test_research_source_digests.py'
      - 'scripts/audit_research_outcomes.py'
      - 'scripts/verify_research_git_first_add.py'
      - 'tests/**'
      - '.github/workflows/research-forecast-tests.yml'
  workflow_dispatch:
jobs:
  research-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate research forecast model and persisted records
        run: python -m unittest -v test_research_model test_research_model_provenance test_research_persistence test_collect_research_daily test_research_source_digests
      - name: Verify audit regressions when auditor branch is integrated
        run: |
          if [ -f scripts/audit_research_outcomes.py ]; then
            python -m unittest discover -s tests -p 'test_*.py' -v
          fi
