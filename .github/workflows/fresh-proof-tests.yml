name: Fresh proof tests
on:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q server.py test_predictions.py test_fresh_commit_proof.py fresh_feed_builder.py test_fresh_feed_builder.py fresh_feed_publisher.py test_fresh_feed_publisher.py fresh_feed_batch.py test_fresh_feed_batch.py fresh_feed_isolated.py test_fresh_feed_isolated.py
      - run: python test_predictions.py
      - run: python test_fresh_commit_proof.py
      - run: python test_fresh_feed_builder.py
      - run: python test_fresh_feed_publisher.py
      - run: python test_fresh_feed_batch.py
      - run: python test_fresh_feed_isolated.py
