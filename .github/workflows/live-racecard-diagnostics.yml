name: CLEAN live racecard upstream diagnostics
on:
  pull_request:
    paths:
      - scripts/diagnose_live_racecard.py
      - .github/workflows/live-racecard-diagnostics.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/diagnose_live_racecard.py
