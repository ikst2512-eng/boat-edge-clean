name: Mobile browser smoke test
on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/mobile-smoke.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - '.github/workflows/mobile-smoke.yml'
jobs:
  browser:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Verify current production mobile navigation
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              // Render may first serve its 503 "Application loading" splash while a sleeping service wakes.
              let response;
              for(let attempt=1;attempt<=12;attempt++){
                response=await page.goto('https://boat-edge-clean.onrender.com/',{waitUntil:'domcontentloaded',timeout:90000});
                if(response?.status()!==503)break;
                console.log('RENDER_WAKING',attempt,'of 12; HTTP 503');
                await page.waitForTimeout(6000);
              }
              const diagnostics=await page.evaluate(()=>({title:document.title,path:location.pathname,heading:document.querySelector('h1')?.textContent?.trim(),venueCount:document.querySelectorAll('#venues button').length,bodySample:document.body?.innerText?.slice(0,450)}));
              console.log('RENDER_PRODUCTION_DIAGNOSTICS',JSON.stringify({status:response?.status(),url:page.url(),...diagnostics}));
              if(response?.status()!==200)throw Error('Render returned HTTP '+response?.status());
              if(diagnostics.venueCount!==24)throw Error('Render is not serving current CLEAN app; expected 24 venue buttons; '+JSON.stringify(diagnostics));
              await page.locator('#venues button').first().waitFor({timeout:20000});
              if(await page.locator('#venues button').count()!==24)throw Error('24 venues not rendered');
              if(await page.locator('#races button').count()!==12)throw Error('12 races not rendered');
              if(await page.locator('#forecast [data-top]').count()!==3)throw Error('Top3/5/10 controls missing');
              await page.locator('#forecast [data-top="5"]').click();
              if(!await page.locator('#forecast [data-top="5"]').evaluate(el=>el.classList.contains('on')))throw Error('Top5 not selected');
              await page.locator('#venues button').nth(11).click();
              await page.locator('#races button').nth(1).click();
              if(!(await page.locator('#activeRaceLabel').innerText()).includes('2R'))throw Error('Current race label not updated');
              await page.locator('.view-tabs [data-view="result"]').click();
              if(!await page.locator('#resultSection').isVisible())throw Error('Result tab not visible');
              await page.locator('.view-tabs [data-view="forecast"]').click();
              if(!await page.locator('#forecast').isVisible())throw Error('Forecast tab not visible');
              if(errors.length)throw Error('JavaScript page errors: '+errors.join('; '));
              console.log('PASS: production mobile 24 venues, 12 races, forecast controls, result navigation');
              console.log('NOTE: Live odds API is checked independently by live-odds-probe workflow');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

  ui-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Check PR-local mobile UI without production API dependency
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true});
              await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
              await page.locator('#venues button').first().waitFor({timeout:15000});
              if(await page.locator('#venues button').count()!==24)throw Error('24 venues missing');
              if(await page.locator('#forecast [data-top]').count()!==3)throw Error('Prediction controls missing');
              const rows=await page.evaluate(()=>{
                predictionTickets=['1-2-3','1-3-2','2-1-3','3-1-2'];
                predictionProbabilities={'1-2-3':28,'1-3-2':17,'2-1-3':9,'3-1-2':2};
                predictionOdds={};
                selectedTop=3;drawPredictions();
                return [...document.querySelectorAll('#predictionRows .prediction-row')].map(r=>({cls:r.className,tier:r.querySelector('.prediction-tier')?.textContent,value:r.querySelector('.prediction-value')?.textContent,prob:r.querySelector('.prediction-odds')?.className}));
              });
              if(rows.length!==3||!rows[0].cls.includes('prediction-primary')||!rows[0].prob.includes('probability-high')||rows[0].tier!=='本命'||rows[0].value!=='28.00%')throw Error('Primary mobile forecast incorrect: '+JSON.stringify(rows));
              if(!rows[1].cls.includes('prediction-strong')||!rows[2].cls.includes('prediction-strong'))throw Error('Upper candidate styling absent');
              await page.locator('#forecast [data-top="5"]').click();
              if(await page.locator('#predictionRows .prediction-row').count()!==4)throw Error('Top5 selector incorrect');
              const bodyOverflow=await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+1);
              if(bodyOverflow)throw Error('Unexpected horizontal page overflow');
              console.log('PASS: PR-local mobile forecast hierarchy and controls');
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
