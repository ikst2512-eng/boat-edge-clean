name: Late preview evidence integrity
on:
  pull_request:
    paths: [late_preview_capture.py, collect_late_preview_once.py, test_late_preview_capture.py, tests/test_collect_late_preview_once.py, tests/test_preview_schedule_jst.py, tests/test_late_preview_paired_coverage.py, scripts/audit_late_preview_evidence.py, tests/test_audit_late_preview_evidence.py, scripts/preview_timing_integrity.py, tests/test_preview_timing_integrity.py, scripts/capture_official_beforeinfo_probe.py, tests/test_capture_official_beforeinfo_probe.py, .github/workflows/late-preview-capture.yml, .github/workflows/late-preview-evidence-tests.yml]
  push:
    branches: [main]
    paths: [late_preview_capture.py, collect_late_preview_once.py, test_late_preview_capture.py, tests/test_collect_late_preview_once.py, tests/test_preview_schedule_jst.py, scripts/audit_late_preview_evidence.py, tests/test_audit_late_preview_evidence.py, scripts/preview_timing_integrity.py, tests/test_preview_timing_integrity.py, scripts/capture_official_beforeinfo_probe.py, tests/test_capture_official_beforeinfo_probe.py, .github/workflows/late-preview-capture.yml, .github/workflows/late-preview-evidence-tests.yml]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_late_preview_capture
      - run: python -m unittest discover -s tests -p 'test_collect_late_preview_once.py' -v
      - run: python -m unittest discover -s tests -p 'test_preview_schedule_jst.py' -v
      - run: python -m unittest discover -s tests -p 'test_preview_timing_integrity.py' -v
      - run: python -m unittest discover -s tests -p 'test_audit_late_preview_evidence.py' -v
      - run: python -m unittest discover -s tests -p 'test_late_preview_paired_coverage.py' -v
      - run: python -m unittest discover -s tests -p 'test_capture_official_beforeinfo_probe.py' -v
