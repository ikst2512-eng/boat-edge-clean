name: CLEAN independent confirmed result collection
on:
  schedule:
    - cron: '*/10 * * * *'
  # GitHub may delay/skip cron. Reuse the EXISTING result collector after
  # independently scheduled or watchdog-dispatched capture, regardless of whether capture succeeded.
  # CLEAN's later 22:28 JST last slot extends catch-up beyond four-mode's 20:52.
  # A failed capture does not imply the result CSV is unavailable.
  workflow_run:
    workflows: ['Four-mode prospective capture (research only)', 'CLEAN prospective pre-cutoff capture']
    types: [completed]
  workflow_dispatch:
    inputs:
      backfill_day:
        description: 'Optional historical JST date YYYYMMDD (last 30 days only)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - collect_clean_results.py
      - clean_results.py
      - server.py
      - test_collect_clean_results.py
      - scripts/backfill_clean_result_day.py
      - test_backfill_clean_result_day.py
      - .github/workflows/collect-clean-results.yml
  pull_request:
    paths:
      - collect_clean_results.py
      - clean_results.py
      - server.py
      - test_collect_clean_results.py
      - .github/workflows/collect-clean-results.yml
permissions:
  contents: write
concurrency:
  group: clean-main-data-writers
  cancel-in-progress: false
jobs:
  collect:
    # Only same-repository main schedule or fallback-dispatch completions can trigger
    # this writer; reject PR/foreign-repository workflow_run events.
    if: >-
      ${{ github.event_name == 'pull_request' ||
          (github.event_name != 'workflow_run' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_run' &&
           contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event.workflow_run.event) &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          # Scheduled/dispatch re-runs may point to a SHA before existing immutable
          # results were archived. Writers must start from current main; PR tests
          # still use their precise synthetic merge commit and NEVER write.
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate collector and archive reader without network
        run: python -m unittest -v test_collect_clean_results test_clean_results test_backfill_clean_result_day
      - name: Collect published results (main only)
        if: github.event_name != 'pull_request'
        env:
          BACKFILL_DAY: ${{ github.event.inputs.backfill_day || '' }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          if [[ -n "${BACKFILL_DAY:-}" ]]; then
            python -m scripts.backfill_clean_result_day "$BACKFILL_DAY" 2>&1 | tee test-results/collection-run.log
          else
            python collect_clean_results.py 2>&1 | tee test-results/collection-run.log
          fi
          test ${PIPESTATUS[0]} -eq 0
      - name: Commit new result archives (main only)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- confirmed_results/
          if ! git diff --cached --quiet; then
            git commit -m 'data: append independently collected confirmed results'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git -c rebase.autoStash=true rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "main updated concurrently; push retries exhausted" >&2
                exit 1
              fi
              sleep "$attempt"
            done
          fi
      - name: Retain collection run diagnostics
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: clean-collection-${{ github.run_id }}
          path: test-results/collection-run.log
          if-no-files-found: warn
          retention-days: 30
