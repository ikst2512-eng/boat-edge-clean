name: Hole shadow stage verdict research
on:
  pull_request:
    paths:
      - hole_shadow_stage_verdict.py
      - test_hole_shadow_stage_verdict.py
      - .github/workflows/hole-shadow-stage-verdict.yml
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v test_hole_shadow_stage_verdict.py
