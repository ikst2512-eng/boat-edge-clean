name: Production API evidence smoke
on:
  pull_request:
    paths:
      - '.github/workflows/production-api-evidence.yml'
  workflow_dispatch:
jobs:
  read-only-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check live production endpoint identities without assuming odds availability
        env:
          BASE_URL: https://boat-edge-clean.onrender.com
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error, datetime
          base=os.environ['BASE_URL']
          def fetch(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'CLEAN-API-PROOF/1.0','Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:
                      return response.status,response.read(300000)
              except urllib.error.HTTPError as e:
                  return e.code,e.read(300000)
          def report(msg):
              print(msg,flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write(msg+'\n')
          status,raw=fetch('/healthz')
          if status!=200 or raw.strip()!=b'ok':raise AssertionError('healthz not healthy: '+str(status))
          report('Health: HTTP 200, ok')
          day=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).strftime('%Y%m%d')
          status,raw=fetch('/api/clean-schedule?date='+day)
          report('Schedule '+day+': HTTP '+str(status))
          if status!=200:
              report('Schedule not verifiable now; no race or cutoff invented.')
          else:
              data=json.loads(raw)
              assert data.get('ok') is True or (isinstance(data.get('venues'),list) and data.get('date')==day), 'invalid schedule response'
              races=[(r.get('venue_code'),r.get('race_no'),r.get('deadline_jst')) for r in data.get('races',[]) if isinstance(r,dict)]
              report('Schedule dated entries: '+str(len(races)))
              candidate=next(((v,n,t) for v,n,t in races if isinstance(t,str) and len(t)>=16 and t.startswith(day[:4]+'-'+day[4:6]+'-'+day[6:8]) and isinstance(n,int)),None)
              if candidate:
                  v,n,t=candidate
                  report('Sample sourced cutoff: venue '+str(v)+' '+str(n)+'R '+t)
                  p='/api/odds?hd='+day+'&jcd='+str(v).zfill(2)+'&rno='+str(n)
                  code,body=fetch(p)
                  report('Same-race odds: HTTP '+str(code))
                  if code==200:
                      odds=json.loads(body)
                      assert odds.get('ok') is True and odds.get('hd')==day and str(odds.get('jcd')).zfill(2)==str(v).zfill(2) and odds.get('rno')==n
                      assert isinstance(odds.get('odds'),dict) and len(odds['odds'])==120
                      report('Odds identity and 120 combos: PASS')
                  else:report('Odds not available; not marked verified.')
                  code,body=fetch('/api/clean-result?hd='+day+'&jcd='+str(v).zfill(2)+'&rno='+str(n))
                  report('Same-race result: HTTP '+str(code))
                  if code==200:
                      result=json.loads(body)
                      race_code=day+str(v).zfill(2)+str(n).zfill(2)
                      source='https://boatracecsv.github.io/data/results/realtime/'+day[:4]+'/'+day[4:6]+'/'+day[6:8]+'.csv'
                      finish=result.get('finish_order')
                      valid=(result.get('ok') is True and result.get('status')=='confirmed'
                             and result.get('race_code')==race_code and result.get('source_url')==source
                             and isinstance(finish,list) and len(finish)==3
                             and all(type(x) is int and 1<=x<=6 for x in finish)
                             and len(set(finish))==3)
                      def parsed(name):
                          value=result.get(name)
                          dt=datetime.datetime.fromisoformat(value) if isinstance(value,str) else None
                          return dt if dt and dt.utcoffset() is not None else None
                      try: confirmed=parsed('confirmed_at_jst');collected=parsed('collected_at_jst')
                      except ValueError: confirmed=collected=None
                      valid=valid and confirmed is not None and collected is not None and collected>=confirmed
                      if not valid:raise AssertionError('Result HTTP 200 but confirmed identity/source/finish/time invalid')
                      report('Confirmed result identity/source/timestamps and finish: PASS '+ '-'.join(map(str,finish)))
                      report('Official payout independently checked: NO (not included in this result API)')
                      archive_status,archive_raw=fetch('/api/four-mode-archive?code='+race_code)
                      report('Same-race four-mode archive: HTTP '+str(archive_status))
                      if archive_status==200:
                          archived=json.loads(archive_raw)
                          assert archived.get('race_code')==race_code and archived.get('status')=='historical_research_only' and archived.get('production_forecast') is False
                          modes=archived.get('modes')
                          assert isinstance(modes,dict), 'missing archived modes'
                          winner='-'.join(map(str,finish))
                          for mode in ('narrow','hit','balance','hole'):
                              tickets=modes.get(mode,{}).get('tickets')
                              assert isinstance(tickets,list) and tickets, 'missing archived tickets: '+mode
                              combos=[x.get('combo') for x in tickets]
                              assert len(combos)==len(set(combos)), 'duplicate archived ticket: '+mode
                              positions=[i+1 for i,combo in enumerate(combos) if combo==winner]
                              report('Archived '+mode+': '+('HIT ticket #'+str(positions[0]) if positions else 'MISS')+' / '+str(len(combos))+' tickets')
                          report('Archive hit comparison: research only; first Git add not authenticated')
                      else:
                          report('Archived forecast not available; hit status not inferred')

                  else:report('Confirmed result unavailable; not marked verified.')
          PY
