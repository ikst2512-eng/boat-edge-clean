name: CLEAN selection public smoke
on:
  push:
    branches: [main, feature/selection-public-smoke]
    paths:
      - "selection.html"
      - "selection_dual.py"
      - "server.py"
      - "audit_clean_first_add.py"
      - "compare_topn_signal70.py"
      - "compare_topn_signal70_days.py"
      - "evaluate_clean_prospective.py"
      - ".github/workflows/selection-public-smoke.yml"
  schedule:
    - cron: '50 15 * * *'
  workflow_dispatch:
jobs:
  production-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check Render public routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://boat-edge-clean.onrender.com"
          check() {
            path="$1"
            out="$(mktemp)"
            if ! code="$(curl --retry 2 --retry-delay 2 --max-time 45 -L -sS -o "$out" -w '%{http_code}' "$base$path")"; then
              echo "::error::Render unreachable: $path"
              return 1
            fi
            if [[ "$code" != 200 ]]; then
              echo "::error::HTTP $code for $path"
              return 1
            fi
            if [[ "$path" == /selection ]]; then
              grep -q '購入候補・並行検証' "$out" || { echo "::error::Selection page missing"; return 1; }
            elif [[ "$path" == /forecast ]]; then
              grep -q 'id="predictionRows"' "$out" || { echo "::error::Forecast page missing"; return 1; }
            else
              python -m json.tool "$out" >/dev/null
              python - "$out" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["schema"]=="CLEAN_DUAL_RESEARCH_V1"
          assert d["minimum_confidence"]==0.7
          assert d["prediction_publication_policy"]=="all_races_unfiltered"
          assert d["below_minimum_policy"]=="skip_selection_keep_forecast"
          assert d["ledgers"]["all"]["races"]>=d["ledgers"]["confidence_70"]["races"]
          assert d["skipped_below_70"]["races"]+d["ledgers"]["confidence_70"]["races"]==d["ledgers"]["all"]["races"]
          print("Public dual ledger healthy; verified",d["sample_races"],"races, post-policy",d["cohorts"]["post_policy"]["all"]["races"])
          PY
            fi
            rm -f "$out"
          }
          check /forecast
          check /selection
          check /api/selection-research
      - name: Verify public holdout API remains evidence-safe
        shell: bash
        run: |
          set -euo pipefail
          # Cold starts may return 503 while the evidence audit initializes.
          # Retry boundedly; never accept a pending response as verified data.
          for attempt in $(seq 1 12); do
            code="$(curl --max-time 15 -sSL -o holdout-status.json -w '%{http_code}' \
              https://boat-edge-clean.onrender.com/api/signal70-holdout-status)" || code="000"
            if [[ "$code" == 200 ]]; then
              break
            fi
            echo "holdout status attempt=$attempt http=$code"
            python - <<'PYLOG'
          import json
          from pathlib import Path
          try:
              d=json.loads(Path("holdout-status.json").read_text(encoding="utf-8"))
              print("holdout operational diagnostic:", {k:d.get(k) for k in
                  ("error","running","elapsed_seconds","last_duration_seconds","last_error_type","worker_pid","process_uptime_seconds")})
          except (OSError,ValueError,TypeError):
              print("holdout response not valid diagnostic JSON")
          PYLOG
            if [[ "$attempt" == 12 ]]; then
              echo "::error::holdout status did not become ready"
              exit 1
            fi
            sleep 5
          done
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("holdout-status.json").read_text(encoding="utf-8"))
          assert d["schema"]=="CLEAN_SIGNAL70_HOLDOUT_STATUS_V1"
          # Require currently deployed diagnostic contract, not a stale HTTP 200.
          assert all(key in d for key in ("archived_candidates","awaiting_result_races",
                                        "audit_rejected_races","audit_rejection_reasons"))
          reasons=d["audit_rejection_reasons"]
          assert isinstance(reasons,dict) and "cutoff_failed" not in reasons, (
              "Render is serving stale unsplit cutoff diagnostics")
          assert sum(reasons.values())==d["audit_rejected_races"]
          assert d["discovery_day"]=="20261029"
          assert type(d["independently_validated"]) is bool
          assert type(d["later_holdout_days"]) is int and d["later_holdout_days"]>=0
          assert type(d["evaluated_holdout_races"]) is int and d["evaluated_holdout_races"]>=0
          # A successful HTTP 200 from an older Render deployment is not
          # sufficient to validate the newly deployed audit diagnostics.
          for key in ("archived_candidates", "awaiting_result_races", "audit_rejected_races"):
              assert type(d.get(key)) is int and d[key]>=0, f"missing {key}"
          reasons=d.get("audit_rejection_reasons")
          assert type(reasons) is dict, "missing audit_rejection_reasons (stale deployment)"
          assert all(type(k) is str and type(v) is int and v>=0 for k,v in reasons.items())
          assert sum(reasons.values())==d["audit_rejected_races"]
          assert (d["archived_candidates"]==d["evaluated_holdout_races"]+
                  d["awaiting_result_races"]+d["audit_rejected_races"])
          if d["later_holdout_days"]==0:
              assert d["evaluated_holdout_races"]==0
              assert d["independently_validated"] is False
          print("Public holdout schema OK; later days:",
                d["later_holdout_days"],"evaluated:",d["evaluated_holdout_races"],
                "independently validated:",d["independently_validated"],
                "archived:",d.get("archived_candidates"),
                "awaiting result:",d.get("awaiting_result_races"),
                "audit rejected:",d.get("audit_rejected_races"),
                "rejection reasons:",d.get("audit_rejection_reasons"))
          PY
