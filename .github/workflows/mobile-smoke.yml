name: Mobile browser smoke test
on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/mobile-smoke.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Verify venue, race and live odds UI
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,deviceScaleFactor:2});
            try{
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              await page.goto('https://boat-edge-clean.onrender.com/',{waitUntil:'domcontentloaded',timeout:90000});
              await page.locator('#venues button').first().waitFor();
              if(await page.locator('#venues button').count()!==24)throw Error('24 venues not rendered');
              await page.locator('#venues button').nth(11).click();
              await page.locator('#races button').nth(0).click();
              await page.locator('#day').fill('2026-10-22');
              await page.locator('#refresh').click();
              await page.waitForFunction(()=>document.querySelector('#oddsStatus').textContent.includes('120通り'),{timeout:40000});
              if(await page.locator('#oddsData .chosen').count()!==120)throw Error('Missing odds cells');
              if(await page.locator('#oddsData .odds-group').count()!==6)throw Error('Expected six first-boat sections');
              for(let i=0;i<6;i++){
                const group=page.locator('#oddsData .odds-group').nth(i);
                if(await group.locator('.odds-cell').count()!==20)throw Error('Expected 20 tickets for boat '+(i+1));
                if(!(await group.locator('h3').innerText()).includes((i+1)+'号艇'))throw Error('Boat heading mismatch');
              }
              if(!(await page.locator('#oddsStatus').innerText()).includes('日本時間'))throw Error('Japanese time label missing');
              if(!(await page.locator('#oddsData .odds-cell strong').first().innerText()).includes('倍'))throw Error('Odds not visually separated');
              // Switching race must invalidate previously displayed odds.
              await page.locator('#races button').nth(1).click();
              if(await page.locator('#oddsData .chosen').count()!==0)throw Error('Stale odds remain after race change');
              if(!(await page.locator('#selected').innerText()).includes('2R'))throw Error('Race 2 not selected');
              if(await page.locator('#refresh').isDisabled())throw Error('Refresh disabled after race change');
              await page.locator('#venues button').nth(10).click();
              if(!(await page.locator('#selected').innerText()).includes('びわこ'))throw Error('Venue change failed');
              if(!(await page.locator('#selected').innerText()).includes('1R'))throw Error('Venue change must select 1R');
              await page.locator('#day').fill('2026-10-21');
              if(!(await page.locator('#selected').innerText()).includes('2026-10-21'))throw Error('Date change failed');
              if(await page.locator('#oddsData .chosen').count()!==0)throw Error('Stale odds after date change');
              // Test in-flight switch with a delayed controlled API reply.
              await page.route('**/api/odds?*', async route=>{
                await new Promise(resolve=>setTimeout(resolve,900));
                await route.fulfill({status:503,contentType:'application/json',body:JSON.stringify({ok:false,message:'通信テスト：一時的に取得できません'})});
              });
              await page.locator('#races button').nth(0).click();
              await page.waitForTimeout(1100);
              await page.locator('#refresh').click();
              await page.locator('#races button').nth(1).click();
              await page.waitForTimeout(1400);
              if(await page.locator('#oddsData .chosen').count()!==0)throw Error('Stale response inserted after switch');
              if(!(await page.locator('#oddsStatus').innerText()).includes('レースを選んで'))throw Error('Stale error overwrote selected race');
              if(await page.locator('#refresh').isDisabled())throw Error('Refresh stayed disabled after switch');
              await page.locator('#refresh').click();
              await page.waitForFunction(()=>document.querySelector('#oddsStatus').textContent.includes('一時的に取得できません'),null,{timeout:8000});
              if(await page.locator('#refresh').isDisabled())throw Error('Refresh stayed disabled after API error');
              await page.unroute('**/api/odds?*');
              if(errors.length)throw Error('JS errors: '+errors.join('; '));
              console.log('PASS: mobile 24 venues, race selection and 120 live odds cells');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
