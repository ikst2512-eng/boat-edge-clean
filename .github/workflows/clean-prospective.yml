name: CLEAN prospective pre-cutoff capture
on:
  schedule:
    - cron: '4,19,34,49 22 * * *' # 07:04-07:49 JST, avoid busy minute 00
    - cron: '4,19,34,49 23 * * *'
    - cron: '4,19,34,49 0-12 * * *'
    # Public race schedule contains 22:45 JST deadlines; preserve late
    # pre-cutoff opportunities rather than ending all collection at 20:45.
    - cron: '4,19,28 13 * * *' # 22:04/22:19/22:28 JST; 22:45 T-12=22:33
  workflow_dispatch:
  pull_request:
    paths:
      - collect_clean_prospective.py
      - test_collect_clean_prospective.py
      - scripts/clean_capture_local_accounting.py
      - test_clean_capture_local_accounting.py
      - .github/workflows/clean-prospective.yml
  push:
    branches: [main]
    paths:
      - collect_clean_prospective.py
      - test_collect_clean_prospective.py
      - scripts/clean_capture_local_accounting.py
      - test_clean_capture_local_accounting.py
      - .github/workflows/clean-prospective.yml
permissions:
  contents: write
  actions: write  # Dispatch the existing independent audit after an actual successful freeze push.
concurrency:
  # Only schedule/manual recovery may write new immutable originals.
  # Frequent PR and main-push CI must not replace pending scheduled runs;
  # GitHub concurrency retains only one pending job per group.
  # Main push still wakes the independent CLEAN watchdog when needed.
  group: ${{ github.event_name == 'pull_request' && format('clean-prospective-pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && 'clean-prospective-main-push-ci' || 'clean-prospective-capture' }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest -v test_collect_clean_prospective test_clean_capture_local_accounting
      - name: Capture if public race cards are already published
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          # Preserve source HTTP bytes per run for independent SHA replays.
          # This is a local Actions artifact, NOT remote first-seen proof.
          FOUR_MODE_RAW_RECEIPT_DIR: test-results/prospective-source-originals
        run: |
          set -euo pipefail
          hour=$(TZ=Asia/Tokyo date +%H)
          mkdir -p test-results
          if [ "$hour" -lt 6 ]; then
            echo 'Daily source not yet published (JST preopening window)' | tee test-results/prospective-capture.log
            exit 0
          fi
          python collect_clean_prospective.py 2>&1 | tee test-results/prospective-capture.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Freeze immutable candidate evidence
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -d prospective_predictions ]; then
            echo 'No eligible pre-cutoff candidates'
            exit 0
          fi
          git add -- prospective_predictions/
          if git diff --cached --name-only --diff-filter=CDMRTUX -- prospective_predictions/ | grep -q .; then
            echo 'Existing prospective prediction modification prohibited' >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          python - <<'PY'
          import hashlib,json,re,subprocess
          from datetime import datetime,timedelta,timezone
          files=subprocess.check_output(['git','diff','--cached','--name-only','--diff-filter=A','--','prospective_predictions/'],text=True).splitlines()
          if not files: raise SystemExit('No newly staged records')
          kept=0
          excluded=0
          for path in files:
              rec=json.load(open(path,encoding='utf-8'))
              if rec.get('race_code') != path.rsplit('/',1)[-1].removesuffix('.json'):
                  raise SystemExit('Prediction file identity mismatch: '+path)
              tickets=rec.get('predictions')
              if not isinstance(tickets,list) or len(tickets)!=10 or len(set(tickets))!=10:
                  raise SystemExit('Prediction must contain ten unique tickets: '+path)
              for ticket in tickets:
                  boats=ticket.split('-') if isinstance(ticket,str) else []
                  if len(boats)!=3 or len(set(boats))!=3 or any(b not in '123456' or len(b)!=1 for b in boats):
                      raise SystemExit('Invalid trifecta ticket: '+path)
              if rec.get('status')!='prospective_candidate' or rec.get('validated') is not False:
                  raise SystemExit('Invalid prospective classification: '+path)
              if rec.get('formal') is not False or rec.get('scoring') is not False:
                  raise SystemExit('Candidate is not research-only: '+path)
              kind=rec.get('input_source_kind')
              if kind not in ('public_pre_race_csv','nonofficial_openapi_v1','direct_race_specific_pre_race'):
                  raise SystemExit('Invalid candidate input source kind: '+path)
              title_sha=rec.get('source_title_sha256')
              cards_sha=rec.get('source_cards_sha256')
              combined_sha=rec.get('input_sha256')
              if any(not isinstance(value,str) or not re.fullmatch(r'[0-9a-f]{64}',value)
                     for value in (title_sha,cards_sha,combined_sha)):
                  raise SystemExit('Invalid candidate source SHA256: '+path)
              if (combined_sha!=hashlib.sha256((title_sha+':'+cards_sha).encode()).hexdigest()
                      or (kind=='nonofficial_openapi_v1' and title_sha!=cards_sha)):
                  raise SystemExit('Candidate source digest inconsistency: '+path)
              # Freeze only real current-calendar races. Once a bad new
              # original reaches Git, the write-once rule cannot repair it.
              code=rec['race_code']
              if (not isinstance(code,str) or not re.fullmatch(r'20[0-9]{10}',code)
                      or not 1<=int(code[8:10])<=24
                      or not 1<=int(code[10:12])<=12):
                  raise SystemExit('Invalid candidate race identity: '+path)
              deadline=datetime.fromisoformat(rec['source_deadline_jst'])
              cutoff=datetime.fromisoformat(rec['cutoff_jst'])
              source_times=[datetime.fromisoformat(rec[k]) for k in ('source_title_received_jst','source_cards_received_jst','generated_at')]
              if deadline.strftime('%Y%m%d')!=code[:8]:
                  raise SystemExit('Candidate deadline does not match race day: '+path)
              if any(t.utcoffset()!=timedelta(hours=9) for t in (deadline,cutoff,*source_times)):
                  raise SystemExit('Candidate source/deadline must be JST: '+path)
              if source_times[0]>source_times[2] or source_times[1]>source_times[2]:
                  raise SystemExit('Source receipt after candidate generation: '+path)
              if deadline-cutoff!=timedelta(minutes=12) or max(source_times)>=cutoff or rec['formal'] or rec['scoring']:
                  raise SystemExit('Malformed prospective candidate: '+path)
              # Reserve 90 seconds for the Git push/receipt. Never backdate a stale candidate.
              if datetime.now(timezone.utc)>=cutoff-timedelta(seconds=90):
                  subprocess.run(['git','reset','-q','--',path],check=True)
                  excluded+=1
              else:
                  kept+=1
          print(json.dumps({'eligible_for_commit':kept,'excluded_near_cutoff':excluded}))
          PY
          if git diff --cached --quiet; then
            echo 'No safe candidate remains for this run'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: freeze prospective pre-cutoff candidates (not yet formal)'
          # Other CLEAN writers update main frequently. Retry only while every
          # newly committed candidate still has a 90-second receipt buffer.
          for attempt in 1 2 3; do
            python - <<'PY'
          import json,subprocess
          from datetime import datetime,timedelta,timezone
          files=subprocess.check_output(
              ['git','diff-tree','--no-commit-id','--name-only','--diff-filter=A','-r','HEAD','--','prospective_predictions/'],
              text=True).splitlines()
          if not files:
              raise SystemExit('No new candidates to push')
          now=datetime.now(timezone.utc)
          for path in files:
              with open(path,encoding='utf-8') as handle:
                  candidate=json.load(handle)
              cutoff=datetime.fromisoformat(candidate['cutoff_jst'])
              if now>=cutoff-timedelta(seconds=90):
                  raise SystemExit('Candidate receipt buffer expired; refusing late push: '+path)
          PY
            git fetch origin main
            git -c rebase.autoStash=true rebase origin/main
            # Rebase can consume the 90s safety margin or change the
            # publication commit. Check its exact first-add files again,
            # immediately before attempting a remote push.
            python - <<'PY'
          import json,subprocess
          from datetime import datetime,timedelta,timezone
          files=subprocess.check_output(
              ['git','diff-tree','--no-commit-id','--name-only','--diff-filter=A','-r','HEAD','--','prospective_predictions/'],
              text=True).splitlines()
          if not files:
              raise SystemExit('No immutable candidate additions after rebase')
          now=datetime.now(timezone.utc)
          for path in files:
              with open(path,encoding='utf-8') as handle:
                  candidate=json.load(handle)
              cutoff=datetime.fromisoformat(candidate['cutoff_jst'])
              if cutoff.utcoffset()!=timedelta(hours=9):
                  raise SystemExit('Non-JST cutoff after rebase: '+path)
              if now>=cutoff-timedelta(seconds=90):
                  raise SystemExit('Post-rebase candidate receipt buffer expired; refusing late push: '+path)
          print('PROSPECTIVE_POST_REBASE_GATE',json.dumps({'eligible_for_push':len(files),'status':'passed'}))
          PY
            if git push origin HEAD:main; then
              # A GITHUB_TOKEN push does not trigger another workflow's push event.
              # Dispatch the existing read-only audit only after a successful freeze.
              # If dispatch fails, surface a failed capture run; never claim audited.
              gh workflow run clean-prospective-evaluation.yml --ref main
              echo 'PROSPECTIVE_FIRST_ADD_AUDIT_DISPATCHED'
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Prospective push retries exhausted' >&2
              exit 1
            fi
            sleep "$attempt"
          done
      - name: Record local capture counts without asserting Git publication
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          python scripts/clean_capture_local_accounting.py \
            --capture-log test-results/prospective-capture.log \
            --output test-results/clean-capture-local-accounting.json
      - name: Flag zero daily captures after midday JST
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo("Asia/Tokyo"))
          if now.hour<12:
              print("CAPTURE_MONITOR_PRE_NOON",now.isoformat())
          else:
              day=now.strftime("%Y%m%d")
              count=sum(1 for _ in Path("prospective_predictions").glob(day+"????.json"))
              print("CAPTURE_MONITOR_JST_DAY",day,"ARCHIVES",count)
              if count==0:
                  print("::warning::No CLEAN prospective archives in checkout after midday JST; inspect public source and capture logs (not counted as forecast losses).")
          PY
      - name: Archive prospective capture diagnostics
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: clean-prospective-capture-${{ github.run_id }}
          path: |
            test-results/prospective-capture.log
            test-results/clean-capture-local-accounting.json
            test-results/prospective-source-originals/
          if-no-files-found: warn
          retention-days: 30
