name: Research pair remote receipt evidence
on:
  push:
    branches:
      - research/paired-hit-evaluation-20261027
    paths:
      - 'research_prospective_pairs/**'
permissions:
  contents: read
jobs:
  receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit committed pair against server-side run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECEIPT_RUN_ID: ${{ github.run_id }}
          RECEIPT_SHA: ${{ github.sha }}
        run: |
          python research_receipt_run_audit.py --run-id "$RECEIPT_RUN_ID" --sha "$RECEIPT_SHA"
      - name: Record GitHub-side push identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          RECEIVED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "research_pair_push_event=${EVENT_NAME}"
          echo "research_pair_push_sha=${RECEIVED_SHA}"
          echo "research_pair_push_run_id=${RUN_ID}"
          echo "research_pair_repository=${REPOSITORY}"
          echo "Server run created_at must be retrieved via Actions API; job clock is not evidence."
