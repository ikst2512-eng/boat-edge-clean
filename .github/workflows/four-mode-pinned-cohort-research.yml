name: Frozen historical four-mode cohort research
on:
  pull_request:
    paths:
      - pinned_four_mode_cohort_audit.py
      - four_mode_latest_main_inventory.py
      - forward_hole_saved_evidence_gate.py
      - test_forward_hole_saved_evidence_gate.py
      - test_four_mode_latest_main_inventory.py
      - pinned_hole_rank3_research.py
      - forward_hole_rank3_protocol.py
      - test_forward_hole_rank3_protocol.py
      - research/forward_hole_rank3_protocol_20261105.json
      - test_pinned_hole_rank3_research.py
      - hole_upper_rank_pair_protection.py
      - test_pinned_four_mode_cohort_audit.py
      - research/locked_four_mode_cohorts_20261105.json
      - four_mode_research_batch.py
      - four_mode_historical_cohort.py
      - .github/workflows/four-mode-pinned-cohort-research.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retrospective:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test manifest integrity and missing-evidence refusal
        run: python -m unittest -v test_pinned_four_mode_cohort_audit test_four_mode_research_batch test_pinned_hole_rank3_research test_forward_hole_rank3_protocol test_four_mode_latest_main_inventory test_forward_hole_saved_evidence_gate
      - name: Compare three exact frozen race cohorts
        run: python pinned_four_mode_cohort_audit.py
      - name: Reproduce predeclared outcome-blind hole rank3 on locked 240 races
        run: python pinned_hole_rank3_research.py
      - name: Verify fixed forward experiment protocol (no data scored)
        run: python forward_hole_rank3_protocol.py > forward_hole_rank3_protocol_audit.json
      - name: Read-only fetch latest main (never check out over PR research files)
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Inspect latest main tree for November 5+ files (no accuracy scored)
        run: python four_mode_latest_main_inventory.py
      - name: Retain evidence on both success and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-four-mode-historical-${{ github.run_id }}
          path: |
            pinned_four_mode_cohort_report.json
            pinned_hole_rank3_research_report.json
            forward_hole_rank3_protocol_audit.json
            four_mode_latest_main_inventory.json
          if-no-files-found: warn
          retention-days: 90
