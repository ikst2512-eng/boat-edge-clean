name: Four-mode capture schedule watchdog
on:
  schedule:
    - cron: '13,28,43,58 22-23,0-12 * * *'
    - cron: '13,29,44 13 * * *' # 22:13/22:29/22:44 JST late CLEAN fallback
    # Dedicated 21:50/22:20 JST fallback checks for the 21:30 V2 nightly audit.
    - cron: '50 12 * * *'
    - cron: '20 13 * * *'
  workflow_dispatch:
  # Independent completion events can wake CLEAN recovery if GitHub omits
  # this workflow's own cron. Only successful same-repository main schedules
  # are trusted; script independently validates parent provenance.
  workflow_run:
    workflows:
      - 'Four-mode prospective capture (research only)'
      - 'CLEAN independent daily schedule capture'
      - 'Preview capture (schedule)'
      - 'CLEAN live official trifecta odds probe'
      - 'Entry research T-minus-12 baseline archival'
      - 'Research independent late preview evidence'
      - 'Entry course missed-cron activation watchdog'
      # Observed independent main/schedule completion 07:32 JST on Nov 5.
      # Only this parent may wake V2 recovery; no new cron or writer.
      - 'Hole cumulative evidence rollup (research only)'
      # Nov 6 07:16 JST successful independently scheduled parent.
      - 'Hole future shadow batch evidence (research only)'
    types: [completed]
  # Main updates provide an opportunistic fallback if GitHub drops cron events.
  # Check five minutes after each planned 15-minute capture. The 14-minute
  # success/cooldown window preserves separate slots while active jobs block
  # duplicates even when older. Push remains an opportunistic fallback.
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/four-mode-capture-watchdog.yml'
      - 'scripts/four_mode_watchdog_policy.py'
      - 'scripts/v2_nightly_watchdog_policy.py'
      - 'test_v2_nightly_watchdog_policy.py'
      - 'test_four_mode_watchdog_policy.py'
      - 'scripts/clean_prospective_watchdog.py'
      - 'test_clean_prospective_watchdog.py'
      - 'scripts/live_odds_slot_rescue.py'
      - 'test_live_odds_slot_rescue.py'
      - 'tests/test_watchdog_decision_artifact.py'
      - 'scripts/render_four_mode_dispatch.py'
      - 'test_render_four_mode_dispatch.py'
      - 'scripts/render_capture_wakeup.py'
      - 'test_render_capture_wakeup.py'
      - 'cloudflare/independent_capture_wakeup.mjs'
      - 'cloudflare/independent_capture_policy.mjs'
      - 'cloudflare/wrangler.toml'
      - 'tests/cloudflare_capture_wakeup.test.mjs'
permissions:
  actions: read
  contents: read
concurrency:
  # The main schedule, trusted independent workflow_run and main-push rescue
  # must serialize to avoid racing to dispatch the same CLEAN capture.
  # PR unit tests and known-ineligible parents cannot delay that queue.
  group: ${{ github.event_name == 'pull_request' && format('four-mode-watchdog-pr-{0}', github.run_id) || (github.event_name == 'workflow_run' && (github.event.workflow_run.event != 'schedule' || github.event.workflow_run.head_branch != 'main' || github.event.workflow_run.conclusion != 'success')) && format('four-mode-watchdog-ineligible-{0}', github.run_id) || 'four-mode-watchdog-main' }}
  cancel-in-progress: false
  queue: max
jobs:
  watchdog:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'schedule' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test dispatch policy
        id: policy_tests
        run: python -m unittest -v test_four_mode_watchdog_policy test_render_four_mode_dispatch tests.test_watchdog_decision_artifact test_v2_nightly_watchdog_policy test_clean_prospective_watchdog test_live_odds_slot_rescue test_render_capture_wakeup
      - name: Setup Node for Cloudflare offline tests (PR only)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Cloudflare external wakeup safety tests (PR only)
        if: ${{ github.event_name == 'pull_request' }}
        run: node --test tests/cloudflare_capture_wakeup.test.mjs
      - name: Validate Cloudflare Worker bundle (PR dry run; no deployment)
        if: ${{ github.event_name == 'pull_request' }}
        run: npx --yes wrangler@4.102.0 deploy --dry-run --config cloudflare/wrangler.toml --outdir /tmp/boat-edge-wakeup-bundle
      - name: Boot real Workerd in local scheduled-only mode (PR no secret)
        if: ${{ github.event_name == 'pull_request' }}
        timeout-minutes: 1
        run: |
          set -euo pipefail
          # This is a runtime STARTUP smoke, NOT a Cron execution proof.
          # Never inject a GitHub token or deploy to Cloudflare.
          npx --yes wrangler@4.102.0 dev --local --config cloudflare/wrangler.toml --ip 127.0.0.1 --port 8787 --log-level error > /tmp/boat-edge-cloudflare-workerd.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 20); do
            # No HTTP handler is intentional; this local GET must produce an
            # explicit no-fetch-handler error, not a successful application route.
            curl --silent --max-time 2 --output /dev/null http://127.0.0.1:8787/ || true
            if grep -q 'Handler does not export a fetch() function' /tmp/boat-edge-cloudflare-workerd.log; then
              ready=1
              break
            fi
            if grep -Eq 'runtime failed to start|Incorrect type for map entry|Worker requires compatibility date' /tmp/boat-edge-cloudflare-workerd.log; then
              echo "WORKERD_STARTUP_FAILED"
              tail -30 /tmp/boat-edge-cloudflare-workerd.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "WORKERD_STARTUP_NOT_VERIFIED"
            tail -30 /tmp/boat-edge-cloudflare-workerd.log
            exit 1
          fi
          echo "WORKERD_SCHEDULED_ONLY_BOOT_NO_FETCH_HANDLER_PASS"
      - name: Check recent capture runs before fallback dispatch
        # A verified independent main/schedule completion can also recover a
        # missing V2 capture. Never trust PR/manual/non-main/foreign parents.
        if: ${{ github.event_name != 'workflow_run' || ((github.event.workflow_run.name == 'Hole cumulative evidence rollup (research only)' || github.event.workflow_run.name == 'Hole future shadow batch evidence (research only)') && github.event.workflow_run.event == 'schedule' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from scripts.four_mode_watchdog_policy import should_dispatch
          from datetime import datetime, timezone, timedelta
          repo=os.environ["GH_REPOSITORY"]
          if os.environ["EVENT_NAME"] == "workflow_run":
              # Verify webhook provenance before any privileged API access.
              from pathlib import Path
              from scripts.clean_prospective_watchdog import trusted_schedule_completion
              parent=json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
              if (parent.get("workflow_run", {}).get("name") not in ("Hole cumulative evidence rollup (research only)", "Hole future shadow batch evidence (research only)")
                      or not trusted_schedule_completion(parent, repo)):
                  raise SystemExit("untrusted_four_mode_schedule_wakeup")
          name="four-mode-prospective-capture.yml"
          root=f"https://api.github.com/repos/{repo}/actions/workflows/{name}"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                   "Accept":"application/vnd.github+json",
                   "X-GitHub-Api-Version":"2022-11-28"}
          # Query event types individually: heavy PR traffic must not push
          # publication executions out of an unfiltered first page.
          publication=[]
          for event in ("schedule","workflow_dispatch"):
              request=urllib.request.Request(root+"/runs?event="+event+"&per_page=30",headers=headers)
              with urllib.request.urlopen(request,timeout=20) as response:
                  publication.extend(json.load(response)["workflow_runs"])
          publication.sort(key=lambda r:r["created_at"],reverse=True)
          now=datetime.now(timezone.utc)
          recent=[r for r in publication
                  if 0 <= (now-datetime.fromisoformat(r["created_at"].replace("Z","+00:00"))).total_seconds()<14*60]
          # A recent failed capture must not suppress recovery for the 14-minute slot.
          # Report the 14-minute outcome subset separately from the 120-minute
          # running/queued protection enforced by the policy.
          healthy=[r for r in recent if r["status"]!="completed" or r["conclusion"]=="success"]
          # Throttle retries: multiple watchdog invocations must not create a
          # dispatch storm when the upstream consistently fails. One retry per
          # 14-minute window preserves each planned 15-minute capture slot;
          # the existing T-20 admission gate holds.
          recent_fallback=[r for r in publication
                           if r["event"]=="workflow_dispatch" and
                           0 <= (now-datetime.fromisoformat(r["created_at"].replace("Z","+00:00"))).total_seconds() < 14*60]
          jst_now=now.astimezone(timezone(timedelta(hours=9)))
          in_capture_hours=7 <= jst_now.hour <= 20
          report={"capture_hours_jst":in_capture_hours,
                  "recent_publication_runs":len(recent),
                  "fallback_retry_cooldown":bool(recent_fallback),
                  "recent_failed_runs":len(recent)-len(healthy),
                  "recent_healthy_or_active_runs":len(healthy),
                  "older_active_runs_blocking":len([r for r in publication if
                      r["status"]!="completed" and 14*60 <=
                      (now-datetime.fromisoformat(r["created_at"].replace("Z","+00:00"))).total_seconds() < 120*60]),
                  "newest":publication[0]["created_at"] if publication else None,
                  "dry_run":os.environ["EVENT_NAME"]=="pull_request"}
          if should_dispatch(publication, now, os.environ["EVENT_NAME"],
                             recent_minutes=14, cooldown_minutes=14):
              # Best-effort repair, never assume dispatch implies successful publication.
              body=json.dumps({"ref":"main"}).encode()
              req=urllib.request.Request(root+"/dispatches",data=body,headers={
                  **headers,"Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(req,timeout=20) as response:
                  if response.status!=204:
                      raise RuntimeError("workflow_dispatch_not_accepted")
              report["action"]="fallback_dispatch_accepted"
          else:
              report["action"]="no_dispatch"
          # Evidence only: no credentials or prediction data are serialized.
          from pathlib import Path
          output=Path("four-mode-evidence/watchdog-decision.json")
          output.parent.mkdir(parents=True,exist_ok=True)
          output.write_text(json.dumps({
              "schema":"FOUR_MODE_WATCHDOG_DECISION_V1",
              "github_run_id":os.environ["GITHUB_RUN_ID"],
              "github_event":os.environ["EVENT_NAME"],
              "checked_at_utc":now.isoformat(),
              **report
          },sort_keys=True)+chr(10),encoding="utf-8")
          print("FOUR_MODE_WATCHDOG="+json.dumps(report,sort_keys=True))
          PY
      # Separate from capture recovery: missing V2 nightly runs should not
      # silently pass merely because research PR tests were green.
      - name: Dispatch one missed V2 nightly research run
        if: ${{ always() && github.event_name != 'pull_request' && github.event_name != 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from scripts.v2_nightly_watchdog_policy import should_dispatch_nightly
          repo = os.environ["GH_REPOSITORY"]
          now = datetime.now(timezone.utc)
          root = f"https://api.github.com/repos/{repo}/actions/workflows/v2-predeclared-shadow-research.yml"
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          runs = []
          verdict = {
              "schema": "V2_NIGHTLY_WATCHDOG_DECISION_V1",
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "trigger": os.environ["EVENT_NAME"],
              "checked_at_utc": now.isoformat(),
              "formal": False,
              "research_scoring_proven": False,
          }
          target = Path("four-mode-evidence/v2-nightly-decision.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          try:
              # The policy is local-time scoped, but do not dispatch without
              # checking both actual nightly event types independently.
              if should_dispatch_nightly([], now, os.environ["EVENT_NAME"]):
                  for event in ("schedule", "workflow_dispatch"):
                      req = urllib.request.Request(
                          root + "/runs?event=" + event + "&per_page=30",
                          headers=headers)
                      with urllib.request.urlopen(req, timeout=20) as response:
                          runs.extend(json.load(response)["workflow_runs"])
              verdict["recent_event_run_count"] = len(runs)
              if should_dispatch_nightly(runs, now, os.environ["EVENT_NAME"]):
                  payload = json.dumps({"ref": "main"}).encode()
                  req = urllib.request.Request(
                      root + "/dispatches", data=payload,
                      headers={**headers, "Content-Type": "application/json"},
                      method="POST")
                  with urllib.request.urlopen(req, timeout=20) as response:
                      if response.status != 204:
                          raise RuntimeError("v2_nightly_dispatch_not_accepted")
                  verdict["action"] = "fallback_dispatch_accepted_not_execution_proof"
              else:
                  verdict["action"] = "no_dispatch"
          except Exception as exc:
              verdict["action"] = "watchdog_check_or_dispatch_failed"
              verdict["error_type"] = type(exc).__name__
              raise
          finally:
              target.write_text(json.dumps(verdict, sort_keys=True) + chr(10),
                                encoding="utf-8")
              print("V2_NIGHTLY_WATCHDOG=" + json.dumps(verdict, sort_keys=True))
          PY
      # Reuse this existing 15-minute watchdog (including its opportunistic
      # main-push checks) to recover omitted CLEAN collector cron events.
      # Dispatch is not proof of a saved forecast; the collector preserves
      # its own T-12, append-only, raw-source and independent audit gates.
      - name: Recover missed CLEAN prospective capture
        # Independent collector recovery must run even if unrelated four-mode
        # or nightly GitHub API checks failed; never skip failing policy tests.
        if: ${{ always() && steps.policy_tests.outcome == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: python -m scripts.clean_prospective_watchdog
      # Rescue the three scheduled odds probe slots only if absent/failed,
      # using the existing watchdog cadence. This dispatch is a late best-
      # effort operational sample, never proof that the direct cron fired.
      # An odds API error cannot suppress the separate CLEAN recovery above.
      - name: Rescue missing direct live-odds slot
        if: ${{ always() && steps.policy_tests.outcome == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: python -m scripts.live_odds_slot_rescue
      - name: Preserve watchdog decision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-mode-watchdog-decision-${{ github.run_id }}
          path: |
            four-mode-evidence/watchdog-decision.json
            four-mode-evidence/v2-nightly-decision.json
            four-mode-evidence/clean-prospective-watchdog-decision.json
            four-mode-evidence/odds-slot-rescue-decision.json
          if-no-files-found: warn
          retention-days: 14
