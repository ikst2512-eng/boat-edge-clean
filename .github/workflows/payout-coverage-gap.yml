name: CLEAN payout coverage gap audit
on:
  pull_request:
    paths: [audit_payout_coverage.py, test_audit_payout_coverage.py, .github/workflows/payout-coverage-gap.yml, 'confirmed_results/**', 'four_mode_performance/verified_races/**']
  push:
    branches: [main]
    paths: [audit_payout_coverage.py, test_audit_payout_coverage.py, .github/workflows/payout-coverage-gap.yml]
  workflow_dispatch:
  schedule:
    - cron: '30 14 * * *' # 23:30 JST daily observational coverage check
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_audit_payout_coverage
      - run: python audit_payout_coverage.py 20261029 20261030 20261031
