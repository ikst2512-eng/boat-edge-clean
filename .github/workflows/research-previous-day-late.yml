name: Compare previous-day prospective late research
on:
  schedule:
    - cron: '15 0 * * *' # 09:15 JST, after prior-day result archiving
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify historical artifact parser
        run: python -m unittest discover -s tests -p 'test_evaluate_previous_day_late_artifacts.py' -v
      - name: Fetch prior immutable predictions and evaluate paired results
        run: python -m scripts.evaluate_previous_day_late_artifacts
      - name: Archive evaluation evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: late-research-previous-day-${{ github.run_id }}
          path: late_research_candidates/
          retention-days: 7
          if-no-files-found: ignore
