name: Isolated WebKit navigation-history hotfix checks
on:
  # Manual from default branch only AFTER an explicitly approved release.
  # PR builds use local WebKit and syntax-check the future production probe.
  workflow_dispatch:
  pull_request:
    paths:
      - index.html
      - navigation.js
      - tests/webkit-history-hotfix.cjs
      - tests/live_webkit_history_postdeploy.cjs
      - tests/live_pages_assets_postdeploy.cjs
      - .github/workflows/webkit-history-hotfix.yml
permissions:
  contents: read
jobs:
  history-stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check navigation and test syntax
        run: |
          node --check navigation.js
          node --check tests/webkit-history-hotfix.cjs
          node --check tests/live_webkit_history_postdeploy.cjs
          node --check tests/live_pages_assets_postdeploy.cjs
          node tests/live_pages_assets_postdeploy.cjs --self-test
      - name: Verify published HTML and JS match checked-out release (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: node tests/live_pages_assets_postdeploy.cjs
      - name: Install local WebKit engine
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps webkit
      - name: Verify real WebKit history quotas, race changes and back/forward
        run: node tests/webkit-history-hotfix.cjs
      - name: Verify REAL published Pages WebKit history (manual only after deployment)
        if: github.event_name == 'workflow_dispatch'
        run: node tests/live_webkit_history_postdeploy.cjs
