name: CLEAN regression checks
on:
  push:
    paths:
      - index.html
      - navigation.js
      - tests/site-regression.cjs
      - tests/test_prospective_receipt_order.py
      - server.py
      - legacy_scenario_engine.py
      - test_legacy_scenario_engine.py
      - tests/test_four_mode_archive_cors_hotfix.py
      - entry_course_t12_seed.py
      - research_model.py
      - tests/test_entry_course_t12_seed.py
      - tests/audit_workflow_paths.py
      - .github/workflows/site-regression.yml
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:
  pull_request:
    paths:
      - index.html
      - navigation.js
      - tests/site-regression.cjs
      - tests/test_prospective_receipt_order.py
      - server.py
      - legacy_scenario_engine.py
      - test_legacy_scenario_engine.py
      - tests/test_four_mode_archive_cors_hotfix.py
      - entry_course_t12_seed.py
      - research_model.py
      - tests/test_entry_course_t12_seed.py
      - tests/audit_workflow_paths.py
      - .github/workflows/site-regression.yml
      - .github/workflows/deploy-pages.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression suite and capture log
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          printf 'Commit: %s\nWorkflow run: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" | tee test-results/provenance.txt
          node tests/site-regression.cjs 2>&1 | tee test-results/site-regression.log
      - name: Verify archived research source receipt ordering
        run: python3 -m unittest discover -s tests -p 'test_prospective_receipt_order.py' -v
      - name: Verify restored scenario engine and immutable V2 comparison
        run: python3 -m unittest -v test_legacy_scenario_engine test_forecast_strategy_contract
      - name: Verify real local HTTP CORS and Render deploy revision header
        run: python3 -m unittest discover -s tests -p 'test_four_mode_archive_cors_hotfix.py' -v
      - name: Observe actual Render deploy commit (read-only; not a publish claim)
        if: github.event_name == 'push'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          if ! curl --silent --show-error --fail --location --head --max-time 18             "https://boat-edge-clean.onrender.com/healthz" -o "$headers"; then
            echo "RENDER_DEPLOY_COMMIT_UNVERIFIED reason=health_http_unavailable"
            echo "::warning::Render health HTTP unavailable; backend revision unverified"
            exit 1
          fi
          revision="$(awk -F': *' 'tolower($1)=="x-boat-edge-deploy-commit" {gsub(/\r/,"",$2); print tolower($2)}' "$headers" | tail -n 1)"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "RENDER_DEPLOY_COMMIT_UNVERIFIED reason=header_missing_or_invalid"
            echo "::warning::Render runtime has not provided a valid deployed commit SHA"
            exit 1
          fi
          echo "RENDER_DEPLOY_COMMIT_OBSERVED $revision"
          echo "RENDER_MAIN_SHA_CHECKED $GITHUB_SHA"
          if [ "$revision" = "$GITHUB_SHA" ]; then
            echo "RENDER_DEPLOY_EQUALS_MAIN_PASS $revision"
          else
            echo "RENDER_DEPLOY_BEHIND_OR_DIFFERENT_MAIN $revision"
            echo "::warning::Published Render runtime revision differs from current test SHA; not claiming backend deployment parity"
          fi
      - name: Verify fresh T-12 generation preserves immutable research originals
        run: python3 -m unittest discover -s tests -p 'test_entry_course_t12_seed.py' -v
      - name: Audit all CLEAN workflow path filters
        run: python3 tests/audit_workflow_paths.py
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-regression-${{ github.run_id }}
          path: test-results/
          if-no-files-found: error
          retention-days: 30
      - name: Record successful verification
        if: success()
        run: |
          echo '## BOAT EDGE CLEAN regression' >> "$GITHUB_STEP_SUMMARY"
          echo '- Node.js 22 test execution: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Command: `node tests/site-regression.cjs`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Scope: static validation and stored fixtures; not live-browser or Git-first-add proof' >> "$GITHUB_STEP_SUMMARY"

  publish-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract actual Pages browser fixture from publishing workflow
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          workflow=pathlib.Path('.github/workflows/deploy-pages.yml').read_text()
          match=re.search(r'(?ms)^      - name: Browser interaction smoke test\n(.*?)(?=^      - name: |\Z)',workflow)
          if not match:
              raise SystemExit('Publishing browser fixture missing')
          script=re.search(r"(?ms)^          node - <<'JS'\n(.*?)^          JS$",match.group(1))
          if not script:
              raise SystemExit('Publishing browser script missing')
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in script.group(1).splitlines())+'\n'
          pathlib.Path('publish-browser-smoke.cjs').write_text(code)
          print('Extracted actual publishing smoke; source assertions unchanged')
          PY
          node --check publish-browser-smoke.cjs
      - name: Run Pages browser smoke before merging
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node publish-browser-smoke.cjs
