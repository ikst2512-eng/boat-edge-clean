name: Persist predeadline research snapshot
on:
  schedule:
    - cron: '15 2 * * *' # 11:15 JST; actual GitHub start may be delayed
  workflow_dispatch:
    inputs:
      race_date:
        description: "JST race date YYYYMMDD"
        required: true
        type: string
      venue:
        description: "Venue code 1-24"
        required: true
        type: string
      race:
        description: "Race number 1-12"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: research-snapshot-persistence
  cancel-in-progress: false
jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate before cutoff and persist immutable source file
        env:
          RACE_DATE: ${{ inputs.race_date }}
          VENUE: ${{ inputs.venue }}
          RACE: ${{ inputs.race }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from research_model import predict
          day = os.environ["RACE_DATE"]
          venue = os.environ["VENUE"]
          race = os.environ["RACE"]
          if not day and not venue and not race:
              from scripts.select_upcoming_research_race import choose
              selected = choose()
              if selected is None:
                  print("No race safely before cutoff; no forecast created")
                  raise SystemExit(0)
              day, venue, race = map(str, selected)
          if len(day) != 8 or not day.isascii() or not day.isdigit():
              raise ValueError("Invalid date")
          if not venue.isascii() or not venue.isdigit() or not 1 <= int(venue) <= 24:
              raise ValueError("Invalid venue")
          if not race.isascii() or not race.isdigit() or not 1 <= int(race) <= 12:
              raise ValueError("Invalid race")
          code = f"{day}{int(venue):02d}{int(race):02d}"
          target = Path("research_snapshots") / (code + ".json")
          if target.exists():
              raise ValueError("Snapshot already tracked: no overwrite")
          forecast = predict(day, venue, race)
          if not target.is_file() or "topn_model_mass_pct" not in target.read_text(encoding="utf-8"):
              raise ValueError("New snapshot not created with TopN mass")
          print("Created research-only snapshot", code, forecast["model_version"])
          PY
      - name: Commit new snapshot to origin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research_snapshots/
          git diff --cached --quiet && { echo "No new eligible snapshot"; exit 0; }
          python - <<'PY'
          import json, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          names = subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines()
          if len(names) != 1 or not names[0].startswith("research_snapshots/"):
              raise ValueError("Expected exactly one new snapshot")
          record = json.loads(Path(names[0]).read_text(encoding="utf-8"))
          if datetime.now(timezone.utc) >= datetime.fromisoformat(record["cutoff_jst"]):
              raise ValueError("Too late to publish before cutoff")
          PY
          git commit -m "research: preserve predeadline snapshot and model mass"
          # Recheck immediately before publishing; commit operations consume cutoff time.
          python - <<'PY'
          import json, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          name = subprocess.check_output(
              ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD"],
              text=True).splitlines()
          if len(name) != 1 or not name[0].startswith("research_snapshots/"):
              raise ValueError("Commit must contain exactly one research snapshot")
          record = json.loads(Path(name[0]).read_text(encoding="utf-8"))
          if datetime.now(timezone.utc) >= datetime.fromisoformat(record["cutoff_jst"]):
              raise ValueError("Publication cutoff passed before Git push")
          PY
          git push origin HEAD:main
