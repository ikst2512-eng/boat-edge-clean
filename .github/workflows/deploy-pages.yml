                return {status,count:cards.length,unique:new Set(cards.map(c=>c.dataset.raceCode)).size,
                  first:cards[0]?.querySelector('summary')?.textContent?.trim()};
              });
              if(evidence.count<=6||evidence.unique!==evidence.count)
                throw Error('candidate_archive_not_complete_'+JSON.stringify(evidence));
