          JS
      - name: Observe public Render revision and racecard HTTP after publish (diagnostic only)
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        run: |
          set -uo pipefail
          # A Pages publish and an independent Render auto-deploy can overlap.
          # Observe, never interpret an old SHA during rollout as a permanent fault.
          mkdir -p test-results
          evidence="test-results/render-edge-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          : > "$evidence"
          for sample in 1 2 3; do
            timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            headers="$(mktemp)"
            health_code="$(curl --silent --show-error --location --head --max-time 12 -D "$headers" -o /dev/null -w '%{http_code}' 'https://boat-edge-clean.onrender.com/healthz' 2>/dev/null)"
            health_exit="$?"
            revision="$(awk -F': *' 'tolower($1)=="x-boat-edge-deploy-commit" {gsub(/\r/,"",$2); print tolower($2)}' "$headers" | tail -n 1)"
            rm -f "$headers"
            if [[ "$health_code" == "200" && "$revision" =~ ^[0-9a-f]{40}$ ]]; then
              if [[ "$revision" == "$GITHUB_SHA" ]]; then
                state="same_as_publish_checkout"
              else
                state="other_live_revision_or_rollout"
              fi
            else
              state="health_unverified"
            fi
            card_metrics="$(curl --silent --show-error --location --max-time 12 -o /dev/null -w 'http=%{http_code} total_s=%{time_total}' 'https://boat-edge-clean.onrender.com/api/clean-racecard?hd=20261028&jcd=01&rno=1' 2>/dev/null)"
            card_exit="$?"
            printf 'RENDER_PUBLISH_EDGE_DIAGNOSTIC sample=%s at_utc=%s expected_sha=%s health_http=%s health_curl_exit=%s observed_sha=%s sha_state=%s racecard=%s racecard_curl_exit=%s\n' \
              "$sample" "$timestamp" "$GITHUB_SHA" "${health_code:-000}" "$health_exit" "${revision:-none}" "$state" "${card_metrics:-http=000}" "$card_exit" \
              | tee -a "$evidence"
            if [[ "$sample" != 3 ]]; then sleep 2; fi
          done
          echo "Render public health/racecard: **diagnostic only** (sampled statuses, not zero-502 or readiness certification)" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve Render publish edge samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-render-publish-edge-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/render-edge-*.log
          if-no-files-found: warn
          retention-days: 30
      # This runs AFTER Pages is deployed. A green historical 24-venue test
      # is not evidence that the newly restored forecast API is responsive.
      # Keep the site release red while V133 returns 502/invalid JSON, even if
      # /healthz and archived racecard routes return HTTP 200.
      - name: Verify live V133 JSON contract before accepting published release
        timeout-minutes: 4
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          url = 'https://boat-edge-clean.onrender.com/api/v133-reference-preview?hd=invalid&jcd=01&rno=1'
          req = Request(url, headers={
              'User-Agent': 'BOAT-EDGE-CLEAN-release-contract/1',
              'Origin': 'https://ikst2512-eng.github.io',
          })
          last = 'not_started'
          # Render and Pages auto-deploy independently. Wait a bounded time
          # for the LIVE backend; never silently accept 502 or a malformed response.
          for attempt in range(1, 9):
              started = time.monotonic()
              try:
                  with urlopen(req, timeout=12) as response:
                      status, headers, body = response.status, response.headers, response.read(8192)
              except HTTPError as error:
                  status, headers, body = error.code, error.headers, error.read(8192)
              except (URLError, TimeoutError, OSError) as error:
                  last = type(error).__name__
                  print(f'PUBLIC_V133_CONTRACT_UNVERIFIED attempt={attempt}/8 transport={last}', flush=True)
                  if attempt < 8:
                      time.sleep(10)
                  continue
              try:
                  payload = json.loads(body)
              except (UnicodeError, ValueError):
                  payload = None
              valid = (
                  status == 400
                  and payload == {'ok': False, 'status': 'invalid_race'}
                  and headers.get('Content-Type', '').startswith('application/json')
                  and headers.get('Access-Control-Allow-Origin') == 'https://ikst2512-eng.github.io'
              )
              elapsed = round(time.monotonic() - started, 3)
              if valid:
                  print(f'PUBLIC_V133_JSON_CONTRACT_PASS attempt={attempt}/8 http=400 latency_s={elapsed}', flush=True)
                  break
              last = f'http={status} content_type={headers.get("Content-Type", "missing")} cors={headers.get("Access-Control-Allow-Origin", "missing")} json_valid={payload is not None}'
              print(f'PUBLIC_V133_CONTRACT_UNVERIFIED attempt={attempt}/8 {last} latency_s={elapsed}', flush=True)
              if attempt < 8:
                  time.sleep(10)
          else:
              raise SystemExit('PUBLIC_V133_JSON_CONTRACT_FAILED: ' + last)
          PY
      - name: Browser-check deployed page
        timeout-minutes: 2
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node - <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            if(!process.env.PAGE_URL)throw Error('No deployed page URL');
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              const faults=[];
              page.on('pageerror',e=>faults.push(e.message));
              await page.route('https://raw.githubusercontent.com/**',r=>r.fulfill({status:404,contentType:'application/json',body:'{}'}));
              await page.route('https://api.github.com/**',r=>r.fulfill({status:404,contentType:'application/json',body:'{}'}));
              const res=await page.goto(process.env.PAGE_URL,{waitUntil:'domcontentloaded',timeout:30000});
              if(!res||res.status()!==200)throw Error('Deployed page HTTP '+res?.status());
              if(await page.locator('body').getAttribute('data-clean-forecast-ui')!=='research-only-20261030')throw Error('STALE_PUBLIC_FORECAST_HTML_REVISION');
              const leaked=await page.evaluate(()=>{
                const text=document.body.innerText;
                return ['if(item.state!==', 'verifiedFourModeRace(key)', 'predictionModes=confirmed.modes', 'if(token!==resultListRequestId'].find(marker=>text.includes(marker))||null;
              });
              if(leaked)throw Error('Public page displays raw JavaScript source: '+leaked);
              const source=await page.content();
              if(!/<\/body>\s*<\/html>\s*$/i.test(source))throw Error('Public HTML closing tags invalid');
              if(await page.locator('script:not([src])').count()!==1)throw Error('Published inline script count invalid');
              await page.locator('#venues button').first().waitFor();
              if(await page.locator('#venues button').count()!==24)throw Error('Public 24 venue buttons missing');
              if(await page.locator('#races button').count()!==12)throw Error('Public 12 race buttons missing');
              // The home screen may legitimately auto-follow a newly received
              // schedule. Enter the detail first, then freeze its selected race.
              await page.waitForFunction(()=>document.documentElement.dataset.cleanNavigationInit==='1');
              await page.evaluate(()=>setView('card'));
              const selectedRace=await page.evaluate(()=>sameRaceKey());
              for(const view of ['card','exhibit','forecast','result']){
                await page.evaluate(view => setView(view), view);
                const panels=await page.evaluate(()=>({
                  card:!document.getElementById('raceDataSection').hidden&&document.getElementById('raceDataSection').dataset.view==='card',
                  exhibit:!document.getElementById('raceDataSection').hidden&&document.getElementById('raceDataSection').dataset.view==='exhibit',
                  forecast:!document.getElementById('forecast').hidden,
                  result:!document.getElementById('resultSection').hidden,
                  race:sameRaceKey()
                }));
                if(panels.race!==selectedRace)throw Error('Selected race changed while switching tabs: '+view);
                if(['card','exhibit','forecast','result'].filter(key=>panels[key]).join(',')!==view)
                  throw Error('Tab visibility not exclusive: '+view+' '+JSON.stringify(panels));
              }
              await page.waitForFunction(()=>document.documentElement.dataset.cleanNavigationInit==='1');
              // Pages has project-prefix URLs; navigation.js must preserve the review
              // screen locally and candidate history to independent GitHub Pages.
              const candidateHref=await page.locator('.site-head a.header-candidate-tab[href*="candidates.html"]').getAttribute('href');
              if(candidateHref!=='/boat-edge-clean/candidates.html')throw Error('PAGES_CANDIDATE_ROUTE_BROKEN '+candidateHref);
              const reviewHref=await page.locator('.site-global-nav a').getAttribute('href');
              const reviewUrl=new URL(reviewHref,process.env.PAGE_URL);
              if(reviewUrl.origin!==new URL(process.env.PAGE_URL).origin||reviewUrl.searchParams.get('screen')!=='review')
                throw Error('PAGES_REVIEW_ROUTE_BROKEN '+reviewHref);
              const candidateResponse=await page.request.get(new URL(candidateHref,process.env.PAGE_URL).href,{timeout:20000});
              if(candidateResponse.status()!==200||!(await candidateResponse.text()).includes('id="todayCandidateRaces"'))
                throw Error('PUBLIC_CANDIDATE_PAGE_UNAVAILABLE '+candidateResponse.status());
              console.log('CLEAN_PAGES_CANDIDATE_NAV_VERIFIED',candidateHref,reviewHref);
              const shortcuts=page.locator('.race-detail-shortcuts button');
              if(await shortcuts.count()!==4)throw Error('Published four race shortcuts missing');
              if(await page.locator('#forecast>.forecast-detail-tabs:visible').count()!==0)throw Error('Duplicate forecast tabs visible');
              if(await page.locator('#forecastQuick:visible').count()!==0)throw Error('Duplicate race picker visible');
              await page.locator('.race-detail-shortcuts button[data-race-view="card"]').click();
              if(await page.locator('#raceCardSubtabs:visible').count()!==1)throw Error('Published card subtabs missing');
              await page.locator('[data-race-card-pane="rates"]').click();
              if(await page.locator('#raceCardStatistics:visible').count()!==1)throw Error('Published racecard rates not visible');
              if(await page.locator('#forecast>.forecast-combined-race:visible').count())throw Error('Published prediction shown inside racecard');
              await page.locator('.race-detail-shortcuts button[data-race-view="forecast"]').click();
              if(await page.locator('#forecast .forecast-statistics:visible').count())throw Error('Published prediction still showing rates');
              for(const view of ['forecast','card','exhibit','result']){
                await page.locator('.race-detail-shortcuts button[data-race-view="'+view+'"]').click();
                const active=await page.evaluate(()=>activeView);
                if(active!==view)throw Error('Race shortcut did not activate '+view+': '+active);
              }
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
              if(overflow>1)throw Error('Mobile horizontal overflow: '+overflow+'px');
              // Actual archived-result values are asserted by the dedicated
              // 'Verify published CLEAN confirmed result in browser' step above.
              // Keep this step focused on the four navigation tabs and racecard subtabs.
              if(faults.length)throw Error('Public JS errors: '+faults.join('; '));
              console.log('DEPLOYED_BROWSER_PASS',process.env.PAGE_URL);
              require('node:fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Public browser navigation: **PASS** (24 venues, 12 races, 4 tabs + card statistics; archived result separately verified)\n');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
