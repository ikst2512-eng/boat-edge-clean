name: CLEAN isolated source staging tests
on:
  pull_request:
    paths:
      - clean_source_staging.py
      - test_clean_source_staging.py
      - .github/workflows/clean-source-staging-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify isolated staging safety
        run: python -m unittest -v test_clean_source_staging
