name: Mobile browser smoke test
on:
  push:
    paths:
      - 'index.html'
      - 'server.py'
      - 'test_odds_parser.py'
      - '.github/workflows/mobile-smoke.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'server.py'
      - 'test_odds_parser.py'
      - '.github/workflows/mobile-smoke.yml'
jobs:
  browser:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Verify current production mobile navigation
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              // Render may first serve its 503 "Application loading" splash while a sleeping service wakes.
              let response;
              for(let attempt=1;attempt<=12;attempt++){
                response=await page.goto('https://boat-edge-clean.onrender.com/',{waitUntil:'domcontentloaded',timeout:90000});
                if(response?.status()!==503)break;
                console.log('RENDER_WAKING',attempt,'of 12; HTTP 503');
                await page.waitForTimeout(6000);
              }
              const diagnostics=await page.evaluate(()=>({title:document.title,path:location.pathname,heading:document.querySelector('h1')?.textContent?.trim(),venueCount:document.querySelectorAll('#venues button').length,bodySample:document.body?.innerText?.slice(0,450)}));
              console.log('RENDER_PRODUCTION_DIAGNOSTICS',JSON.stringify({status:response?.status(),url:page.url(),...diagnostics}));
              if(response?.status()!==200)throw Error('Render returned HTTP '+response?.status());
              const health=await page.request.get('https://boat-edge-clean.onrender.com/healthz',{timeout:30000});
              if(health.status()!==200)throw Error('Render backend health failed: HTTP '+health.status());
              console.log('RENDER_BACKEND_HEALTH_PASS',health.status());
              // Invalid requests must never return a successful 120-ticket response.
              const invalidOdds=await page.request.get('https://boat-edge-clean.onrender.com/api/odds?hd=invalid&jcd=99&rno=13',{timeout:30000});
              if(invalidOdds.status()!==400)throw Error('Render odds validation failure: expected HTTP 400, got '+invalidOdds.status());
              const rejected=await invalidOdds.json();
              if(rejected.ok!==false)throw Error('Render odds accepted invalid race inputs');
              console.log('RENDER_ODDS_INPUT_GUARD_PASS');
              if(diagnostics.venueCount!==24)throw Error('Render is not serving current CLEAN app; expected 24 venue buttons; '+JSON.stringify(diagnostics));
              await page.locator('#venues button').first().waitFor({timeout:20000});
              if(await page.locator('#venues button').count()!==24)throw Error('24 venues not rendered');
              if(await page.locator('#races button').count()!==12)throw Error('12 races not rendered');
              await page.evaluate(()=>setView('forecast'));
              if(!await page.locator('#forecast').isVisible())throw Error('Forecast tab not visible');
              if(!await page.locator('#predictionStatus').isVisible())throw Error('Prediction status not visible');
              const state=await page.evaluate(()=>({mode:selectedPredictionMode,rows:document.querySelectorAll('#predictionRows .prediction-row').length}));
              if(state.mode!=='research')throw Error('Current research forecast is not the default: '+JSON.stringify(state));
              if(await page.locator('#forecast [data-mode="balance"], #forecast [data-mode="hole"], #forecast [data-mode="narrow"]').count())throw Error('Retired mode controls reappeared');
              const leaked=await page.evaluate(()=>['if(item.state!==','verifiedFourModeRace(key)','predictionModes=confirmed.modes','if(token!==resultListRequestId'].some(t=>document.body.innerText.includes(t)));
              if(leaked)throw Error('Raw JavaScript is visible in forecast page');
              console.log('CURRENT_RESEARCH_FORECAST_UI_PASS',JSON.stringify(state));
              const bodyOverflow=await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+1);
              if(bodyOverflow)throw Error('Unexpected horizontal page overflow');
              console.log('PASS: current CLEAN mobile research forecast and navigation');
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
