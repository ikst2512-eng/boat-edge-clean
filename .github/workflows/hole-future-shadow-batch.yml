name: Hole future shadow batch evidence (research only)
on:
  pull_request:
    paths:
      - hole_future_artifact_batch.py
      - hole_future_cumulative_rollup.py
      - test_hole_future_artifact_batch.py
      - test_hole_future_late_recheck.py
      - hole_future_result_coverage.py
      - test_hole_future_result_coverage.py
      - .github/workflows/hole-future-shadow-batch.yml
  workflow_dispatch:
  schedule:
    # 16:40 UTC = 01:40 JST, after the artifact inventory.
    - cron: '40 16 * * *'
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test batch evidence quarantine
        run: python -m unittest -v test_hole_future_artifact_batch.py test_hole_future_shadow_audit.py test_hole_future_result_coverage.py test_hole_future_late_recheck.py
      - name: Audit last 20 collection runs (read only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python hole_future_artifact_batch.py --days 2 > hole_future_batch.json
          python - <<'PY'
          import json
          d=json.load(open("hole_future_batch.json"))
          assert d["formal"] is False
          assert d["independent_first_receipt_verified"] is False
          assert d["prospective_validation"] is False
          assert d["production_forecast_changed"] is False
          assert type(d["capture_window_complete"]) is bool
          assert type(d["run_listing_complete"]) is bool
          assert d["window_start_jst"] < d["window_end_exclusive_jst"]
          print("WINDOW",d["window_start_jst"],d["window_end_exclusive_jst"])
          print("PAGES",d["pages_fetched"],"LISTING_COMPLETE",d["run_listing_complete"])
          print("RUNS",d["runs_in_window"],"INSPECTED",d["runs_inspected"],"DOWNLOADED",d["runs_downloaded"])
          print("ARTIFACT_WINDOW_COMPLETE",d["capture_window_complete"])
          print("ARTIFACT_FILES",d["artifact_files"],"SCORABLE",d["comparable"])
          print("DOWNLOAD_FAILURES",d["run_download_failures"])
          print("SHADOW_STATUSES",d["shadow_status_counts"])
          print("RUNS_WITHOUT_SHADOW",d["downloaded_runs_without_shadow"])
          print("DOWNLOAD_STAGE_COUNTS",d["downloaded_stage_counts"])
          print("DOWNLOAD_RUN_EVIDENCE",d["downloaded_run_evidence"])
          print("DUPLICATES_QUARANTINED",d["duplicate_codes_quarantined"])
          print("EXCLUDED",d["excluded_by_reason"])
          print("REPO_RESULT_COVERAGE",d["repository_result_coverage"])
          print("HITS",d["hits"],"DELTA",d["delta"])
          PY
      - name: Recheck original frozen research evidence after 7 and 21 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for age in 7 21; do
            output="hole_future_late_${age}d.json"
            python hole_future_artifact_batch.py --days 1 --lag-days "$age" > "$output"
            AGE="$age" REPORT="$output" python - <<'PY'
          import json,os
          r=json.load(open(os.environ["REPORT"]))
          assert r["formal"] is False
          assert r["prospective_validation"] is False
          assert r["independent_first_receipt_verified"] is False
          assert r["recheck_lag_days"]==int(os.environ["AGE"])
          assert r["window_start_jst"]<r["window_end_exclusive_jst"]
          print("LATE_RECHECK",os.environ["AGE"],r["window_start_jst"],
                "scorable",r["comparable"],
                "pending",r["repository_result_coverage"].get("unconfirmed","unknown"),
                "artifacts",r["artifact_files"],
                "capture_complete",r["capture_window_complete"])
          PY
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hole-future-shadow-batch
          path: |
            hole_future_batch.json
            hole_future_late_7d.json
            hole_future_late_21d.json
          if-no-files-found: warn
