name: Inventory historical official T12 dispatches (read only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/official-t12-history-inventory.yml'
      - 'scripts/inventory_joint_t12_history.py'
      - 'scripts/render_joint_t12_inventory_summary.py'
      - 'scripts/render_joint_t12_reaudit_summary.py'
      - 'tests/test_render_joint_t12_reaudit_summary.py'
      - 'scripts/inspect_joint_t12_archive.py'
      - 'scripts/reaudit_joint_t12_archive.py'
      - 'scripts/reaudit_joint_t12_inventory.py'
      - 'tests/test_reaudit_joint_t12_inventory.py'
      - 'tests/test_reaudit_joint_t12_archive.py'
      - 'tests/test_inspect_joint_t12_archive.py'
  pull_request:
    paths:
      - '.github/workflows/official-t12-history-inventory.yml'
      - 'scripts/inventory_joint_t12_history.py'
      - 'tests/test_inventory_joint_t12_history.py'
      - 'scripts/reaudit_joint_t12_inventory.py'
      - 'tests/test_reaudit_joint_t12_inventory.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inventory real-run history without changing evidence
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python -m scripts.inventory_joint_t12_history --repo "$REPOSITORY" --output reports/t12_history_inventory.json
      - name: Re-audit archived original T12 source pairs
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python -m scripts.reaudit_joint_t12_inventory --inventory reports/t12_history_inventory.json --repo "$REPOSITORY" --output reports/t12_reaudit_results.json
      - name: Show verified inventory scope in Actions summary
        if: ${{ github.event_name != 'pull_request' }}
        run: python -m scripts.render_joint_t12_inventory_summary reports/t12_history_inventory.json "$GITHUB_STEP_SUMMARY"
      - name: Show independently verified T12 source pairs in Actions summary
        if: ${{ github.event_name != 'pull_request' }}
        run: python -m scripts.render_joint_t12_reaudit_summary reports/t12_reaudit_results.json "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name != 'pull_request' }}
        with:
          name: t12-history-inventory-${{ github.run_id }}
          path: |
            reports/t12_history_inventory.json
            reports/t12_reaudit_results.json
          retention-days: 14
      - name: Regression tests
        run: |
          python -m unittest discover -s tests -p 'test_inventory_joint_t12_history.py' -v
          python -m unittest discover -s tests -p 'test_render_joint_t12_inventory_summary.py' -v
          python -m unittest discover -s tests -p 'test_inspect_joint_t12_archive.py' -v
          python -m unittest discover -s tests -p 'test_reaudit_joint_t12_archive.py' -v
          python -m unittest discover -s tests -p 'test_reaudit_joint_t12_inventory.py' -v
          python -m unittest discover -s tests -p 'test_render_joint_t12_reaudit_summary.py' -v
