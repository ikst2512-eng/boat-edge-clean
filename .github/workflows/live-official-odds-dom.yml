name: CLEAN live official odds public DOM reconciliation
on:
  workflow_dispatch:
  schedule:
    - cron: '35 3,5,7 * * *'
  pull_request:
    paths:
      - 'tests/live-official-odds-dom.cjs'
      - '.github/workflows/live-official-odds-dom.yml'
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/live-official-odds-dom.cjs
