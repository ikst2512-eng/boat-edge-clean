name: Postrelease public Pages-Render read-only diagnosis

on:
  pull_request:
    paths:
      - .github/workflows/postrelease-readonly-diagnosis.yml

permissions:
  contents: read

jobs:
  published-browser-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: read-only-public-diagnosis-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout deployed main source, not this Draft diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # The historical #1706 merge predates the 40-commit shallow boundary.
          persist-credentials: false

      - name: Confirm recovery merge is present in actual main
        run: |
          git merge-base --is-ancestor 3ba8b4830621770d1cfbb7644163bf7dcab63d38 HEAD
          echo "PUBLIC_DIAGNOSTIC_APPROVED_MAIN_SHA=$(git rev-parse HEAD)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read-only public Pages/Render frontend hashes and API CORS
        timeout-minutes: 5
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const run=process.env.GITHUB_RUN_ID;
          const assets=[
            ['index.html',[
              'https://ikst2512-eng.github.io/boat-edge-clean/',
              'https://boat-edge-clean.onrender.com/index.html'
            ]],
            ['navigation.js',[
              'https://ikst2512-eng.github.io/boat-edge-clean/navigation.js',
              'https://boat-edge-clean.onrender.com/navigation.js'
            ]]
          ];
          async function get(url){
            const u=new URL(url);
            u.searchParams.set('read_only_audit',run);
            const r=await fetch(u,{cache:'no-store',signal:AbortSignal.timeout(45000)});
            assert.equal(r.status,200,u.hostname+u.pathname+' HTTP '+r.status);
            return Buffer.from(await r.arrayBuffer());
          }
          (async()=>{
            for(const [file,urls] of assets){
              const expected=fs.readFileSync(file);
              assert.ok(expected.length>0);
              for(const url of urls){
                const actual=await get(url);
                assert.ok(actual.length>0,'Published asset empty '+url);
                assert.equal(sha(actual),sha(expected),
                  'Public asset differs from checked-out main: '+url);
                console.log('PUBLIC_FRONTEND_BYTES_MATCH '+new URL(url).hostname+' '+file+' '+sha(actual));
              }
            }
            const response=await fetch(
              'https://boat-edge-clean.onrender.com/api/four-mode-archive?code=202611100401',
              {headers:{Origin:'https://ikst2512-eng.github.io'},
               signal:AbortSignal.timeout(45000),cache:'no-store'});
            assert.equal(response.status,200,'Public saved four-mode API HTTP status');
            assert.equal(response.headers.get('access-control-allow-origin'),
              'https://ikst2512-eng.github.io','Public CORS response missing exact Pages origin');
            const saved=await response.json();
            assert.equal(saved.race_code,'202611100401');
            assert.deepEqual(['narrow','hit','balance','hole'].map(k=>
              saved.modes?.[k]?.tickets?.length),[5,10,16,22]);
            console.log('PUBLIC_RENDER_CORS_HEADER_200_AND_FOUR_MODE_SOURCE_PASS 202611100401');
            console.log('READONLY_HTTP_PREFLIGHT_PASS noMocks=true noProductionWrites=true');
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE

      - name: Install pinned real Chromium and WebKit
        timeout-minutes: 15
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium webkit

      - name: Unmocked published Pages-to-Render CORS 200/404/422
        timeout-minutes: 4
        run: node tests/live_four_mode_archive_cors_postdeploy.cjs

      - name: Unmocked three-day four-mode cards, tickets, probabilities, race switching
        timeout-minutes: 5
        run: node tests/live_four_mode_display_postdeploy.cjs

      - name: Unmocked published WebKit navigation, history and back/forward
        timeout-minutes: 4
        run: node tests/live_webkit_history_postdeploy.cjs

      - name: Distinguish software WebKit from real iPhone Safari
        run: |
          echo 'PUBLIC_POSTRELEASE_READONLY_BROWSER_AUDIT_PASS'
          echo 'NOT_PROVEN: physical_iPhone_Safari, true_accuracy, T-12_evidence, idle_wake_stability'
