name: Research forecast checks
on:
  push:
    paths:
      - 'research_model.py'
      - 'research_beta_backtest.py'
      - 'research_batch_result_join.py'
      - 'research_official_result_parser.py'
      - 'research_collect_official_results.py'
      - 'test_research_collect_official_results.py'
      - 'test_research_official_result_parser.py'
      - 'test_research_batch_result_join.py'
      - 'research_snapshot_inventory.py'
      - 'research_git_first_add_inventory.py'
      - 'test_research_git_first_add_inventory.py'
      - 'test_research_snapshot_inventory.py'
      - 'test_research_beta_backtest.py'
      - 'server.py'
      - 'test_research_model.py'
      - 'test_research_model_provenance.py'
      - 'test_research_source_digests.py'
      - 'test_research_capture_workflow.py'
      - 'scripts/verify_new_research_snapshots.py'
      - '.github/workflows/daily-research-forecast.yml'
      - 'test_research_persistence.py'
      - 'collect_research_daily.py'
      - 'test_collect_research_daily.py'
      - 'test_collect_research_input_integrity.py'
      - '.github/workflows/research-forecast-tests.yml'
  pull_request:
    paths:
      - 'research_model.py'
      - 'research_beta_backtest.py'
      - 'collect_research_daily.py'
      - 'test_research_*.py'
      - 'test_collect_research*.py'
      - 'test_research_capture_workflow.py'
      - 'scripts/verify_new_research_snapshots.py'
      - '.github/workflows/daily-research-forecast.yml'
      - '.github/workflows/research-forecast-tests.yml'
  workflow_dispatch:
jobs:
  research-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate research forecast model and persisted records
        run: python -m unittest -v test_research_model test_research_persistence test_collect_research_daily test_collect_research_input_integrity test_research_source_digests test_research_model_provenance test_research_capture_workflow test_research_beta_backtest test_research_snapshot_inventory test_research_git_first_add_inventory test_research_batch_result_join test_research_official_result_parser test_research_collect_official_results

      - name: Audit Git first additions without outcome access
        run: python research_git_first_add_inventory.py --repo . --snapshots research_snapshots
      - name: Inventory frozen forecasts without results access
        run: python research_snapshot_inventory.py --snapshots research_snapshots

      - name: Probe one official historical result (research only, non-blocking)
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          mkdir -p /tmp/boat-edge-official-probe
          python - <<'PY'
          import json
          from pathlib import Path
          from research_collect_official_results import collect
          # Historical single-race probe, no predictions or results committed.
          import tempfile
          with tempfile.TemporaryDirectory() as d:
              src = Path('research_snapshots/202610270102.json')
              if not src.exists():
                  print('probe_snapshot_missing')
              else:
                  import shutil
                  shutil.copyfile(src, Path(d)/src.name)
                  result = collect(d, max_races=1)
                  print(json.dumps({'status':result['status'],'fetched':result['fetched'],
                                    'failed':result['failed'],'failures':result['failures'],
                                    'tickets': [{'race_code':r['race_code'],'ticket':r['ticket'],
                                                 'verification_status':r['verification_status']}
                                                for r in result['results']]}, ensure_ascii=False))
          PY
