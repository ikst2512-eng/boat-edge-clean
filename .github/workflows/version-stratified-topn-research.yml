name: Historical version-stratified TopN research
on:
  pull_request:
    paths:
      - four_mode_version_topn_audit.py
      - four_mode_nov05_08_daily_reference_audit.py
      - four_mode_result_raw_csv_audit.py
      - research/four_mode_nov05_08_official_non_scoreable_reference.json
      - test_four_mode_result_raw_csv_audit.py
      - test_four_mode_nov05_08_daily_reference_audit.py
      - test_four_mode_version_topn_audit.py
      - four_mode_forward_paired_score.py
      - four_mode_all_mode_same_job_shadow.py
      - test_four_mode_all_mode_same_job_shadow.py
      - four_mode_all_shadow_reference_review.py
      - test_four_mode_all_shadow_reference_review.py
      - four_mode_all_shadow_durable_ledger.py
      - test_four_mode_all_shadow_durable_ledger.py
      - test_four_mode_forward_paired_score.py
      - research/four_mode_all_modes_forward_protocol_20261106.json
      - research/four_mode_top1_pair_forward_protocol_20261108.json
      - four_mode_top1_forward_reference.py
      - four_mode_top1_head_exposure_audit.py
      - test_four_mode_top1_head_exposure_audit.py
      - test_four_mode_top1_forward_reference.py
      - four_mode_top1_bias_input_audit.py
      - four_mode_top1_head_prior_shadow.py
      - test_four_mode_top1_head_prior_shadow.py
      - research/four_mode_hit_head_prior_forward_protocol_20261108.json
      - test_four_mode_top1_bias_input_audit.py
      - four_mode_top1_capture_run_inventory.py
      - test_four_mode_top1_capture_run_inventory.py
      - docs/research/four_mode_forward_all_modes_20261106.md
      - .github/workflows/version-stratified-topn-research.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce preregistered Top1 selector byte pin before research replay
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          policy = json.loads(Path("research/four_mode_top1_pair_forward_protocol_20261108.json").read_bytes())
          selector = Path("four_mode_all_mode_same_job_shadow.py").read_bytes()
          git_blob = hashlib.sha1(b"blob " + str(len(selector)).encode("ascii") + b"\0" + selector).hexdigest()
          if (policy.get("schema") != "FOUR_MODE_TOP1_PAIR_FORWARD_PREREGISTRATION_V1"
                  or policy.get("selector_file") != "four_mode_all_mode_same_job_shadow.py"
                  or policy.get("pinned_selector_git_blob_sha1") != git_blob
                  or policy.get("eligible_deadline_start_jst") != "2026-11-09T00:00:00+09:00"
                  or policy.get("eligible_deadline_end_jst") != "2026-12-31T23:59:59+09:00"
                  or policy.get("promotion_allowed") is not False
                  or policy.get("formal_count") != 0):
              raise SystemExit("preregistered_top1_selector_or_cohort_drift")
          print("TOP1_SELECTOR_PREREGISTERED_BLOB_VERIFIED:" + git_blob)
          PY
      - name: Validate independent HIT-head prior selector source pin
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          p = json.loads(Path("research/four_mode_hit_head_prior_forward_protocol_20261108.json").read_bytes())
          src = Path("four_mode_top1_head_prior_shadow.py").read_bytes()
          sha = hashlib.sha1(b"blob " + str(len(src)).encode("ascii") + b"\0" + src).hexdigest()
          dependency_pins = p.get("pinned_dependency_git_blob_sha1")
          if not isinstance(dependency_pins, dict) or set(dependency_pins) != {
                  "research_model.py", "four_mode_all_mode_same_job_shadow.py", "clean_four_modes.py"}:
              raise SystemExit("head_prior_dependency_pin_missing")
          for name, expected in dependency_pins.items():
              data = Path(name).read_bytes()
              actual = hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
              if actual != expected:
                  raise SystemExit("head_prior_dependency_drift:" + name)
          if (p.get("schema") != "FOUR_MODE_HIT_WINNER_HEAD_PRIOR_FORWARD_PREREGISTRATION_V1"
                  or p.get("selector_file") != "four_mode_top1_head_prior_shadow.py"
                  or p.get("pinned_selector_git_blob_sha1") != sha
                  or p.get("registered_jst_date") != "2026-11-08"
                  or p.get("eligible_deadline_start_jst") != "2026-11-09T00:00:00+09:00"
                  or p.get("primary_metric") != "paired_HIT_Top1_exact_trifecta_original_versus_head_prior_shadow"
                  or p.get("pilot_races") != 300 or p.get("confirmation_races") != 300
                  or p.get("formal_count") != 0 or p.get("promotion_allowed") is not False):
              raise SystemExit("head_prior_source_or_registration_drift")
          print("HIT_HEAD_PRIOR_SELECTOR_BLOB_VERIFIED:" + sha)
          PY
      - name: Validate audit logic
        run: python -m unittest -v test_four_mode_version_topn_audit
      - name: Check frozen future-only four-mode study policy and leakage refusal
        run: python -m unittest -v test_four_mode_forward_paired_score
      - name: Test pre-result frozen all-mode candidate invariants
        run: python -m unittest -v test_four_mode_all_mode_same_job_shadow
      - name: Test standalone HIT-head prior proposal without any outcomes
        run: python -m unittest -v test_four_mode_top1_head_prior_shadow
      - name: Replay Nov8 original HIT-head proposal input only
        run: python four_mode_top1_head_prior_shadow.py --day 20261108 | tee hit_head_prior_nov8_input_only.json
      - name: Refuse incomplete or result-leaking HIT-head proposal input
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("hit_head_prior_nov8_input_only.json").read_text())
          if (x.get("status") != "historical_input_replay_no_outcome_access"
                  or x.get("original_forecasts") < 116
                  or x.get("results_read") is not False
                  or x.get("non_hit_modes_unchanged") is not True
                  or x.get("formal") is not False
                  or x.get("model_improvement_proven") is not False
                  or x.get("model_promotion_allowed") is not False):
              raise SystemExit("incomplete_or_unsafe_head_prior_input_replay")
          print("HIT_HEAD_PRIOR_INPUT_ONLY_VERIFIED:" + str(x["original_forecasts"]))
          PY
      - name: Unit-test Top1 first-boat versus third-boat change accounting
        run: python -m unittest -v test_four_mode_top1_head_exposure_audit
      - name: Replay real Nov 5 original forecasts without reading results
        run: python four_mode_all_mode_same_job_shadow.py --audit-historical-input-day 20261105
      # Historical input-only check. This mode never opens confirmed results,
      # so it cannot turn a settled Nov 6-8 race into prospective evidence.
      - name: Replay saved Nov 6-8 V2 inputs without any result reads
        shell: bash
        run: |
          set -euo pipefail
          python four_mode_all_mode_same_job_shadow.py --audit-historical-input-day 20261106 | tee four_mode_shadow_input_replay_20261106.log
          python four_mode_all_mode_same_job_shadow.py --audit-historical-input-day 20261107 | tee four_mode_shadow_input_replay_20261107.log
          python four_mode_all_mode_same_job_shadow.py --audit-historical-input-day 20261108 | tee four_mode_shadow_input_replay_20261108.log
      - name: Reject incomplete real V2 replays and protected-rank drift
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          # Nov 8 had 116 initial forecasts; additional same-day first-adds
          # must be included rather than causing an obsolete hardcoded count.
          for day, minimum in (("20261106", 130), ("20261107", 122), ("20261108", 116)):
              lines = Path(f"four_mode_shadow_input_replay_{day}.log").read_text(
                  encoding="utf-8"
              ).splitlines()
              prefix = "FOUR_MODE_SHADOW_HISTORICAL_INPUT="
              if len(lines) != 1 or not lines[0].startswith(prefix):
                  raise SystemExit(f"unverifiable_input_replay:{day}")
              report = json.loads(lines[0][len(prefix):])
              count = report.get("original_v2_races")
              if (report.get("day") != day
                      or type(count) is not int or count < minimum
                      or (day != "20261108" and count != minimum)
                      or report.get("excluded") != {}
                      or report.get("formal") is not False
                      or report.get("result_files_read") is not False
                      or report.get("status") != "historical_input_replay_only"):
                  raise SystemExit(f"incomplete_or_result_leaking_replay:{day}")
              modes = report.get("changes")
              if type(modes) is not dict or set(modes) != {
                  "narrow", "hit", "balance", "hole"
              }:
                  raise SystemExit(f"missing_mode_replay:{day}")
              for mode, changes in modes.items():
                  if (changes.get("changed_all_tickets") != count
                          or changes.get("changed_top1") != 0):
                      raise SystemExit(f"method_or_top1_drift:{day}:{mode}")
              top1 = report.get("top1_pair_changes")
              if (type(top1) is not dict or set(top1) != set(modes)
                      or any(type(x.get("changed_top1")) is not int
                             or not 0 <= x["changed_top1"] <= count
                             or x.get("preserved_top3_5_10") != count
                             for x in top1.values())):
                  raise SystemExit(f"top1_membership_or_exposure_drift:{day}")
              if (modes["hit"].get("changed_top3") != 0
                      or modes["balance"].get("changed_top3") != 0
                      or modes["hole"].get("changed_top5") != 0):
                  raise SystemExit(f"protected_rank_drift:{day}")
              print(f"RESULT_BLIND_V2_REPLAY_VERIFIED:{day}:{count}/{count}")
          PY
      - name: Classify discovery-only Top1 changes by finishing position without results
        shell: bash
        run: |
          set -euo pipefail
          for day in 20261105 20261106 20261107 20261108; do
            python four_mode_top1_head_exposure_audit.py --day "$day" | tee "four_mode_top1_position_exposure_${day}.json"
          done
      - name: Verify complete discovery roster and distinct head-versus-ticket changes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for day, minimum in (("20261105", 106), ("20261106", 130),
                               ("20261107", 122), ("20261108", 116)):
              obj = json.loads(Path(f"four_mode_top1_position_exposure_{day}.json").read_text())
              n = obj.get("original_v2_races")
              if (type(n) is not int or n < minimum
                      or (day != "20261108" and n != minimum)
                      or obj.get("day") != day
                      or obj.get("status") != "discovery_input_only_no_outcome_read"
                      or obj.get("result_files_read") is not False
                      or obj.get("formal") is not False
                      or obj.get("model_improvement_proven") is not False):
                  raise SystemExit(f"top1_input_or_result_leakage:{day}")
              modes = obj.get("modes")
              if type(modes) is not dict or set(modes) != {
                  "narrow", "hit", "balance", "hole"
              }:
                  raise SystemExit(f"top1_mode_inventory:{day}")
              for mode, row in modes.items():
                  swaps = row.get("changed_exact_top1")
                  heads = row.get("changed_first_boat")
                  seconds = row.get("changed_second_boat")
                  thirds = row.get("changed_third_boat")
                  if (any(type(x) is not int or x < 0 or x > n
                          for x in (swaps, heads, seconds, thirds))
                          or heads > swaps or seconds > swaps or thirds > swaps
                          or row.get("swaps_same_first_boat") != swaps - heads
                          or sum(row.get("original_top1_heads", {}).values()) != n
                          or sum(row.get("candidate_top1_heads", {}).values()) != n):
                      raise SystemExit(f"top1_position_accounting_drift:{day}:{mode}")
                  print(f"TOP1_POSITION_EXPOSURE:{day}:{mode}:{n}:"
                        f"changed_exact={swaps}:changed_head={heads}:"
                        f"changed_second={seconds}:changed_third={thirds}")
          PY
      - name: Test append-only GitHub candidate receipt and strict remote observation clock
        run: python -m unittest -v test_four_mode_all_shadow_durable_ledger
      - name: Check original and candidate replay before any result lookup
        run: python -m unittest -v test_four_mode_all_shadow_reference_review
      - name: Test fixed prior Top1 concentration and absence of result reads
        run: python -m unittest -v test_four_mode_top1_bias_input_audit
      - name: Audit available archived Nov8 V2 input concentration, without results
        run: python four_mode_top1_bias_input_audit.py --day 20261108
      - name: Refuse incomplete or tampered Nov8 prediction input reference
        run: |
          python - <<'PY'
          from pathlib import Path
          from four_mode_top1_bias_input_audit import audit
          report = audit(Path("."), "20261108")
          if (report["valid_v2_saved"] < 116
                  or report["valid_v2_saved"] != report["file_count"]
                  or report["invalid_archives"]
                  or report.get("saved_ticket_order_and_scores_replayed") is not True
                  or report["distinct_national_win_rate_vectors"] != report["valid_v2_saved"]
                  or report["confirmed_results_read"] is not False
                  or report["formal"] is not False):
              raise SystemExit("unverified_or_tampered_nov8_v2_archives")
          print(f'NOV8_RESULT_BLIND_FORECAST_REPLAY_VERIFIED:{report["valid_v2_saved"]}/{report["file_count"]}')
          PY
      - name: Verify separate Nov9 Top1 holdout and result-first leakage rejection
        run: python -m unittest -v test_four_mode_top1_forward_reference
      - name: Validate fail-closed read-only GitHub capture-run inventory
        run: python -m unittest -v test_four_mode_top1_capture_run_inventory
      - name: Report independent Top1 reference status without scoring historical dates
        run: python four_mode_top1_forward_reference.py
      - name: Report reference review readiness (no invented frozen artifact)
        run: python four_mode_all_shadow_reference_review.py
      - name: Report forward gate status (no candidate or result invented)
        run: python four_mode_forward_paired_score.py
      - name: Test read-only public-result source-gap classification (offline fixtures)
        run: python -m unittest -v test_four_mode_result_raw_csv_audit
      - name: Verify daily saved-original/result audit exclusions (no candidate scoring)
        run: python -m unittest -v test_four_mode_nov05_08_daily_reference_audit
      - name: Audit Nov5-8 original V2 Top1/3/5/10 and three distinct miss positions
        run: python four_mode_nov05_08_daily_reference_audit.py --output four_mode_nov05_08_reference.json
      - name: Verify complete Nov5 baseline and daily denominator integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path("four_mode_nov05_08_reference.json").read_text())
          if (v.get("formal") is not False or v.get("formal_count") != 0
                  or v.get("model_improvement_proven") is not False
                  or v.get("model_promotion_allowed") is not False
                  or v.get("result_source_bytes_reverified") is not False
                  or v.get("prospective_candidate_pairs") != 0
                  or set(v.get("by_day",{})) != {"20261105","20261106","20261107","20261108"}):
              raise SystemExit("reference_gate_or_dates_invalid")
          expected={"20261105":106,"20261106":130,"20261107":122,"20261108":116}
          for day, minimum in expected.items():
              row=v["by_day"][day]
              n=row["forecast_files"]
              if (n < minimum or (day!="20261108" and n!=minimum)
                      or n!=row["evaluated"]+row["pending_result_count"]+row["excluded_count"]):
                  raise SystemExit("daily_source_roster_or_denominator_mismatch:"+day)
              for mode, group in row["mode"].items():
                  if sum(group["miss_partition"].values())!=row["evaluated"]:
                      raise SystemExit("miss_partition_mismatch:"+day+":"+mode)
              print("NOV_REFERENCE_DAY:"+day+":forecast="+str(n)+
                    ":evaluated="+str(row["evaluated"])+
                    ":pending="+str(row["pending_result_count"])+
                    ":excluded="+str(row["excluded_count"]))
          overall=v["reference_overall"]
          known=overall["confirmed_denominator"]
          missing=overall["pending_outcome_count"]
          if (known!=v["totals"]["evaluated"] or missing!=v["totals"]["pending_results"]
                  or overall["known_plus_pending_denominator"]!=known+missing
                  or overall.get("missing_result_intervals_are_not_confidence_intervals") is not True):
              raise SystemExit("pooled_denominator_or_uncertainty_flag_invalid")
          mode_data=overall["mode"]
          if set(mode_data)!={"narrow","hit","balance","hole"}:
              raise SystemExit("pooled_mode_roster_invalid")
          for mode, row in mode_data.items():
              if row["full_list_covered"]-row["top_hits"]["top10"]!=row["full_list_correct_beyond_top10"]:
                  raise SystemExit("full_vs_top10_mismatch:"+mode)
              if sum(row["miss_partition"].values())!=known:
                  raise SystemExit("pooled_miss_partition:"+mode)
              for key,hits in row["top_hits"].items():
                  bounds=row["top_pending_bounds"][key]
                  if (bounds["confirmed_only_hits"]!=hits
                          or bounds["saved_valid_with_or_without_result"]!=known+missing
                          or bounds["interpretation"]!="missing_outcomes_extreme_bounds_not_confidence_interval"):
                      raise SystemExit("unresolved_outcome_bounds:"+mode+":"+key)
                  if known+missing:
                      low=round(100*hits/(known+missing),2)
                      high=round(100*(hits+missing)/(known+missing),2)
                      if (bounds["lower_percent_all_pending_miss"]!=low or
                              bounds["upper_percent_all_pending_hit"]!=high):
                          raise SystemExit("uncertainty_math:"+mode+":"+key)
                  elif (bounds["lower_percent_all_pending_miss"] is not None
                        or bounds["upper_percent_all_pending_hit"] is not None):
                      raise SystemExit("no_denominator_not_unknown:"+mode+":"+key)
          pairs=overall["same_race_original_top10_pairs"]
          for a,b in (("narrow","hit"),("hit","balance"),("balance","hole")):
              key=a+"_vs_"+b
              p=pairs[key]
              if (set(p)!={"both","left_only","right_only","neither"}
                      or sum(p.values())!=known
                      or p["both"]+p["left_only"]!=mode_data[a]["top_hits"]["top10"]
                      or p["both"]+p["right_only"]!=mode_data[b]["top_hits"]["top10"]):
                  raise SystemExit("same_race_pair_margins:"+key)
          print("NOV_REFERENCE_UNRESOLVED_OUTCOME_BOUNDS_AND_PAIRED_MARGINS_VALIDATED")
          base=v["by_day"]["20261105"]
          expected_top={
              "narrow":[4,21,33,33],
              "hit":[4,21,33,53],
              "balance":[4,23,32,52],
              "hole":[2,6,9,16]}
          if (base["evaluated"]!=106 or base["excluded_count"]!=0
                  or base["pending_result_count"]!=0):
              raise SystemExit("nov05_reference_denominator_drift")
          for mode,hits in expected_top.items():
              got=[base["mode"][mode]["top_hits"]["top"+str(n)] for n in (1,3,5,10)]
              if got!=hits:
                  raise SystemExit("nov05_reference_hit_drift:"+mode+":"+str(got))
          print("NOV05_106_REFERENCE_SCORES_REPRODUCED")
          PY
      - name: Test public source gap status and historical snapshot drift (no results written)
        run: python -m unittest -v test_four_mode_nov05_08_raw_source_observation
      - name: Observe latest public source CSV independently (research-only, no writes)
        run: |
          python four_mode_nov05_08_raw_source_observation.py --output four_mode_nov05_08_postrace_source_observation.json --source-raw-dir four_mode_nov05_08_public_source_raw
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          r=json.loads(Path("four_mode_nov05_08_postrace_source_observation.json").read_text())
          if (r.get("formal") is not False or r.get("formally_eligible_races")!=0
                  or r.get("prospective_candidate_pairs")!=0
                  or r.get("model_promotion_allowed") is not False
                  or r.get("comparison_only_not_storage_repair") is not True):
              raise SystemExit("research_source_observation_formal_guard_changed")
          preview=r["unarchived_published_shadow_only"]
          if (preview.get("separate_from_441_persisted_reference") is not True
                  or preview.get("eligible_for_formal_admission") is not False
                  or preview.get("not_a_prospective_candidate_comparison") is not True
                  or preview["races"]!=preview["denominator"]
                  or preview["races"]!=len(preview["race_codes"])
                  or preview["races"]!=len(set(preview["race_codes"]))
                  or preview["races"]>r["unresolved_saved_result_files"]):
              raise SystemExit("public_shadow_not_isolated_from_persisted_reference")
          for mode,hits in preview["original_saved_top_hits"].items():
              if set(hits)!={"top1","top3","top5","top10"}:
                  raise SystemExit("public_shadow_topn_schema:"+mode)
              if not (0<=hits["top1"]<=hits["top3"]<=hits["top5"]<=hits["top10"]<=preview["races"]):
                  raise SystemExit("public_shadow_topn_nonmonotone:"+mode)
              for k,h in hits.items():
                  if h!=sum(z["unarchived_published_shadow_only"]["original_saved_top_hits"][mode][k]
                            for z in r["by_day"].values()):
                      raise SystemExit("public_shadow_reconciliation:"+mode+":"+k)
          # Fail closed on unarchived-source / confirmed-only cohort denominator mixing.
          union=r["historical_original_union_reference_only"]
          known=union["valid_saved_forecasts_with_persisted_or_public_result"]
          missing=union["unknown_or_unobserved_result_count"]
          if (union["persisted_result_count"]!=r["reference_results_already_saved"]
                  or union["newly_observed_public_unarchived_result_count"]!=preview["races"]
                  or known!=r["reference_results_already_saved"]+preview["races"]
                  or missing!=r["unresolved_saved_result_files"]-preview["races"]
                  or missing<0 or union["eligible_archive_roster_without_exclusions"]!=known+missing
                  or union.get("not_official_and_not_prospective") is not True
                  or union.get("do_not_replace_persisted_denominator") is not True
                  or union.get("incomplete_or_conflicting_source_cannot_be_promoted") is not True
                  or (union["status"]=="COMPLETE_PUBLIC_SNAPSHOT_AND_CONFLICT_FREE")!=
                      (r["source_observation_days"]==len(r["days"]) and not r["source_errors"]
                       and r["source_conflict_count"]==0)):
              raise SystemExit("postrace_original_union_denominator_or_status_drift")
          for mode, vals in union["modes"].items():
              for n in (1,3,5,10):
                  key="top"+str(n)
                  hit=vals["top_hits_by_evidence_class"][key]
                  if (hit["saved_only"]+hit["public_unarchived_only"]!=hit["combined_observed"]
                          or hit["public_unarchived_only"]!=preview["original_saved_top_hits"][mode][key]
                          or not (0<=hit["combined_observed"]<=known)):
                      raise SystemExit("postrace_original_union_hit_drift:"+mode+":"+key)
                  expected=round(100*hit["combined_observed"]/known,2) if known else None
                  if vals["top_pct_of_currently_observed_outcomes_reference_only"][key]!=expected:
                      raise SystemExit("postrace_original_union_percentage_drift:"+mode+":"+key)
                  bounds=vals["top_bounds_on_saved_archive_roster_not_confidence_intervals"][key]
                  n_total=known+missing
                  lo=round(100*hit["combined_observed"]/n_total,2) if n_total else None
                  hi=round(100*(hit["combined_observed"]+missing)/n_total,2) if n_total else None
                  if (bounds["lower_if_all_unknown_miss_pct"]!=lo or
                          bounds["upper_if_all_unknown_hit_pct"]!=hi):
                      raise SystemExit("postrace_original_union_bounds_drift:"+mode+":"+key)
          print("PUBLIC_SOURCE_ORIGINAL_UNION_ONLY:observed="+str(known)+
                ":unobserved="+str(missing)+":saved="+str(union["persisted_result_count"]))
          print("PUBLIC_SOURCE_SHADOW_ORIGINAL_ONLY:"+str(preview["races"])+
                ":top10="+str({m:v["top10"] for m,v in preview["original_saved_top_hits"].items()}))
          if (r.get("public_raw_csv_evidence_is_ci_artifact_only") is not True
                  or len(r.get("public_raw_csv_retained_day_codes",[]))!=r["source_observation_days"]
                  or r.get("public_raw_csv_retained_for_exact_replay")!=(r["source_observation_days"]==len(r["days"]))):
              raise SystemExit("raw_csv_artifact_retention_not_reconcilable")
          root=Path("four_mode_nov05_08_public_source_raw")
          for day,row in r["by_day"].items():
              raw_path=root/(day+".csv")
              if (not raw_path.is_file()
                      or raw_path.stat().st_size!=row["current_snapshot_bytes"]
                      or hashlib.sha256(raw_path.read_bytes()).hexdigest()!=row["current_snapshot_sha256"]):
                  raise SystemExit("raw_csv_bytes_do_not_replay:"+day)
          print("PUBLIC_SOURCE_RAW_REPLAY_BYTES="+str(r["source_observation_days"]))
          print("PUBLIC_SOURCE_OBSERVATION_STATUS="+r["status"])
          for day, row in r["by_day"].items():
              print("PUBLIC_SOURCE_DAY="+day+
                    ":pending="+str(row["pending_saved_forecast_results"])+
                    ":classes="+str(row["pending_classes"])+
                    ":sha="+row["current_snapshot_sha256"])
          for day, err in r["source_errors"].items():
              print("PUBLIC_SOURCE_UNVERIFIED="+day+":"+str(err))
          if r["source_conflict_count"]>0:
              raise SystemExit("persisted_finish_conflicts_latest_source_manual_review")
          PY
      - name: Cross-audit the same retained public CSV source snapshot (never refetch)
        shell: bash
        run: |
          set -euo pipefail
          python four_mode_result_raw_csv_audit.py --source-dir four_mode_nov05_08_public_source_raw --official-reference research/four_mode_nov05_08_official_non_scoreable_reference.json | tee four_mode_current_raw_csv_status.json
      - name: Refuse result-row disagreement and fabricated formal status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path("four_mode_current_raw_csv_status.json").read_text())
          if (v.get("schema")!="FOUR_MODE_ORIGINAL_CURRENT_PUBLIC_RESULT_CSV_RESEARCH_AUDIT_V1"
                  or v.get("formal") is not False or v.get("formal_count") != 0
                  or v.get("prospective_candidate_pairs") != 0
                  or v.get("model_improvement_proven") is not False
                  or v.get("model_promotion_allowed") is not False
                  or v.get("candidate_not_scored") is not True
                  or v.get("current_raw_hash_not_historical_first_result_sha") is not True
                  or set(v.get("by_day",{}))!={"20261105","20261106","20261107","20261108"}):
              raise SystemExit("untrusted_public_result_source_audit")
          official=v.get("official_non_scored_reference")
          if (type(official) is not dict
                  or official.get("non_scored_total")!=12
                  or official.get("non_scored_counts_by_type")!={"cancelled_race_day":11,
                                                                 "trifecta_not_established":1}
                  or official.get("official_pages_live_rechecked_by_script") is not False
                  or official.get("formal") is not False
                  or official.get("model_promotion_allowed") is not False):
              raise SystemExit("official_non_scoreable_reference_unverifiable")
          if (official["remaining_unresolved_result_races"]+
                  official["non_scored_total"]!=v["frozen_original_result_reference"]["pending_results"]
                  or official["maximum_potential_trifecta_slots_in_saved_forecasts"]+
                     official["non_scored_total"]!=v["frozen_original_result_reference"]["forecast_files"]):
              raise SystemExit("official_non_scoreable_denominator_mismatch")
          print("MANUALLY_REVIEWED_OFFICIAL_NON_SCOREABLE:"+str(official["non_scored_total"]))
          totals=v["totals"]
          ref=v["frozen_original_result_reference"]
          agree=totals.get("saved_result_rows_matched_current_csv",0)
          mismatch=totals.get("saved_result_rows_disagree_or_not_present",0)
          pending=sum(n for k,n in totals.items() if k not in (
              "saved_result_rows_matched_current_csv",
              "saved_result_rows_disagree_or_not_present"))
          if (mismatch or agree!=ref["evaluated"] or pending!=ref["pending_results"]
                  or ref["excluded"]!=0):
              raise SystemExit("public_csv_row_or_roster_discrepancy")
          print("CURRENT_CSV_VS_STORED_ROWS_MATCHED:"+str(agree))
          print("CURRENT_CSV_PERSISTENCE_GAPS:"+str(pending))
          print("NO_FORMAL_RESULT_ADMISSION")
          PY
      - name: Cross-check two independent read-only source auditors and officially non-scoreable denominator
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          raw=json.loads(Path("four_mode_nov05_08_postrace_source_observation.json").read_text())
          ref=json.loads(Path("four_mode_current_raw_csv_status.json").read_text())
          if (raw.get("status")!="ALL_SOURCE_SNAPSHOTS_OBSERVED"
                  or raw.get("public_raw_csv_retained_for_exact_replay") is not True
                  or set(raw.get("by_day",{})) != set(ref.get("by_day",{}))
                  or set(raw["by_day"]) != {"20261105","20261106","20261107","20261108"}
                  or raw.get("reference_results_already_saved") != ref["frozen_original_result_reference"]["evaluated"]
                  or raw.get("unresolved_saved_result_files") != ref["frozen_original_result_reference"]["pending_results"]
                  or raw.get("archived_v2_forecasts") != ref["frozen_original_result_reference"]["forecast_files"]):
              raise SystemExit("same_raw_source_observation_roster_not_reconciled")
          formal=ref["official_non_scored_reference"]
          if (formal.get("formal") is not False or formal.get("official_pages_live_rechecked_by_script") is not False
                  or formal["non_scored_total"] != 12
                  or formal["maximum_potential_trifecta_slots_in_saved_forecasts"] !=
                     raw["archived_v2_forecasts"]-formal["non_scored_total"]
                  or formal["remaining_unresolved_result_races"] !=
                     raw["unresolved_saved_result_files"]-formal["non_scored_total"]):
              raise SystemExit("non_scoreable_reference_denominator_changed")
          mapping={
              "not_in_published_csv":"not_in_published_csv",
              "invalid_or_unfinished_finish":"invalid_or_unfinished_finish_not_scoreable",
              "valid_published_row_not_yet_archived":"valid_source_three_finish_unpersisted",
          }
          for day, v in raw["by_day"].items():
              q=ref["by_day"][day]
              if (v["current_snapshot_sha256"] != q["current_raw_sha256"]
                      or v["current_snapshot_bytes"] != q["current_raw_bytes"]
                      or v["pending_saved_forecast_results"] !=
                         sum(q["pending_classification_counts"].values())):
                  raise SystemExit("independent_csv_digests_or_pending_counts_disagree:"+day)
              for old,new in mapping.items():
                  if v["pending_classes"][old] != q["pending_classification_counts"].get(new,0):
                      raise SystemExit("independent_csv_classification_disagree:"+day+":"+old)
              if any(v["pending_classes"][kind] for kind in v["pending_classes"] if kind not in mapping):
                  raise SystemExit("extra_invalid_csv_classification_requires_manual_review:"+day)
          if (sum(v["pending_classes"]["valid_published_row_not_yet_archived"]
                  for v in raw["by_day"].values()) !=
                  raw["unarchived_published_shadow_only"]["races"]):
              raise SystemExit("unarchived_shadow_denominator_drift")
          if (raw["reference_results_already_saved"] + raw["unarchived_published_shadow_only"]["races"]
                  + formal["non_scored_total"] > raw["archived_v2_forecasts"]):
              raise SystemExit("cross_audited_roster_overflow")
          print("SAME_RAW_SOURCE_TWO_AUDITORS_RECONCILED")
          print("MAXIMUM_TRIFECTA_SCOREABLE_RESEARCH_COHORT="+str(formal["maximum_potential_trifecta_slots_in_saved_forecasts"]))
          print("STORED_RESULTS="+str(raw["reference_results_already_saved"])+
                ":PUBLIC_UNARCHIVED="+str(raw["unarchived_published_shadow_only"]["races"])+
                ":OFFICIAL_MANUAL_NON_SCOREABLE="+str(formal["non_scored_total"]))
          print("FORMAL_COUNT_UNCHANGED:0")
          PY
