name: CLEAN independently verified trifecta payouts
on:
  # Reuse completed trusted main result-collection jobs to wake payouts
  # when GitHub's independent payout Cron is skipped or severely delayed.
  # This is an additional event for this EXISTING workflow, not a new writer.
  workflow_run:
    workflows: ['CLEAN independent confirmed result collection']
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [collect_clean_payouts.py, test_collect_clean_payouts.py, .github/workflows/collect-clean-payouts.yml]
  schedule:
    - cron: '20 9-15 * * *' # 18:20-00:20 JST, catch up late-published payouts
  pull_request:
    paths: [collect_clean_payouts.py, test_collect_clean_payouts.py, .github/workflows/collect-clean-payouts.yml]
permissions:
  contents: write
concurrency:
  group: clean-payout-evidence-writer
  cancel-in-progress: false
jobs:
  collect:
    # A workflow_run can originate from a pull_request or foreign branch.
    # Those must never get this writer's contents:write permissions.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       contains(fromJSON('["schedule","workflow_dispatch","push","workflow_run"]'),
                github.event.workflow_run.event))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_collect_clean_payouts
      - name: Read-only live payout source probe (historical date)
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import json
          from collect_clean_payouts import collect
          try:
              print("HISTORICAL_PAYOUT_PROBE", json.dumps(collect("20261030"), sort_keys=True))
          except Exception as error:
              print("HISTORICAL_PAYOUT_PROBE_ERROR", type(error).__name__, str(error))
              raise
          PY
      - name: Collect today and previous two dates from published payout CSV
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          from datetime import datetime,timedelta,timezone
          from collect_clean_payouts import collect
          now=datetime.now(timezone(timedelta(hours=9)))
          for days_back in (2,1,0):
              print(collect((now-timedelta(days=days_back)).strftime("%Y%m%d")))
          PY
      - name: Commit immutable, result-matched payout records
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d payout_evidence ]; then echo 'No payout evidence yet'; exit 0; fi
          git add -- payout_evidence/
          if git diff --cached --name-only --diff-filter=CDMRTUX -- payout_evidence/ | grep -q .; then
            echo 'Existing payout evidence modifications prohibited' >&2
            exit 1
          fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: archive result-matched payout evidence'
          # The result collector and site publisher also advance main.
          # Retry a non-fast-forward race without modifying an existing payout.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "main advanced concurrently; payout append retries exhausted" >&2
              exit 1
            fi
            sleep "$attempt"
          done
