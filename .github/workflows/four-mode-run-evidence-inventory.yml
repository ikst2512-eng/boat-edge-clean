name: Four-mode run evidence inventory
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/inventory_four_mode_actions_evidence.py
      - tests/test_inventory_four_mode_actions_evidence.py
      - .github/workflows/four-mode-run-evidence-inventory.yml
permissions:
  contents: read
  actions: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run fail-closed tests
        run: python -m unittest -v tests/test_inventory_four_mode_actions_evidence.py
      - name: Inventory recent scheduled collection run artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/inventory_four_mode_actions_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: four-mode-run-inventory
          path: four-mode-run-evidence-inventory.json
