name: Experimental official spdata beforeinfo JSON
on:
  pull_request:
    paths: ['.github/workflows/official-spdata-experiment.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Request real official beforeinfo JSON
        shell: bash
        run: |
          mkdir -p evidence
          python - <<'PY'
          import urllib.request,urllib.parse,json,datetime,hashlib
          from pathlib import Path
          params={'type':'beforeinfo','hd':'20261102','jcd':'15','rno':'11'}
          url='https://www.boatrace.jp/owsp/sp/spdata?'+urllib.parse.urlencode(params)
          o={'url':url,'forecast_usable':False,'t12_eligible':False}
          try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json, text/javascript, */*; q=0.01','X-Requested-With':'XMLHttpRequest','Referer':'https://www.boatrace.jp/owsp/sp/race/beforeinfo?hd=20261102&jcd=15&rno=11'})
              with urllib.request.urlopen(req,timeout=18) as r:
                  raw=r.read(1000001)
                  o.update(http_status=r.status,content_type=r.headers.get('Content-Type'),final_url=r.geturl())
              o.update(bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),received_at_jst=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).isoformat())
              parsed=json.loads(raw)
              o['parse_status']='json'
              o['keys']=list(parsed)[:20] if isinstance(parsed,dict) else []
              main=parsed.get('maindata') if isinstance(parsed,dict) else None
              o['main_keys']=list(main)[:35] if isinstance(main,dict) else []
              boats=main.get('teiinfolist') if isinstance(main,dict) else None
              o['teiinfolist_count']=len(boats) if isinstance(boats,list) else None
              o['example_boat_keys']=list(boats[0])[:35] if isinstance(boats,list) and boats and isinstance(boats[0],dict) else []
              Path('evidence/official_original.json').write_bytes(raw)
          except Exception as e:o['error']=type(e).__name__
          Path('evidence/report.json').write_text(json.dumps(o,ensure_ascii=False,indent=2))
          print(json.dumps(o,ensure_ascii=False)[:6500])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-spdata-beforeinfo-json
          path: evidence/
          retention-days: 7
