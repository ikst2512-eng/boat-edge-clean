name: Isolated live preview evidence capture
run-name: Preview capture (${{ github.event_name }})
on:
  pull_request:
    paths:
      - '.github/workflows/late-preview-capture.yml'
  workflow_dispatch:
  schedule:
    # UTC 00:03-12:58 = JST 09:03-21:58. Avoid :00 peak; scheduled runs may still be delayed or dropped.
    - cron: '3-58/5 0-12 * * *'
permissions:
  contents: read
concurrency:
  group: late-preview-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify preview import and capture unit tests
        run: |
          python -m unittest discover -s tests -p 'test_collect_late_preview_once.py' -v
          python -m unittest discover -s tests -p 'test_late_preview_paired_coverage.py' -v
          python -m unittest discover -s tests -p 'test_audit_late_preview_evidence.py' -v
      - name: Fetch and save only deadline-eligible live rows
        run: python collect_late_preview_once.py
      - name: Verify complete predeadline exhibition and entry pairs
        run: python scripts/audit_late_preview_evidence.py
      - name: Summarize locally captured evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          files=list(Path("late_preview_evidence").rglob("*.json"))
          report=json.loads(Path("late_preview_capture_report.json").read_text())
          from scripts.audit_late_preview_evidence import audit
          coverage=audit()
          Path("late_preview_audit_report.json").write_text(json.dumps(coverage,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("verified_preview_pair_audit="+json.dumps(coverage,ensure_ascii=False))
          print("verified_t12_pairs="+str(coverage['paired_complete_12min_observable']))
          for kind, data in report["kinds"].items():
              print(f"{kind}: source={data.get('source_rows', 'unavailable')} eligible={data.get('pre_deadline_2min', {})} six_lanes={data.get('six_lane_validation', {})}")
          print(f"eligible_saved_rows={len(files)}")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a") as summary:
              summary.write(f"Late preview evidence saved: {len(files)} race-kind records. No main forecast changes.\n")
              summary.write(f"**Verified complete six-boat STT+TKZ pairs: {coverage['paired_complete_6boat_stt_tkz']}**; T-12 observable: {coverage['paired_complete_12min_observable']}; invalid records: {coverage['invalid']}; observed race codes: {coverage['races']}.\n")
              for kind, data in report["kinds"].items():
                  summary.write(f"- {kind}: fetched={data.get('source_rows', 'unavailable')}, saved={data.get('saved', 0)}, timing={data.get('pre_deadline_2min', {})}, lanes={data.get('six_lane_validation', {})}\n")
          PY
      - name: Upload separate short-retention evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: late-preview-evidence-${{ github.run_id }}
          path: |
            late_preview_evidence/**/*.json
            late_preview_capture_report.json
            late_preview_audit_report.json
          if-no-files-found: ignore
          retention-days: 90
