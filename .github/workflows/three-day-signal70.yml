name: CLEAN three-day 70 signal audited ROI
on:
  pull_request:
    paths: [compare_three_day_signal70.py, .github/workflows/three-day-signal70.yml]
  push:
    branches: [main]
    paths: [compare_three_day_signal70.py, .github/workflows/three-day-signal70.yml]
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python compare_three_day_signal70.py
