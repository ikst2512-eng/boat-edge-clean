name: Official racecard raw receipt research tests
on:
  pull_request:
    paths:
      - 'scripts/capture_official_racelist_receipt.py'
      - 'tests/test_capture_official_racelist_receipt.py'
      - 'scripts/audit_official_racelist_receipt.py'
      - 'tests/test_audit_official_racelist_receipt.py'
      - '.github/workflows/official-racelist-raw-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/capture_official_racelist_receipt.py'
      - 'tests/test_capture_official_racelist_receipt.py'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_capture_official_racelist_receipt.py' -v
      - run: python -m unittest discover -s tests -p 'test_audit_official_racelist_receipt.py' -v
