name: P0 trusted forecast-model PR protection

# This trusted job runs from the BASE repository version, without ever
# checking out or executing code supplied by an untrusted pull request.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  protected-active-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse unauthorized active model or lock bypass in any PR
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request
          repository=os.environ["FULL_REPO"]
          number=os.environ["PR_NUMBER"]
          # The only path for a future model switch is an owner-approved,
          # separately audited manual promotion AFTER 300+300 validation.
          # Research candidate files outside these paths are unaffected.
          protected={
              "legacy_v133_reference_engine.py",
              "legacy_scenario_engine.py",
              "boat_edge_v254_third_tail.py",
              "capture_v133_policy.py",
              "clean_four_modes.py",
              "research_model.py",
              "clean_four_mode_capture.py",
              "test_active_forecast_lock.py",
              "test_original_v133_primary_contract.py",
              "test_forecast_strategy_contract.py",
              "research/active_forecast_lock_20261114.json",
              "research/forecast_strategy_guard_20261111.json",
              ".github/workflows/active-forecast-lock.yml",
              ".github/workflows/active-forecast-protected-pr.yml",
          }
          sensitive={
              "server.py":(
                  "get_v133_reference_preview",
                  "/api/v133-reference-preview",
                  "legacy_v133_reference_engine",
                  "v133_reference_preview(",
              ),
              "index.html":(
                  "loadOriginalV133Frozen",
                  "validModes(",
                  "/api/v133-reference-preview",
                  "V127_V133_BALANCE12_HOLE15_18_20_REFERENCE_V2",
                  "BALANCE12_WAVE15_18_20_V133_REFERENCE_V2",
              ),
          }
          changed=[]
          for page in range(1,31):
              url=("https://api.github.com/repos/"+repository+
                   "/pulls/"+number+"/files?per_page=100&page="+str(page))
              req=urllib.request.Request(url,headers={
                  "Authorization":"Bearer "+os.environ["GH_TOKEN"],
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "Cache-Control":"no-cache",
                  "User-Agent":"boat-edge-forecast-lock",
              })
              with urllib.request.urlopen(req,timeout=25) as response:
                  if response.status!=200:raise RuntimeError("PR file list unavailable")
                  items=json.load(response)
              if not isinstance(items,list):raise ValueError("bad PR file roster")
              changed.extend(items)
              if len(items)<100:break
          else:
              raise RuntimeError("PR has too many files to evaluate safely")
          blocked=[]
          for item in changed:
              paths=(item.get("filename"),item.get("previous_filename"))
              if any(path in protected for path in paths):
                  blocked.append(item.get("filename")+" (locked source or guard)")
                  continue
              for path in paths:
                  if path in sensitive:
                      patch=item.get("patch")
                      # Binary/truncated diffs must not bypass protected logic.
                      if patch is None:
                          blocked.append(path+" (missing verifiable diff)")
                          break
                      delta=[line for line in patch.splitlines()
                             if (line.startswith("+") or line.startswith("-"))
                             and not (line.startswith("+++") or line.startswith("---"))]
                      if any(word in line for word in sensitive[path] for line in delta):
                          blocked.append(path+" (active forecast routing changed)")
                          break
          if blocked:
              print("::error::ACTIVE V127/V133 MODEL LOCK. Changes blocked:")
              for item in sorted(set(blocked)):
                  print("::error::"+item)
              print("Submit isolated research challengers; first establish "
                    "independent 300+300 evidence and explicit owner approval "
                    "in Issue #1708. Never self-authorize by editing guard files.")
              sys.exit(1)
          print("PASS: PR avoids frozen active engine, point policy, "
                "comparators and locked V133 routing.")
          PY
