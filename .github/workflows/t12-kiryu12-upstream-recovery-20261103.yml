name: T12 Kiryu12 upstream completion recovery (research only, Nov 3)
on:
  workflow_run:
    workflows: ['Four-mode prospective capture (research only)']
    types: [completed]
permissions:
  contents: write
jobs:
  recover-observation:
    # Only a real scheduled upstream run; never a PR run or workflow_dispatch.
    if: ${{ github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      group: kiryu12-t12-upstream-recovery-20261103
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require one-day and safe pre-T12 window
        env:
          UPSTREAM_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          import os
          now = datetime.now(ZoneInfo("Asia/Tokyo"))
          cutoff = datetime(2026, 11, 3, 20, 19, tzinfo=ZoneInfo("Asia/Tokyo"))
          window = datetime(2026, 11, 3, 19, 30, tzinfo=ZoneInfo("Asia/Tokyo"))
          if not (window <= now < cutoff - timedelta(seconds=90)):
              raise SystemExit("Kiryu12 research T12 recovery outside safe window")
          started = datetime.fromisoformat(os.environ["UPSTREAM_STARTED_AT"].replace("Z", "+00:00"))
          if not (window.astimezone(timezone.utc) <= started <= now.astimezone(timezone.utc)):
              raise SystemExit("Upstream scheduled run is stale or outside research window")
          PY
      - name: Write original three-source evidence only to dedicated branch and reread it
        env:
          GITHUB_EVIDENCE_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.run_external_three_t12 \
            --race-code 202611030112 \
            --repo ikst2512-eng/boat-edge-clean \
            --branch research-t12-external-evidence
      - name: Declare limits (no reliability certification)
        if: always()
        run: |
          {
            echo 'Research-only recovery from an existing scheduled GitHub workflow.'
            echo 'This is NOT an external scheduler and does not prove T12 reliability.'
            echo 'Archive result never certifies final entry or authorizes forecasts.'
            echo 'A missing workflow_run is not observed by this job.'
          } >> "$GITHUB_STEP_SUMMARY"
