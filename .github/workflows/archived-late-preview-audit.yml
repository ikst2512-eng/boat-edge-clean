name: Archived late preview evidence report
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'GitHub Actions run containing archived late-preview evidence (optional)'
        required: false
        type: string
      source_artifact_name:
        description: 'Artifact name from that run (required with source_run_id)'
        required: false
        type: string
  pull_request:
    paths:
      - 'scripts/export_late_preview_audit.py'
      - 'tests/test_export_late_preview_audit.py'
      - '.github/workflows/archived-late-preview-audit.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/audit_late_preview_evidence.py'
      - 'scripts/export_late_preview_audit.py'
      - 'late_preview_evidence/**'
      - '.github/workflows/archived-late-preview-audit.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download explicitly selected evidence artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT: ${{ inputs.source_artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid source run ID"; exit 1; }
          [[ "$ARTIFACT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || { echo "Invalid artifact name"; exit 1; }
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir source_artifact
          if [[ -d source_artifact/late_preview_evidence ]]; then
            cp -a source_artifact/late_preview_evidence ./late_preview_evidence
          else
            mkdir -p late_preview_evidence
            find source_artifact -mindepth 1 -maxdepth 1 -type d -name '20????????' -exec cp -a {} late_preview_evidence/ \;
          fi
          test -n "$(find late_preview_evidence -type f -name '*.json' -print -quit)" || { echo "No evidence JSON found in selected artifact"; exit 1; }
      - name: Verify archived data and generate evidence-status report
        run: |
          python -m unittest discover -s tests -p 'test_audit_late_preview_evidence.py' -v
          python -m unittest discover -s tests -p 'test_export_late_preview_audit.py' -v
          python -m scripts.export_late_preview_audit --root late_preview_evidence --output audit_output/late_preview_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: late-preview-audit-report
          path: audit_output/late_preview_audit.json
          if-no-files-found: error
          retention-days: 14
