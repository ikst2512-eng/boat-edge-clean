# PROPOSAL ONLY. This workflow lives in a separate Draft PR, not on main.
# NEVER merge/enable without explicit manual security+research review.
# No schedule/PR/push trigger; no secrets; no Cloudflare; no production change.
name: Hole pair manual research gateway (NONFORMAL, review before enabling)
on:
  pull_request:
    paths:
      - .github/workflows/hole-pair-manual-gateway.yml
      - docs/research/hole_pair_gateway_review_20261108.md
  workflow_dispatch:
    inputs:
      capture_day_jst:
        description: 'Current JST day YYYYMMDD (>=20261109); no backfill'
        required: true
        type: string
      acknowledgement:
        description: 'Type CAPTURE_UNVERIFIED_RESEARCH; only local artifact, never formal'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: hole-pair-manual-research-${{ inputs.capture_day_jst }}
  cancel-in-progress: false
jobs:
  review_only:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject unattended capture and unpinned research execution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          s = Path('.github/workflows/hole-pair-manual-gateway.yml').read_text()
          header, jobs_text = s.split("\njobs:\n", 1)
          triggers = header.split("\non:\n", 1)[1].split("\npermissions:\n", 1)[0]
          event_names = re.findall(r"(?m)^  ([a-z_]+):$", triggers)
          assert event_names == ['pull_request', 'workflow_dispatch'], event_names
          parts = re.split(r"(?m)^  ([a-z_]+):\n", jobs_text)
          assert parts[0] == ''
          jobs = dict(zip(parts[1::2], parts[2::2]))
          assert list(jobs) == ['review_only', 'capture'], list(jobs)
          review, capture = jobs['review_only'], jobs['capture']
          assert review.startswith("    if: github.event_name == 'pull_request'\n")
          assert capture.startswith(
              "    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'\n"
          )
          assert not re.search(r"(?m)^\s+python research/hole_pair_manual_capture\.py(?: |$)", review)
          assert not re.search(r"(?m)^\s+- uses: actions/upload-artifact@", review)
          assert re.search(r"(?m)^          ref: 464d1641a5c7b981248ab17ba5bdc42b7bfa698b$", capture)
          assert capture.count('persist-credentials: false') == 1
          assert re.search(r"(?m)^          persist-credentials: false$", review)
          assert 'contents: read' in header and 'contents: write' not in header
          assert 'contents: write' not in capture
          assert 'CAPTURE_UNVERIFIED_RESEARCH' in capture
          assert 'cancel-in-progress: false' in header
          assert 'research_candidate_freeze.json' in capture
          competitors = (
              '.github/workflows/hole-pair-manual-research-gateway.yml',
              '.github/workflows/hole-future-pair-precommit.yml',
          )
          for competitor in competitors:
              assert not Path(competitor).exists(), 'competing_gateway_present_in_merge_tree:' + competitor
              assert competitor in capture, 'missing_live_competing_gateway_guard:' + competitor
          assert 'git cat-file -e "origin/main:$competing"' in capture
          print('REVIEW_ONLY_GATE_PASS_exact_triggers_job_guards_no_pr_capture_no_duplicate_gateway')
          PY
  capture:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Verify deliberate current-day research capture BEFORE checkout
        shell: bash
        env:
          DAY: ${{ inputs.capture_day_jst }}
          ACK: ${{ inputs.acknowledgement }}
        run: |
          set -euo pipefail
          [[ "$ACK" == "CAPTURE_UNVERIFIED_RESEARCH" ]] || { echo "::error::explicit research acknowledgement required"; exit 2; }
          [[ "$DAY" =~ ^20[0-9]{6}$ ]] || { echo "::error::invalid YYYYMMDD capture day"; exit 2; }
          [[ "$DAY" == "$(TZ=Asia/Tokyo date +%Y%m%d)" && "$DAY" > "20261108" ]] || { echo "::error::only current JST day from Nov9; no backfill"; exit 2; }
      - name: Checkout exact reviewed research implementation (never branch tip)
        uses: actions/checkout@v4
        with:
          ref: 464d1641a5c7b981248ab17ba5bdc42b7bfa698b
          fetch-depth: 1
          persist-credentials: false
      - name: Python for offline/research candidate freeze
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Current-day research freeze, never fetch settled results
        shell: bash
        env:
          HOLE_RESEARCH_CAPTURE_DAY: ${{ inputs.capture_day_jst }}
          HOLE_RESEARCH_MANUAL_ACK: ${{ inputs.acknowledgement }}
          HOLE_RESEARCH_LOCKED_COMMIT: 464d1641a5c7b981248ab17ba5bdc42b7bfa698b
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$HOLE_RESEARCH_LOCKED_COMMIT"
          # Temporary runtime token is read-only. Main is fetched, not edited.
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          # Fail closed if a competing manual/legacy gateway reached main.
          # This prevents THIS gateway from collecting alongside a second path;
          # it cannot control executions initiated through the other workflow.
          for competing in \
            .github/workflows/hole-pair-manual-research-gateway.yml \
            .github/workflows/hole-future-pair-precommit.yml; do
            if git cat-file -e "origin/main:$competing" 2>/dev/null; then
              echo "::error::competing research capture workflow on main: $competing; refuse this capture"
              exit 3
            fi
          done
          python research/hole_pair_manual_capture.py --capture-day "$HOLE_RESEARCH_CAPTURE_DAY" --output research_candidate_freeze.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research_candidate_freeze.json')
          obj=json.loads(p.read_text(encoding='utf-8'))
          assert obj['schema']=='HOLE_PAIR_FUTURE_ACTIONS_BATCH_V1'
          assert obj['status']=='local_predeadline_freeze_not_formal'
          assert obj['capture_day_jst']==__import__('os').environ['HOLE_RESEARCH_CAPTURE_DAY']
          assert obj['source_snapshot_coverage']['source_snapshot_race_coverage_complete'] is True
          assert obj['source_snapshot_coverage']['entire_day_or_official_schedule_complete_verified'] is False
          assert obj['frozen_count']+sum(obj['excluded_by_reason'].values())==obj['eligible_forecasts_examined']
          for key in ('formal','prospective_validation','independent_first_receipt_verified','production_forecast_changed'):
              assert obj[key] is False
          print('NONFORMAL_FROZEN_COUNT',obj['frozen_count'])
          print('EXCLUSIONS',obj['excluded_by_reason'])
          PY
      - name: Save exact nonformal research candidate manifest (not first receipt)
        uses: actions/upload-artifact@v4
        with:
          name: hole-pair-manual-unverified-${{ inputs.capture_day_jst }}
          path: research_candidate_freeze.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail a zero-candidate run rather than announcing capture success
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('research_candidate_freeze.json').read_text())
          if x['frozen_count'] == 0:
              raise SystemExit('no_predeadline_candidates_frozen_nonformal; artifact saved for audit')
          print('local_artifact_saved_only_NOT_independent_receipt_NOT_official_T12')
          PY
