name: CLEAN independent confirmed result collection
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - collect_clean_results.py
      - clean_results.py
      - server.py
      - test_collect_clean_results.py
      - .github/workflows/collect-clean-results.yml
  pull_request:
    paths:
      - collect_clean_results.py
      - clean_results.py
      - server.py
      - test_collect_clean_results.py
      - .github/workflows/collect-clean-results.yml
permissions:
  contents: write
concurrency:
  group: clean-main-data-writers
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate collector and archive reader without network
        run: python -m unittest -v test_collect_clean_results test_clean_results
      - name: Collect published results (main only)
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p test-results
          python collect_clean_results.py 2>&1 | tee test-results/collection-run.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Commit new result archives (main only)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- confirmed_results/
          if ! git diff --cached --quiet; then
            git commit -m 'data: append independently collected confirmed results'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git -c rebase.autoStash=true rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "main updated concurrently; push retries exhausted" >&2
                exit 1
              fi
              sleep "$attempt"
            done
          fi
      - name: Retain collection run diagnostics
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: clean-collection-${{ github.run_id }}
          path: test-results/collection-run.log
          if-no-files-found: warn
          retention-days: 30
