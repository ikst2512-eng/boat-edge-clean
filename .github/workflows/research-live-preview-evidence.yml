name: Research independent late preview evidence
on:
  pull_request:
    paths:
      - 'scripts/collect_live_preview_evidence.py'
      - '.github/workflows/research-live-preview-evidence.yml'
      - 'tests/test_late_preview_paired_coverage.py'
  schedule:
    # 09:00-21:45 JST every 15 minutes; capture eligibility remains fail-closed.
    - cron: '*/15 0-12 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test same-race paired preview completeness
        run: python -m unittest discover -s tests -p 'test_late_preview_paired_coverage.py' -v
      - name: Capture eligible predeadline preview rows
        run: python scripts/collect_live_preview_evidence.py
      - name: Archive separately from research predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-late-preview-${{ github.run_id }}
          path: late_preview_evidence/
          retention-days: 7
          if-no-files-found: ignore
