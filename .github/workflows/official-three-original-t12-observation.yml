name: Official three-original T12 live research observation
on:
  # The Nov 3 scheduled research campaign has ended. The UTC cron matching
  # Nov 3 can run after midnight JST on Nov 4 with a stale Nov 3 race code.
  # Preserve manual current-day observations, but never schedule yesterday's
  # immutable race-code matrix on the next local date or in later years.
  pull_request:
    paths:
      - '.github/workflows/official-three-original-t12-observation.yml'
      - 'scripts/observe_three_official_t12_originals.py'
      - 'scripts/audit_official_racelist_receipt.py'
      - 'scripts/audit_three_official_t12_originals.py'
      - 'scripts/audit_joint_official_receipts.py'
      - 'scripts/inspect_official_racelist_registrations.py'
      - 'scripts/inspect_official_beforeinfo_json.py'
      - 'scripts/summarize_three_t12_venues.py'
      - 'test_official_three_original_schedule_retirement.py'
  workflow_dispatch:
    inputs:
      race_code:
        description: 'Current-JST-day YYYYMMDDJJRR; must have time before T−12'
        required: true
        type: string
permissions:
  contents: read
jobs:
  workflow-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v test_official_three_original_schedule_retirement
  observe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Different venues are PR research observations only.
        # Dispatch uses the supplied current-day race_code instead.
        # This fallback only drives safe PR fixtures.
        race_code: ${{ fromJSON('["202611030104"]') }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Observe three original sources without persisting forecasts
        env:
          RACE_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.race_code || matrix.race_code }}
          OBSERVATION_ID: ${{ github.run_id }}
        run: |
          python -m scripts.observe_three_official_t12_originals \
            --race-code "$RACE_CODE" --observation-id "$OBSERVATION_ID" \
            --root evidence --report reports/three_originals.json
      - name: Show independently audited timestamps and missing T12 components
        if: always()
        run: |
          if [ -f reports/three_originals.json ]; then
            python -m scripts.render_three_t12_live_summary reports/three_originals.json "$GITHUB_STEP_SUMMARY"
          else
            echo 'Research observation did not produce an audit report; T12 not verified.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-three-originals-${{ github.run_id }}${{ github.event_name == 'pull_request' && format('-{0}', matrix.race_code) || '' }}
          path: |
            evidence/
            reports/
          retention-days: 14
          if-no-files-found: warn

  summarize:
    if: github.event_name == 'workflow_dispatch' && always()
    needs: observe
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: official-three-originals-${{ github.run_id }}*
          path: collected
          merge-multiple: false
      - name: Aggregate T12 source completeness across venues (not certified)
        run: python -m scripts.summarize_three_t12_venues --root collected --output reports/cross_venue_t12.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-three-originals-cross-venue-summary-${{ github.run_id }}
          path: reports/cross_venue_t12.json
          retention-days: 14
          if-no-files-found: warn
