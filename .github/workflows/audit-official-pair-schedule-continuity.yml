name: Audit official-pair schedule continuity (read only)
on:
  pull_request:
    paths:
      - scripts/audit_official_pair_schedule_continuity.py
      - tests/test_audit_official_pair_schedule_continuity.py
      - .github/workflows/audit-official-pair-schedule-continuity.yml
  workflow_dispatch:
    inputs:
      utc_day:
        description: 'UTC YYYYMMDD; blank uses current UTC day and counts only elapsed slots'
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify strict scope and incomplete-page failure gates
        run: python -m unittest discover -s tests -p 'test_audit_official_pair_schedule_continuity.py' -v
      - name: Audit real scheduled metadata only on explicit manual request
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REQUESTED_UTC_DAY: ${{ inputs.utc_day }}
        run: |
          day="${REQUESTED_UTC_DAY:-$(date -u +%Y%m%d)}"
          python -m scripts.audit_official_pair_schedule_continuity \
            --repo "$REPOSITORY" --day-utc "$day" \
            --output reports/official_pair_schedule_continuity.json
      - name: Preserve manual metadata report separately from prediction originals
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: official-pair-schedule-audit-${{ github.run_id }}
          path: reports/official_pair_schedule_continuity.json
          if-no-files-found: error
          retention-days: 30
