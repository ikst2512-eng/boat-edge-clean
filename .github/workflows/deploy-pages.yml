name: Publish BOAT EDGE CLEAN
on:
  push:
    branches: [main]
    paths:
      - index.html
      - navigation.js
      - 'confirmed_results/**'
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: boat-edge-clean-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout published source
        uses: actions/checkout@v4
      - name: Validate inline JavaScript and TopK UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          page = Path('index.html').read_text()
          if not page.strip() or 'BOAT EDGE' not in page:
              raise SystemExit('Missing or invalid CLEAN home page')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', page)
          if len(scripts) != 1:
              raise SystemExit('Expected exactly one inline script')
          if 'id="predictionStatus"' not in page:
              raise SystemExit('Missing research prediction status')
          if any(f'data-mode="{mode}"' in page for mode in ('hit', 'balance', 'hole', 'narrow')):
              raise SystemExit('Old prediction selectors must not appear')
          if "status==='research'" in scripts[0]:
              raise SystemExit('Unverified research prediction fallback')
          ids = re.findall(r'\bid="([^"]+)"', page)
          if len(ids) != len(set(ids)):
              raise SystemExit('Duplicate HTML id')
          referenced = re.findall(r"getElementById\('([^']+)'\)", scripts[0])
          missing = sorted(set(referenced) - set(ids))
          if missing:
              raise SystemExit(f'Missing DOM targets: {missing}')
          if 'async function loadPredictions(' not in scripts[0]:
              raise SystemExit('CLEAN research forecast loader missing')
          if 'verifiedFourModeRace(' not in scripts[0]:
              raise SystemExit('Archived verification evidence loader missing')
          Path('/tmp/clean-inline.js').write_text(scripts[0])
          PY
          node --check /tmp/clean-inline.js
      - name: Stage only public files
        run: |
          mkdir -p public
          cp index.html navigation.js public/
          cp -R confirmed_results public/confirmed_results
          test -s public/confirmed_results/202610270101.json
          test -s public/confirmed_results/202610310708.json
          test -s public/confirmed_results/202611031911.json
          test -s public/index.html
          test -s public/navigation.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record deployed revision
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "### BOAT EDGE CLEAN deployed revision"
            echo "Commit: \`$GITHUB_SHA\`"
            echo "Pages URL: $PAGE_URL"
            echo "Browser diagnostics run after publication; their failures are reported separately."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify deployed public page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"
          for attempt in 1 2 3 4 5 6; do
            echo "Checking published revision (attempt $attempt/6)"
            if curl --fail --silent --show-error --location --max-time 20 "$PAGE_URL" -o /tmp/clean-deployed.html; then
              if cmp -s public/index.html /tmp/clean-deployed.html; then
                NAV_URL="${PAGE_URL%/}/navigation.js"
                if ! curl --fail --silent --show-error --location --max-time 20 "$NAV_URL" -o /tmp/clean-deployed-navigation.js || ! cmp -s public/navigation.js /tmp/clean-deployed-navigation.js; then
                  echo "Published navigation.js not yet identical (attempt $attempt)" >&2
                  sleep 10
                  continue
                fi
                result_ok=1
                for RESULT_KEY in 202610270101 202610310708 202611031911; do
                  RESULT_URL="${PAGE_URL%/}/confirmed_results/${RESULT_KEY}.json"
                  if ! curl --fail --silent --show-error --location --max-time 20 "$RESULT_URL" -o "/tmp/clean-deployed-${RESULT_KEY}.json" || ! cmp -s "public/confirmed_results/${RESULT_KEY}.json" "/tmp/clean-deployed-${RESULT_KEY}.json"; then
                    echo "Published confirmed result not yet identical: ${RESULT_KEY} (attempt $attempt)" >&2
                    result_ok=0
                    break
                  fi
                done
                if [ "$result_ok" -ne 1 ]; then
                  sleep 10
                  continue
                fi
                echo "Public HTML, navigation.js, and 2 confirmed results byte-identical PASS: $PAGE_URL"
                echo "Public HTML: **PASS** (byte-identical to deployed revision)" >> "$GITHUB_STEP_SUMMARY"
                sha256sum public/index.html
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Public HTML/JS/results: **FAIL / UNCONFIRMED** after retries" >> "$GITHUB_STEP_SUMMARY"
          echo "Public page verification FAIL: HTML, navigation.js or confirmed result bytes unavailable/mismatched after retries: $PAGE_URL" >&2
          exit 1
      - name: Browser interaction smoke test
        timeout-minutes: 5
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
          node - <<'JS'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({viewport:{width:390,height:844}});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              await page.route('https://raw.githubusercontent.com/**',r=>r.fulfill({status:404,headers:{'access-control-allow-origin':'*'},body:'{}'}));
              await page.route('https://api.github.com/**',r=>r.fulfill({status:404,headers:{'access-control-allow-origin':'*'},body:'{}'}));
              await page.goto('file://'+process.cwd()+'/index.html',{waitUntil:'domcontentloaded'});
              await page.locator('#venues button').first().waitFor({timeout:15000});
              await page.waitForFunction(()=>document.documentElement.dataset.cleanNavigationInit==='1',null,{timeout:15000});
              if(await page.locator('.race-detail-shortcuts button').count()!==4)throw Error('navigation.js four race tabs missing');
              if(await page.locator('#venues button').count()!==24)throw Error('home must offer 24 venues');
              if(await page.locator('#races button').count()!==12)throw Error('home must offer 12 race choices');
              await page.locator('#venues button').nth(11).click();
              // Venue selection can navigate to the forecast; restore the home picker before a second selection.
              await page.evaluate(()=>setView('home'));
              await page.locator('#races button').nth(4).click();
              if(!(await page.locator('#activeRaceLabel').innerText()).includes('5R'))throw Error('race selection failed');
              await page.evaluate(()=>setView('forecast'));
              if(await page.locator('[data-home-only]:visible').count()!==0)throw Error('venue list leaked into forecast page');
              if(await page.locator('#forecast [data-mode]').count()!==0)throw Error('legacy mode controls must be absent on forecast');
              if(await page.locator('#forecast .legacy-mode-comparison').count()!==0)throw Error('legacy comparison should not appear in forecast');
              if(await page.locator('#predictionStatus').count()!==1)throw Error('research prediction status missing');
              for(const view of ['exhibit','card','result','review']){
                await page.evaluate(v=>setView(v),view);
                if(await page.locator('[data-home-only]:visible').count()!==0)throw Error('home grid leaked into '+view);
              }
              // PR smoke must exercise the real archived candidate data path, not
              // merely prove that the tabs are visible.
              const archive=JSON.parse(require('node:fs').readFileSync('prospective_predictions/202610310708.json','utf8'));
              if(Date.parse(archive.source_cards_received_jst)<=Date.parse(archive.generated_at))throw Error('Archive provenance fixture unexpectedly changed');
              const historic=await browser.newPage({viewport:{width:390,height:844}});
              await historic.route('https://raw.githubusercontent.com/**',route=>{
                if(route.request().url().endsWith('/prospective_predictions/202610310708.json'))
                  return route.fulfill({status:200,contentType:'application/json',headers:{'access-control-allow-origin':'*'},body:JSON.stringify(archive)});
                return route.fulfill({status:404,contentType:'application/json',headers:{'access-control-allow-origin':'*'},body:'{}'});
              });
              await historic.route('https://api.github.com/**',route=>route.fulfill({status:404,contentType:'application/json',headers:{'access-control-allow-origin':'*'},body:'{}'}));
              await historic.goto('file://'+process.cwd()+'/index.html?date=2026-10-31&venue=07&race=8&view=forecast',{waitUntil:'domcontentloaded'});
              await historic.evaluate(()=>{setView('forecast');loadPredictions(true);});
              await historic.waitForFunction(()=>document.querySelector('#snapshotMeta')?.textContent?.includes('時刻証拠未検証'),null,{timeout:20000});
              if(!(await historic.locator('#snapshotMeta').textContent()).includes('正式採点対象外'))throw Error('Historical provenance warning not non-formal');
              await historic.close();
              console.log('CLEAN_OCT31_ARCHIVE_WARNING_PR_BROWSER_PASS');
              if(errors.length)throw Error('JavaScript errors: '+errors.join('; '));
              console.log('CLEAN_BROWSER_SMOKE_PASS: race view, home-only venues, mobile navigation');
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Verify Oct 31 archived forecast and visible receipt warning
        timeout-minutes: 3
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage({viewport:{width:390,height:844}});
              for(const race of [
                {key:'202610280101',date:'2026-10-28',venue:'01',race:'1'},
                {key:'202610310708',date:'2026-10-31',venue:'07',race:'8'},
                {key:'202611021905',date:'2026-11-02',venue:'19',race:'5'},
                {key:'202611031911',date:'2026-11-03',venue:'19',race:'11'}
              ]){
              const key=race.key;
              const original=await page.request.get('https://raw.githubusercontent.com/ikst2512-eng/boat-edge-clean/main/prospective_predictions/'+key+'.json',{timeout:30000});
              if(!original.ok())throw Error('Archived prediction inaccessible: '+key+' '+original.status());
              const saved=await original.json();
              if(saved.race_code!==key||saved.status!=='prospective_candidate'||saved.validated!==false)throw Error('Original candidate status changed');
              if(Date.parse(saved.source_cards_received_jst)<=Date.parse(saved.generated_at))throw Error('Expected test fixture no longer has receipt-order discrepancy');
              const url=new URL(process.env.PAGE_URL);
              url.searchParams.set('date',race.date);
              url.searchParams.set('venue',race.venue);
              url.searchParams.set('race',race.race);
              url.searchParams.set('view','forecast');
              const response=await page.goto(url.toString(),{waitUntil:'domcontentloaded',timeout:30000});
              if(!response||response.status()!==200)throw Error('Published page HTTP '+response?.status());
              await page.evaluate(()=>{setView('forecast');loadPredictions(true);});
              await page.waitForFunction(()=>document.getElementById('snapshotMeta')?.textContent?.includes('時刻証拠未検証'),null,{timeout:30000});
              const detail=await page.locator('#snapshotMeta').textContent();
              if(!detail.includes('正式採点対象外'))throw Error('Research-only warning lost');
              console.log('CLEAN_ARCHIVED_FORECAST_PROVENANCE_BROWSER_PASS',key);
              }
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Verify historical six-racer card in public browser
        timeout-minutes: 3
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage({viewport:{width:390,height:844}});
              for(const race of [
                {key:'202610280101',date:'2026-10-28',venue:'01',race:'1'},
                {key:'202610310708',date:'2026-10-31',venue:'07',race:'8'},
                {key:'202611021905',date:'2026-11-02',venue:'19',race:'5'},
                {key:'202611031911',date:'2026-11-03',venue:'19',race:'11'}
              ]){
              const url=new URL(process.env.PAGE_URL);
              url.searchParams.set('date',race.date);
              url.searchParams.set('venue',race.venue);
              url.searchParams.set('race',race.race);
              const response=await page.goto(url.toString(),{waitUntil:'domcontentloaded',timeout:30000});
              if(response?.status()!==200)throw Error('PUBLIC_PAGES_HTTP '+response?.status());
              await page.evaluate(async()=>{
                datePinned=true;venueSpecified=true;
                setView('card');
                await loadRaceData(true);
              });
              const status=await page.locator('#raceDataStatus').innerText();
              const count=await page.locator('#raceDataRows tr').count();
              if(count!==6)throw Error('PUBLIC_HISTORICAL_RACECARD_NOT_SIX_LANES '+JSON.stringify({count,status}));
              const lanes=await page.locator('#raceDataRows tr td:first-child').allTextContents();
              if(lanes.map(x=>x.trim()).join(',')!=='1,2,3,4,5,6')throw Error('PUBLIC_HISTORICAL_RACECARD_LANES '+lanes.join(','));
              if(!(await page.locator('#raceDataSource').innerText()).includes('Git初回登録時刻は未照合'))throw Error('PUBLIC_HISTORICAL_RACECARD_EVIDENCE_NOTICE_MISSING');
              if(race.key==='202611031911'){
                // Read the source actually accepted by the published frontend.
                // Closed on the same calendar day must be research-only/read-only,
                // never misrepresented as a verified predeadline source.
                const card=await page.evaluate(()=>verifiedRaceCache.get(sameRaceKey()));
                if(card?.meta?.phase!=='HISTORICAL_READ_ONLY'||
                   card?.meta?.historical_reference_only!==true||
                   card?.meta?.scoring!==false||
                   card?.source_audit?.race_card?.predeadline_verified!==false)
                  throw Error('SAME_DAY_CLOSED_CARD_NOT_READ_ONLY '+JSON.stringify(card?.meta));
                console.log('CLEAN_SAME_DAY_CUTOFF_READ_ONLY_BROWSER_PASS',race.key);
              }
              console.log('CLEAN_HISTORICAL_SIX_RACER_BROWSER_PASS',race.key,status);
              await page.evaluate(()=>setView('exhibit'));
              if(!(await page.locator('#exhibitionGrid').isVisible()))throw Error('PUBLIC_HISTORICAL_EXHIBITION_TAB_HIDDEN');
              const exhibition=await page.locator('#exhibitionGrid').innerText();
              if(!exhibition.includes('直前データ：未取得／公開待ち／取得記録の検証待ち')&&!exhibition.includes('直前データ：取得記録は締切前・Git初回登録未照合'))throw Error('PUBLIC_HISTORICAL_EXHIBITION_STATE_MISSING');
              const hasData=exhibition.includes('直前データ：取得記録は締切前・Git初回登録未照合');
              if(hasData&&!exhibition.includes('取得 6/6艇'))throw Error('PUBLIC_HISTORICAL_EXHIBITION_INCOMPLETE_VERIFIED_COUNT');
              console.log('CLEAN_HISTORICAL_EXHIBITION_STATUS_BROWSER_PASS',race.key,hasData?'verified':'unverified');
              }
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Verify published CLEAN confirmed result in browser
        timeout-minutes: 3
        continue-on-error: false
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage({viewport:{width:390,height:844}});
              for(const race of [
                {key:'202610272301',date:'2026-10-27',venue:'23',race:'1',finish:'1-2-5'},
                {key:'202610280101',date:'2026-10-28',venue:'01',race:'1',finish:'4-1-3'},
                {key:'202610310708',date:'2026-10-31',venue:'07',race:'8',finish:'1-4-6'},
                {key:'202611021905',date:'2026-11-02',venue:'19',race:'5',finish:'1-3-4'},
                {key:'202611031911',date:'2026-11-03',venue:'19',race:'11',finish:'1-5-3'}
              ]){
                // Compare against the already published, byte-checked Pages archive.
                // Requiring GitHub Raw here would fail despite a healthy same-origin result.
                const archive=new URL('confirmed_results/'+race.key+'.json',process.env.PAGE_URL).toString();
                // Pages can briefly return a 503 just after deployment. Retry only
                // transient transport/server statuses, never 404 or bad content.
                let archived;
                for(let attempt=0;attempt<4;attempt++){
                  archived=await page.request.get(archive,{timeout:15000});
                  if(archived.ok()||![429,500,502,503,504].includes(archived.status()))break;
                  if(attempt<3)await new Promise(resolve=>setTimeout(resolve,1500*(attempt+1)));
                }
                if(!archived.ok())throw Error('CLEAN published result unavailable: '+race.key+' HTTP '+archived.status());
                const expected=await archived.json();
                if(expected.race_code!==race.key||expected.status!=='confirmed'||expected.finish_order?.join('-')!==race.finish)throw Error('CLEAN archived result mismatch: '+race.key);
                const url=new URL(process.env.PAGE_URL);
                url.searchParams.set('date',race.date);
                url.searchParams.set('venue',race.venue);
                url.searchParams.set('race',race.race);
                url.searchParams.set('view','result');
                await page.goto(url.toString(),{waitUntil:'domcontentloaded',timeout:30000});
                await page.evaluate(()=>{setView('result');loadResult();});
                await page.waitForFunction(()=>document.querySelector('#resultStatus')?.textContent?.startsWith('CLEAN保存済み結果'),null,{timeout:30000});
                const shown=await page.locator('#resultDetail .result-combo .boat-num').allTextContents();
                if(shown.join('-')!==race.finish)throw Error('Published result differs: '+race.key+' '+shown.join('-'));
                if(await page.locator('#resultComparison .comparison-hit, #resultComparison .comparison-miss').count())throw Error('Unverified formal forecast was scored: '+race.key);
                console.log('CLEAN_RESULT_PUBLISHED_BROWSER_PASS',url.toString(),shown.join('-'));
              }
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Check a real JST-day race across four published tabs (diagnostic)
        timeout-minutes: 4
        # Live sources are external and may not have published today's card yet.
        # An unavailable source is reported as UNVERIFIED, not as a passed live test.
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node - <<'JS'
          const {chromium}=require('playwright');
          const fs=require('node:fs');
          const summary=message=>fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,message+'\n');
          (async()=>{
            const day=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()).replaceAll('-','');
            const browser=await chromium.launch({headless:true});
            let selected=null;
            try{
              const api=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              const schedule=await api.request.get('https://boat-edge-clean.onrender.com/api/clean-schedule?date='+day,{timeout:20000});
              if(schedule.status()!==200)throw Error('schedule_http_'+schedule.status());
              const feed=await schedule.json();
              if(feed.ok!==true||feed.date!==day||!Array.isArray(feed.races))throw Error('schedule_unverified');
              // Take only explicitly named CLEAN races; never infer missing venues or numbers.
              const candidates=feed.races.filter(x=>/^\d{2}$/.test(x.venue_code||'')&&
                Number(x.venue_code)>=1&&Number(x.venue_code)<=24&&
                Number.isInteger(x.race_no)&&x.race_no>=1&&x.race_no<=12).slice(0,8);
              for(const race of candidates){
                const query='hd='+day+'&jcd='+Number(race.venue_code)+'&rno='+race.race_no;
                let result;
                try{result=await api.request.get('https://boat-edge-clean.onrender.com/api/clean-racecard?'+query,{timeout:12000})}
                catch(_){continue}
                if(result.status()!==200)continue;
                const card=await result.json();
                const key=day+'-'+race.venue_code+'-'+String(race.race_no).padStart(2,'0');
                if(card.race_key===key&&Array.isArray(card.racers)&&card.racers.length===6&&
                  new Set(card.racers.map(x=>x.lane)).size===6){selected={race,key};break}
              }
              if(!selected)throw Error('no_verified_six_racer_card_in_first_eight_published_races');
              const url=new URL(process.env.PAGE_URL);
              url.searchParams.set('date',day.slice(0,4)+'-'+day.slice(4,6)+'-'+day.slice(6,8));
              url.searchParams.set('venue',selected.race.venue_code);
              url.searchParams.set('race',String(selected.race.race_no));
              url.searchParams.set('view','card');
              url.searchParams.delete('follow');
              const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              const failures=[];page.on('pageerror',e=>failures.push(e.message));
              const publicPage=await page.goto(url.toString(),{waitUntil:'domcontentloaded',timeout:30000});
              if(!publicPage||publicPage.status()!==200)throw Error('published_page_http_'+publicPage?.status());
              // Exercise the same user click that invokes render/loadRaceData.
              // setView('card') alone only toggles visibility; it does not fetch racers.
              // Deep-linked Pages may initially show the home view with race tabs hidden.
              // Transition to the selected race with the same setView+render sequence
              // that navigation.js runs after a real user selects a race tab.
              await page.waitForFunction(()=>document.documentElement.dataset.cleanNavigationInit==='1');
              await page.evaluate(()=>{setView('card');render()});
              try{
                await page.waitForFunction(()=>document.querySelectorAll('#mobileRaceCards .mobile-racer').length===6,null,{timeout:30000});
              }catch(error){
                const state=await page.evaluate(()=>({
                  race:typeof sameRaceKey==='function'?sameRaceKey():null,
                  active:typeof activeView==='string'?activeView:null,
                  dataStatus:document.getElementById('raceDataStatus')?.textContent,
                  source:document.getElementById('raceDataSource')?.textContent,
                  venueState:document.getElementById('venueState')?.textContent,
                  cardCount:document.querySelectorAll('#mobileRaceCards .mobile-racer').length
                }));
                throw Error('six_racer_browser_unverified '+JSON.stringify(state)+' '+error.message);
              }
              await page.waitForFunction(()=>document.documentElement.dataset.cleanNavigationInit==='1');
              if(await page.evaluate(()=>sameRaceKey())!==selected.key)throw Error('race_changed_during_display');
              for(const view of ['card','exhibit','forecast','result']){
                await page.locator('.race-detail-shortcuts button[data-race-view="'+view+'"]').click();
                if(await page.evaluate(()=>activeView)!==view)throw Error('tab_not_selected_'+view);
                if(await page.evaluate(()=>sameRaceKey())!==selected.key)throw Error('race_changed_in_'+view);
              }
              // Observe data availability independently of tab visibility. Missing forecast,
              // exhibition, or result is not a successful data verification.
              const tabEvidence={};
              for(const [view,selector] of [
                ['card','#raceDataStatus'],
                ['exhibit','#raceDataStatus'],
                ['forecast','#predictionStatus'],
                ['result','#resultStatus']
              ]){
                await page.locator('.race-detail-shortcuts button[data-race-view="'+view+'"]').click();
                try{
                  await page.waitForFunction(sel=>{
                    const value=document.querySelector(sel)?.textContent?.trim()||'';
                    return !!value&&!/(確認中|更新中|読み込み中|取得中)/.test(value);
                  },selector,{timeout:12000});
                }catch(_){}
                tabEvidence[view]=await page.evaluate(sel=>({
                  status:document.querySelector(sel)?.textContent?.trim()?.slice(0,180)||'status_missing',
                  race:sameRaceKey()
                }),selector);
                if(tabEvidence[view].race!==selected.key)throw Error('tab_evidence_race_changed_'+view);
              }
              tabEvidence.exhibit.count=await page.locator('#exhibitionGrid .exhibition-boat').count();
              // Six UI cards are not proof of real exhibition measurements.
              // Derive evidence only from the verified CLEAN snapshot retained for this race.
              tabEvidence.exhibit.sourceVerified=await page.evaluate(key=>{
                const card=verifiedRaceCache.get(key);
                return card?.verifiedPreview===true&&card?.source_audit?.beforeinfo?.status==='ok';
              },selected.key);
              tabEvidence.exhibit.sourceState=await page.locator('#exhibitionGrid .muted').first().innerText().catch(()=> 'status_missing');
              if(!tabEvidence.exhibit.sourceVerified&&/取得記録は締切前/.test(tabEvidence.exhibit.sourceState))
                throw Error('unverified_exhibition_mislabeled_verified');
              // Exhibition cards without measured source values are not exhibition-data proof.
              tabEvidence.forecast.forecastRows=await page.locator('#predictionRows > *').count();
              tabEvidence.result.confirmed=await page.locator('#resultDetail .result-combo .boat-num').count()===3;
              console.log('CLEAN_LIVE_DAY_TAB_STATUS',selected.key,JSON.stringify(tabEvidence));
              summary('Live JST-day tab data states (not proof of complete sources): '+selected.key+
                ' '+JSON.stringify(tabEvidence).slice(0,750));
              if(failures.length)throw Error('browser_js_errors_'+failures.join(';').slice(0,240));
              console.log('CLEAN_LIVE_DAY_BROWSER_VERIFIED',selected.key);
              summary('Live JST-day Pages browser (390px, 4 tabs, six racers): **VERIFIED** '+selected.key+
                ' (source card verified on Render; predictions/exhibition/results not claimed complete)');
            }catch(error){
              console.error('CLEAN_LIVE_DAY_BROWSER_UNVERIFIED',day,selected?.key||'',error.message);
              summary('Live JST-day Pages browser: **UNVERIFIED** '+day+' '+(selected?.key||'')+
                ' reason='+String(error.message).replace(/[\r\n]/g,' ').slice(0,240)+
                ' (does not change historic browser or formal forecast results)');
              throw error;
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exitCode=1});
