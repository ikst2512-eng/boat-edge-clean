name: Hole future pair precommit research (nonformal)
on:
  pull_request:
    paths:
      - hole_future_pair_precommit.py
      - hole_pair_remote_receipt_evidence.py
      - test_hole_pair_remote_receipt_evidence.py
      - research/hole_pair_future_holdout_protocol_20261109.json
      - test_hole_future_pair_precommit.py
      - hole_future_pair_pinned92_score.py
      - test_hole_future_pair_pinned92_score.py
      - .github/workflows/hole-future-pair-precommit.yml
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify new predeclared research policies
        run: python -m unittest -v test_hole_future_pair_precommit.py test_hole_future_pair_pinned92_score.py test_hole_pair_remote_receipt_evidence.py
      - name: Prove Nov 5 is excluded before opening any forecast
        run: |
          python hole_future_pair_precommit.py 202611050101 > research_not_eligible.json
          python - <<'PY'
          import json
          data=json.load(open('research_not_eligible.json'))
          assert data['status']=='not_yet_eligible_or_invalid_code'
          assert data['formal'] is False
          assert data['production_forecast_changed'] is False
          print(data['status'])
          PY
      - name: Freeze future race candidates from immutable main forecasts (research only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          # Read main, but never push or modify it. No results are fetched.
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          python - <<'PY'
          import collections
          import json
          import subprocess
          from datetime import datetime, timedelta
          from pathlib import Path
          from hole_future_pair_precommit import JST, freeze

          started = datetime.now(JST)
          day = started.strftime("%Y%m%d")
          source_head = subprocess.check_output(
              ["git", "rev-parse", "origin/main"], text=True).strip()
          names = subprocess.check_output(
              ["git", "ls-tree", "-r", "--name-only", "origin/main",
               "--", "four_mode_forecasts/"], text=True).splitlines()
          paths = [name for name in names
                   if name.startswith("four_mode_forecasts/" + day)
                   and name.endswith(".json")
                   and len(Path(name).stem) == 12
                   and Path(name).stem.isdigit()]
          if len(paths) > 500:
              raise ValueError("unreasonably_large_new_day_inventory")
          records = []
          excluded = collections.Counter()
          for name in sorted(paths):
              code = Path(name).stem
              source = subprocess.check_output(
                  ["git", "show", "origin/main:" + name])
              target = Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              if target.exists() and target.read_bytes() != source:
                  raise ValueError("research_branch_has_conflicting_forecast:" + code)
              if not target.exists():
                  target.write_bytes(source)
              # Selectors precommitted in #1685. freeze() NEVER opens a result file.
              frozen = freeze(code, ".")
              if frozen.get("status") == "locally_frozen_unverified":
                  frozen["source_git_blob_sha1"] = subprocess.check_output(
                      ["git", "rev-parse", "origin/main:" + name],
                      text=True).strip()
                  records.append(frozen)
              else:
                  excluded[str(frozen.get("status", "invalid"))] += 1

          finished = datetime.now(JST)
          assert all(datetime.fromisoformat(row["local_finish_jst"]) <
                     datetime.fromisoformat(row["t_minus_12_jst"])
                     for row in records)
          output = {
              "schema": "HOLE_PAIR_FUTURE_ACTIONS_BATCH_V1",
              "status": "local_predeadline_freeze_not_formal",
              "source_main_commit": source_head,
              "capture_day_jst": day,
              "batch_started_at_jst": started.isoformat(),
              "batch_finished_at_jst": finished.isoformat(),
              "eligible_forecasts_examined": len(paths),
              "frozen_count": len(records),
              "excluded_by_reason": dict(sorted(excluded.items())),
              "records": records,
              "formal": False,
              "prospective_validation": False,
              "independent_first_receipt_verified": False,
              "production_forecast_changed": False,
              "warning": "Compare only after future results; local times and artifact creation alone do not certify independent first remote receipt or formal T-minus-12."
          }
          assert output["frozen_count"] + sum(excluded.values()) == len(paths)
          Path("research_candidate_freeze.json").write_text(
              json.dumps(output, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8")
          print(json.dumps({k: v for k, v in output.items() if k != "records"},
                           ensure_ascii=False, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: hole-future-pair-precutoff-candidates
          path: research_candidate_freeze.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: hole-future-pair-precommit-readiness
          path: research_not_eligible.json
