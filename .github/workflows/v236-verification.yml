name: CLEAN V236 verification queue
on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['CLEAN independent confirmed result collection']
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/v236-verification.yml'
      - 'clean_direct_sources.py'
      - 'test_clean_direct_sources.py'
      - 'confirmed_results/**'
  pull_request:
    paths:
      - 'clean_racecard.py'
      - 'test_clean_racecard.py'
      - 'v236_freeze.py'
      - 'test_v236_freeze.py'
      - 'verification_pipeline.py'
      - 'test_verification_pipeline.py'
      - '.github/workflows/v236-verification.yml'
permissions:
  contents: write
concurrency:
  group: clean-main-data-writers
  cancel-in-progress: false
jobs:
  review:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
          fetch-depth: 0
      - name: Verify processing states and payouts
        run: python -m unittest -v test_verification_pipeline test_v236_freeze test_clean_racecard
      - name: Freeze prospectively committed V236 candidate cohorts
        if: github.event_name != 'pull_request'
        run: python v236_freeze.py
      - name: Commit frozen forecasts before any result evaluation
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p v236_forecasts
          git add v236_forecasts/
          if ! git diff --cached --quiet; then
            git commit -m "data: freeze V236 predictions before race [skip ci]"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git -c rebase.autoStash=true rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "main updated concurrently; push retries exhausted" >&2
                exit 1
              fi
              sleep "$attempt"
            done
          fi
      - name: Advance all saved races including unfinished statuses
        run: python verification_pipeline.py
      - name: Save updated states to CLEAN
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification_status/
          if ! git diff --cached --quiet; then
            git commit -m "data: advance V236 verification statuses [skip ci]"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git -c rebase.autoStash=true rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "main updated concurrently; push retries exhausted" >&2
                exit 1
              fi
              sleep "$attempt"
            done
          fi
