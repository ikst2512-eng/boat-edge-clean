      - name: Cross-check two independent read-only source auditors and officially non-scoreable denominator
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          raw=json.loads(Path("four_mode_nov05_08_postrace_source_observation.json").read_text())
          ref=json.loads(Path("four_mode_current_raw_csv_status.json").read_text())
          if (raw.get("status")!="ALL_SOURCE_SNAPSHOTS_OBSERVED"
                  or raw.get("public_raw_csv_retained_for_exact_replay") is not True
                  or set(raw.get("by_day",{})) != set(ref.get("by_day",{}))
                  or set(raw["by_day"]) != {"20261105","20261106","20261107","20261108"}
                  or raw.get("reference_results_already_saved") != ref["frozen_original_result_reference"]["evaluated"]
                  or raw.get("unresolved_saved_result_files") != ref["frozen_original_result_reference"]["pending_results"]
                  or raw.get("archived_v2_forecasts") != ref["frozen_original_result_reference"]["forecast_files"]):
              raise SystemExit("same_raw_source_observation_roster_not_reconciled")
          formal=ref["official_non_scored_reference"]
          if (formal.get("formal") is not False or formal.get("official_pages_live_rechecked_by_script") is not False
                  or formal["non_scored_total"] != 12
                  or formal["maximum_potential_trifecta_slots_in_saved_forecasts"] !=
                     raw["archived_v2_forecasts"]-formal["non_scored_total"]
                  or formal["remaining_unresolved_result_races"] !=
                     raw["unresolved_saved_result_files"]-formal["non_scored_total"]):
              raise SystemExit("non_scoreable_reference_denominator_changed")
          mapping={
              "not_in_published_csv":"not_in_published_csv",
              "invalid_or_unfinished_finish":"invalid_or_unfinished_finish_not_scoreable",
              "valid_published_row_not_yet_archived":"valid_source_three_finish_unpersisted",
          }
          for day, v in raw["by_day"].items():
              q=ref["by_day"][day]
              if (v["current_snapshot_sha256"] != q["current_raw_sha256"]
                      or v["current_snapshot_bytes"] != q["current_raw_bytes"]
                      or v["pending_saved_forecast_results"] !=
                         sum(q["pending_classification_counts"].values())):
                  raise SystemExit("independent_csv_digests_or_pending_counts_disagree:"+day)
              for old,new in mapping.items():
                  if v["pending_classes"][old] != q["pending_classification_counts"].get(new,0):
                      raise SystemExit("independent_csv_classification_disagree:"+day+":"+old)
              if any(v["pending_classes"][kind] for kind in v["pending_classes"] if kind not in mapping):
                  raise SystemExit("extra_invalid_csv_classification_requires_manual_review:"+day)
          if (sum(v["pending_classes"]["valid_published_row_not_yet_archived"]
                  for v in raw["by_day"].values()) !=
                  raw["unarchived_published_shadow_only"]["races"]):
              raise SystemExit("unarchived_shadow_denominator_drift")
          if (raw["reference_results_already_saved"] + raw["unarchived_published_shadow_only"]["races"]
                  + formal["non_scored_total"] > raw["archived_v2_forecasts"]):
              raise SystemExit("cross_audited_roster_overflow")
          # Once the manually referenced canceled/no-trifecta roster is proven
          # equal to all remaining source gaps, those 12 can NEVER be assumed
          # to become wins. Correct scoreable denominator is 462, not 474.
          union=raw["historical_original_union_reference_only"]
          effective=union["valid_saved_forecasts_with_persisted_or_public_result"]
          if (union["status"]!="COMPLETE_PUBLIC_SNAPSHOT_AND_CONFLICT_FREE"
                  or union["unknown_or_unobserved_result_count"]!=formal["non_scored_total"]
                  or effective!=formal["maximum_potential_trifecta_slots_in_saved_forecasts"]
                  or effective+formal["non_scored_total"]!=raw["archived_v2_forecasts"]
                  or union["persisted_result_count"]!=raw["reference_results_already_saved"]
                  or union["newly_observed_public_unarchived_result_count"]!=
                     raw["unarchived_published_shadow_only"]["races"]):
              raise SystemExit("non_scoreable_denominator_not_exhaustively_reconciled")
          mode_summary={}
          for mode, entry in union["modes"].items():
              count={}
              pct={}
              for n in (1,3,5,10):
                  key="top"+str(n)
                  h=entry["top_hits_by_evidence_class"][key]
                  if h["saved_only"]+h["public_unarchived_only"]!=h["combined_observed"]:
                      raise SystemExit("scoreable_reference_hit_subtotal:"+mode+":"+key)
                  count[key]=h["combined_observed"]
                  pct[key]=round(100*count[key]/effective,2) if effective else None
                  if entry["top_pct_of_currently_observed_outcomes_reference_only"][key]!=pct[key]:
                      raise SystemExit("scoreable_reference_percentage:"+mode+":"+key)
              mode_summary[mode]={"original_top_hits":count,
                                  "original_top_pct":pct}
          report={
              "schema":"FOUR_MODE_SCOREABLE_20261105_08_ORIGINAL_REFERENCE_V1",
              "status":"complete_postrace_trifecta_outcomes_on_current_public_CSV_reference_only",
              "all_saved_v2_forecast_roster":raw["archived_v2_forecasts"],
              "scoreable_outcomes":effective,
              "confirmed_results_git_persisted":raw["reference_results_already_saved"],
              "public_third_party_results_not_git_persisted":raw["unarchived_published_shadow_only"]["races"],
              "excluded_no_trifecta_canceled_reference_count":formal["non_scored_total"],
              "official_case_reference_manual_not_live_CI":True,
              "source_snapshot_from_exact_raw_ci_artifact":True,
              "modes":mode_summary,
              "cohort":"historical_original_model_ONLY_not_preregistered_candidate",
              "official_T_minus_12_evidence_verified":False,
              "independent_first_Git_receipt_proven":False,
              "prospective_candidate_pairs":0,
              "formal":False,
              "formally_eligible_races":0,
              "model_promotion_allowed":False,
          }
          Path("four_mode_scoreable_original_reference.json").write_text(
              json.dumps(report,ensure_ascii=False,sort_keys=True,indent=2)+"\n")
          print("HISTORICAL_ORIGINAL_ONLY_TRIFECTA_SCOREABLE:"+str(effective)+
                ":excluded_non_scoreable="+str(formal["non_scored_total"])+
                ":top10="+str({m:v["original_top_hits"]["top10"] for m,v in mode_summary.items()}))
          print("SAME_RAW_SOURCE_TWO_AUDITORS_RECONCILED")
          print("MAXIMUM_TRIFECTA_SCOREABLE_RESEARCH_COHORT="+str(formal["maximum_potential_trifecta_slots_in_saved_forecasts"]))
          print("STORED_RESULTS="+str(raw["reference_results_already_saved"])+
                ":PUBLIC_UNARCHIVED="+str(raw["unarchived_published_shadow_only"]["races"])+
                ":OFFICIAL_MANUAL_NON_SCOREABLE="+str(formal["non_scored_total"]))
          print("FORMAL_COUNT_UNCHANGED:0")
          PY
      - name: Test displayed estimate versus observed full-ticket coverage gates
        run: python -m unittest -v test_four_mode_original_coverage_calibration_audit
      - name: Audit historical original full-list coverage estimate without model changes
        run: |
          python four_mode_original_coverage_calibration_audit.py --source-dir four_mode_nov05_08_public_source_raw --official-reference research/four_mode_nov05_08_official_non_scoreable_reference.json --output four_mode_original_coverage_calibration.json
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("four_mode_original_coverage_calibration.json").read_text())
          original=json.loads(Path("four_mode_scoreable_original_reference.json").read_text())
          archived=json.loads(Path("four_mode_nov05_08_reference.json").read_text())
          latest=json.loads(Path("four_mode_nov05_08_postrace_source_observation.json").read_text())
          expected={"narrow":5, "hit":10, "balance":16, "hole":22}
          if (c.get("schema")!="FOUR_MODE_V2_NOV05_08_ORIGINAL_ESTIMATED_FULL_COVERAGE_CALIBRATION_V1"
                  or c.get("formal") is not False
                  or c.get("predictive_calibration_proven") is not False
                  or c.get("model_promotion_allowed") is not False
                  or c.get("prospective_candidate_pairs")!=0
                  or c.get("compares_full_mode_ticket_lists_not_top10_for_16_or_22_budget") is not True
                  or c.get("ticket_budgets")!=expected
                  or c.get("postrace_scoreable")!=original["scoreable_outcomes"]
                  or c.get("archived_original_forecasts")!=original["all_saved_v2_forecast_roster"]
                  or c.get("non_scoreable_excluded")!=original["excluded_no_trifecta_canceled_reference_count"]
                  or c.get("persisted_results")!=original["confirmed_results_git_persisted"]
                  or c.get("public_only_postrace_results")!=original["public_third_party_results_not_git_persisted"]
                  or set(c.get("mode",{}))!=set(expected)):
              raise SystemExit("historical_full_ticket_calibration_evidence_not_consistent")
          for mode,stats in c["mode"].items():
              saved=archived["reference_overall"]["mode"][mode]["full_list_covered"]
              newly=sum(row["unarchived_published_shadow_only"]["original_saved_full_list_covered"][mode]
                        for row in latest["by_day"].values())
              if (stats["races"]!=c["postrace_scoreable"]
                      or stats["persisted_result_count"]!=c["persisted_results"]
                      or stats["public_only_result_count"]!=c["public_only_postrace_results"]
                      or stats["observed_hit_count"]!=saved+newly
                      or stats["observed_hit_count"]<original["modes"][mode]["original_top_hits"]["top10"]
                      or not 0<=stats["mean_squared_error_brier_descriptive"]<=1
                      or stats["estimated_full_list_min_pct"] is None
                      or stats["estimated_full_list_max_pct"] is None
                      or not (0<=stats["estimated_full_list_min_pct"]<=stats["estimated_full_list_hit_rate_pct"]<=stats["estimated_full_list_max_pct"]<=100)
                      or stats["estimated_full_list_population_stddev_pp"] is None
                      or stats["estimated_full_list_population_stddev_pp"]<0
                      or not (1<=stats["distinct_original_estimated_pct_values"]<=stats["races"])
                      or stats["descriptive_original_estimate_hit_discrimination_auc"] is None
                      or not 0<=stats["descriptive_original_estimate_hit_discrimination_auc"]<=1
                      or c.get("auc_is_historical_same_cohort_not_future_holdout") is not True):
                  raise SystemExit("calibration_full_list_vs_top10_reconciliation:"+mode)
              print("ORIGINAL_CALIBRATION_REFERENCE:"+mode+
                    ":estimated_full_pct="+str(stats["estimated_full_list_hit_rate_pct"])+
                    ":actual_full_pct="+str(stats["observed_full_list_hit_rate_pct"])+
                    ":gap_pp="+str(stats["observed_minus_estimated_percentage_points"])+
                    ":actual_full_hits="+str(stats["observed_hit_count"])+
                    ":estimated_min="+str(stats["estimated_full_list_min_pct"])+
                    ":estimated_max="+str(stats["estimated_full_list_max_pct"])+
                    ":estimated_sd_pp="+str(stats["estimated_full_list_population_stddev_pp"])+
                    ":distinct_estimates="+str(stats["distinct_original_estimated_pct_values"])+
                    ":historical_auc="+str(stats["descriptive_original_estimate_hit_discrimination_auc"]))
          leave=c.get("leave_one_day_out_original_auc")
          if (c.get("leave_one_day_out_is_descriptive_robustness_not_prospective") is not True
                  or not isinstance(leave,dict) or set(leave)!=set(expected)):
              raise SystemExit("missing_or_invalid_day_exclusion_robustness")
          expected_days=set(c["by_day"])
          if expected_days!={"20261105","20261106","20261107","20261108"}:
              raise SystemExit("unexpected_historical_day_roster")
          for mode, detail in leave.items():
              rows=detail.get("excluding_each_day")
              if (detail.get("not_prospective_or_cross_validated_model_training") is not True
                      or not isinstance(rows,dict) or set(rows)!=expected_days):
                  raise SystemExit("missing_leave_one_day_out_cases:"+mode)
              valid=[]
              for removed, case in rows.items():
                  include=expected_days-{removed}
                  n=sum(c["by_day"][day][mode]["races"] for day in include)
                  positive=sum(c["by_day"][day][mode]["observed_hit_count"] for day in include)
                  auc=case["descriptive_original_estimate_hit_discrimination_auc"]
                  if (set(case["included_days"])!=include
                          or case["excluded_day"]!=removed
                          or case["included_races"]!=n
                          or case["observed_full_list_hits"]!=positive
                          or case["observed_full_list_misses"]!=n-positive
                          or auc is not None and not 0<=auc<=1):
                      raise SystemExit("day_exclusion_denominator_or_auc:"+mode+":"+removed)
                  if auc is not None:
                      valid.append(auc)
              if detail["evaluable_day_exclusions"]!=len(valid):
                  raise SystemExit("day_exclusion_eligible_count:"+mode)
              if valid:
                  if (detail["minimum_three_day_auc"]!=min(valid)
                          or detail["maximum_three_day_auc"]!=max(valid)
                          or detail["range_across_omitted_days"]!=round(max(valid)-min(valid),5)):
                      raise SystemExit("day_exclusion_auc_range:"+mode)
              else:
                  if any(detail[k] is not None for k in
                         ("minimum_three_day_auc","maximum_three_day_auc","range_across_omitted_days")):
                      raise SystemExit("day_exclusion_auc_unknown_must_remain_null:"+mode)
              print("ORIGINAL_AUC_LEAVE_ONE_DAY_OUT:"+mode+":pooled="+str(
                    c["mode"][mode]["descriptive_original_estimate_hit_discrimination_auc"])+
                    ":min="+str(detail["minimum_three_day_auc"])+
                    ":max="+str(detail["maximum_three_day_auc"])+
                    ":by_removed_day="+str({d:v["descriptive_original_estimate_hit_discrimination_auc"]
                                              for d,v in rows.items()}))
          print("ORIGINAL_CALIBRATION_FORMAL_COUNT:0")
          PY
