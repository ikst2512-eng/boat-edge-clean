name: Research forecast checks
on:
  push:
    paths:
      - 'research_model.py'
      - 'server.py'
      - 'test_research_model.py'
      - 'test_research_model_provenance.py'
      - 'test_research_source_digests.py'
      - 'test_research_persistence.py'
      - 'collect_research_daily.py'
      - 'test_collect_research_daily.py'
      - 'scripts/audit_research_outcomes.py'
      - 'scripts/verify_research_git_first_add.py'
      - 'tests/test_audit_research_outcomes.py'
      - 'tests/test_research_audit_git_integration.py'
      - 'tests/test_verify_research_git_first_add.py'
      - '.github/workflows/research-forecast-tests.yml'
  pull_request:
    paths:
      - 'research_model.py'
      - 'server.py'
      - 'test_research_model.py'
      - 'test_research_model_provenance.py'
      - 'test_research_source_digests.py'
      - 'test_research_persistence.py'
      - 'collect_research_daily.py'
      - 'test_collect_research_daily.py'
      - 'scripts/audit_research_outcomes.py'
      - 'scripts/verify_research_git_first_add.py'
      - 'tests/test_audit_research_outcomes.py'
      - 'tests/test_research_audit_git_integration.py'
      - 'tests/test_verify_research_git_first_add.py'
      - '.github/workflows/research-forecast-tests.yml'
  workflow_dispatch:
jobs:
  research-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate research forecast model and persisted records
        run: |\n          python -m unittest -v test_research_model test_research_persistence test_collect_research_daily\n          if [ -f test_research_model_provenance.py ] && [ -f test_research_source_digests.py ]; then\n            python -m unittest -v test_research_model_provenance test_research_source_digests\n          fi
      - name: Verify isolated research auditor fixture gates
        run: python -m unittest discover -s tests -p 'test_*.py' -v
