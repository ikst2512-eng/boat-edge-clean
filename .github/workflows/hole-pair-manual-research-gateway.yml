# Manual research-only capture gateway. Proposed in Draft PR; NOT on main.
# No schedule, repository_dispatch, push, cloud worker, secrets or write token.
# Deliberately pinned to a previously tested immutable research-code commit.
name: Hole pair minimal manual research capture gateway (NONFORMAL)

on:
  pull_request:
    paths:
      - .github/workflows/hole-pair-manual-research-gateway.yml
  workflow_dispatch:
    inputs:
      capture_day_jst:
        description: "Same-day YYYYMMDD JST, Nov 9 2026 or later; past days rejected"
        required: true
        type: string
      confirmation:
        description: "Type CAPTURE_UNVERIFIED_RESEARCH; this is NOT official T-12 evidence"
        required: true
        type: string

permissions:
  contents: read

jobs:
  review_only:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check this PR cannot create candidate artifacts automatically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s = Path(".github/workflows/hole-pair-manual-research-gateway.yml").read_text()
          assert "if: github.event_name == 'workflow_dispatch'" in s
          assert "if: github.event_name == 'pull_request'" in s
          assert "contents: read" in s
          assert "CAPTURE_UNVERIFIED_RESEARCH" in s
          assert "ref: ec83d7254b8703a49a34ce10b343390e6da74f84" in s
          assert "persist-credentials: false" in s
          assert "cancel-in-progress: false" in s
          assert "timeout-minutes: 12" in s
          assert "schedule:" not in s
          assert "repository_dispatch:" not in s
          assert "contents: write" not in s
          assert "pull_request_target" not in s
          print("GATEWAY_REVIEW_PASS_no_capture_from_pr_event")
          PY

  capture_research_only:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    concurrency:
      group: hole-pair-manual-research-${{ inputs.capture_day_jst }}
      cancel-in-progress: false
    steps:
      - name: Require a deliberate manual request for exactly the current JST day
        shell: bash
        env:
          CAPTURE_DAY: ${{ inputs.capture_day_jst }}
          MANUAL_ACK: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$MANUAL_ACK" != "CAPTURE_UNVERIFIED_RESEARCH" ]]; then
            echo "::error::Explicit research-only confirmation is required"; exit 2
          fi
          if [[ ! "$CAPTURE_DAY" =~ ^20[0-9]{6}$ ]]; then
            echo "::error::Invalid YYYYMMDD input"; exit 2
          fi
          DAY_NOW_JST="$(TZ=Asia/Tokyo date +%Y%m%d)"
          if [[ "$CAPTURE_DAY" != "$DAY_NOW_JST" || "$CAPTURE_DAY" < "20261109" ]]; then
            echo "::error::Only the current JST research day from Nov 9 is permitted"; exit 2
          fi

      - name: Checkout only a SHA-pinned candidate selection implementation
        uses: actions/checkout@v4
        with:
          ref: ec83d7254b8703a49a34ce10b343390e6da74f84
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact source pin, then read immutable main source snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ec83d7254b8703a49a34ce10b343390e6da74f84"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git rev-parse --verify origin/main
          test "$(git rev-parse HEAD)" = "ec83d7254b8703a49a34ce10b343390e6da74f84"

      - name: Validate research frozen-candidate code without access to outcomes
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -q research/test_hole_pair_manual_capture.py research/test_hole_pair_universe_coverage.py

      - name: Capture same-day pre-T-minus-12 research candidates only
        shell: bash
        env:
          HOLE_RESEARCH_MANUAL_ACK: ${{ inputs.confirmation }}
          CAPTURE_DAY: ${{ inputs.capture_day_jst }}
        run: |
          set -euo pipefail
          python research/hole_pair_manual_capture.py --capture-day "$CAPTURE_DAY" --output research_candidate_freeze.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research_candidate_freeze.json").read_text())
          assert d["schema"]=="HOLE_PAIR_FUTURE_ACTIONS_BATCH_V1"
          assert d["formal"] is False
          assert d["independent_first_receipt_verified"] is False
          assert d["prospective_validation"] is False
          assert d["production_forecast_changed"] is False
          assert d["source_snapshot_coverage"]["source_snapshot_race_coverage_complete"] is True
          assert d["source_snapshot_coverage"]["entire_day_or_official_schedule_complete_verified"] is False
          print("CAPTURE_UNVERIFIED_only_no_formal_claim")
          PY

      - name: Archive nonformal candidate manifest; NOT an independent first receipt
        uses: actions/upload-artifact@v4
        with:
          name: hole-pair-manual-unverified-${{ github.run_id }}
          path: research_candidate_freeze.json
          if-no-files-found: error
          retention-days: 90
