name: Official odds T12 research gate tests
on:
  pull_request:
    paths:
      - scripts/inspect_official_odds_receipt.py
      - tests/test_inspect_official_odds_receipt.py
      - .github/workflows/official-odds-receipt-gate.yml
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_inspect_official_odds_receipt.py' -v
