name: Hole locked future-period evaluation (research only)
on:
  pull_request:
    paths:
      - hole_future_locked_eval.py
      - hole_future_first_add_audit.py
      - test_hole_future_first_add_audit.py
      - test_hole_future_locked_eval.py
      - test_hole_locked_selector_integrity.py
      - hole_third_choice_research.py
      - hole_pair_diversification_research.py
      - hole_top5_safe_bundle_research.py
      - hole_pair_third_bundle_research.py
      - .github/workflows/hole-future-locked-eval.yml
  workflow_dispatch:
  schedule:
    # 15:15 UTC = 00:15 JST next day, after the complete prior racing day.
    - cron: '15 15 * * *'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce locked future-period safeguards
        run: python -m unittest -v test_hole_future_locked_eval.py test_hole_locked_selector_integrity.py test_hole_future_first_add_audit.py
      - name: Evaluate only 2026-11-04+ frozen predictions and confirmed results
        run: python hole_future_locked_eval.py > hole_future_locked_results.json
      - name: Audit first-add Git blob provenance without claiming remote receipt
        run: python hole_future_first_add_audit.py > hole_future_first_add_results.json
      - name: Fail closed on inconsistent first-add evidence reporting
        run: |
          python - <<'PY'
          import json
          proof=json.load(open("hole_future_first_add_results.json"))
          future=json.load(open("hole_future_locked_results.json"))
          assert proof["formal"] is False
          assert proof["independent_remote_first_receipt_verified"] is False
          assert proof["eligible_for_formal_accuracy"] is False
          assert proof["locked_selector_changed"] is False
          assert proof["production_forecast_changed"] is False
          assert sum(proof["counts"].values())==proof["scanned_forecasts"]
          assert sum(proof["by_day"].values())==proof["scanned_forecasts"]
          if future["status"]!="not_yet_eligible":
              assert set(future["race_codes"]).issubset(
                  {row["race_code"] for row in proof["records"]})
          print("FIRST_ADD_AUDIT_COUNTS",proof["counts"])
          print("FIRST_ADD_EVIDENCE",proof["records"])
          print("REMOTE_FIRST_RECEIPT_PROVEN",False)
          PY
      - name: Print honest results and evidence boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open("hole_future_locked_results.json"))
          assert r["formal"] is False
          if r["status"]=="not_yet_eligible":
              print("STATUS",r["status"])
          else:
              assert r["prospective_validation"] is False
              assert r["independent_first_receipt_verified"] is False
              assert r["candidate_scores_calibrated"] is False
              assert r["production_forecast_changed"] is False
              assert r["first_eligible_jst"]=="2026-11-04"
              assert len(r["locked_selector_git_blobs"])==4
              print("STATUS",r["status"],"COMPARABLE",r["comparable"])
              print("RACES",r["race_codes"])
              print("MISSING",r["excluded_by_reason"])
              print("HITS",r["hits"])
              print("DELTA",r["delta"])
              print("BY_DAY",r["by_day"])
              print("BY_MODEL_VERSION",r["by_model_version"])
              print("EVIDENCE_QUALITY",r["evidence_quality"])
              assert r["evidence_quality"]["independent_remote_first_receipt_proof_present"] is False
              assert r["evidence_quality"]["eligible_for_formal_accuracy"] is False
              assert sum(day["scanned"] for day in r["by_day"].values())==r["scanned_valid_date_codes"]
              assert sum(day["comparable"] for day in r["by_day"].values())==r["comparable"]
              assert sum(version["comparable"] for version in r["by_model_version"].values())==r["comparable"]
              for policy,metrics in r["hits"].items():
                  for metric,value in metrics.items():
                      assert sum(day["hits"][policy][metric] for day in r["by_day"].values())==value
                      assert sum(version["hits"][policy][metric] for version in r["by_model_version"].values())==value
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hole-future-locked-results
          path: |
            hole_future_locked_results.json
            hole_future_first_add_results.json
