name: Research-only all-mode scenario bridge CI

on:
  pull_request:
    paths:
      - 'scenario_four_mode_bridge.py'
      - 'test_scenario_four_mode_bridge.py'
      - 'scenario_first_head_research.py'
      - 'test_scenario_first_head_research.py'
      - 'scenario_feature_effect_probe.py'
      - 'test_scenario_feature_effect_probe.py'
      - 'scenario_official_exhibition_projection.py'
      - 'test_scenario_official_exhibition_projection.py'
      - 'scenario_exhibition_all_mode_runner.py'
      - 'test_scenario_exhibition_all_mode_runner.py'
      - 'scenario_official_pair_research_input.py'
      - 'scenario_actual_pair_four_mode_replay.py'
      - 'test_scenario_official_pair_research_input.py'
      - '.github/workflows/scenario-official-pair-real-inject-once.yml'
      - 'scenario_mode_specific_exhibition_end_to_end.py'
      - 'scenario_archived_rates_ablation.py'
      - 'scenario_future_three_original_gateway.py'
      - 'scenario_future_local_candidate_handoff.py'
      - 'scenario_future_github_research_adapter.py'
      - 'scenario_future_archived_receipts_to_candidate.py'
      - 'test_scenario_future_archived_receipts_to_candidate.py'
      - 'test_scenario_future_github_research_adapter.py'
      - 'test_scenario_future_local_candidate_handoff.py'
      - 'research/four_mode_triple_source_forward_protocol_20261110.json'
      - 'test_scenario_future_protocol_freeze.py'
      - 'scenario_official_racelist_rates.py'
      - 'test_scenario_official_racelist_rates.py'
      - 'test_scenario_future_three_original_gateway.py'
      - 'test_scenario_archived_rates_ablation.py'
      - '.github/workflows/scenario-official-pair-real-inject-once.yml'
      - 'test_scenario_mode_specific_exhibition_end_to_end.py'
      - 'docs/research/scenario_all_mode_bridge_1708.md'
      - '.github/workflows/scenario-four-mode-bridge-pr.yml'

permissions:
  contents: read

jobs:
  scenario-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check scenario bridge safety and all four mode contracts
        run: python -m unittest -v test_scenario_four_mode_bridge test_scenario_first_head_research test_scenario_feature_effect_probe test_scenario_official_exhibition_projection test_scenario_official_pair_research_input test_scenario_archived_rates_ablation test_scenario_future_three_original_gateway test_scenario_official_racelist_rates test_scenario_future_protocol_freeze test_scenario_future_local_candidate_handoff test_scenario_future_github_research_adapter test_scenario_future_archived_receipts_to_candidate
      - name: Materialize pinned existing #1698 conditional lab for integration (read-only)
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin e152b57033f825e02343b004a9c013a8998f9954
          mkdir -p "$RUNNER_TEMP/position1698"
          git show e152b57033f825e02343b004a9c013a8998f9954:position_sensitive_conditioned_lab.py > "$RUNNER_TEMP/position1698/position_sensitive_conditioned_lab.py"
          test "$(git hash-object "$RUNNER_TEMP/position1698/position_sensitive_conditioned_lab.py")" = "0019978a4e27a1235d0b466c11f514bd7105f261"
      - name: Confirm reused #1693 raw semantic replayer has EXACT reviewed code identity
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin d93349e4855d6dc1026dfad1795a99632d7e9a35
          mkdir -p "$RUNNER_TEMP/semantic1693"
          git show d93349e4855d6dc1026dfad1795a99632d7e9a35:four_mode_official_raw_semantic_replay.py > "$RUNNER_TEMP/semantic1693/four_mode_official_raw_semantic_replay.py"
          test "$(git hash-object "$RUNNER_TEMP/semantic1693/four_mode_official_raw_semantic_replay.py")" = "2f5af32201e3060c57b5a999f0389ce67c3046cb"
          git show d93349e4855d6dc1026dfad1795a99632d7e9a35:four_mode_official_future_lineage_preflight.py > "$RUNNER_TEMP/semantic1693/four_mode_official_future_lineage_preflight.py"
          test "$(git hash-object "$RUNNER_TEMP/semantic1693/four_mode_official_future_lineage_preflight.py")" = "88caa6ee3b324df58e60397d74055a075a8de6a9"
      - name: Verify source bridge rejects two REAL incomplete triple archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/13749433042/zip" \
            --output "$RUNNER_TEMP/real-triple-incomplete-bridge.zip"
          echo "7eddf4704635613f7d8cb18a03f07bcc1f9037efafb52ee26a3723b333a30354  $RUNNER_TEMP/real-triple-incomplete-bridge.zip" | sha256sum --check --status
          python - <<'PY'
          import json,os
          from pathlib import Path
          from zipfile import ZipFile
          from scenario_future_archived_receipts_to_candidate import build_archive_bundle
          from scripts.audit_three_official_t12_originals import audit_three_originals
          tmp=Path(os.environ["RUNNER_TEMP"])
          unpack=tmp/"real-triple-incomplete-bridge"
          with ZipFile(tmp/"real-triple-incomplete-bridge.zip") as zipped:
              assert zipped.testzip() is None
              names=zipped.namelist()
              assert len(names)==len(set(names))==28
              assert all(not p.startswith("/") and ".." not in Path(p).parts
                         for p in names)
              zipped.extractall(unpack)
          count=0
          for race in ("202611101207","202611100708"):
              base=unpack/"official_joint_evidence"/"observations"
              day=race[:8]
              dirs=[base/(kind+"_run42786724704")/day/race
                    for kind in ("card","before","odds")]
              audit=audit_three_originals(*dirs)
              assert audit["three_originals_hash_verified"] is True
              assert audit["all_research_components_observed_by_t12"] is False
              assert audit["missing_components"]
              called=[]
              def forbidden_parser(*args):
                  called.append("unexpected-parser")
                  raise AssertionError("source bridge must reject before math")
              try:
                  build_archive_bundle(
                      *dirs,"2026-11-11T15:07:00+09:00",
                      before_parser=forbidden_parser)
              except ValueError as exc:
                  assert str(exc)=="three_official_T12_originals_incomplete",str(exc)
              else:
                  raise AssertionError("REAL_INCOMPLETE_SOURCE_GENERATED_CANDIDATE")
              assert not called
              count+=1
          assert count==2
          print(json.dumps({
              "real_archives_preflight_rejected":count,
              "same_race_raw_original_hashes_verified":True,
              "new_four_mode_candidate_generated":0,
              "independent_remote_first_receipt_verified":False,
              "formal":False,
          },sort_keys=True))
          PY
      - name: Confirm all-mode scenario composition uses actual reviewed #1698 conditional math
        env:
          RESEARCH_1698_PIN_REQUIRED: '1'
        run: PYTHONPATH="$RUNNER_TEMP/position1698:$PWD" python -m unittest -v test_scenario_exhibition_all_mode_runner test_scenario_mode_specific_exhibition_end_to_end test_scenario_future_three_original_gateway test_scenario_future_archived_receipts_to_candidate
