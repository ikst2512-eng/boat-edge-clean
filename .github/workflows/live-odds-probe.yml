name: Live odds API probe
on:
  workflow_dispatch:
    inputs:
      hd:
        description: 'Race date JST (YYYYMMDD); use a date with publicly available odds'
        required: true
        type: string
      jcd:
        description: 'Venue code (01-24)'
        required: true
        type: string
      rno:
        description: 'Race number (1-12)'
        required: true
        type: string
  push:
    paths:
      - '.github/workflows/live-odds-probe.yml'
jobs:
  probe:
    # Push validates configuration only; live odds require explicitly selected, available race.
    runs-on: ubuntu-latest
    steps:
      - name: Validate probe configuration
        shell: bash
        env:
          HD: ${{ inputs.hd }}
          JCD: ${{ inputs.jcd }}
          RNO: ${{ inputs.rno }}
        run: |
          python3 - <<'PY'
          import os,re
          from datetime import datetime
          if os.environ.get('GITHUB_EVENT_NAME')=='push':
              print('CONFIG_PASS: live odds requires explicit race selection; no stale historical request')
          else:
              hd,jcd,rno=(os.environ[k] for k in ('HD','JCD','RNO'))
              assert re.fullmatch(r'20[0-9]{6}',hd), 'invalid hd format'
              datetime.strptime(hd,'%Y%m%d')
              assert re.fullmatch(r'[0-9]{2}',jcd) and 1<=int(jcd)<=24, 'invalid jcd'
              assert re.fullmatch(r'[1-9]|1[0-2]',rno), 'invalid rno'
              print('RACE_SELECTION_VALIDATED',hd,jcd,rno)
          PY
      - name: Probe live health and 120 odds
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          HD: ${{ inputs.hd }}
          JCD: ${{ inputs.jcd }}
          RNO: ${{ inputs.rno }}
        run: |
          set -euo pipefail
          base=https://boat-edge-clean.onrender.com
          # Render's cold-start splash returns 503. Retry only that state.
          health_status=503
          for attempt in $(seq 1 12); do
            health_status=$(curl --silent --show-error --location --max-time 25 -o /tmp/health -w '%{http_code}' "$base/healthz")
            if [ "$health_status" != 503 ]; then break; fi
            echo "Render waking: attempt $attempt HTTP 503"
            sleep 6
          done
          echo "health_http=$health_status"
          cat /tmp/health; echo
          test "$health_status" = 200 || { echo 'Health endpoint unhealthy'; exit 1; }
          odds_status=$(curl --silent --show-error --location --max-time 50 -G -o /tmp/odds.json -w '%{http_code}' "$base/api/odds" --data-urlencode "hd=$HD" --data-urlencode "jcd=$JCD" --data-urlencode "rno=$RNO")
          echo "odds_http=$odds_status"
          if [ "$odds_status" != 200 ]; then
            echo 'Odds API did not return data for selected race; this is not a successful live odds check.'
            head -c 500 /tmp/odds.json; echo
            exit 1
          fi
          python3 - <<'PY'
          import json
          from itertools import permutations
          from datetime import datetime,timezone
          data=json.load(open('/tmp/odds.json'))
          assert data.get('ok') is True, data.get('message')
          odds=data['odds']
          expected={'-'.join(map(str,p)) for p in permutations(range(1,7),3)}
          assert set(odds)==expected, f'Expected all 120 triples; got {len(odds)}'
          assert all(isinstance(v,(int,float)) and not isinstance(v,bool) and 1<=v<=1000000 for v in odds.values())
          stamp=data.get('fetched_at')
          assert isinstance(stamp,str) and stamp.endswith('+00:00'), 'missing UTC fetch timestamp'
          fetched=datetime.fromisoformat(stamp)
          age=(datetime.now(timezone.utc)-fetched).total_seconds()
          assert -30<=age<=120, f'odds response is stale or future-dated: age={age:.0f}s'
          print(f'LIVE_ODDS_PASS: 120 real trifecta odds; fetched_at={stamp}; age={age:.0f}s')
          PY
