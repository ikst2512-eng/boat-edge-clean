name: AI repair proposal (manual and review-gated)
on:
  pull_request:
    paths:
      - ai_repair_agent.py
      - test_ai_repair_agent.py
      - .github/workflows/ai-repair-proposal.yml
  schedule:
    - cron: '17 20 * * *' # 05:17 JST; only actual regression failures launch repair proposals
  workflow_dispatch:
    inputs:
      issue:
        description: '具体的なUI/ナビゲーション不具合。予想ロジック変更は禁止'
        required: true
        type: string
permissions:
  contents: read
jobs:
  tests:
    outputs:
      regression_failed: ${{ steps.regression.outputs.failed }}
      regression_issue: ${{ steps.regression.outputs.issue }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_ai_repair_agent
      - name: Detect actual UI regression (scheduled only, without AI key)
        if: github.event_name == 'schedule'
        id: regression
        shell: bash
        run: |
          python - <<'PY'
          import os,subprocess
          commands=[["python","-m","unittest","-v","tests.test_navigation_contract"],
                    ["node","tests/site-regression.cjs"]]
          failures=[]
          for cmd in commands:
              try:
                  proc=subprocess.run(cmd,capture_output=True,text=True,timeout=90)
                  if proc.returncode:
                      failures.append(" ".join(cmd)+" returned nonzero exit code")
              except subprocess.TimeoutExpired:
                  failures.append(" ".join(cmd)+": timed out")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as output:
              output.write("failed="+("true" if failures else "false")+"\n")
              output.write("issue="+("UI regression found: "+" | ".join(failures)[:650] if failures else "none")+"\n")
          print("UI regression failures:",len(failures))
          if failures:
              print("Failure identities only; no untrusted test output is sent to AI.")
          PY
  propose:
    needs: tests
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && needs.tests.outputs.regression_failed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test patch guardrails
        run: python -m unittest -v test_ai_repair_agent
      - name: Skip scheduled AI request when key is absent
        if: github.event_name == 'schedule'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::Regression detected, but OPENAI_API_KEY is missing; cannot create AI repair proposal."
            exit 1
          fi
      - name: Require configured AI credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is not configured in GitHub Actions secrets. No AI request was made."
            exit 1
          fi
          echo "OpenAI API credential is present (value is never printed)."
      - name: Request a small AI UI repair (optional API)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          AI_ISSUE: ${{ github.event_name == 'schedule' && needs.tests.outputs.regression_issue || inputs.issue }}
        run: python ai_repair_agent.py --issue "$AI_ISSUE"
      - name: Validate untrusted AI patch without write token
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          report=json.load(open('ai_repair_proposal.json'))
          if report['status'] == 'disabled':
              print('API key absent: no repair attempted')
          PY
          if git diff --quiet; then
            echo 'No safe patch proposed'
            exit 0
          fi
          # AI has no permission to modify CI, workflow, model or data files.
          git diff --name-only > /tmp/ai_changed_files
          while IFS= read -r path; do
            case "$path" in
              index.html|navigation.js|secondary_navigation.js) ;;
              *) echo "Unexpected changed file $path" >&2; exit 1 ;;
            esac
          done < /tmp/ai_changed_files
          python -m unittest -v tests.test_navigation_contract
          node tests/site-regression.cjs
          git diff --check
      - name: Publish reviewed-by-CI patch as draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          AI_ISSUE: ${{ inputs.issue }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then echo 'No repair to publish'; exit 0; fi
          branch="ai/repair-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html navigation.js secondary_navigation.js
          git commit -m "AI: propose narrow UI repair for review"
          gh auth setup-git
          git push origin "HEAD:$branch"
          gh pr create --draft --base main --head "$branch" --title "AI proposed UI repair (manual review required)" --body "AI-generated, untrusted code suggestion. Issue: ${AI_ISSUE}. Tests executed: navigation contract and site regression. **No automatic merge, deploy, or model changes.** Review patch and CI before approval."
      - name: Archive proposal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-repair-proposal-${{ github.run_id }}
          path: ai_repair_proposal.json
          if-no-files-found: warn
          retention-days: 30
