name: CLEAN regression checks
on:
  push:
    paths:
      - index.html
      - tests/site-regression.cjs
      - official_prerace_capture.py
      - test_official_prerace_capture.py
      - official_beforeinfo_inspect.py
      - test_official_beforeinfo_inspect.py
      - run_official_prerace_probe.py
      - test_official_probe_runner.py
      - .github/workflows/official-prerace-probe.yml
      - .github/workflows/site-regression.yml
  workflow_dispatch:
  pull_request:
    paths:
      - index.html
      - tests/site-regression.cjs
      - official_prerace_capture.py
      - test_official_prerace_capture.py
      - official_beforeinfo_inspect.py
      - test_official_beforeinfo_inspect.py
      - run_official_prerace_probe.py
      - test_official_probe_runner.py
      - .github/workflows/official-prerace-probe.yml
      - .github/workflows/site-regression.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression suite and capture log
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          printf 'Commit: %s\nWorkflow run: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" | tee test-results/provenance.txt
          node tests/site-regression.cjs 2>&1 | tee test-results/site-regression.log
      - name: Verify isolated official pre-race capture
        run: python3 -m unittest -v test_official_prerace_capture test_official_beforeinfo_inspect test_official_probe_runner
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-regression-${{ github.run_id }}
          path: test-results/
          if-no-files-found: error
          retention-days: 30
      - name: Record successful verification
        if: success()
        run: |
          echo '## BOAT EDGE CLEAN regression' >> "$GITHUB_STEP_SUMMARY"
          echo '- Node.js 22 test execution: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Command: `node tests/site-regression.cjs`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Scope: static validation and stored fixtures; not live-browser or Git-first-add proof' >> "$GITHUB_STEP_SUMMARY"
