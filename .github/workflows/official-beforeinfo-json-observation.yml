name: Official beforeinfo JSON observation (research only)
on:
  workflow_dispatch:
    inputs:
      race_code:
        description: '12-digit YYYYMMDDVVRR'
        required: true
        type: string
      attempts:
        description: 'Observations 1-3, 60 seconds apart'
        required: true
        type: choice
        default: '2'
        options: ['1','2','3']
  pull_request:
    paths:
      - '.github/workflows/official-beforeinfo-json-observation.yml'
      - 'scripts/capture_official_beforeinfo_json.py'
      - 'tests/test_capture_official_beforeinfo_json.py'
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify fail-closed collector tests
        run: |
          python -m unittest discover -s tests -p 'test_capture_official_beforeinfo_json.py' -v
          python -m unittest discover -s tests -p 'test_inspect_official_beforeinfo_json.py' -v
      - name: Observe official JSON at actual receipt times
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          RACE_CODE: ${{ inputs.race_code }}
          ATTEMPTS: ${{ inputs.attempts }}
        run: |
          set -euo pipefail
          [[ "$RACE_CODE" =~ ^20[0-9]{10}$ ]] || exit 1
          [[ "$ATTEMPTS" =~ ^[123]$ ]] || exit 1
          mkdir -p reports
          for ((i=1;i<=ATTEMPTS;i++)); do
            python -m scripts.capture_official_beforeinfo_json "$RACE_CODE" --root official_json_observations --observation-id "run${GITHUB_RUN_ID}_attempt${i}" > "reports/attempt${i}.json" || true
            if [[ "$i" -lt "$ATTEMPTS" ]]; then sleep 60; fi
          done
      - name: Report actual evidence status, reject all-failed runs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          reports=[json.loads(p.read_text()) for p in sorted(Path('reports').glob('*.json'))]
          good=[x for x in reports if x.get('status')=='official_json_observed_not_t12_certified']
          lines=['### Official JSON observations',f'- Attempts: {len(reports)}',
                 f'- Saved source JSON: {len(good)}',
                 f'- Full exhibition: {sum(bool(x.get("exhibition_time_nonempty_six")) for x in good)}',
                 '- T-12 certified: no','- Forecast usable: no']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(chr(10).join(lines)+chr(10))
          if not good:raise SystemExit('No source JSON acquired; evidence absent')
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        with:
          name: official-json-observation-${{ github.run_id }}
          path: |
            reports/
            official_json_observations/
          retention-days: 14
