name: Legacy Action references read-only audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/audit_legacy_action_references.py
      - tests/test_audit_legacy_action_references.py
      - .github/workflows/legacy-action-references.yml
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v tests/test_audit_legacy_action_references.py
      - run: python scripts/audit_legacy_action_references.py
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-action-references
          path: legacy_action_references.json
          retention-days: 90
