name: Archived research Top-N evidence audit
on:
  pull_request:
    paths:
      - 'scripts/audit_research_topn.py'
      - '.github/workflows/research-topn-evidence-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/audit_research_topn.py
