name: Fresh snapshot arrival witness
# This workflow's GitHub-issued created_at is the independent arrival marker.
# It deliberately NEVER generates forecasts or reads results.
on:
  push:
    branches: [main]
    paths:
      - 'fresh_snapshots/**'
  workflow_dispatch:
jobs:
  witness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable snapshot files in pushed commit
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, re, hashlib
          paths = list(pathlib.Path("fresh_snapshots").glob("*.json"))
          if not paths:
              raise SystemExit("No immutable snapshots in commit")
          for path in paths:
              if not re.fullmatch(r"[0-9]{12}\.json", path.name):
                  raise SystemExit("Invalid race filename")
              body = json.loads(path.read_bytes())
              if body.get("race_code") != path.stem or body.get("validated") is not True:
                  raise SystemExit("Invalid race identity or status")
              print(path, hashlib.sha256(path.read_bytes()).hexdigest())
          PY
