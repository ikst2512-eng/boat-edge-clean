              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              const target=new URL('candidates.html?date=2026-11-08',process.env.PAGE_URL).href;
              const response=await page.goto(target,{waitUntil:'domcontentloaded',timeout:30000});
              if(!response||response.status()!==200)throw Error('candidate_page_http_'+response?.status());
              await page.waitForFunction(()=>{
                const value=document.querySelector('#candidateStatus')?.textContent||'';
