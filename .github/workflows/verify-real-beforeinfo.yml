      # Use the existing 19:35 gate and the same runner; don't add Cron or
      # confuse a diagnostic artifact with the official upstream originals.
      - name: Preserve real-source E2E decision and actual Render revision
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: official-live-e2e-decision-${{ github.run_id }}
          path: clean-live-official-pages-evidence.ndjson
          # Missing run-specific proof is a broken audit, not a green success.
          if-no-files-found: error
          retention-days: 90
