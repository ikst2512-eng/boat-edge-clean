<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c2340"><title>BOAT EDGE CLEAN｜全国24場</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#162942;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}header{background:#0b2342;color:white;padding:18px 14px}main,header>div{max-width:900px;margin:auto}main{padding:15px}.logo{font-size:23px;font-weight:900}header small{color:#bacde3}.box{background:white;border:1px solid #dce4ee;border-radius:13px;padding:15px;margin-bottom:14px}h1{font-size:20px;margin:0 0 12px}h2{font-size:18px;margin:0 0 12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid button{text-align:left;padding:13px 11px;min-height:48px;font-size:15px}.races{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}button{background:white;color:#174066;border:1px solid #cbd9e8;border-radius:9px;padding:12px 4px;font-weight:700;cursor:pointer}button.on{background:#155eae;border-color:#155eae;color:white}button:focus-visible{outline:3px solid #7ab8ff}input{border:1px solid #cbd9e8;border-radius:8px;padding:10px;font-size:16px}.muted{font-size:12px;color:#65788e}.chosen{background:#eaf3fd;padding:13px;border-radius:9px;margin-bottom:12px;font-weight:700}.link{display:inline-block;background:#165eac;color:white;text-decoration:none;border-radius:9px;padding:13px 17px;font-weight:700}footer{text-align:center;font-size:12px;color:#7a889a;padding:20px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.races{grid-template-columns:repeat(12,1fr)}}@media(max-width:340px){.grid{grid-template-columns:repeat(2,1fr)}}.prediction-tabs{display:flex;gap:8px;margin-bottom:14px}.prediction-tabs button{flex:1}.prediction-rows{display:grid;gap:8px}.prediction-row{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:9px;background:#edf5ff;border:1px solid #d4e5f7}.prediction-rank{font-size:12px;color:#56718e}.prediction-ticket{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}.source-meta{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0}.source-chip{padding:5px 9px;border:1px solid #d5e2ee;background:#f6f9fd;border-radius:20px;font-size:12px}.prediction-row{border-left:5px solid #145aa0}.prediction-odds{font-size:12px;color:#405f7e;text-align:right;max-width:170px;line-height:1.7}.ticket-boats{display:flex;align-items:center;gap:5px;margin-top:4px}.boat-num{display:inline-grid;place-items:center;width:29px;height:29px;border-radius:6px;font-size:16px;font-weight:800;border:1px solid #bac7d4}.boat-1{background:#fff;color:#172a3d}.boat-2{background:#202b3b;color:#fff}.boat-3{background:#df4147;color:#fff}.boat-4{background:#2478cf;color:#fff}.boat-5{background:#e8cc3a;color:#1b2633}.boat-6{background:#29925a;color:#fff}.ticket-arrow{font-size:13px;color:#71829a}header{padding:13px 14px;background:#fff;color:#172c46;border-bottom:3px solid #1463ad;box-shadow:0 2px 10px #0b244010}header small{color:#61748c}header .logo{font-size:21px;letter-spacing:.025em}header .logo span{color:#1463ad!important}main{max-width:1040px;padding:12px 10px}.box{padding:14px 12px;margin-bottom:10px;border-radius:8px;border-color:#dce3ed;box-shadow:0 1px 2px #20334b0a}.box h1,.box h2{font-size:16px;color:#182d47;margin:0 0 12px;border-left:4px solid #1666ad;padding-left:9px}.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}.grid button{font-size:12px;min-height:38px;padding:7px 2px;text-align:center;border-radius:5px;white-space:nowrap}.races{gap:4px}.races button{min-height:40px;padding:7px 2px;border-radius:5px}.row{gap:6px}.row button{padding:10px 12px}.chosen{background:#123b66;color:#fff;border-radius:5px;font-size:17px;padding:12px;margin-bottom:8px}.prediction-tabs{gap:4px;margin:10px 0}.prediction-tabs button{border-radius:5px;background:#eef3f8}.prediction-tabs button.on{background:#1669b9;color:#fff}.prediction-row{background:#fff;border:1px solid #dce5ef;border-left:5px solid #1669b9;border-radius:5px;padding:12px 10px}.prediction-rank{font-size:11px;font-weight:700;color:#677e96}.prediction-ticket{font-size:21px;letter-spacing:.04em}.source-chip{border-radius:4px}.prediction-rows{gap:5px}#forecast{border-top:4px solid #1669b9}#retryPrediction{margin-top:12px;padding:9px 15px;border-color:#96b8d7;color:#165f9c}footer{padding:12px}.muted{line-height:1.5}@media(min-width:700px){.grid{grid-template-columns:repeat(8,minmax(0,1fr))}.races{grid-template-columns:repeat(12,1fr)}.grid button{font-size:13px}}@media(max-width:370px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.prediction-ticket{font-size:18px}}</style></head><body><header><div><div class="logo">BOAT EDGE <span style="color:#6bc8ff">CLEAN</span></div><small>全国24場から選べるボートレース情報</small></div></header><main><section class="box"><h1>開催日・レース場</h1><div class="row"><button id="prev">前日</button><input type="date" id="day" aria-label="開催日"><button id="today">今日</button><button id="next">翌日</button></div><div class="grid" id="venues"></div></section><section class="box"><h2 id="raceTitle">レース選択</h2><div class="races" id="races"></div></section><section class="box"><h2>公式レース情報</h2><div class="row"><a class="link" id="officialCard" target="_blank" rel="noopener noreferrer">公式 出走表 ↗</a><a class="link" id="officialPreview" target="_blank" rel="noopener noreferrer">公式 直前情報 ↗</a></div><p class="muted">出走表・展示はBOATRACE公式で確認。予想欄はBOAT EDGEの保存済みモデル値のみ表示。</p></section><section class="box" id="forecast"><h2>BOAT EDGE 3連単予想 <span class="muted">保存済み10候補内のモデル確率順</span></h2><p id="raceMeta" class="chosen" aria-live="polite"></p><p id="snapshotMeta" class="muted"></p><div id="sourceMeta" class="source-meta" aria-live="polite"></div><div class="prediction-tabs" role="group" aria-label="予想点数"><button type="button" data-top="3" class="on">Top3</button><button type="button" data-top="5">Top5</button><button type="button" data-top="10">Top10</button></div><p id="predictionStatus" class="muted" role="status">選択したレースの予想データを確認中…</p><div id="predictionRows" class="prediction-rows"></div><button type="button" id="retryPrediction">再読み込み</button></section></main><footer>BOAT EDGE CLEAN｜保存原本・初回記録照合</footer><script>const names=['桐生','戸田','江戸川','平和島','多摩川','浜名湖','蒲郡','常滑','津','三国','びわこ','住之江','尼崎','鳴門','丸亀','児島','宮島','徳山','下関','若松','芦屋','福岡','唐津','大村'];const s={date:'',venue:0,race:1};const p=x=>String(x).padStart(2,'0'),fmt=d=>[d.getFullYear(),p(d.getMonth()+1),p(d.getDate())].join('-');function jst(){return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Tokyo'}))}s.date=fmt(jst());const params=new URLSearchParams(location.search);const qday=params.get('date'),qvenue=Number(params.get('venue')),qrace=Number(params.get('race'));if(qday&&/^\d{4}-\d{2}-\d{2}$/.test(qday)&&Number.isFinite(Date.parse(qday+'T12:00:00')))s.date=qday;if(params.has('venue')&&Number.isInteger(qvenue)&&qvenue>=1&&qvenue<=24)s.venue=qvenue-1;if(params.has('race')&&Number.isInteger(qrace)&&qrace>=1&&qrace<=12)s.race=qrace;const day=document.getElementById('day'),vb=document.getElementById('venues'),rb=document.getElementById('races');names.forEach((n,i)=>{let b=document.createElement('button');b.textContent=p(i+1)+'　'+n;b.addEventListener('click',()=>{s.venue=i;s.race=1;render()});vb.append(b)});for(let i=1;i<=12;i++){let b=document.createElement('button');b.textContent=i+'R';b.addEventListener('click',()=>{s.race=i;render()});rb.append(b)}function render(){day.value=s.date;[...vb.children].forEach((b,i)=>{b.classList.toggle('on',s.venue===i);b.setAttribute('aria-pressed',s.venue===i)});[...rb.children].forEach((b,i)=>{b.classList.toggle('on',s.race===i+1);b.setAttribute('aria-pressed',s.race===i+1)});document.getElementById('raceTitle').textContent=names[s.venue]+' のレース';document.getElementById('raceMeta').textContent=s.date+'　'+names[s.venue]+'　'+s.race+'R';const officialArgs='?rno='+s.race+'&jcd='+p(s.venue+1)+'&hd='+s.date.replaceAll('-','');document.getElementById('officialCard').href='https://www.boatrace.jp/owpc/pc/race/racelist'+officialArgs;document.getElementById('officialPreview').href='https://www.boatrace.jp/owpc/pc/race/beforeinfo'+officialArgs;loadPredictions()}day.addEventListener('change',()=>{if(/^\d{4}-\d{2}-\d{2}$/.test(day.value)){s.date=day.value;render()}});for(let [id,n] of [['prev',-1],['next',1]])document.getElementById(id).addEventListener('click',()=>{let d=new Date(s.date+'T12:00:00');d.setDate(d.getDate()+n);s.date=fmt(d);render()});document.getElementById('today').addEventListener('click',()=>{s.date=fmt(jst());render()});let predictionTickets=[],selectedTop=3,predictionOdds={},predictionProbabilities={};document.querySelectorAll('[data-top]').forEach(button=>button.addEventListener('click',()=>{selectedTop=Number(button.dataset.top);document.querySelectorAll('[data-top]').forEach(b=>b.classList.toggle('on',b===button));drawPredictions()}));function drawPredictions(){const root=document.getElementById('predictionRows');root.replaceChildren();predictionTickets.slice(0,selectedTop).forEach((ticket,index)=>{const row=document.createElement('div');row.className='prediction-row';const left=document.createElement('div');const rank=document.createElement('div');rank.className='prediction-rank';rank.textContent='予想 '+(index+1)+'位';const combo=document.createElement('div');combo.className='prediction-ticket';combo.textContent=ticket;const colored=document.createElement('div');colored.className='ticket-boats';ticket.split('-').forEach((num,i)=>{if(i){const arrow=document.createElement('span');arrow.className='ticket-arrow';arrow.textContent='›';colored.append(arrow)}const boat=document.createElement('span');boat.className='boat-num boat-'+num;boat.textContent=num;colored.append(boat)});left.append(rank,combo,colored);const odds=document.createElement('div');odds.className='prediction-odds';odds.textContent=(Number.isFinite(predictionProbabilities[ticket])?'保存モデル値 '+predictionProbabilities[ticket].toFixed(2)+'%':'')+(Number.isFinite(predictionOdds[ticket])?'｜保存時オッズ '+predictionOdds[ticket].toLocaleString('ja-JP')+'倍':'');row.append(left,odds);root.append(row)})}const validTicket=t=>typeof t==='string'&&/^[1-6]-[1-6]-[1-6]$/.test(t)&&new Set(t.split('-')).size===3;
function verifiedTicketArray(a){return Array.isArray(a)&&a.length===10&&a.every(validTicket)&&new Set(a).size===10}
document.getElementById('retryPrediction').addEventListener('click',()=>loadPredictions(true));
const EDGE_BASE='https://api.github.com/repos/ikst2512-eng/boat-edge';
const EDGE_RAW='https://raw.githubusercontent.com/ikst2512-eng/boat-edge';
async function edgeJson(url){const r=await fetch(url,{cache:'no-store',headers:{'Accept':'application/vnd.github+json'}});if(!r.ok)throw Error('SOURCE_HTTP_'+r.status);return r.json()}
function sameRaceKey(){return s.date.replaceAll('-','')+'-'+p(s.venue+1)+'-'+p(s.race)}
const verifiedCache=new Map();
async function verifiedStoredPrediction(key,force=false){
 if(!force&&verifiedCache.has(key))return verifiedCache.get(key);
 const path='data/site_prediction_snapshots/'+key+'.json';
 const currentRes=await fetch(EDGE_RAW+'/main/'+path,{cache:'no-store'});
 if(currentRes.status===404)throw Error('PREDICTION_NOT_PUBLISHED');
 if(!currentRes.ok)throw Error('SOURCE_HTTP_'+currentRes.status);
 const currentText=await currentRes.text();
 let commits=[],page=1;
 for(;page<=10;page++){
  const batch=await edgeJson(EDGE_BASE+'/commits?path='+encodeURIComponent(path)+'&per_page=100&page='+page);
  if(!Array.isArray(batch))throw Error('FIRST_COMMIT_UNCONFIRMED');
  commits=commits.concat(batch);
  if(batch.length<100)break;
 }
 if(!commits.length||page>10)throw Error('FIRST_COMMIT_UNCONFIRMED');
 const earliest=commits[commits.length-1];
 const commit=await edgeJson(EDGE_BASE+'/commits/'+encodeURIComponent(earliest.sha));
 const file=commit.files&&commit.files.find(f=>f.filename===path);
 if(!file||file.status!=='added')throw Error('FIRST_ADD_UNCONFIRMED');
 const firstRes=await fetch(EDGE_RAW+'/'+earliest.sha+'/'+path,{cache:'no-store'});
 if(!firstRes.ok)throw Error('SOURCE_HTTP_'+firstRes.status);
 const firstText=await firstRes.text();
 if(firstText!==currentText)throw Error('SNAPSHOT_CHANGED_SINCE_FIRST_ADD');
 const raw=JSON.parse(firstText);
 if(raw.race_key!==key||raw.schema_version!=='boat-edge-server-site-final-v123'||raw.prediction_kind!=='SITE_REFERENCE_V122'||raw.venue_code!==key.split('-')[1]||Number(raw.race_no)!==Number(key.split('-')[2]))throw Error('RACE_OR_MODEL_MISMATCH');
 if(raw.guards?.results_seen!==false||raw.guards?.unlock!==false||raw.guards?.scoring!==false)throw Error('UNSAFE_SOURCE');
 if(!/^[a-f0-9]{64}$/.test(raw.race_sha256)||!/^[a-f0-9]{64}$/.test(raw.odds_sha256))throw Error('SOURCE_SHA_INVALID');
 if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(raw.deadline))throw Error('DEADLINE_INVALID');
 const limit=Date.parse(key.slice(0,4)+'-'+key.slice(4,6)+'-'+key.slice(6,8)+'T'+raw.deadline+':00+09:00'),saved=Date.parse(raw.first_saved_at),added=Date.parse(commit.commit?.committer?.date);
 if(![limit,saved,added].every(Number.isFinite)||saved>added||added>=limit||limit-saved<120000||limit-saved>600000||limit-added<120000||limit-added>600000)throw Error('FREEZE_TIME_NOT_PROVEN');
 const mode=raw.default_display_mode;
 if(mode!=='tail'||!verifiedTicketArray(raw.modes?.[mode]?.tickets?.map(t=>t.combo)))throw Error('PREDICTIONS_INVALID');
 if(raw.modes[mode].tickets.some(t=>!Number.isFinite(t.p)||t.p<0||t.p>100))throw Error('PREDICTION_SCORE_INVALID');
 if(raw.modes[mode].tickets.some(t=>t.odds!==undefined&&(!Number.isFinite(t.odds)||t.odds<=0)))throw Error('ODDS_INVALID');
 if(raw.modes[mode].tickets.some(t=>t.stake_yen!==undefined&&(!Number.isInteger(t.stake_yen)||t.stake_yen<0)))throw Error('STAKE_INVALID');
 const ordered=raw.modes[mode].tickets.slice().sort((a,b)=>b.p-a.p);
 const tickets=ordered.map(t=>t.combo);
 const verified={tickets,probabilities:Object.fromEntries(ordered.map(t=>[t.combo,t.p])),odds:Object.fromEntries(ordered.filter(t=>Number.isFinite(t.odds)&&t.odds>0).map(t=>[t.combo,t.odds])),deadline:raw.deadline,grade:raw.grade,confidence:raw.modes[mode].confidence,version:raw.prediction_kind+' / '+raw.mode_policy,created:raw.first_saved_at,inputs:Array.isArray(raw.used_inputs)?raw.used_inputs.filter(v=>typeof v==='string'&&v.length<70):[],proof:earliest.sha.slice(0,12)};
 verifiedCache.set(key,verified);
 return verified;
}
async function loadPredictions(force=false){
 const token=(window.predictionRequestId||0)+1;window.predictionRequestId=token;
 predictionTickets=[];predictionOdds={};predictionProbabilities={};document.getElementById('snapshotMeta').textContent='';document.getElementById('sourceMeta').replaceChildren();drawPredictions();
 const label=document.getElementById('predictionStatus');
 label.textContent='既存モデルの保存予想と初回Git記録を照合中…';
 const key=sameRaceKey();
 try{
  const confirmed=await verifiedStoredPrediction(key,force);
  if(token!==window.predictionRequestId||sameRaceKey()!==key)return;
  predictionTickets=confirmed.tickets;predictionOdds=confirmed.odds;predictionProbabilities=confirmed.probabilities;const sources=document.getElementById('sourceMeta');const prefix=document.createElement('span');prefix.className='source-chip';prefix.textContent='保存予想の使用情報';sources.append(prefix);confirmed.inputs.forEach(v=>{const chip=document.createElement('span');chip.className='source-chip';chip.textContent=v;sources.append(chip)});document.getElementById('snapshotMeta').textContent='締切 '+confirmed.deadline+'｜評価 '+(confirmed.grade||'未記録')+'｜モデル内指標 '+(Number.isFinite(confirmed.confidence)?confirmed.confidence:'未記録')+'（的中率の保証ではありません）｜オッズは保存時点';
  label.textContent='保存予想（初回Git記録照合済）｜'+confirmed.version+'｜保存 '+new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(confirmed.created))+' JST｜根拠 '+confirmed.proof;
  drawPredictions();
 }catch(e){
  if(token!==window.predictionRequestId||sameRaceKey()!==key)return;
  const reason=e instanceof Error?e.message:'';
  label.textContent=reason==='SOURCE_HTTP_403'||reason==='SOURCE_HTTP_429'?'データ取得制限のため確認できません。再読み込みをお試しください。':reason==='PREDICTION_NOT_PUBLISHED'?'このレースの保存予想はまだ公開されていません。':reason==='SOURCE_HTTP_404'?'初回保存原本を取得できません。':reason.startsWith('SOURCE_HTTP_')||reason==='SNAPSHOT_UNAVAILABLE'?'通信または配信元の応答に問題があります。再読み込みをお試しください。':'保存原本・初回保存記録を確認できないため、買い目を表示しません。';
 }
};render();</script></body></html>
