name: Research TopN batch audit
on:
  schedule:
    - cron: '25 13 * * *' # 22:25 JST daily; catches GITHUB_TOKEN bot commits
  push:
    branches: [main]
    paths:
      - 'research_snapshots/**'
      - 'confirmed_results/**'
  pull_request:
    paths:
      - 'scripts/research_topn_batch_audit.py'
      - 'scripts/research_selective_top10_backtest.py'
      - 'scripts/research_prerace_feature_audit.py'
      - 'tests/test_research_mass_cohort_audit.py'
      - 'research_model.py'
      - 'collect_research_daily.py'
      - 'tests/test_daily_research_mass_contract.py'
      - 'tests/test_daily_research_written_mass.py'
      - 'scripts/select_upcoming_research_race.py'
      - 'tests/test_scheduled_research_selector.py'
      - 'tests/test_research_topn_mass_contract.py'
      - 'tests/test_snapshot_persistence_workflow.py'
      - 'tests/test_research_workflow_embedded_python.py'
      - '.github/workflows/persist-research-snapshot.yml'
      - '.github/workflows/research-topn-audit.yml'
  workflow_dispatch:
jobs:
  research-topn:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check real daily snapshot write and immutable retry
        run: python -m unittest discover -s tests -p 'test_daily_research_written_mass.py' -v
      - name: Check daily capture TopN contract
        run: python -m unittest discover -s tests -p 'test_daily_research_mass_contract.py' -v
      - name: Check TopN model probability mass contract
        run: python -m unittest discover -s tests -p 'test_research_topn_mass_contract.py' -v
      - name: Check snapshot persistence workflow ordering
        run: python -m unittest discover -s tests -p 'test_snapshot_persistence_workflow.py' -v
      - name: Check scheduled predeadline selector
        run: python -m unittest discover -s tests -p 'test_scheduled_research_selector.py' -v
      - name: Parse embedded workflow Python scripts
        run: python -m unittest discover -s tests -p 'test_research_workflow_embedded_python.py' -v
      - name: Verify research mass cohorts
        run: python -m unittest discover -s tests -p 'test_research_mass_cohort_audit.py' -v
      - name: Out-of-time lane strength study
        run: python scripts/research_prerace_feature_audit.py
      - name: Out-of-time Top10 selectivity research
        run: python scripts/research_selective_top10_backtest.py
      - name: Count stored research forecasts against confirmed results
        run: |
          python scripts/research_topn_batch_audit.py > /tmp/research-topn-audit.json
          cat /tmp/research-topn-audit.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          audit = json.loads(Path("/tmp/research-topn-audit.json").read_text())["audit"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("## Research TopN audit (research only)\n")
              out.write("Not a calibrated confidence score or validated betting performance.\n\n")
              for name, values in audit["by_mass_cohort"].items():
                  out.write(f"### {name} — matched {values['matched']}\n")
                  for n in (3, 5, 10):
                      out.write(f"- Top{n}: {values['top'+str(n)]} / {values['matched']} ({values['top'+str(n)+'_rate_pct']}%)\n")
              for day, values in list(audit["by_day"].items())[-7:]:
                  out.write(f"### {day}: {values['matched']} / {values['saved_forecasts']} confirmed ({values['result_coverage_pct']}% coverage; {values['sample_status']})\\n")
                  for n in (3, 5, 10):
                      out.write(f"- Top{n}: {values['top'+str(n)]} / {values['matched']} ({values['top'+str(n)+'_rate_pct']}%)\\n")
              out.write(f"\nStored snapshots with TopN mass: {audit['mass_coverage']['with_topn_mass']} / {audit['mass_coverage']['all_forecasts']}\n")
          PY
