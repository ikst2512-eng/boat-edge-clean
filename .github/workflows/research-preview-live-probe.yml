name: Research nonofficial preview live probe
on:
  pull_request:
    paths:
      - '.github/workflows/research-preview-live-probe.yml'
      - 'scripts/probe_openapi_preview.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect today nonofficial previews (no prediction changes)
        run: |
          python - <<'PY'
          from datetime import datetime
          from research_model import JST
          from scripts.probe_openapi_preview import probe
          now=datetime.now(JST)
          day=now.strftime("%Y%m%d")
          # Check future races only. Never backfill a post-race preview as prereace evidence.
          for venue,race in [(12,12),(24,12),(23,12)]:
              try:
                  result=probe(day,venue,race,now=now)
                  print("preview_probe",result,flush=True)
              except Exception as e:
                  print("preview_probe_unavailable",venue,race,type(e).__name__,str(e),flush=True)
          PY
