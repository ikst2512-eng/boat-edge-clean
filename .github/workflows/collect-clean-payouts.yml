name: CLEAN independently verified trifecta payouts
on:
  # Reuse the existing confirmed-result collector when GitHub skips payout Cron.
  # This is ONE extra event on the SAME payout writer, not an extra writer.
  workflow_run:
    workflows: ['CLEAN independent confirmed result collection']
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [collect_clean_payouts.py, test_collect_clean_payouts.py, .github/workflows/collect-clean-payouts.yml]
  schedule:
    - cron: '20 9-15 * * *' # 18:20-00:20 JST, catch up late-published payouts
  pull_request:
    paths: [collect_clean_payouts.py, test_collect_clean_payouts.py, .github/workflows/collect-clean-payouts.yml]
permissions:
  contents: write
concurrency:
  group: clean-payout-evidence-writer
  cancel-in-progress: false
jobs:
  collect:
    outputs:
      new_payouts: ${{ steps.append_payouts.outputs.new_payouts }}
    # workflow_run can be fired by PRs or external branches; only the trusted
    # same-repository main result collector can wake a privileged payout write.
    # Preserve PR's read-only probe, but block feature-branch manual dispatch.
    if: >-
      ${{ github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository &&
           contains(fromJSON('["schedule","workflow_dispatch","workflow_run","push"]'),
                    github.event.workflow_run.event)) ||
          (github.ref == 'refs/heads/main' &&
           contains(fromJSON('["schedule","workflow_dispatch","push"]'),
                    github.event_name)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          # A trusted result writer may commit after its triggering SHA; read
          # the latest archived results before cross-checking payouts.
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_collect_clean_payouts
      - name: Read-only live payout source probe (historical date)
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import json
          from collect_clean_payouts import collect
          try:
              for day in ("20261030", "20261110"):
                  # PR job is read-only relative to GitHub: data only written
                  # to the disposable runner's untracked local files.
                  print("HISTORICAL_PAYOUT_PROBE", json.dumps(collect(day), sort_keys=True))
          except Exception as error:
              print("HISTORICAL_PAYOUT_PROBE_ERROR", type(error).__name__, str(error))
              raise
          PY
      - name: Collect today and previous two dates from published payout CSV
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          from datetime import datetime,timedelta,timezone
          from collect_clean_payouts import collect
          now=datetime.now(timezone(timedelta(hours=9)))
          for days_back in (2,1,0):
              print(collect((now-timedelta(days=days_back)).strftime("%Y%m%d")))
          PY
      - name: Commit immutable, result-matched payout records
        id: append_payouts
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d payout_evidence ]; then echo 'No payout evidence yet'; exit 0; fi
          git add -- payout_evidence/
          if git diff --cached --name-only --diff-filter=CDMRTUX -- payout_evidence/ | grep -q .; then
            echo 'Existing payout evidence modifications prohibited' >&2
            exit 1
          fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: archive result-matched payout evidence'
          # Other append-only main data writers can advance main during this
          # payout job. Retry non-fast-forward push without changing old payout.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "main advanced concurrently; payout append retries exhausted" >&2
              exit 1
            fi
            sleep "$attempt"
          done
          # Only a successful new immutable Git push may request an extra
          # publication. No-op, failed pushes and PR checks never dispatch.
          echo "new_payouts=true" >> "$GITHUB_OUTPUT"

  publish-new-payouts:
    # Same existing Pages workflow, no new Cron or collector. GitHub's
    # GITHUB_TOKEN push cannot trigger ordinary push workflows, so explicitly
    # dispatch only after a successful NEW payout Git commit.
    needs: collect
    if: >-
      ${{ github.event_name != 'pull_request' &&
          needs.collect.result == 'success' &&
          needs.collect.outputs.new_payouts == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch existing Pages publication for newly saved payouts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ikst2512-eng/boat-edge-clean"
          curl --fail --show-error --silent --retry 3 --retry-all-errors --retry-delay 3 \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data '{"ref":"main"}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-pages.yml/dispatches" \
            --output /dev/null
          echo "PAYOUT_PAGES_DISPATCH_REQUESTED: new payout files committed; Pages deployment still requires separate successful verification"
