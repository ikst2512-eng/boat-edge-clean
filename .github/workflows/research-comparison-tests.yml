name: Isolated research comparison checks
on:
  pull_request:
    paths:
      - 'research_comparison/**'
      - '.github/workflows/research-comparison-tests.yml'
  push:
    paths:
      - 'research_comparison/**'
      - '.github/workflows/research-comparison-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-comparison-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m compileall -q research_comparison
      - name: Offline synthetic regressions
        run: python -m unittest discover -s research_comparison -p 'test_*.py' -v
