name: Isolated live preview evidence capture
on:
  pull_request:
    paths:
      - '.github/workflows/late-preview-capture.yml'
  workflow_dispatch:
  schedule:
    # UTC 00:00-12:50 = JST 09:00-21:50; GitHub schedule may be delayed.
    - cron: '*/10 0-12 * * *'
permissions:
  contents: read
concurrency:
  group: late-preview-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and save only deadline-eligible live rows
        run: python collect_late_preview_once.py
      - name: Verify complete predeadline exhibition and entry pairs
        run: python scripts/audit_late_preview_evidence.py
      - name: Summarize locally captured evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          files=list(Path("late_preview_evidence").rglob("*.json"))
          report=json.loads(Path("late_preview_capture_report.json").read_text())
          for kind, data in report["kinds"].items():
              print(f"{kind}: source={data.get('source_rows', 'unavailable')} eligible={data.get('pre_deadline_2min', {})} six_lanes={data.get('six_lane_validation', {})}")
          print(f"eligible_saved_rows={len(files)}")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a") as summary:
              summary.write(f"Late preview evidence saved: {len(files)} race-kind records. No main forecast changes.\n")
              for kind, data in report["kinds"].items():
                  summary.write(f"- {kind}: fetched={data.get('source_rows', 'unavailable')}, saved={data.get('saved', 0)}, timing={data.get('pre_deadline_2min', {})}, lanes={data.get('six_lane_validation', {})}\n")
          PY
      - name: Upload separate short-retention evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: late-preview-evidence-${{ github.run_id }}
          path: |
            late_preview_evidence/**/*.json
            late_preview_capture_report.json
          if-no-files-found: ignore
          retention-days: 30
