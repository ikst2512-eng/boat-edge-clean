name: CLEAN result source-gap audit
on:
  workflow_dispatch:
  schedule:
    - cron: '40 15 * * *' # 00:40 JST, check previous two completed dates
  pull_request:
    paths:
      - collect_clean_results.py
      - test_collect_clean_results.py
      - .github/workflows/clean-result-gap-audit.yml
  push:
    branches: [main]
    paths:
      - collect_clean_results.py
      - test_collect_clean_results.py
      - .github/workflows/clean-result-gap-audit.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_collect_clean_results
      - name: Inspect recent and still-unresolved dates (read-only)
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from collect_clean_results import diagnose_source_gaps
          today = datetime.now(ZoneInfo("Asia/Tokyo")).date()
          dates = {(today - timedelta(days=n)).strftime("%Y%m%d") for n in (2, 1)}
          status_path = Path("confirmed_results/collection_status.json")
          status = {}
          if status_path.is_file():
              status = json.loads(status_path.read_text(encoding="utf-8"))
              for code in status.get("overdue_race_codes", []):
                  if isinstance(code, str) and len(code) == 12 and code.isascii() and code.isdigit():
                      dates.add(code[:8])
          observed_at = datetime.now(ZoneInfo("Asia/Tokyo")).isoformat()
          snapshot_at = status.get("checked_at_jst") if status_path.is_file() else None
          results = []
          for day in sorted(dates):
              result = diagnose_source_gaps(day)
              result["audited_at_jst"] = observed_at
              result["collection_snapshot_checked_at_jst"] = snapshot_at
              result["checkout_sha"] = os.environ.get("GITHUB_SHA")
              results.append(result)
          Path("test-results").mkdir(exist_ok=True)
          Path("test-results/result-source-gaps.json").write_text(json.dumps(results, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(results, ensure_ascii=False, sort_keys=True))
          PY
      - name: Archive source-gap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-source-gaps-${{ github.run_id }}
          path: test-results/result-source-gaps.json
          if-no-files-found: warn
          retention-days: 90
