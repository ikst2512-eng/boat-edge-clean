name: AI operations optional diagnostics
on:
  pull_request:
    paths:
      - ai_diagnostics.py
      - ai_frozen_race_preflight.py
      - test_ai_frozen_race_preflight.py
      - four_mode_frozen_diagnostic.py
      - test_four_mode_frozen_diagnostic.py
      - test_ai_diagnostics.py
      - four_mode_research_batch.py
      - four_mode_historical_cohort.py
      - test_four_mode_research_batch.py
      - .github/workflows/ai-operations-diagnostics.yml
  workflow_dispatch:
    inputs:
      race_code:
        description: "Archived four-mode race (YYYYMMDDJJRR); research only"
        required: true
        default: "202610280101"
        type: string
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest -v test_ai_operations test_ai_diagnostics test_four_mode_research_batch test_ai_frozen_race_preflight
      - name: Calculate real archived historical four-mode cohort
        run: python four_mode_historical_cohort.py
      - name: Produce immutable-data research audit
        run: python ai_operations.py --output ai_operations_report.json
      - name: Verify archived race evidence before paid Gemini request
        if: github.event_name == 'workflow_dispatch'
        env:
          RESEARCH_RACE_CODE: ${{ inputs.race_code }}
        run: python ai_frozen_race_preflight.py "$RESEARCH_RACE_CODE"
      - name: Optional AI diagnosis (never edits production)
        env:
          GEMINI_API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.GEMINI_API_KEY || '' }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          RESEARCH_RACE_CODE: ${{ inputs.race_code || '' }}
        run: |
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            python ai_diagnostics.py --report ai_operations_report.json --output ai_diagnostics_report.json
          else
            if [[ ! "$RESEARCH_RACE_CODE" =~ ^20[0-9]{10}$ ]]; then
              echo "::error::A 12-digit historical race_code is required for a manual Gemini race analysis."
              exit 1
            fi
            python ai_diagnostics.py --require-analysis --report ai_operations_report.json --output ai_diagnostics_report.json --race-code "$RESEARCH_RACE_CODE"
          fi
      - name: Summarize analysis outcome from saved JSON
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          output = Path("ai_diagnostics_report.json")
          if output.exists():
              try:
                  record = json.loads(output.read_text(encoding="utf-8"))
                  status = record.get("status", "unknown")
                  review = record.get("evidence_review", {}).get("review_status", "unknown")
              except (ValueError, TypeError, OSError, AttributeError):
                  status, review = "invalid_report", "unknown"
          else:
              status, review = "missing_report", "unknown"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Gemini research diagnostics\n")
              summary.write(f"- API analysis status: `{status}`\n")
              summary.write(f"- Evidence review status: `{review}`\n")
              summary.write("- This workflow never proves an improvement in accuracy or authorizes prediction changes.\n")
          PY
      - name: Archive both reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-operations-diagnostics-${{ github.run_id }}
          path: |
            ai_operations_report.json
            ai_diagnostics_report.json
            ai_frozen_race_case.json
            ai_frozen_race_preflight.json
            four_mode_historical_cohort_report.json
          retention-days: 90
