name: Daily research forecast capture
on:
  schedule:
    # Add earlier capture windows to reduce pre-cutoff misses; all records still require verified pre-cutoff sources.
    # 07:45 / 08:00 / 08:10 / 08:35 / 09:00 JST (UTC previous day 22:45,23:00,23:10,23:35; same day 00:00)
    - cron: '45 22 * * *'
    - cron: '0,10,35 23 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-research-forecast
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect research-only forecasts from published cards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p capture-evidence
          python collect_research_daily.py 2>&1 | tee capture-evidence/collection.log
      - name: Persist research-only snapshots to Git
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "run_id=$GITHUB_RUN_ID checkout_sha=$GITHUB_SHA"
            if [ ! -d research_snapshots ]; then
              if git ls-files -- research_snapshots/ | grep -q .; then
                echo 'ERROR: tracked research snapshots directory missing' >&2
                exit 1
              fi
              echo 'No research forecast files produced'
            else
              git add -- research_snapshots/
              # Only newly added twelve-digit race JSON files are allowed.
              if git diff --cached --name-only --diff-filter=CDMRTUX -- research_snapshots/ | grep -q .; then
                echo 'ERROR: existing research snapshot changed or deleted' >&2
                exit 1
              fi
              if git diff --cached --name-only --diff-filter=A -- research_snapshots/ | grep -Ev '^research_snapshots/[0-9]{12}[.]json$' | grep -q .; then
                echo 'ERROR: invalid research snapshot path' >&2
                exit 1
              fi
              if git diff --cached --quiet; then
                echo 'No new cutoff-eligible research forecasts'
              else
                # Fail closed on malformed or post-cutoff research snapshots before any commit/push.
                mapfile -d '' new_files < <(git diff --cached --name-only --diff-filter=A -z -- research_snapshots/)
                python scripts/verify_new_research_snapshots.py "${new_files[@]}"
                mkdir -p capture-evidence/new-snapshots
                while IFS= read -r -d '' file; do
                  cp -- "$file" "capture-evidence/new-snapshots/$(basename "$file")"
                done < <(git diff --cached --name-only --diff-filter=A -z -- research_snapshots/)
                (cd capture-evidence/new-snapshots && sha256sum -- *.json) > capture-evidence/snapshot-sha256.txt
                git -c user.name='research-capture-bot' -c user.email='research-capture-bot@users.noreply.github.com' commit -m 'Archive research forecasts captured before cutoff'
                git push
              fi
            fi
          } 2>&1 | tee capture-evidence/persistence.log
      - name: Preserve collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-research-collection-${{ github.run_id }}
          path: |
            capture-evidence/collection.log
            capture-evidence/persistence.log
            capture-evidence/new-snapshots/*.json
            capture-evidence/snapshot-sha256.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Publish diagnostic summary
        if: always()
        shell: bash
        run: |
          echo '## Research-only daily collection' >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Git SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo '- Output: daily-research-collection artifact (30 days)' >> "$GITHUB_STEP_SUMMARY"
          echo '- Research only: not formal Fresh validation or site publication proof' >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          lines=Path('capture-evidence/collection.log').read_text(errors='replace').splitlines() if Path('capture-evidence/collection.log').exists() else []
          counts=next((json.loads(line) for line in reversed(lines) if line.startswith('{') and line.endswith('}') and '"not_ready"' in line),None)
          if counts is None:
              print('- Coverage: unavailable; collection log did not contain validated counts')
          else:
              print(f"- Research capture: saved={counts['saved']}, already_saved={counts['already_saved']}, not_ready={counts['not_ready']}, missing={counts['missing']}, invalid={counts['invalid']}")
              print('- not_ready means cutoff or source timing prevented capture; never backfill after cutoff')
          PY
