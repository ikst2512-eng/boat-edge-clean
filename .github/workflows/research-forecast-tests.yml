name: Research forecast checks
on:
  push:
    paths:
      - 'research_model.py'
      - 'server.py'
      - 'test_research_model.py'
      - 'test_research_persistence.py'
      - 'collect_research_daily.py'
      - 'test_collect_research_daily.py'
      - 'test_collect_research_input_integrity.py'
      - 'test_research_capture_workflow.py'
      - '.github/workflows/daily-research-forecast.yml'
      - '.github/workflows/research-forecast-tests.yml'
  pull_request:
    paths:
      - 'research_model.py'
      - 'server.py'
      - 'collect_research_daily.py'
      - 'test_research_capture_workflow.py'
      - '.github/workflows/daily-research-forecast.yml'
      - '.github/workflows/research-forecast-tests.yml'
  workflow_dispatch:
jobs:
  research-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate research forecast model and persisted records
        run: python -m unittest -v test_research_model test_research_persistence test_collect_research_daily test_collect_research_input_integrity test_research_capture_workflow
