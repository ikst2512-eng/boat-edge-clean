name: Rehearse CLEAN prospective collector on actual CSV
on:
  pull_request:
    paths:
      - rehearse_real_prospective.py
      - .github/workflows/rehearse-prospective.yml
  push:
    branches: [main]
    paths:
      - rehearse_real_prospective.py
      - .github/workflows/rehearse-prospective.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python rehearse_real_prospective.py
