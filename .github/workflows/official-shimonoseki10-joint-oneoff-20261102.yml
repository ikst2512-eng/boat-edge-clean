name: One-date Shimonoseki 10R joint official T12 evidence
on:
  schedule:
    - cron: '20 12 2 11 *' # 2026-11-02 21:20 JST
    - cron: '28 12 2 11 *' # 2026-11-02 21:28 JST
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/official-shimonoseki10-joint-oneoff-20261102.yml'
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect original official evidence
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          python - <<'PY'
          import datetime,json,os,re
          from pathlib import Path
          from scripts.capture_official_beforeinfo_json import capture as before
          from scripts.capture_official_odds_receipt import capture as odds
          jst=datetime.timezone(datetime.timedelta(hours=9))
          if datetime.datetime.now(jst).date().isoformat()!='2026-11-02':
              raise SystemExit('Outside one-date experiment')
          race='202611021910'
          Path('reports').mkdir()
          a=before(race,'evidence','before'+os.environ['GITHUB_RUN_ID'])
          Path('reports/before.json').write_text(json.dumps(a,ensure_ascii=False,indent=2))
          if a.get('status')!='official_json_observed_not_t12_certified' or not re.fullmatch(r'\d{2}:\d{2}',str(a.get('deadline_display'))):
              raise SystemExit('Official beforeinfo failed')
          deadline=datetime.datetime.fromisoformat('2026-11-02T'+a['deadline_display']+':00+09:00')
          b=odds(race,deadline.isoformat(),'evidence','odds'+os.environ['GITHUB_RUN_ID'])
          Path('reports/odds.json').write_text(json.dumps(b,ensure_ascii=False,indent=2))
          cutoff=deadline-datetime.timedelta(minutes=12)
          complete=bool(a.get('six_unique_boats') and a.get('exhibition_time_nonempty_six')
                        and a.get('tilt_observed_boats')==6 and a.get('start_exhibition_six_valid_rows')
                        and datetime.datetime.fromisoformat(a['received_at_jst'])<=cutoff
                        and b.get('complete_odds_observed_before_t12'))
          summary={'race_code':race,'deadline_jst':deadline.isoformat(),'cutoff_jst':cutoff.isoformat(),
                   'beforeinfo_received_at_jst':a.get('received_at_jst'),
                   'odds_received_at_jst':b.get('received_at_jst'),
                   'exhibition_boats':a.get('exhibition_time_observed_boats'),
                   'start_valid':a.get('start_exhibition_six_valid_rows'),
                   'valid_odds_120_before_t12':b.get('complete_odds_observed_before_t12'),
                   'both_sources_complete_before_t12':complete,
                   't12_eligible':False,'forecast_usable':False}
          Path('reports/joint.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          print('JOINT_SUMMARY',json.dumps(summary,ensure_ascii=False))
          PY
      - name: Regress independent collectors
        run: |
          python -m unittest discover -s tests -p 'test_capture_official_beforeinfo_json.py' -v
          python -m unittest discover -s tests -p 'test_capture_official_odds_receipt.py' -v
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name != 'pull_request' }}
        with:
          name: shimonoseki10-joint-t12-${{ github.run_id }}
          path: |
            reports/
            evidence/
          retention-days: 14
