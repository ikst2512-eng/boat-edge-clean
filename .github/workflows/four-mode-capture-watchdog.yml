name: Four-mode capture schedule watchdog
on:
  schedule:
    - cron: '17,47 22-23,0-11 * * *'
  workflow_dispatch:
  # Exercise the watchdog when its own configuration reaches main;
  # the 27-minute run check still prevents duplicate capture dispatch.
  push:
    branches: [main]
    paths:
      - '.github/workflows/four-mode-capture-watchdog.yml'
  pull_request:
    paths:
      - '.github/workflows/four-mode-capture-watchdog.yml'
permissions:
  actions: read
  contents: read
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check recent capture runs before fallback dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          repo=os.environ["GH_REPOSITORY"]
          name="four-mode-prospective-capture.yml"
          root=f"https://api.github.com/repos/{repo}/actions/workflows/{name}"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                   "Accept":"application/vnd.github+json",
                   "X-GitHub-Api-Version":"2022-11-28"}
          # Query event types individually: heavy PR traffic must not push
          # publication executions out of an unfiltered first page.
          publication=[]
          for event in ("schedule","workflow_dispatch"):
              request=urllib.request.Request(root+"/runs?event="+event+"&per_page=30",headers=headers)
              with urllib.request.urlopen(request,timeout=20) as response:
                  publication.extend(json.load(response)["workflow_runs"])
          publication.sort(key=lambda r:r["created_at"],reverse=True)
          now=datetime.now(timezone.utc)
          recent=[r for r in publication
                  if (now-datetime.fromisoformat(r["created_at"].replace("Z","+00:00"))).total_seconds()<27*60]
          report={"recent_publication_runs":len(recent),
                  "newest":publication[0]["created_at"] if publication else None,
                  "dry_run":os.environ["EVENT_NAME"]=="pull_request"}
          if not recent and os.environ["EVENT_NAME"]!="pull_request":
              # Best-effort repair, never assume dispatch implies successful publication.
              body=json.dumps({"ref":"main"}).encode()
              req=urllib.request.Request(root+"/dispatches",data=body,headers={
                  **headers,"Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(req,timeout=20) as response:
                  if response.status!=204:
                      raise RuntimeError("workflow_dispatch_not_accepted")
              report["action"]="fallback_dispatch_accepted"
          else:
              report["action"]="no_dispatch"
          print("FOUR_MODE_WATCHDOG="+json.dumps(report,sort_keys=True))
          PY
