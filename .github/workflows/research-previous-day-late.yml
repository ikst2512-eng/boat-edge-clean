name: Compare previous-day prospective late research
on:
  pull_request:
    paths:
      - 'scripts/evaluate_previous_day_late_artifacts.py'
      - 'tests/test_evaluate_previous_day_late_artifacts.py'
      - '.github/workflows/research-previous-day-late.yml'
  schedule:
    - cron: '15 0 * * *' # 09:15 JST, after prior-day result archiving
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify historical artifact parser
        run: python -m unittest discover -s tests -p 'test_evaluate_previous_day_late_artifacts.py' -v
      - name: Fetch prior immutable predictions and evaluate paired results
        if: github.event_name != 'pull_request'
        run: python -m scripts.evaluate_previous_day_late_artifacts
      - name: Summarize actual comparison coverage
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('late_research_report.json').read_text(encoding='utf-8'))
          paired=data['paired_evaluation']['paired_races']
          recovered=data['artifact_recovery']['imported_immutable_candidates']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f'Prospective late records imported: **{recovered}**; paired confirmed races: **{paired}**.\\n')
              if not paired: out.write('No eligible Top-N hit rate yet; do not interpret this as 0%.\\n')
          PY
      - name: Archive evaluation evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: late-research-previous-day-${{ github.run_id }}
          path: |
            late_research_candidates/
            late_research_report.json
          retention-days: 7
          if-no-files-found: ignore
