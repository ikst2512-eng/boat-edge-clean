name: Odds parser regression
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify odds parser
        run: python test_odds_parser.py
