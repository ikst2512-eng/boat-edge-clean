name: CLEAN regression checks
on:
  push:
    paths:
      - index.html
      - tests/site-regression.cjs
      - .github/workflows/site-regression.yml
  pull_request:
    paths:
      - index.html
      - tests/site-regression.cjs
      - .github/workflows/site-regression.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/site-regression.cjs
