name: Research preview CSV source diagnostics
on:
  pull_request:
    paths:
      - 'scripts/research_preview_csv_probe.py'
      - 'late_preview_capture.py'
      - 'collect_late_preview_once.py'
      - 'tests/test_collect_late_preview_once.py'
      - 'scripts/audit_late_preview_evidence.py'
      - 'tests/test_audit_late_preview_evidence.py'
      - 'scripts/collect_late_preview_evidence.py'
      - 'tests/test_live_late_preview_capture.py'
      - 'tests/test_late_preview_capture.py'
      - 'scripts/preview_timing_integrity.py'
      - 'tests/test_preview_timing_integrity.py'
      - '.github/workflows/research-preview-csv-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test live preview CSV to isolated capture
        run: python -m unittest discover -s tests -p 'test_live_late_preview_capture.py' -v
      - name: Test saved preview integrity and pairing
        run: python -m unittest discover -s tests -p 'test_audit_late_preview_evidence.py' -v
      - name: Test fetched preview integration
        run: python -m unittest discover -s tests -p 'test_collect_late_preview_once.py' -v
      - name: Test isolated append-only later-cutoff capture
        run: python -m unittest discover -s tests -p 'test_late_preview_capture.py' -v
      - name: Test preview cutoff isolation
        run: python -m unittest discover -s tests -p 'test_preview_timing_integrity.py' -v
      - name: Actual CSV receipt through strict late-preview gate
        run: python scripts/collect_late_preview_evidence.py
      - name: Archive predeadline evidence for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: late-preview-evidence
          path: late_preview_evidence/
          if-no-files-found: ignore
          retention-days: 3
      - name: Inspect pre-race preview CSV availability only
        run: python scripts/research_preview_csv_probe.py
