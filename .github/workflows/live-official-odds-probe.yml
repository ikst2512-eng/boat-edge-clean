name: CLEAN live official trifecta odds probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/live-official-odds-probe.yml'
      - 'scripts/probe_live_odds_health.py'
      - 'scripts/diagnose_live_odds_failure.py'
      - 'scripts/gate_live_odds_event.py'
      - 'tests/test_gate_live_odds_event.py'
      - 'tests/test_probe_live_odds_health.py'
      - 'scripts/summarize_live_odds_history.py'
      - 'tests/test_summarize_live_odds_history.py'
      - 'scripts/check_live_odds_probe_verdict.py'
      - 'tests/test_check_live_odds_probe_verdict.py'
  schedule:
    # Split the same three slots into distinct expressions to refresh the
    # scheduled-workflow actor/registration without changing cadence.
    - cron: '25 3 * * *' # 12:25 JST
    - cron: '25 5 * * *' # 14:25 JST
    - cron: '25 7 * * *' # 16:25 JST
  workflow_run:
    workflows: ['CLEAN prospective pre-cutoff capture', 'Four-mode prospective capture (research only)']
    types: [completed] # Read-only fallback; upstream schedules actually observed
concurrency:
  # Keep non-operational PR, manual and PR/push-origin upstream runs out
  # of the operational schedule queue, even when their jobs overlap.
  group: ${{ github.event_name == 'pull_request' && format('live-odds-pr-{0}', github.run_id) || github.event_name == 'workflow_dispatch' && format('live-odds-manual-{0}', github.run_id) || (github.event_name == 'workflow_run' && github.event.workflow_run.event != 'schedule') && format('live-odds-ineligible-{0}', github.run_id) || format('live-odds-operational-{0}', github.ref) }}
  cancel-in-progress: false
  # Keep eligible scheduled probes queued rather than replacing the pending one.
  queue: max
permissions:
  contents: read
  actions: read
jobs:
  live-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify parent event and preserve ineligible evidence
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/gate_live_odds_event.py
      # Production monitoring must sample and verdict before optional diagnostics.
      # A regression test or slow history lookup must not block the live sample.
      - name: Sample up to three independently sourced upcoming races
        if: steps.gate.outputs.collect == 'true'
        run: python scripts/probe_live_odds_health.py
      - name: Fail unhealthy unattended odds sampling
        if: steps.gate.outputs.collect == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_run')
        run: python scripts/check_live_odds_probe_verdict.py
      - name: Preserve failed-source HTML after operational verdict
        if: always() && steps.gate.outputs.collect == 'true'
        continue-on-error: true
        run: timeout --signal=TERM --kill-after=5s 35s python scripts/diagnose_live_odds_failure.py
      - name: Verify fallback event classification
        if: steps.gate.outputs.collect == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        run: python -m unittest discover -s tests -p test_gate_live_odds_event.py -v
      - name: Verify read-only live odds metric classification
        if: steps.gate.outputs.collect == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        run: python -m unittest discover -s tests -p test_probe_live_odds_health.py -v
      - name: Verify 14-day odds trend aggregation
        if: steps.gate.outputs.collect == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        run: python -m unittest discover -s tests -p test_summarize_live_odds_history.py -v
      - name: Verify strict operational verdict tests
        if: steps.gate.outputs.collect == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        run: python -m unittest discover -s tests -p test_check_live_odds_probe_verdict.py -v
      - name: Summarize eligible preceding scheduled run artifacts
        # Keep diagnostic history when a real unattended sample failed its
        # strict HTTP-200 verdict; never turn that failure into a green job.
        # Bound the optional GitHub archive scan: runner job timeout is eight
        # minutes, and evidence upload must still have time to execute.
        if: always() && steps.gate.outputs.collect == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: timeout --signal=TERM --kill-after=5s 60s python scripts/summarize_live_odds_history.py
      - name: Preserve per-race statuses and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Ineligible upstream PR/push runs retain their receipt without
          # forcing later fallback checks to download a needless ZIP.
          name: ${{ steps.gate.outputs.collect == 'true' && 'live-odds-metrics' || 'live-odds-skipped' }}
          path: |
            live_odds_metrics.json
            live_odds_14day_trend.json
          if-no-files-found: warn
          retention-days: 14
      # Keep large diagnostic HTML separate: operational artifact ZIP readers
      # enforce a strict 2MB cap and must never download these extra bytes.
      - name: Preserve failure-only official HTML diagnostics
        if: always() && steps.gate.outputs.collect == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: live-odds-forensics
          path: live_odds_failure_evidence/
          if-no-files-found: ignore
          retention-days: 14
