name: CLEAN live browser smoke
on:
  workflow_dispatch:
  schedule:
    - cron: '25 1 * * *'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: pages
            url: https://ikst2512-eng.github.io/boat-edge-clean/
          - target: render
            url: https://boat-edge-clean.onrender.com/
    env:
      CLEAN_SITE_URL: ${{ matrix.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test published GitHub Pages
        shell: bash
        run: |
          set -o pipefail
          node tests/live-browser.cjs 2>&1 | tee browser-smoke.log
      - name: Preserve browser test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-browser-${{ matrix.target }}-${{ github.run_id }}
          path: |
            browser-smoke.log
            test-results/
          if-no-files-found: warn
