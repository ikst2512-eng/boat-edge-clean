name: Official beforeinfo observation (research only)
on:
  workflow_dispatch:
    inputs:
      race_code:
        description: '12-digit race code YYYYMMDDVVRR'
        required: true
        type: string
      attempts:
        description: 'Number of observations (1-3)'
        required: true
        default: '2'
        type: choice
        options: ['1', '2', '3']
  pull_request:
    paths:
      - '.github/workflows/official-beforeinfo-observation.yml'
      - 'scripts/capture_official_beforeinfo_probe.py'
      - 'tests/test_capture_official_beforeinfo_probe.py'
      - 'scripts/inspect_official_beforeinfo_json.py'
      - 'tests/test_inspect_official_beforeinfo_json.py'
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regression tests
        run: |
          python -m unittest discover -s tests -p 'test_capture_official_beforeinfo_probe.py' -v
          python -m unittest discover -s tests -p 'test_inspect_official_beforeinfo_json.py' -v
      - name: Collect separate immutable official HTML observations
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          RACE_CODE: ${{ inputs.race_code }}
          ATTEMPTS: ${{ inputs.attempts }}
        run: |
          set -euo pipefail
          [[ "$RACE_CODE" =~ ^20[0-9]{10}$ ]] || { echo "Invalid race code"; exit 1; }
          [[ "$ATTEMPTS" =~ ^[123]$ ]] || exit 1
          mkdir -p official_probe_reports
          for ((i=1; i<=ATTEMPTS; i++)); do
            id="run${GITHUB_RUN_ID}_attempt${i}"
            python -m scripts.capture_official_beforeinfo_probe "$RACE_CODE" --root official_probe_output --observation-id "$id" > "official_probe_reports/$id.json" || echo "Attempt $i failed; non-certified diagnostic saved"
            if [[ "$i" -lt "$ATTEMPTS" ]]; then sleep 60; fi
          done
      - name: Inspect captured HTML and export labeled source diagnostics
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p official_probe_inspections
          while IFS= read -r -d '' manifest; do
            folder="${manifest%/manifest.json}"
            id="${folder#official_probe_output/observations/}"
            id="${id%%/*}"
            python -m scripts.inspect_official_beforeinfo_html "$folder" > "official_probe_inspections/$id.json"
          done < <(find official_probe_output -name manifest.json -type f -print0 2>/dev/null || true)
      - name: Check actual observations and write job summary
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          reports=sorted(Path("official_probe_reports").glob("*.json"))
          statuses=[]
          for item in reports:
              try:
                  status=json.loads(item.read_text(encoding="utf-8")).get("status","invalid_report")
              except (OSError, ValueError):
                  status="invalid_report"
              statuses.append(status)
          success=sum(s=="raw_http_observed_not_t12_certified" for s in statuses)
          lines=["### Official beforeinfo: observed outcomes",
                 f"- Attempts with diagnostic files: {len(reports)}",
                 f"- Saved raw HTML observations: {success}",
                 f"- Failed or invalid observations: {len(reports)-success}",
                 "- Six-lane verified: no",
                 "- T-12 forecast eligible: no"]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as fh:
              fh.write("\\n".join(lines)+"\\n")
          if not reports or success==0:
              raise SystemExit("No usable official HTML was captured; never report collection success")
          PY
      - name: Archive original HTML and manifests
        uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        with:
          name: official-beforeinfo-probe-${{ github.run_id }}
          path: |
            official_probe_output/
            official_probe_reports/
            official_probe_inspections/
          if-no-files-found: warn
          retention-days: 14
