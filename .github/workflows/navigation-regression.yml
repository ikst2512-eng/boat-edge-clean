name: Navigation regression checks
on:
  pull_request:
    paths:
      - 'navigation.js'
      - 'index.html'
      - 'styles.css'
      - 'server.py'
      - 'test_holdout_status_async.py'
      - 'tests/test_navigation_contract.py'
      - 'tests/test_verified_prediction_refresh_contract.py'
      - 'tests/test_forecast_preview_origin.py'
      - 'tests/test_saved_prospective_api.py'
      - 'tests/test_preview_completeness.py'
      - 'clean_racecard.py'
      - 'official_preview.py'
      - 'tests/test_official_preview.py'
      - 'tests/fixtures/official_preview_202611040111.json'
      - '.github/workflows/navigation-regression.yml'
  push:
    branches: [main]
    paths:
      - 'navigation.js'
      - 'index.html'
      - 'styles.css'
      - 'server.py'
      - 'test_holdout_status_async.py'
      - 'tests/test_navigation_contract.py'
      - 'tests/test_verified_prediction_refresh_contract.py'
      - 'tests/test_forecast_preview_origin.py'
      - 'tests/test_saved_prospective_api.py'
      - 'tests/test_preview_completeness.py'
      - 'clean_racecard.py'
      - 'official_preview.py'
      - 'tests/test_official_preview.py'
      - 'tests/fixtures/official_preview_202611040111.json'
      - '.github/workflows/navigation-regression.yml'
jobs:
  navigation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Navigation and verified forecast refresh contracts
        run: |
          python -m unittest discover -s tests -p 'test_navigation_contract.py' -v
          python -m unittest discover -s tests -p 'test_verified_prediction_refresh_contract.py' -v
          python -m unittest discover -s tests -p 'test_forecast_preview_origin.py' -v
          python -m unittest discover -s tests -p 'test_saved_prospective_api.py' -v
          python -m unittest discover -s tests -p 'test_preview_completeness.py' -v
          python -m unittest discover -s tests -p 'test_official_preview.py' -v
          python -m unittest -v test_holdout_status_async
          python -m unittest -v test_bulk_first_add

  browser-pr-smoke:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for local UI smoke
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium webkit
      - name: Exercise four race tabs and racecard-only stats on mobile
        run: |
          node - <<'JS'
          const {chromium,webkit}=require('playwright');
          (async()=>{
            for(const [engine,launcher] of [['Chromium',chromium],['WebKit',webkit]]){
            const browser=await launcher.launch({headless:true});
            try {
              const page=await browser.newPage({viewport:{width:390,height:844}});
              const faults=[];
              page.on('pageerror',error=>faults.push(error.message));
              await page.route('https://raw.githubusercontent.com/**',route=>route.fulfill({status:404,contentType:'application/json',body:'{}'}));
              await page.route('https://api.github.com/**',route=>route.fulfill({status:404,contentType:'application/json',body:'{}'}));
              await page.route('https://boat-edge-clean.onrender.com/**',route=>route.fulfill({status:404,contentType:'application/json',body:'{}'}));
              await page.goto('file://'+process.cwd()+'/index.html',{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>document.documentElement.dataset.cleanNavigationInit==='1');
              if(await page.locator('#venues button').count()!==24)throw Error('24 venues missing');
              if(await page.locator('#races button').count()!==12)throw Error('12 races missing');
              const tabs=page.locator('.race-detail-shortcuts button');
              if(await tabs.count()!==4)throw Error('Four race shortcuts missing');
              await page.locator('#venues button').first().click();
              for(const view of ['forecast','card','exhibit','result']){
                await page.locator('.race-detail-shortcuts button[data-race-view="'+view+'"]').click();
                if(await page.evaluate(()=>activeView)!==view)throw Error('Shortcut failed: '+view);
                if(await page.locator('[data-home-only]:visible').count())throw Error('Home controls leak into '+view);
              }
              await page.locator('.race-detail-shortcuts button[data-race-view="card"]').click();
              if(await page.locator('#raceCardSubtabs:visible').count()!==1)throw Error('Racecard subtabs missing');
              await page.locator('[data-race-card-pane="rates"]').click();
              if(await page.evaluate(()=>activeView)!=='card')throw Error('Rates must live under racecard');
              if(await page.locator('#raceCardStatistics:visible').count()!==1)throw Error('Card rates pane not visible');
              if(await page.locator('#raceCardCore:visible').count())throw Error('Base racecard leaks into rates');
              if(await page.locator('#forecast>.forecast-combined-race:visible').count())throw Error('Prediction visible on racecard');
              await page.locator('[data-race-card-pane="card"]').click();
              if(await page.locator('#raceCardCore:visible').count()!==1)throw Error('Base racecard did not return');
              if(await page.locator('#raceCardStatistics:visible').count())throw Error('Rates leaked into base racecard');
              await page.locator('.race-detail-shortcuts button[data-race-view="forecast"]').click();
              if(await page.locator('#forecast>.forecast-combined-race:visible').count()!==1)throw Error('Prediction tickets not visible');
              if(await page.locator('#forecast .forecast-statistics:visible').count())throw Error('Statistics visible in prediction');
              if(await page.locator('#forecast>.forecast-detail-tabs:visible').count())throw Error('Duplicate forecast tabs');
              if(await page.locator('#forecastQuick:visible').count())throw Error('Duplicate race picker');
              // Verify ticket typography and odds layout at iPhone-sized viewport.
              const fourModeLayout=await page.evaluate(()=>{
                const root=document.getElementById('fourModeForecastRows');
                const card=document.createElement('article');card.className='four-mode-forecast-item';
                const row=document.createElement('div');row.className='four-mode-forecast-ticket';
                const combo=document.createElement('strong');combo.className='four-mode-combo';combo.textContent='1-2-4';
                const prob=document.createElement('span');prob.className='four-mode-prob';prob.textContent='6.60%';
                const odds=document.createElement('span');odds.className='four-mode-odds';odds.textContent='オッズ 16倍';
                row.append(combo,prob,odds);card.append(row);root.append(card);
                const out={combo:parseFloat(getComputedStyle(combo).fontSize),
                  prob:parseFloat(getComputedStyle(prob).fontSize),
                  odds:parseFloat(getComputedStyle(odds).fontSize),
                  wrap:odds.getBoundingClientRect().top>=combo.getBoundingClientRect().bottom-2,
                  clipped:row.scrollWidth>row.clientWidth+1};
                card.remove();return out;
              });
              if(!(fourModeLayout.combo>fourModeLayout.prob&&fourModeLayout.prob>fourModeLayout.odds&&fourModeLayout.wrap&&!fourModeLayout.clipped))
                throw Error('Four-mode mobile layout broken '+JSON.stringify(fourModeLayout));
              // Render the actual production exhibition builder with source-shaped
              // six-boat fixtures; this is UI-only and never a published result.
              await page.evaluate(async()=>{
                const key=sameRaceKey(),raceDate=s.date;
                const racers=Array.from({length:6},(_,i)=>({
                  lane:i+1,name:'比較選手'+(i+1),class:'A1',registration_no:String(4001+i),
                  avg_st:0.12+i/100, F:0,L:0,
                  national:{win_rate:5.2,quinella_rate:40,trio_rate:60},
                  local:{win_rate:5.4,quinella_rate:42,trio_rate:62},
                  motor:{no:i+1,quinella_rate:31,trio_rate:48},
                  boat:{no:i+1,quinella_rate:33,trio_rate:50}
                }));
                const preview=racers.map(r=>({lane:r.lane,exhibition_time:6.50+r.lane/100,tilt:-0.5}));
                const starts=racers.map(r=>({lane:r.lane,st:'.0'+r.lane,course:r.lane}));
                const auditTime=raceDate+'T10:00:00+09:00';
                verifiedRaceCache.set(key,{
                  race_key:key,meta:{date:raceDate,deadline:'23:59',phase:'PRE_RESULT'},
                  racers,beforeinfo:{racers:preview,start_exhibition:starts},
                  source_audit:{race_card:{status:'ok',fetched_at:auditTime},beforeinfo:{status:'ok',fetched_at:auditTime}},
                  verifiedPreview:true,actual_entry:[]
                });
                const headers=['レースコード','計測数','計測項目1','計測項目2','計測項目3'];
                const values=[key.replaceAll('-',''),'3','1周','まわり足','直線'];
                for(let lane=1;lane<=6;lane++)for(let k=1;k<=3;k++){
                  headers.push('艇'+lane+'_値'+k);
                  values.push(String(lane*10+k));
                }
                const csv=headers.join(',')+'\n'+values.join(',')+'\n';
                const previousFetch=fetchTimed;
                fetchTimed=async (url,...args)=>String(url).includes('/original_exhibition/')
                  ?new Response(csv,{status:200,headers:{'access-control-allow-origin':'*'}})
                  :previousFetch(url,...args);
                setView('exhibit');
                await loadRaceData();
              });
              await page.waitForFunction(()=>document.getElementById('originalExhibitionStatus')?.textContent.includes('6艇分'),{timeout:5000});
              const exhibitionLayout=await page.evaluate(()=>{
                const cards=[...document.querySelectorAll('#exhibitionGrid .exhibition-boat')];
                return {
                  boats:cards.length,
                  official:cards.map(c=>c.querySelectorAll('.exhibition-metric').length),
                  original:cards.map(c=>c.querySelectorAll('.exhibition-original-metric').length),
                  firstValues:[...cards[0]?.querySelectorAll('.exhibition-original-metric strong')||[]].map(x=>x.textContent),
                  lastValues:[...cards[5]?.querySelectorAll('.exhibition-original-metric strong')||[]].map(x=>x.textContent),
                  courses:cards.map(c=>[...c.querySelectorAll('.exhibition-metric')]
                    .find(x=>x.querySelector('span')?.textContent==='展示進入')?.querySelector('strong')?.textContent),
                  overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
                };
              });
              if(exhibitionLayout.boats!==6
                ||exhibitionLayout.official.some(x=>x!==5)
                ||exhibitionLayout.original.some(x=>x!==3)
                ||exhibitionLayout.firstValues.join(',')!=='11,12,13'
                ||exhibitionLayout.lastValues.join(',')!=='61,62,63'
                ||exhibitionLayout.courses.join(',')!=='1C,2C,3C,4C,5C,6C'
                ||exhibitionLayout.overflow>1)
                throw Error('Unified six-boat exhibition UI broken '+JSON.stringify(exhibitionLayout));
              console.log('CLEAN_SIX_BOAT_COMPACT_EXHIBITION_PASS',engine,JSON.stringify(exhibitionLayout));
              const cutoffLabel=await page.evaluate(()=>{
                const original=todayVenueRaces;
                try{
                  todayVenueRaces={date:s.date,venues:[{jcd:String(s.venue+1).padStart(2,'0'),races:[{race_no:8,deadline:'21:14'}]}]};
                  updateRacePickerLabels();
                  return [...document.querySelectorAll('#races button')].find(b=>b.textContent.startsWith('8R'))?.textContent;
                }finally{todayVenueRaces=original;updateRacePickerLabels();}
              });
              if(cutoffLabel!=='8R 締切 21:14')throw Error('Race cutoff missing: '+cutoffLabel);

              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
              if(overflow>1)throw Error('Horizontal overflow '+overflow);
              // WebKit denies local file:// access to result fixtures; this is
              // unrelated to browser layout and not a production HTTP failure.
              const realFaults=faults.filter(message=>!(
                message.includes('confirmed_results/')&&message.includes('due to access control checks')
              ));
              if(realFaults.length)throw Error('JS errors: '+realFaults.join('; '));
              // Exercise the successful schedule path: exceptions here are
              // caught by the UI and would evade pageerror-only smoke tests.
              const home=await browser.newPage({viewport:{width:390,height:844}});
              await home.route('https://raw.githubusercontent.com/**',route=>{
                if(route.request().url().endsWith('/schedule_snapshots/20990101.json'))
                  return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({
                    date:'2099-01-01',phase:'PRE_RESULT',results_seen:false,unlock:false,scoring:false,
                    source_received_jst:new Date().toISOString(),venues:[{jcd:'01',races:[
                      {race_no:1,deadline:'10:00'},{race_no:2,deadline:'11:00'},
                      {race_no:3,deadline:'12:00'},{race_no:4,deadline:'13:00'}]}]})});
                return route.fulfill({status:404,contentType:'application/json',body:'{}'});
              });
              await home.route('https://boat-edge-clean.onrender.com/**',route=>route.fulfill({status:404,body:'{}'}));
              await home.goto('file://'+process.cwd()+'/index.html?date=2099-01-01',{waitUntil:'domcontentloaded'});
              await home.waitForFunction(()=>document.querySelector('#venueState').textContent.includes('開催情報：1場'));
              if(await home.locator('#deadlineList .deadline-item').count()!==3)throw Error('Successful schedule lost next-three races');
              const order=await home.evaluate(()=>document.querySelector('#deadlineSection').compareDocumentPosition(document.querySelector('#venueChooser')) & Node.DOCUMENT_POSITION_FOLLOWING);
              if(!order)throw Error('Next-three must precede venue chooser');
              console.log('CLEAN_HOME_SCHEDULE_'+engine.toUpperCase()+'_PASS');
              await home.close();
              console.log('CLEAN_PR_MOBILE_'+engine.toUpperCase()+'_PASS');
            } finally {await browser.close();}
            }
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
