name: CLEAN V236 verification queue
on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'clean_racecard.py'
      - 'test_clean_racecard.py'
      - 'clean_four_mode_capture.py'
      - 'clean_four_modes.py'
      - 'test_clean_four_modes.py'
      - 'four_mode_performance.py'
      - 'test_four_mode_performance.py'
      - 'collect_four_mode_performance.py'
      - 'v236_freeze.py'
      - 'test_v236_freeze.py'
      - 'verification_pipeline.py'
      - 'test_verification_pipeline.py'
      - '.github/workflows/v236-verification.yml'
permissions:
  contents: write
concurrency:
  group: clean-v236-verification
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
          fetch-depth: 0
      - name: Verify processing states and payouts
        run: python -m unittest -v test_verification_pipeline test_v236_freeze test_clean_four_modes test_clean_racecard test_four_mode_performance
      - name: Capture independent four-mode forecasts before deadline
        if: github.event_name != 'pull_request'
        run: python clean_four_mode_capture.py
      - name: Commit newly captured four-mode forecasts
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p four_mode_forecasts
          git add four_mode_forecasts/
          if ! git diff --cached --quiet; then
            git commit -m "data: freeze independent four-mode forecast [skip ci]"
            git push origin HEAD:main
          fi
      - name: Freeze prospectively committed V236 candidate cohorts
        if: github.event_name != 'pull_request'
        run: python v236_freeze.py
      - name: Commit frozen forecasts before any result evaluation
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p v236_forecasts
          git add v236_forecasts/
          if ! git diff --cached --quiet; then
            git commit -m "data: freeze V236 predictions before race [skip ci]"
            git push origin HEAD:main
          fi
      - name: Advance all saved races including unfinished statuses
        run: python verification_pipeline.py
      - name: Evaluate verified four-mode simulated performance
        run: |
          for budget in 5000 6000 7000 8000 9000 10000; do
            python collect_four_mode_performance.py --budget-yen "$budget"
          done
      - name: Commit four-mode summary
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add four_mode_performance/summary-*.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update verified four-mode performance [skip ci]"
            git push origin HEAD:main
          fi
      - name: Save updated states to CLEAN
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification_status/
          if ! git diff --cached --quiet; then
            git commit -m "data: advance V236 verification statuses [skip ci]"
            git push origin HEAD:main
          fi
