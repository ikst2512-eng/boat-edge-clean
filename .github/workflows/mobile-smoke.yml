name: Mobile browser smoke test
on:
  push:
    paths:
      - 'index.html'
      - 'server.py'
      - 'test_odds_parser.py'
      - '.github/workflows/mobile-smoke.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'server.py'
      - 'test_odds_parser.py'
      - '.github/workflows/mobile-smoke.yml'
jobs:
  browser:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Verify published Pages mobile navigation and Render API health
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              // Render may first serve its 503 "Application loading" splash while a sleeping service wakes.
              let response;
              for(let attempt=1;attempt<=12;attempt++){
                response=await page.goto('https://ikst2512-eng.github.io/boat-edge-clean/',{waitUntil:'domcontentloaded',timeout:90000});
                if(response?.status()!==503)break;
                console.log('RENDER_WAKING',attempt,'of 12; HTTP 503');
                await page.waitForTimeout(6000);
              }
              const diagnostics=await page.evaluate(()=>({title:document.title,path:location.pathname,heading:document.querySelector('h1')?.textContent?.trim(),venueCount:document.querySelectorAll('#venues button').length,bodySample:document.body?.innerText?.slice(0,450)}));
              console.log('PAGES_PRODUCTION_DIAGNOSTICS',JSON.stringify({status:response?.status(),url:page.url(),...diagnostics}));
              if(response?.status()!==200)throw Error('Pages returned HTTP '+response?.status());
              const health=await page.request.get('https://boat-edge-clean.onrender.com/healthz',{timeout:30000});
              if(health.status()!==200)throw Error('Render backend health failed: HTTP '+health.status());
              console.log('RENDER_BACKEND_HEALTH_PASS',health.status());
              // Invalid requests must never return a successful 120-ticket response.
              const invalidOdds=await page.request.get('https://boat-edge-clean.onrender.com/api/odds?hd=invalid&jcd=99&rno=13',{timeout:30000});
              if(invalidOdds.status()!==400)throw Error('Render odds validation failure: expected HTTP 400, got '+invalidOdds.status());
              const rejected=await invalidOdds.json();
              if(rejected.ok!==false)throw Error('Render odds accepted invalid race inputs');
              console.log('RENDER_ODDS_INPUT_GUARD_PASS');
              if(diagnostics.venueCount!==24)throw Error('Pages is not serving current CLEAN app; expected 24 venue buttons; '+JSON.stringify(diagnostics));
              await page.locator('#venues button').first().waitFor({timeout:20000});
              if(await page.locator('#venues button').count()!==24)throw Error('24 venues not rendered');
              if(await page.locator('#races button').count()!==12)throw Error('12 races not rendered');
              await page.evaluate(()=>setView('forecast'));
              if(await page.locator('#forecast [data-mode]').count()!==0)throw Error('Old forecast controls still rendered on Pages');
              if(await page.locator('#forecast .legacy-mode-comparison').count()!==0)throw Error('Legacy comparison remains on forecast');
              if(await page.locator('#predictionStatus').count()!==1)throw Error('Research forecast status is missing');
              const research=await page.evaluate(()=>{
                predictionModes={research:{tickets:['1-2-3','1-3-2'],probabilities:{},odds:{}}};
                selectedPredictionMode='research';applyPredictionMode();
                return {mode:selectedPredictionMode,rows:document.querySelectorAll('#predictionRows .prediction-row').length};
              });
              if(research.mode!=='research'||research.rows!==2)throw Error('Research-only forecast fixture failed: '+JSON.stringify(research));
              const bodyOverflow=await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+1);
              if(bodyOverflow)throw Error('Unexpected horizontal page overflow');
              console.log('PASS: deployed Pages research-only mobile UI; Render API health checked separately');
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
