name: Forecast ten-ticket odds DOM verification
on:
  pull_request:
    paths:
      - 'tests/forecast-odds-dom.cjs'
      - '.github/workflows/forecast-odds-dom.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - run: node tests/forecast-odds-dom.cjs
