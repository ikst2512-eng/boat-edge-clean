name: Research staging safety CI
on:
  push:
    branches: [research-capture-v142-isolated-20261025]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify safety tests (offline; no race HTTP)
        shell: bash
        run: |
          mkdir -p audit-output
          set +e
          python3 -m compileall -q research-capture > audit-output/compile.log 2>&1
          compile_status=$?
          python3 research-capture/staging_audit.py > audit-output/staging-audit.log 2>&1
          audit_status=$?
          python3 -m unittest discover -s research-capture -p 'test_*.py' -v > audit-output/unit-tests.log 2>&1
          tests_status=$?
          python3 research-capture/exhibition_parser.py > audit-output/parser-selftest.log 2>&1
          parser_status=$?
          printf '{"compile":%d,"audit":%d,"tests":%d,"parser":%d,"forecast_generated":false,"scoring":"NOT_RUN"}\n' "$compile_status" "$audit_status" "$tests_status" "$parser_status" > audit-output/exit-status.json
          if (( compile_status || audit_status || tests_status || parser_status )); then
            echo "Offline safety CI failed; inspect uploaded logs"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-safety-ci
          path: audit-output/
          retention-days: 30
