name: CLEAN daily frozen forecast evidence audit
on:
  pull_request:
    paths:
      - audit_clean_daily_forecasts.py
      - test_audit_clean_daily_forecasts.py
      - .github/workflows/clean-daily-forecast-audit.yml
  push:
    branches: [main]
    paths:
      - audit_clean_daily_forecasts.py
      - test_audit_clean_daily_forecasts.py
      - .github/workflows/clean-daily-forecast-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_audit_clean_daily_forecasts
      - name: Audit preserved 2026-10-29 prospective predictions
        run: python audit_clean_daily_forecasts.py 20261029
