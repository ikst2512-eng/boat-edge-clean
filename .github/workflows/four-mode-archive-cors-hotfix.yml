name: Four-mode archive CORS hotfix regression

on:
  pull_request:
    paths:
      - server.py
      - tests/test_four_mode_archive_cors_hotfix.py
      - .github/workflows/four-mode-archive-cors-hotfix.yml

permissions:
  contents: read

jobs:
  actual-http-cors:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact allow-origin headers from real local HTTP
        run: python -m unittest discover -s tests -p 'test_four_mode_archive_cors_hotfix.py' -v
