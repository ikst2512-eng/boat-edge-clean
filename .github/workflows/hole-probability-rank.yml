name: Hole frozen probability score research
on:
  pull_request:
    paths:
      - hole_probability_rank_research.py
      - test_hole_probability_rank_research.py
      - .github/workflows/hole-probability-rank.yml
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v test_hole_probability_rank_research.py
      - run: python hole_probability_rank_research.py > hole_probability_rank.json
      - name: Verify boundaries and show metrics
        run: |
          python - <<'PY'
          import json
          r=json.load(open('hole_probability_rank.json'))
          assert not any(r[k] for k in ('formal','independent_holdout','prospective_validation','production_forecast_changed','score_calibrated'))
          print('EARLIER',r['earlier'])
          print('LATER',r['later'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hole-probability-rank
          path: hole_probability_rank.json
