name: Four-mode prospective capture (research only)
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 22 * * *'
    - cron: '7,22,37,52 23 * * *'
    - cron: '7,22,37,52 0-11 * * *'
  pull_request:
    paths:
      - clean_four_mode_capture.py
      - capture_restored_scenario.py
      - test_capture_restored_scenario.py
      - legacy_scenario_engine.py
      - legacy_v133_reference_engine.py
      - boat_edge_v254_third_tail.py
      - test_legacy_v133_reference_engine.py
      - test_original_v133_primary_contract.py
      - clean_four_modes.py
      - test_clean_four_mode_capture_e2e.py
      - test_clean_four_modes.py
      - research_model.py
      - four_mode_archive_api.py
      - research/forecast_strategy_guard_20261111.json
      - test_forecast_strategy_contract.py
      - AGENTS.md
      - test_four_mode_receipts.py
      - four_mode_raw_receipt.py
      - test_four_mode_raw_receipt.py
      - audit_four_mode_raw_receipts.py
      - test_audit_four_mode_raw_receipts.py
      - link_four_mode_raw_forecast.py
      - test_link_four_mode_raw_forecast.py
      - scripts/verify_four_mode_new_receipts.py
      - scripts/audit_new_v2_staged.py
      - test_audit_new_v2_staged.py
      - hole_shadow_same_job_capture.py
      - hole_shadow_prospective_gate.py
      - test_hole_shadow_prospective_gate.py
      - third_rate_same_job_capture.py
      - four_mode_github_server_observation.py
      - test_four_mode_remote_evidence_end_to_end.py
      - test_verify_four_mode_capture_evidence.py
      - scripts/verify_four_mode_capture_evidence.py
      - four_mode_github_server_observation_ledger.py
      - test_four_mode_github_server_observation_ledger.py
      - test_four_mode_github_server_observation.py
      - third_rate_evidence_ledger.py
      - test_third_rate_evidence_ledger.py
      - four_mode_v2_third_rate_shadow.py
      - test_third_rate_same_job_capture.py
      - test_hole_shadow_same_job_capture.py
      - test_four_mode_workflow_shell_syntax.py
      - tests/test_four_mode_source_link_scope.py
      - scripts/report_four_mode_source_links.py
      - .github/workflows/four-mode-prospective-capture.yml
permissions:
  contents: read
concurrency:
  # PR checks must never displace a pending scheduled capture.
  group: ${{ github.event_name == 'pull_request' && format('four-mode-pr-{0}', github.event.pull_request.number) || 'four-mode-publication' }}
  cancel-in-progress: false
  queue: max
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify four-mode capture and receipts
        run: python -m unittest -v test_clean_four_mode_capture_e2e test_clean_four_modes test_four_mode_receipts test_four_mode_raw_receipt test_audit_four_mode_raw_receipts test_link_four_mode_raw_forecast test_audit_new_v2_staged test_hole_shadow_same_job_capture test_hole_shadow_prospective_gate test_third_rate_same_job_capture test_third_rate_evidence_ledger test_four_mode_github_server_observation test_four_mode_github_server_observation_ledger test_four_mode_remote_evidence_end_to_end test_verify_four_mode_capture_evidence test_four_mode_workflow_shell_syntax tests.test_four_mode_source_link_scope test_forecast_strategy_contract test_capture_restored_scenario test_legacy_v133_reference_engine test_original_v133_primary_contract
  capture:
    # workflow_dispatch can target a feature branch. Never let it enter the
    # privileged forecast-publication path or attempt git push HEAD:main.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture predeadline records
        id: source_capture
        if: github.event_name != 'pull_request'
        env:
          FOUR_MODE_RAW_RECEIPT_DIR: four-mode-evidence/raw-sources
        run: |
          set -o pipefail
          mkdir -p four-mode-evidence
          python clean_four_mode_capture.py 2>&1 | tee four-mode-evidence/capture.log
      - name: Verify four-mode capture and receipts before publishing
        id: before_publish_tests
        run: python -m unittest -v test_clean_four_mode_capture_e2e test_clean_four_modes test_four_mode_receipts test_forecast_strategy_contract test_legacy_v133_reference_engine test_original_v133_primary_contract
      - name: Stage only immutable new forecasts and check receipt window
        id: receipt_staging
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          publication_stage="candidate_staging"
          record_failure() {
            code=$?
            PUBLICATION_STAGE="$publication_stage" EXIT_CODE="$code" python - <<'PY'
          import json, os
          from pathlib import Path
          Path("four-mode-evidence").mkdir(exist_ok=True)
          Path("four-mode-evidence/publication.json").write_text(
              json.dumps({"outcome":"failed", "stage":os.environ["PUBLICATION_STAGE"],
                          "exit_code":int(os.environ["EXIT_CODE"])},sort_keys=True)+chr(10),
              encoding="utf-8")
          PY
            exit "$code"
          }
          trap record_failure ERR
          # Stage only newly created and individually valid candidates. One
          # expired race must not block still-eligible races in the same batch.
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from scripts.verify_four_mode_new_receipts import verify
          names = subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard", "--", "four_mode_forecasts/"],
              text=True).splitlines()
          staged = 0
          skipped = {}
          for name in names:
              if not name.endswith(".json") or Path(name).name == "capture_status.json":
                  continue
              try:
                  verify([name], buffer_seconds=90)
              except (ValueError, OSError, KeyError, TypeError) as exc:
                  label = str(exc)[:80] or type(exc).__name__
                  skipped[label] = skipped.get(label, 0) + 1
                  continue
              subprocess.run(["git", "add", "--", name], check=True)
              staged += 1
          import json
          diagnostic = {"new_untracked_json": len([n for n in names if n.endswith(".json") and Path(n).name != "capture_status.json"]),
                        "staged_valid": staged, "excluded": skipped}
          Path("four-mode-evidence/staging.json").write_text(
              json.dumps(diagnostic, ensure_ascii=False, sort_keys=True) + chr(10), encoding="utf-8")
          print("Four-mode staging diagnostic:", json.dumps(diagnostic, sort_keys=True))
          PY
          git reset -q -- four_mode_forecasts/capture_status.json || true
          if git diff --cached --name-only --diff-filter=CDMRTUX -- four_mode_forecasts/ | grep -q .; then
            echo 'Existing four-mode archive changed: refusing write' >&2; exit 1
          fi
          python scripts/verify_four_mode_new_receipts.py --staged --buffer-seconds 90
          # A new V2 model must never be silently published under the old V1 label.
          python scripts/audit_new_v2_staged.py
          if git diff --cached --quiet; then
            printf '{"outcome":"no_eligible_candidates"}\n' > four-mode-evidence/publication.json
            echo 'No new cutoff-safe four-mode candidates'
            exit 0
          fi
          git config user.name 'four-mode-capture-bot'
          git config user.email 'four-mode-capture-bot@users.noreply.github.com'
          # Git timestamps have only one-second precision. A commit in the
          # same second as forecast generation cannot prove chronology.
          python - <<'PY'
          import json, subprocess, time
          from pathlib import Path
          from scripts.verify_four_mode_new_receipts import seconds_until_unambiguous_commit
          names = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only", "--diff-filter=A",
               "--", "four_mode_forecasts/"], text=True).splitlines()
          generated = [
              json.loads(Path(name).read_text(encoding="utf-8"))["generated_at_jst"]
              for name in names
          ]
          delay = seconds_until_unambiguous_commit(generated, time.time())
          if delay > 0:
              time.sleep(delay)
          PY
          # The delay must not allow any archive to expire.
          python scripts/verify_four_mode_new_receipts.py --staged --buffer-seconds 90
          publication_stage="git_commit"
          git commit -m 'data: freeze four-mode predeadline research candidates'
          for attempt in 1 2 3; do
            publication_stage="post_commit_receipt_check"
            python scripts/verify_four_mode_new_receipts.py --commit HEAD --buffer-seconds 90
            publication_stage="fetch_main"
            git fetch origin main
            publication_stage="rebase_main"
            git -c rebase.autoStash=true rebase origin/main
            # Rebasing changes the commit timestamp. Recheck the actual candidate
            # immediately before publication; never push an expired receipt.
            publication_stage="post_rebase_receipt_check"
            python scripts/verify_four_mode_new_receipts.py --commit HEAD --buffer-seconds 90
            publication_stage="local_first_add_audit"
            # Verify the exact first-add blob and Git chronology before pushing.
            # This is local provenance only, never remote first-seen validation.
            python - <<'PY'
          import subprocess
          from audit_four_mode_first_add import inspect
          names = subprocess.check_output(
              ["git", "diff-tree", "--no-commit-id", "--name-only",
               "--diff-filter=A", "-r", "HEAD", "--",
               "four_mode_forecasts/"], text=True).splitlines()
          if not names:
              raise SystemExit("No immutable forecasts in capture commit")
          for name in names:
              inspect(name)
          print("First-add local chronology preflight passed:", len(names))
          PY
            publication_stage="push_main"
            if git push origin HEAD:main; then
              # A successful push response alone is not evidence that this
              # first-add commit remains reachable from remote main.
              publication_stage="confirm_remote_main"
              git fetch origin main
              git merge-base --is-ancestor HEAD FETCH_HEAD
              # Record the exact pushed commit, not just a success label.
              # This allows the immutable first-add audit to inspect its blob.
              python - <<'PY'
          import json, subprocess
          from pathlib import Path
          sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True).strip()
          count = len(subprocess.check_output(
              ["git", "diff-tree", "--no-commit-id", "--name-only",
               "--diff-filter=A", "-r", "HEAD", "--",
               "four_mode_forecasts/"], text=True).splitlines())
          target = Path("four-mode-evidence/publication.json")
          target.write_text(json.dumps({
              "outcome": "pushed_to_main",
              "commit_sha": sha,
              "added_forecasts": count
          }, sort_keys=True) + chr(10), encoding="utf-8")
          print("Published four-mode commit:", sha, "new archives:", count)
          PY
              echo 'Immutable four-mode candidates pushed'
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              # Trigger ERR trap so publication.json records the final push failure.
              false
            fi
            sleep "$attempt"
          done
      # Capture the locked third-rate candidate independently of the hole
      # research step's outcome. Even when source/publication fails, write
      # explicit "no confirmed publication" evidence rather than silently skip.
      - name: Observe first-add forecast bytes with GitHub API server Date
        id: github_server_observation
        if: ${{ always() && github.event_name != 'pull_request' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python four_mode_github_server_observation.py
      - name: Freeze third-place research shadow from published original before T-12
        id: third_rate_shadow
        if: ${{ always() && github.event_name != 'pull_request' }}
        run: python third_rate_same_job_capture.py
      # The third-rate research freeze can fail on a malformed individual
      # candidate after main publication. Preserve independent hole-shadow
      # evidence even when that separate research step fails. Its failure
      # still makes the job fail; no production-success claim is hidden.
      - name: Freeze shadow after confirmed publication (research only)
        id: hole_shadow
        if: ${{ always() && github.event_name != 'pull_request' }}
        run: |
          python hole_shadow_same_job_capture.py
      - name: Preserve frozen third-rate research evidence in append-only Git branch
        id: third_rate_ledger
        if: ${{ always() && github.event_name != 'pull_request' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python third_rate_evidence_ledger.py
      - name: Preserve GitHub API observation in write-once research ledger
        id: github_observation_ledger
        if: ${{ always() && github.event_name != 'pull_request' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python four_mode_github_server_observation_ledger.py
      - name: Record per-stage capture verdict
        if: always()
        env:
          SOURCE_OUTCOME: ${{ steps.source_capture.outcome }}
          STAGING_OUTCOME: ${{ steps.receipt_staging.outcome }}
          TESTS_OUTCOME: ${{ steps.before_publish_tests.outcome }}
          LEDGER_OUTCOME: ${{ steps.third_rate_ledger.outcome }}
          THIRD_RATE_SHADOW_OUTCOME: ${{ steps.third_rate_shadow.outcome }}
          GITHUB_SERVER_OBSERVATION_OUTCOME: ${{ steps.github_server_observation.outcome }}
          GITHUB_OBSERVATION_LEDGER_OUTCOME: ${{ steps.github_observation_ledger.outcome }}
          HOLE_SHADOW_OUTCOME: ${{ steps.hole_shadow.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = Path("four-mode-evidence")
          evidence.mkdir(exist_ok=True)
          states = {"github_observation_ledger": os.environ["GITHUB_OBSERVATION_LEDGER_OUTCOME"],
                    "github_server_observation": os.environ["GITHUB_SERVER_OBSERVATION_OUTCOME"],
                    "third_rate_ledger": os.environ["LEDGER_OUTCOME"],
                    "source_capture": os.environ["SOURCE_OUTCOME"],
                    "before_publish_tests": os.environ["TESTS_OUTCOME"],
                    "receipt_staging": os.environ["STAGING_OUTCOME"],
                    # Research failures remain visible and never overwrite
                    # the independent V2 publication verdict.
                    "third_rate_shadow": os.environ["THIRD_RATE_SHADOW_OUTCOME"],
                    "hole_shadow": os.environ["HOLE_SHADOW_OUTCOME"]}
          publication = evidence/"publication.json"
          states["publication"] = "not_confirmed"
          if publication.exists():
              try:
                  payload = json.loads(publication.read_text(encoding="utf-8"))
                  if not isinstance(payload, dict) or not isinstance(payload.get("outcome"), str):
                      raise ValueError("invalid publication verdict")
                  states["publication"] = payload["outcome"]
              except (ValueError, UnicodeError, OSError):
                  states["publication"] = "invalid_publication_evidence"
          # A malformed publication file must never erase the source/staging verdicts.
          (evidence/"stages.json").write_text(
              json.dumps(states, sort_keys=True) + chr(10), encoding="utf-8")
          print("Four-mode execution stages:", json.dumps(states, sort_keys=True))
          PY
      - name: Verify published forecasts have durable early observation evidence
        if: always()
        run: python -m unittest -v test_verify_four_mode_capture_evidence && python scripts/verify_four_mode_capture_evidence.py
      - name: Publish source acquisition summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          expected_day=datetime.now(timezone(timedelta(hours=9))).strftime("%Y%m%d")
          path=Path("four_mode_forecasts/capture_status.json")
          if not path.exists():
              print("::warning::Capture status missing; see execution log.")
          else:
              data=json.loads(path.read_text(encoding="utf-8"))
              if data.get("day_jst") != expected_day:
                  print(f"::warning::Capture status is stale: {data.get('day_jst')} != {expected_day}; never treat it as today's capture.")
              publication_path=Path("four-mode-evidence/publication.json")
              try:
                  publication=json.loads(publication_path.read_text(encoding="utf-8")) if publication_path.exists() else {"outcome":"not_confirmed"}
                  if not isinstance(publication, dict) or not isinstance(publication.get("outcome"), str):
                      raise ValueError("invalid publication verdict")
              except (ValueError, UnicodeError, OSError):
                  publication={"outcome":"invalid_publication_evidence"}
              staging_path=Path("four-mode-evidence/staging.json")
              staging=json.loads(staging_path.read_text(encoding="utf-8")) if staging_path.exists() else None
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as output:
                  output.write("### Four-mode research capture\n")
                  output.write(f"- status_current_day: {data.get('day_jst') == expected_day}\n")
                  for key in ("day_jst","source_status","published_title_rows","published_card_rows","eligible_forecasts_today","last_run_new_count","capture_outcome","cutoff_skipped","already_saved","research_archives_present","production_success_proven"):
                      output.write(f"- {key}: {data.get(key, 'unavailable')}\n")
                  output.write(f"- staging: {staging if staging is not None else 'not reached'}\n")
                  output.write(f"- publication: {publication['outcome']}\n")
                  # Only freshly staged (not previously archived) records can establish V2 candidates.
                  v2_candidate_count = staging.get("staged_valid", 0) if isinstance(staging, dict) else None
                  output.write(f"- V2 staged candidate count: {v2_candidate_count if v2_candidate_count is not None else 'not reached'}\n")
                  output.write("- V2 live publication independently verified: false (GitHub history/API check required)\n")
              if data.get("source_status") != "available":
                  print("::warning::Race-card source incomplete; no forecast availability is implied.")
          PY
      - name: Verify preserved raw HTTP artifact integrity
        if: always()
        run: |
          python audit_four_mode_raw_receipts.py four-mode-evidence/raw-sources
      - name: Report only this run's published forecast and preserved-source hashes
        if: always()
        run: python -m scripts.report_four_mode_source_links
      - name: Preserve capture log and structured source status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-mode-capture-${{ github.run_id }}
          path: |
            four-mode-evidence/raw-sources/**
            four-mode-evidence/capture.log
            four-mode-evidence/staging.json
            four-mode-evidence/publication.json
            four-mode-evidence/stages.json
            four-mode-evidence/source-links.json
            four-mode-evidence/hole-shadow.json
            four-mode-evidence/third-rate-shadow.json
            four-mode-evidence/third-rate-ledger.json
            four-mode-evidence/github-server-observation.json
            four-mode-evidence/github-server-observation-ledger.json
            four-mode-evidence/final-evidence-verdict.json
            four_mode_forecasts/capture_status.json
          if-no-files-found: warn
          retention-days: 30

  scenario_capture:
    # Reuse this EXISTING research workflow schedule. This is a separate,
    # append-only scenario experiment, never a replacement for frozen V2.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original scenario guards before capture
        run: python -m unittest -v test_legacy_scenario_engine test_capture_restored_scenario test_forecast_strategy_contract
      - name: Freeze available near-deadline scenario evidence
        run: python capture_restored_scenario.py
      - name: Commit and publish only safe new scenario snapshots
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- scenario_forecasts/ || ! git diff --cached --quiet -- scenario_forecasts/; then
            echo "Previously tracked scenario evidence changed; refusing write" >&2
            exit 1
          fi
          python - <<'PY'
          import subprocess
          from capture_restored_scenario import verify_snapshot
          files = subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard", "--", "scenario_forecasts/"],
              text=True).splitlines()
          valid = 0
          for name in files:
              if not name.endswith(".json"):
                  continue
              try:
                  verify_snapshot(name)
              except (ValueError, OSError, KeyError, TypeError) as exc:
                  print("scenario snapshot held from publication:", name, str(exc)[:90])
                  continue
              subprocess.run(["git", "add", "--", name], check=True)
              valid += 1
          print("scenario candidates safely staged:", valid)
          PY
          if git diff --cached --quiet; then
            echo 'No safe new restored-scenario forecasts; leave V2 and history unchanged.'
            exit 0
          fi
          git config user.name 'scenario-capture-bot'
          git config user.email 'scenario-capture-bot@users.noreply.github.com'
          git commit -m 'data: freeze restored scenario four-mode research (unvalidated)'
          for attempt in 1 2 3; do
            git fetch origin main
            git -c rebase.autoStash=true rebase origin/main
            python - <<'PY'
          import subprocess
          from capture_restored_scenario import verify_snapshot
          files = subprocess.check_output(
              ["git", "diff-tree", "--no-commit-id", "--name-only", "--diff-filter=A", "-r", "HEAD", "--", "scenario_forecasts/"],
              text=True).splitlines()
          if not files:
              raise SystemExit("No newly added scenario evidence in commit")
          for name in files:
              print("scenario pre-push checked:", verify_snapshot(name))
          PY
            if git push origin HEAD:main; then
              git fetch origin main
              git merge-base --is-ancestor HEAD FETCH_HEAD
              echo 'Scenario research published; formal/independent first-seen remains unverified.'
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Scenario push rejected; no backdated archive created" >&2
              exit 1
            fi
            sleep "$attempt"
          done
