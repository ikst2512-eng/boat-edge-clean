name: Official beforeinfo live accessibility diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/official-beforeinfo-live-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify official beforeinfo raw response only
        run: |
          python - <<'PY'
          from datetime import datetime
          from scripts import probe_official_beforeinfo as source
          from urllib.error import HTTPError, URLError
          from research_model import JST
          now = datetime.now(JST)
          import os
          date = now.strftime("%Y%m%d")
          endpoints = (
              ("pc", "https://www.boatrace.jp/owpc/pc/race/beforeinfo"),
              ("mobile", "https://www.boatrace.jp/owsp/sp/race/beforeinfo"),
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Official beforeinfo accessibility (raw only)\n")
              for name, base in endpoints:
                  original = source.BASE
                  try:
                      source.BASE = base
                      from urllib.request import Request, urlopen
                      raw_data=[]
                      def capture(target):
                          with urlopen(Request(target,headers={"User-Agent":"BOAT-EDGE-CLEAN-RESEARCH/1.0"}),timeout=10) as response:
                              data=response.read(1_000_001)
                          raw_data.append(data)
                          return data
                      result = source.probe(date, 12, 10, fetch=capture)
                      print("official_http_probe=success", name, result, flush=True)
                      summary.write(f"- {name}: raw_response_received; bytes={result['bytes']}; exhibition=unverified; entry=unverified\\n")
                      page=raw_data[0].decode("utf-8",errors="replace")
                      from html.parser import HTMLParser
                      class PageText(HTMLParser):
                          def __init__(self):
                              super().__init__()
                              self.words=[]
                          def handle_data(self, data):
                              value=" ".join(data.split())
                              if value: self.words.append(value)
                      parsed=PageText()
                      parsed.feed(page)
                      markers=("展示タイム","展示ST","スタート展示","進入","チルト","周回","レース情報")
                      for marker in markers:
                          hits=[i for i, word in enumerate(parsed.words) if marker in word]
                          print("beforeinfo_marker",name,marker,"count",len(hits),"sample",[" / ".join(parsed.words[max(0,i-2):i+5])[:260] for i in hits[:2]],flush=True)
                  except (HTTPError, URLError, OSError, TimeoutError, ValueError) as e:
                      print("official_http_probe=unavailable", name, type(e).__name__, str(e), flush=True)
                      summary.write(f"- {name}: unavailable ({type(e).__name__}); exhibition=unverified; entry=unverified\n")
                  finally:
                      source.BASE = original
          PY
