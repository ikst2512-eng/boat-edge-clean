name: CLEAN six-boat parser fixtures
on:
  pull_request:
    paths:
      - clean_racecard.py
      - clean_direct_sources.py
      - test_clean_six_boat_fixtures.py
      - .github/workflows/clean-six-boat-parser-tests.yml
  push:
    branches: [main]
    paths:
      - clean_racecard.py
      - clean_direct_sources.py
      - test_clean_six_boat_fixtures.py
      - .github/workflows/clean-six-boat-parser-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test actual independent CLEAN source parsers
        run: python -m unittest -v test_clean_six_boat_fixtures test_clean_direct_sources test_clean_racecard
