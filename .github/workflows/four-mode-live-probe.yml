name: Four-mode live acquisition probe (no publication)
on:
  pull_request:
    paths:
      - '.github/workflows/four-mode-live-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe live source acquisition, no publication
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import time
          import tempfile
          from pathlib import Path
          from clean_four_mode_capture import collect
          from scripts.verify_four_mode_new_receipts import verify, seconds_until_unambiguous_commit
          from audit_four_mode_first_add import inspect
          with tempfile.TemporaryDirectory() as temporary:
              result=collect(root=Path(temporary))
              report={key:result.get(key) for key in (
                  "date_jst", "source_status", "source_probes",
                  "published_title_rows", "published_card_rows",
                  "cutoff_skipped", "excluded", "new_saved")}
              report["new_saved_count"]=len(result.get("new_saved", []))
              original=os.getcwd()
              valid=0
              rejected={}
              try:
                  os.chdir(temporary)
                  for code in result.get("new_saved", []):
                      path="four_mode_forecasts/"+code+".json"
                      try:
                          verify([path], buffer_seconds=90)
                          valid+=1
                      except (ValueError, KeyError, TypeError, OSError) as exc:
                          reason=str(exc) or type(exc).__name__
                          rejected[reason]=rejected.get(reason,0)+1
              finally:
                  os.chdir(original)
              report["staging_valid_now"]=valid
              report["staging_rejected_now"]=rejected
              commit_verdict="not_attempted"
              if valid:
                  try:
                      # Isolated Git repo: never push or alter project history.
                      subprocess.run(["git","init","-q"],cwd=temporary,check=True)
                      subprocess.run(["git","config","user.name","four-mode-probe"],cwd=temporary,check=True)
                      subprocess.run(["git","config","user.email","four-mode-probe@example.invalid"],cwd=temporary,check=True)
                      files=["four_mode_forecasts/"+code+".json" for code in result["new_saved"]]
                      subprocess.run(["git","add","--",*files],cwd=temporary,check=True)
                      generated=[json.loads(Path(temporary,name).read_text())["generated_at_jst"] for name in files]
                      delay=seconds_until_unambiguous_commit(generated,time.time())
                      if delay>0:time.sleep(delay)
                      subprocess.run(["git","commit","-qm","probe immutable receipts"],cwd=temporary,check=True)
                      for name in files:
                          inspect(name,root=Path(temporary))
                      commit_verdict="local_first_add_passed"
                  except Exception as exc:
                      commit_verdict="failed:"+type(exc).__name__+":"+str(exc)[:90]
              report["commit_preflight"]=commit_verdict
              report.pop("new_saved", None)
              print("LIVE_FOUR_MODE_PROBE="+json.dumps(report,ensure_ascii=False,sort_keys=True))
          PY
