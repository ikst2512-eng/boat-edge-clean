name: CLEAN daywise signal70 validation
on:
  pull_request:
    paths:
      - compare_topn_signal70_days.py
      - test_compare_topn_signal70_days.py
      - .github/workflows/signal70-daywise.yml
  push:
    branches: [main]
    paths:
      - compare_topn_signal70_days.py
      - test_compare_topn_signal70_days.py
      - .github/workflows/signal70-daywise.yml
  workflow_dispatch:
  schedule:
    - cron: '23 15 * * *' # 00:23 JST, next calendar day
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_compare_topn_signal70_days
      - name: Compare archived days without changing the discovery threshold
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from compare_topn_signal70_days import report
          import json
          Path('test-results').mkdir(exist_ok=True)
          dates=sorted({p.stem[:8] for p in Path("prospective_predictions").glob("20??????????.json")})
          if not dates:
              print("No prospective archives; evaluation skipped")
          else:
              result=report(dates)
              Path("test-results/signal70-daywise.json").write_text(json.dumps(result,ensure_ascii=False,sort_keys=True,indent=2)+"\\n",encoding="utf-8")
              print(json.dumps(result,ensure_ascii=False,sort_keys=True))
              print("Future holdout days:",result["later_holdout_days"])
          PY
      - name: Keep each run's daywise evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal70-daywise-${{ github.run_id }}
          path: test-results/signal70-daywise.json
          if-no-files-found: warn
          retention-days: 90
