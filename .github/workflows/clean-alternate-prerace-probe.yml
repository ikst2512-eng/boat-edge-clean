name: CLEAN alternate prerace source probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - probe_clean_openapi.py
      - test_probe_clean_openapi.py
      - .github/workflows/clean-alternate-prerace-probe.yml
  push:
    branches: [main]
    paths:
      - probe_clean_openapi.py
      - test_probe_clean_openapi.py
      - .github/workflows/clean-alternate-prerace-probe.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate six-boat parsing without forecast writes
        run: python -m unittest -v test_probe_clean_openapi
      - name: Probe today's alternate pre-race source (read-only)
        run: python probe_clean_openapi.py
