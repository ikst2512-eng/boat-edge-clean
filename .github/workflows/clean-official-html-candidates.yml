name: CLEAN official HTML candidate parser
on:
  pull_request:
    paths:
      - clean_official_racelist_candidates.py
      - clean_diagnostic_retry.py
      - test_clean_diagnostic_retry.py
      - test_clean_official_racelist_candidates.py
      - .github/workflows/clean-official-html-candidates.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax and safety tests
        run: |
          python -m unittest -v test_clean_diagnostic_retry
          python -m py_compile clean_official_racelist_candidates.py test_clean_official_racelist_candidates.py
          python -m unittest -v test_clean_official_racelist_candidates

      - name: Probe actual official HTML structure (diagnostic only)
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import hashlib
          import json
          from urllib.request import Request, urlopen
          from clean_official_racelist_candidates import extract_six_candidates
          url = 'https://www.boatrace.jp/owpc/pc/race/racelist?hd=20261026&jcd=21&rno=1'
          report = {'race_key': '20261026-21-01', 'status': 'unverified'}
          try:
              with urlopen(Request(url, headers={'User-Agent': 'BOAT-EDGE-CLEAN-RESEARCH/1.0'}), timeout=12) as response:
                  raw = response.read(2_000_001)
                  report['http_status'] = response.status
                  report['bytes'] = len(raw)
                  report['sha256'] = hashlib.sha256(raw).hexdigest()
              if len(raw) > 2_000_000:
                  raise ValueError('HTML too large')
              from clean_official_racelist_candidates import _Rows
              scanner = _Rows()
              scanner.feed(raw.decode('utf-8'))
              pattern_counts = {}
              for row in scanner.rows:
                  key = f"lanes_{len(row['lanes'])}_links_{len(row['racers'])}"
                  pattern_counts[key] = pattern_counts.get(key, 0) + 1
              from html.parser import HTMLParser
              class Topology(HTMLParser):
                  def __init__(self):
                      super().__init__()
                      self.rows=[]; self.row=None; self.stack=[]
                  def handle_starttag(self, tag, attrs):
                      attrs=dict(attrs); self.stack.append(tag)
                      if tag == 'tr': self.row=[]
                      if self.row is not None:
                          tokens=[x for x in attrs.get('class','').split() if x.startswith('is-boatColor')]
                          if tokens: self.row.append({'tag':tag,'depth':len(self.stack),'boat_classes':tokens[:7]})
                          if tag=='a' and 'toban=' in attrs.get('href',''):
                              self.row.append({'tag':'a','depth':len(self.stack),'racer_link':True})
                  def handle_endtag(self, tag):
                      if tag=='tr' and self.row is not None:
                          if any('racer_link' in x for x in self.row): self.rows.append(self.row[:30])
                          self.row=None
                      if tag in self.stack:
                          while self.stack:
                              if self.stack.pop()==tag: break
              topology=Topology()
              topology.feed(raw.decode('utf-8'))
              report['racer_row_topologies'] = topology.rows[:6]
              report['row_structure_counts'] = pattern_counts
              report['total_html_rows'] = len(scanner.rows)
              result = extract_six_candidates(raw, url, report['race_key'])
              report['candidate_count'] = len(result['racers'])
              import csv
              import io
              csv_url = 'https://boatracecsv.github.io/data/programs/race_cards/2026/10/26.csv'
              with urlopen(Request(csv_url, headers={'User-Agent': 'BOAT-EDGE-CLEAN-RESEARCH/1.0'}), timeout=12) as csv_response:
                  csv_bytes = csv_response.read(2_000_001)
              if len(csv_bytes) > 2_000_000:
                  raise ValueError('CSV too large')
              rows = list(csv.DictReader(io.StringIO(csv_bytes.decode('utf-8-sig'))))
              matches = [row for row in rows if row.get('レースコード') == '202610262101']
              if len(matches) != 1:
                  raise ValueError('CSV matching race missing or duplicate')
              row = matches[0]
              official = {x['lane']: x for x in result['racers']}
              differences = []
              for lane in range(1, 7):
                  candidate = official[lane]
                  if candidate['registration'] != row.get(f'艇{lane}_登録番号', '').strip():
                      differences.append(f'lane{lane}.registration')
                  csv_name = ''.join(row.get(f'艇{lane}_選手名', '').split())
                  html_name = ''.join(candidate['name'].split())
                  if csv_name != html_name:
                      differences.append(f'lane{lane}.name')
              report['csv_sha256'] = hashlib.sha256(csv_bytes).hexdigest()
              report['six_lane_registration_equal'] = not any(x.endswith('.registration') for x in differences)
              report['six_lane_name_equal'] = not any(x.endswith('.name') for x in differences)
              report['mismatch_fields'] = differences
              report['comparison_status'] = 'matched_unverified' if not differences else 'blocked_mismatch'
              report['status'] = result['status']
              report['official_provenance_verified'] = False
          except Exception as exc:
              report['status'] = 'blocked_unverified'
              report['error_type'] = type(exc).__name__
              report['error'] = str(exc)[:130]
          # Repeat the same fail-closed six-racer check on other races for this date.
          # No source payloads or racer PII are printed or stored.
          batch = []
          for venue, race in [('21', '2'), ('21', '3'), ('01', '1')]:
              key = f'20261026-{venue}-{int(race):02d}'
              entry = {'race_key': key, 'status': 'blocked_unverified'}
              try:
                  other_url = f'https://www.boatrace.jp/owpc/pc/race/racelist?hd=20261026&jcd={venue}&rno={race}'
                  # Retry transient network failures only; never retry parse or data mismatches.
                  from urllib.error import URLError
                  import time
                  for attempt in range(1, 3):
                      entry['fetch_attempts'] = attempt
                      try:
                          with urlopen(Request(other_url, headers={'User-Agent':'BOAT-EDGE-CLEAN-RESEARCH/1.0'}), timeout=10) as response:
                              other = response.read(2_000_001)
                          break
                      except (TimeoutError, URLError):
                          if attempt == 2:
                              raise
                          time.sleep(1)
                  if len(other) > 2_000_000: raise ValueError('HTML too large')
                  parsed = extract_six_candidates(other, other_url, key)
                  target = '20261026' + venue + f'{int(race):02d}'
                  matching = [row for row in rows if row.get('レースコード') == target]
                  if len(matching) != 1: raise ValueError('CSV race missing or duplicate')
                  row = matching[0]
                  mismatches = []
                  for racer in parsed['racers']:
                      lane = racer['lane']
                      if racer['registration'] != (row.get(f'艇{lane}_登録番号') or '').strip():
                          mismatches.append(f'lane{lane}.registration')
                      if ''.join(racer['name'].split()) != ''.join((row.get(f'艇{lane}_選手名') or '').split()):
                          mismatches.append(f'lane{lane}.name')
                  entry.update(candidate_count=len(parsed['racers']), mismatch_count=len(mismatches),
                               status='matched_unverified' if not mismatches else 'blocked_mismatch')
              except Exception as exc:
                  entry.update(error_type=type(exc).__name__, error=str(exc)[:100])
              batch.append(entry)
          report['additional_races'] = batch
          report['comparison_summary'] = {
              'matched': sum(x['status'] == 'matched_unverified' for x in batch)
                         + int(report.get('comparison_status') == 'matched_unverified'),
              'blocked': sum(x['status'] != 'matched_unverified' for x in batch)
                         + int(report.get('comparison_status') != 'matched_unverified'),
              'timeouts': sum(x.get('error_type') == 'TimeoutError' for x in batch),
              'expected_races': 1 + len(batch),
              'all_races_matched': report.get('comparison_status') == 'matched_unverified'
                                   and all(x['status'] == 'matched_unverified' for x in batch)
          }

          preview_report = {}
          for kind in ('stt', 'tkz', 'sui'):
              entry = {'status': 'blocked_unverified'}
              try:
                  source = f'https://boatracecsv.github.io/data/previews/{kind}/2026/10/26.csv'
                  with urlopen(Request(source, headers={'User-Agent':'BOAT-EDGE-CLEAN-RESEARCH/1.0'}), timeout=12) as response:
                      payload = response.read(2_000_001)
                  if len(payload) > 2_000_000: raise ValueError('preview too large')
                  matches = [x for x in csv.DictReader(io.StringIO(payload.decode('utf-8-sig')))
                             if x.get('レースコード') == '202610262101']
                  if len(matches) != 1: raise ValueError('missing or duplicate preview race')
                  record = matches[0]
                  if record.get('レース場') != '21' or record.get('レース回') != '01R':
                      raise ValueError('preview identity mismatch')
                  fields = ('コース', 'スタート展示') if kind == 'stt' else ('展示タイム', 'チルト')
                  values = {f'艇{i}_{field}': record.get(f'艇{i}_{field}') for i in range(1,7) for field in fields} if kind != 'sui' else {}
                  if kind != 'sui' and any(value is None for value in values.values()):
                      raise ValueError('missing preview column')
                  if kind == 'stt':
                      courses = [record[f'艇{i}_コース'] for i in range(1,7)]
                      if sorted(courses) != list('123456'): raise ValueError('invalid six-course permutation')
                  if kind == 'stt':
                      import re
                      for lane in range(1,7):
                          st = (record.get(f'艇{lane}_スタート展示') or '').strip()
                          if not re.fullmatch(r'(?:F[.]?[0-9]{1,2}|[.]?[0-9]{1,2}|[0-9][.][0-9]{1,2})', st):
                              raise ValueError('invalid/missing exhibition ST')
                  if kind == 'tkz':
                      import re
                      for lane in range(1,7):
                          for field in ('展示タイム','チルト'):
                              val = (record.get(f'艇{lane}_{field}') or '').strip()
                              if not re.fullmatch(r'-?[0-9]+(?:[.][0-9]+)?', val):
                                  raise ValueError('invalid/missing exhibition numeric value')
                  if kind == 'sui':
                      required=('風速(m)','風向','波の高さ(cm)','天候','気温(℃)','水温(℃)')
                      if any(not (record.get(field) or '').strip() for field in required):
                          raise ValueError('missing water-surface field')
                  entry = {'status':'schema_unverified', 'column_count':len(record),
                           'lane_field_count':len(values), 'nonempty_lane_fields':sum(bool(v and v.strip()) for v in values.values()),
                           'sha256':hashlib.sha256(payload).hexdigest()}
              except Exception as exc:
                  entry.update(error_type=type(exc).__name__, error=str(exc)[:100])
              preview_report[kind] = entry
          report['preview_csv_diagnostic'] = preview_report
          print(json.dumps(report, ensure_ascii=False))
          PY
