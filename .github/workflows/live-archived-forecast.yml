name: CLEAN published archived forecast browser check
on:
  pull_request:
    paths:
      # Re-test public Pages/Render when release-critical UI or CORS code changes.
      - index.html
      - server.py
      - tests/live-archived-forecast.cjs
      - tests/render-http-reachability.sh
      - .github/workflows/live-archived-forecast.yml
  workflow_dispatch:
  schedule:
    - cron: '40 2 * * *'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture Render connection timing (non-gating diagnostic)
        shell: bash
        run: |
          set -o pipefail
          bash tests/render-http-reachability.sh 2>&1 | tee render-reachability.log
      - name: Install browser runner
        timeout-minutes: 12
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps --only-shell chromium
      - name: Verify actual stored prediction displayed on public site
        run: node tests/live-archived-forecast.cjs
      - name: Preserve transport diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-archive-reachability-${{ github.run_id }}
          path: render-reachability.log
          if-no-files-found: warn
