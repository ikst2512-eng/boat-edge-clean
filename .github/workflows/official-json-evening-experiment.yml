name: Temporary official JSON evening readiness experiment
on:
  pull_request:
    paths: ['.github/workflows/official-json-evening-experiment.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Observe actual official JSON before deadline
        shell: bash
        run: |
          mkdir -p evidence
          python - <<'PY'
          import urllib.request,urllib.parse,json,datetime,hashlib
          from pathlib import Path
          from scripts.inspect_official_beforeinfo_json import inspect
          q={'type':'beforeinfo','hd':'20261102','jcd':'15','rno':'11'}
          url='https://www.boatrace.jp/owsp/sp/spdata?'+urllib.parse.urlencode(q)
          now=lambda:datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).isoformat()
          report={'url':url,'request_started_at_jst':now(),'forecast_usable':False,'t12_eligible':False}
          try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json, text/javascript, */*; q=0.01','X-Requested-With':'XMLHttpRequest','Referer':'https://www.boatrace.jp/owsp/sp/race/beforeinfo?hd=20261102&jcd=15&rno=11'})
              with urllib.request.urlopen(req,timeout=18) as r:
                  raw=r.read(1000001)
                  report['http_status']=r.status
                  report['final_url']=r.geturl()
              report['received_at_jst']=now()
              data=json.loads(raw)
              report.update(inspect(data))
              report['sha256']=hashlib.sha256(raw).hexdigest()
              report['bytes']=len(raw)
              Path('evidence/original.json').write_bytes(raw)
          except Exception as e:report['error']=type(e).__name__
          Path('evidence/report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-json-evening-readiness
          path: evidence/
          retention-days: 7
