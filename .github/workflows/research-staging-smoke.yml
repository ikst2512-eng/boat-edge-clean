name: Research staging smoke test
on:
  push:
    branches:
      - research-capture-v142-isolated-20261025
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Offline staging audit
        run: python3 research-capture/staging_audit.py
