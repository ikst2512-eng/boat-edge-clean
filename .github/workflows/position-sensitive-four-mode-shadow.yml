name: Position-sensitive 4-mode research shadow checks

on:
  pull_request:
    paths:
      - 'four_mode_position_sensitive_shadow.py'
      - 'test_four_mode_position_sensitive_shadow.py'
      - 'four_mode_position_sensitive_forward.py'
      - 'position_sensitive_topk_exposure_audit.py'
      - 'position_sensitive_paired_guard.py'
      - 'position_sensitive_paired_inference.py'
      - 'position_sensitive_feature_inventory.py'
      - 'position_sensitive_receipt_intake.py'
      - 'position_sensitive_append_only_research.py'
      - 'test_position_sensitive_append_only_research.py'
      - 'position_sensitive_t12_window_audit.py'
      - 'test_position_sensitive_t12_window_audit.py'
      - 'test_position_sensitive_receipt_intake.py'
      - 'test_position_sensitive_feature_inventory.py'
      - 'test_position_sensitive_paired_inference.py'
      - 'test_position_sensitive_paired_guard.py'
      - 'test_position_sensitive_topk_exposure_audit.py'
      - 'test_four_mode_position_sensitive_forward.py'
      - 'research/four_mode_position_sensitive_forward_protocol_20261108.json'
      - 'docs/research/four_mode_position_sensitive_shadow_20261108.md'
      - '.github/workflows/position-sensitive-four-mode-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-only-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify registered selector and baseline source blobs
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          policy = json.loads(Path("research/four_mode_position_sensitive_forward_protocol_20261108.json").read_bytes())
          def git_blob_sha(path):
              raw = Path(path).read_bytes()
              header = b"blob " + str(len(raw)).encode("ascii") + b"\0"
              return hashlib.sha1(header + raw).hexdigest()

          checks = {
              "candidate_selector_git_blob_sha1": "four_mode_position_sensitive_shadow.py",
              "original_model_git_blob_sha1": "research_model.py",
              "mode_selector_git_blob_sha1": "clean_four_modes.py",
          }
          for key, path in checks.items():
              registered = policy.get(key)
              observed = git_blob_sha(path)
              if registered != observed:
                  raise SystemExit(f"selector_blob_drift:{path}:registered={registered}:actual={observed}")
          if (policy.get("schema") != "FOUR_MODE_POSITION_SENSITIVE_FORWARD_PREREGISTRATION_V1"
                  or policy.get("registered_jst_date") != "2026-11-08"
                  or policy.get("candidate_model") != "RESEARCH_POSITION_SENSITIVE_V1_UNCALIBRATED"
                  or policy.get("factor_second_beta") != 0.5
                  or policy.get("factor_third_beta") != 0.25
                  or policy.get("eligible_deadline_start_jst") != "2026-11-09T00:00:00+09:00"
                  or policy.get("eligible_deadline_end_jst") != "2026-12-31T23:59:59+09:00"
                  or policy.get("pilot_races") != 300
                  or policy.get("confirmation_races") != 300
                  or policy.get("formal") is not False
                  or policy.get("model_improvement_proven") is not False
                  or policy.get("promotion_allowed") is not False):
              raise SystemExit("position_sensitive_protocol_drift")
          print("POSITION_SENSITIVE_PREREGISTRATION_BLOBS_VERIFIED")
          PY
      - name: Unit and negative regression tests
        run: python -m unittest -v test_four_mode_position_sensitive_shadow test_four_mode_position_sensitive_forward test_position_sensitive_topk_exposure_audit test_position_sensitive_paired_guard test_position_sensitive_paired_inference test_position_sensitive_feature_inventory test_position_sensitive_receipt_intake test_position_sensitive_t12_window_audit test_position_sensitive_append_only_research
      - name: Confirm forward protocol has no eligible captures or certification
        run: python four_mode_position_sensitive_forward.py
      - name: Explicit zero-future-data paired guard is NOT certification
        run: |
          python position_sensitive_paired_guard.py | tee position_paired_guard_unstarted.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('position_paired_guard_unstarted.json').read_text())
          if (report.get('confirmed_forward_reference_samples') != 0
                  or report.get('promotion_allowed') is not False
                  or report.get('model_improvement_proven') is not False
                  or report.get('formal') is not False):
              raise SystemExit('paired_guard_must_be_noncertifying')
          print('POSITION_SENSITIVE_PAIRED_GUARD_UNSTARTED_SAFE')
          PY
      - name: Exact paired hypothesis diagnostic cannot certify empty forward cohort
        run: |
          python position_sensitive_paired_inference.py | tee position_paired_inference_unstarted.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('position_paired_inference_unstarted.json').read_text())
          if (report.get('reference_confirmed_confirmation_races') != 0
                  or report.get('formal') is not False
                  or report.get('promotion_allowed') is not False
                  or report.get('model_improvement_proven') is not False):
              raise SystemExit('paired_inference_must_be_noncertifying')
          print('POSITION_SENSITIVE_EXACT_PAIRED_INFERENCE_NOT_CERTIFIED')
          PY
      - name: Intake preflight cannot certify nonexistent next-day remote candidate
        run: |
          python position_sensitive_receipt_intake.py | tee position_receipt_intake_unstarted.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('position_receipt_intake_unstarted.json').read_text())
          if (p.get('status') != 'no_actual_future_candidate_or_remote_observation_supplied'
                  or p.get('verified_future_candidate_receipts') != 0
                  or p.get('formal') is not False
                  or p.get('production_changed') is not False
                  or p.get('promotion_allowed') is not False):
              raise SystemExit('false_future_candidate_remote_receipt')
          print('POSITION_SENSITIVE_REMOTE_CANDIDATE_INTAKE_FAIL_CLOSED')
          PY
      - name: Candidate append-only remote adapter must remain disabled
        run: |
          python position_sensitive_append_only_research.py | tee position_append_only_unstarted.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('position_append_only_unstarted.json').read_text())
          if (data.get("status") != "adapter_uninstalled_no_live_publisher" or
                  data.get("actual_candidate_publications") != 0 or
                  data.get("formal") is not False or
                  data.get("promotion_allowed") is not False or
                  data.get("production_changed") is not False):
              raise SystemExit("research_append_only_adapter_must_not_be_live")
          print("POSITION_SENSITIVE_APPEND_ONLY_ADAPTER_NOT_INSTALLED")
          PY
      - name: Read-only replay of original Nov-08 frozen archive inputs
        run: |
          python four_mode_position_sensitive_shadow.py --day 20261108 | tee position_shadow_input_only.json
      - name: Assert 116 saved Nov8 V2 inputs reproduced without results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("position_shadow_input_only.json").read_text(encoding="utf-8"))
          n = report.get("archived_files")
          if (report.get("day_jst") != "20261108"
                  or type(n) is not int or n < 116
                  or report.get("compared") != n
                  or report.get("excluded") != 0
                  or report.get("status") != "historical_input_only_shadow_diagnostic"
                  or report.get("formal") is not False
                  or report.get("research_only") is not True
                  or report.get("production_forecast") is not False
                  or report.get("forward_holdout_scored") != 0
                  or report.get("first_remote_receipt_verified") is not False
                  or report.get("model_improvement_proven") is not False):
              raise SystemExit("position_shadow_replay_or_result_leakage")
          for mode, row in report.get("by_mode", {}).items():
              if row.get("top1_changed", -1) < 0 or row.get("first_boat_changed", -1) < 0:
                  raise SystemExit(f"invalid_position_exposure:{mode}")
              if row["first_boat_changed"] > row["top1_changed"]:
                  raise SystemExit(f"impossible_head_change:{mode}")
          if set(report.get("by_mode", {})) != {"narrow", "hit", "balance", "hole"}:
              raise SystemExit("missing_mode_exposure")
          print(f"POSITION_SENSITIVE_RESULT_BLIND_REPLAY_VERIFIED:{n}/{n}")
          PY
      - name: Read-only same-race Top1 3 5 10 turnover exposure
        run: python position_sensitive_topk_exposure_audit.py --day 20261108 | tee position_shadow_topk_exposure.json
      - name: Assert outcome-blind TopK pairs and original replay agree
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path("position_shadow_input_only.json").read_text(encoding="utf-8"))
          b = json.loads(Path("position_shadow_topk_exposure.json").read_text(encoding="utf-8"))
          n = a["compared"]
          if (b.get("status") != "historical_result_blind_topk_exposure"
                  or b.get("archived_files") != a["archived_files"]
                  or b.get("compared") != n or b.get("excluded") != 0
                  or b.get("formal") is not False
                  or b.get("research_only") is not True
                  or b.get("forward_holdout_scored") != 0
                  or b.get("first_remote_receipt_verified") is not False
                  or b.get("model_improvement_proven") is not False
                  or b.get("production_forecast_changed") is not False):
              raise SystemExit("outcome_blind_topk_contract_failed")
          for mode in ("narrow", "hit", "balance", "hole"):
              row = b["by_mode"][mode]
              if row["top1_changed"] != a["by_mode"][mode]["top1_changed"]:
                  raise SystemExit(f"baseline_top1_exposure_mismatch:{mode}")
              if row["topn"]["5"]["membership_changed_races"] != a["by_mode"][mode]["top5_membership_changed"]:
                  raise SystemExit(f"baseline_top5_exposure_mismatch:{mode}")
              for k in (1, 3, 5, 10):
                  q = row["topn"][str(k)]
                  if mode == "narrow" and k == 10:
                      if (q.get("applicable") is not False or
                              q.get("mode_ticket_budget") != 5):
                          raise SystemExit("narrow_top10_must_be_not_applicable")
                      continue
                  if q.get("applicable") is not True:
                      raise SystemExit(f"unexpected_topn_not_applicable:{mode}:{k}")
                  hist = q["retained_tickets_histogram"]
                  if sum(hist.values()) != n or not 0 <= q["total_displaced_ticket_slots"] <= k*n:
                      raise SystemExit(f"topk_overlap_partition_invalid:{mode}:{k}")
          print(f"POSITION_SENSITIVE_SAME_RACE_TOPK_EXPOSURE_VALIDATED:{n}/{n};NO_ACCURACY_CLAIM")
          PY
      - name: Read-only archive feature coverage without official/T12 claims
        run: |
          python position_sensitive_feature_inventory.py --day 20261108 | tee position_shadow_feature_inventory.json
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path('position_shadow_input_only.json').read_text())
          b = json.loads(Path('position_shadow_feature_inventory.json').read_text())
          if (b.get('archived_files') != a['archived_files']
                  or b.get('compared') != a['compared']
                  or b.get('excluded') != 0
                  or b.get('recorded_top_level_feature_counts', {}).get(
                      'national_win_rates_six') != a['compared']
                  or b.get('formal') is not False
                  or b.get('formal_official_beforeinfo_six_odds120_verified') is not False
                  or b.get('independent_candidate_first_remote_receipt_verified') is not False
                  or b.get('model_improvement_proven') is not False):
              raise SystemExit('feature_inventory_or_official_claim_invalid')
          print(f"POSITION_SENSITIVE_FEATURE_COVERAGE_READONLY:{b['compared']}/{b['archived_files']}")
          PY
      - name: Original generation to T12 theoretical window only
        run: |
          python position_sensitive_t12_window_audit.py --day 20261108 | tee position_shadow_t12_windows.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("position_shadow_input_only.json").read_text())
          b=json.loads(Path("position_shadow_t12_windows.json").read_text())
          if (b.get("compared") != a["compared"] or
                  b.get("excluded") != 0 or
                  b.get("actual_candidate_publications") != 0 or
                  b.get("independent_remote_candidate_receipts_verified") is not False or
                  b.get("formal") is not False or
                  b.get("promotion_allowed") is not False):
              raise SystemExit("false_theoretical_T12_to_remote_attestation")
          print("POSITION_SENSITIVE_T12_WINDOW_THEORY_ONLY:" + str(b["compared"]))
          PY
      - name: Upload diagnostic (not accuracy or certification)
        uses: actions/upload-artifact@v4
        with:
          name: position-sensitive-input-only-${{ github.run_id }}
          path: |
            position_shadow_input_only.json
            position_shadow_topk_exposure.json
            position_paired_guard_unstarted.json
            position_paired_inference_unstarted.json
            position_shadow_feature_inventory.json
            position_receipt_intake_unstarted.json
            position_append_only_unstarted.json
            position_shadow_t12_windows.json
          retention-days: 30
