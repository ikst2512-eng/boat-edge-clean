name: Experimental official beforeinfo JSON live check
on:
  pull_request:
    paths: ['.github/workflows/official-beforeinfo-json-experiment.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Request public official JSON and summarize structure
        shell: bash
        run: |
          mkdir -p evidence
          python - <<'PY'
          import urllib.request,urllib.parse,json,hashlib,datetime
          from pathlib import Path
          q={'type':'beforeinfo','hd':'20261102','jcd':'15','rno':'11'}
          url='https://www.boatrace.jp/owsp/sp/race/beforeinfo?'+urllib.parse.urlencode(q)
          result={'url':url,'forecast_usable':False,'t12_eligible':False}
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'BOAT-EDGE-CLEAN-EVIDENCE/1.0','Accept':'application/json','X-Requested-With':'XMLHttpRequest'}),timeout=18) as r:
                  raw=r.read(1000001)
                  result['http_status']=r.status
                  result['content_type']=r.headers.get('Content-Type')
                  result['final_url']=r.geturl()
              result['received_at_jst']=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).isoformat()
              result['bytes']=len(raw)
              result['sha256']=hashlib.sha256(raw).hexdigest()
              parsed=json.loads(raw)
              result['parse_status']='json'
              result['keys']=list(parsed)[:30] if isinstance(parsed,dict) else []
              main=parsed.get('maindata') if isinstance(parsed,dict) else None
              result['main_keys']=list(main)[:40] if isinstance(main,dict) else []
              boats=main.get('teiinfolist') if isinstance(main,dict) else None
              result['teiinfolist_count']=len(boats) if isinstance(boats,list) else None
              result['example_boat_keys']=list(boats[0])[:35] if isinstance(boats,list) and boats and isinstance(boats[0],dict) else []
              # Raw response is research-only, not promoted to production.
              Path('evidence/original.json').write_bytes(raw)
          except Exception as e:result['error']=type(e).__name__
          Path('evidence/report.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False)[:5000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-beforeinfo-json-check
          path: evidence/
          retention-days: 7
