name: Re-audit Toda/Kiryu T12 scheduled original archives (research only)
on:
  pull_request:
    paths:
      - '.github/workflows/official-three-original-t12-reinspect.yml'
      - 'scripts/reaudit_scheduled_three_t12.py'
      - 'tests/test_reaudit_scheduled_three_t12.py'
  # 2026-11-03 16:25 JST; later-year dates are rejected by in-job UTC guard.
  schedule:
    - cron: '25 7 3 11 *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reaudit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify actual scheduled observations and archived original sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "schedule" ] && [ "$(date -u +%Y-%m-%d)" != "2026-11-03" ]; then
            echo "One-day audit expired; do not misclassify later years." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python -m scripts.reaudit_scheduled_three_t12 --repo "$REPO" \
            --output reports/t12_scheduled_reaudit.json
      - name: Regression tests of immutable archive proof
        run: python -m unittest discover -s tests -p 'test_reaudit_scheduled_three_t12.py' -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t12-scheduled-original-reinspection-${{ github.run_id }}
          path: reports/t12_scheduled_reaudit.json
          retention-days: 14
          if-no-files-found: warn
