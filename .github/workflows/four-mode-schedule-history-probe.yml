name: Diagnose four-mode scheduled run history
on:
  pull_request:
    paths:
      - '.github/workflows/four-mode-schedule-history-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read recent scheduled capture runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          repo=os.environ["GH_REPOSITORY"]
          url=f"https://api.github.com/repos/{repo}/actions/workflows/four-mode-prospective-capture.yml/runs?per_page=100"
          request=urllib.request.Request(url,headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28"})
          with urllib.request.urlopen(request,timeout=20) as response:
              data=json.load(response)
          scheduled=[{"id":run["id"],"created_at":run["created_at"],
                      "status":run["status"],"conclusion":run["conclusion"],
                      "url":run["html_url"]}
                     for run in data["workflow_runs"] if run["event"]=="schedule"]
          print("FOUR_MODE_SCHEDULED_RUNS="+json.dumps(scheduled[:12],sort_keys=True))
          dispatched=[{"id":r["id"],"created_at":r["created_at"],"conclusion":r["conclusion"]} for r in data["workflow_runs"] if r["event"]=="workflow_dispatch"]
          print("FOUR_MODE_DISPATCHED_RUNS="+json.dumps(dispatched[:5],sort_keys=True))
          watchdog_url=f"https://api.github.com/repos/{repo}/actions/workflows/four-mode-capture-watchdog.yml/runs?per_page=30"
          with urllib.request.urlopen(urllib.request.Request(watchdog_url,headers=request.headers),timeout=20) as response:
              watchdog_data=json.load(response)
          watchdog=[{"id":r["id"],"event":r["event"],"created_at":r["created_at"],
                     "status":r["status"],"conclusion":r["conclusion"]}
                    for r in watchdog_data["workflow_runs"]]
          print("FOUR_MODE_WATCHDOG_RUNS="+json.dumps(watchdog[:10],sort_keys=True))
          print("FOUR_MODE_WATCHDOG_SCHEDULE_COUNT="+str(sum(r["event"]=="schedule" for r in watchdog)))
          print("FOUR_MODE_WATCHDOG_LATEST="+json.dumps(watchdog[:3],sort_keys=True))
          print("FOUR_MODE_HISTORY_CHECK_JST=2026-11-02 20:47+09:00")
          if not scheduled:
              print("::warning::No scheduled workflow runs in the most recent 100; execution is unconfirmed")
          else:
              # Compare latest schedule against current time; do not infer
              # deployment, push or eligibility from a completed workflow.
              latest=datetime.fromisoformat(scheduled[0]["created_at"].replace("Z","+00:00"))
              age_minutes=int((datetime.now(timezone.utc)-latest).total_seconds()/60)
              print("FOUR_MODE_LATEST_SCHEDULE_AGE_MINUTES="+str(age_minutes))
              if age_minutes > 35:
                  print("::warning::Last scheduled capture started "+str(age_minutes)+" minutes ago; inspect schedule health")
          PY
