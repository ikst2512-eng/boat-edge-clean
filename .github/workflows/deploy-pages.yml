name: Publish BOAT EDGE CLEAN
on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: boat-edge-clean-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout published source
        uses: actions/checkout@v4
      - name: Validate inline JavaScript and TopK UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          page = Path('index.html').read_text()
          if not page.strip() or 'BOAT EDGE' not in page:
              raise SystemExit('Missing or invalid CLEAN home page')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', page)
          if len(scripts) != 1:
              raise SystemExit('Expected exactly one inline script')
          for size in (3, 5, 10):
              if f'data-top="{size}"' not in page:
                  raise SystemExit(f'Missing Top{size} selector')
          if "status==='research'" in scripts[0]:
              raise SystemExit('Unverified research prediction fallback')
          ids = re.findall(r'\bid="([^"]+)"', page)
          if len(ids) != len(set(ids)):
              raise SystemExit('Duplicate HTML id')
          referenced = re.findall(r"getElementById\('([^']+)'\)", scripts[0])
          missing = sorted(set(referenced) - set(ids))
          if missing:
              raise SystemExit(f'Missing DOM targets: {missing}')
          if 'verifiedStoredPrediction' not in scripts[0]:
              raise SystemExit('Verified frozen prediction loader missing')
          Path('/tmp/clean-inline.js').write_text(scripts[0])
          PY
          node --check /tmp/clean-inline.js
      - name: Stage only public files
        run: |
          mkdir -p public
          cp index.html public/index.html
          test -s public/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record deployed revision
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "### BOAT EDGE CLEAN deployed revision"
            echo "Commit: \`$GITHUB_SHA\`"
            echo "Pages URL: $PAGE_URL"
            echo "Browser diagnostics run after publication; their failures are reported separately."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify deployed public page
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 "$PAGE_URL" -o /tmp/clean-deployed.html; then
              if cmp -s public/index.html /tmp/clean-deployed.html; then
                echo "Public page byte-identical PASS: $PAGE_URL"
                echo "Public HTML: **PASS** (byte-identical to deployed revision)" >> "$GITHUB_STEP_SUMMARY"
                sha256sum public/index.html
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Public HTML: **FAIL / UNCONFIRMED** (unavailable or differs from deployed revision)" >> "$GITHUB_STEP_SUMMARY"
          echo "Public page verification FAIL: deployed HTML differs from current index.html or is unavailable: $PAGE_URL" >&2
          exit 1
      - name: Browser interaction smoke test
        timeout-minutes: 5
        continue-on-error: false
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
          node - <<'JS'
          const { chromium } = require('playwright');
          const cors={'access-control-allow-origin':'*'};
          (async () => {
            const browser = await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({viewport:{width:390,height:844}});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              page.on('console',msg=>{if(msg.type()==='error')console.error('BROWSER_CONSOLE_ERROR',msg.text())});
              page.on('requestfailed',req=>console.error('BROWSER_REQUEST_FAILED',req.url(),req.failure()?.errorText));
              await page.route('https://raw.githubusercontent.com/**',route=>route.fulfill({status:404,contentType:'application/json',headers:cors,body:'{}'}));
              await page.route('https://api.github.com/**',route=>route.fulfill({status:404,contentType:'application/json',headers:cors,body:'{}'}));
              await page.goto('file://' + process.cwd() + '/index.html');
              await page.locator('#venues button').first().waitFor();
              if(await page.locator('#venues button').count()!==24)throw Error('24 venue buttons expected');
              if(await page.locator('#races button').count()!==12)throw Error('12 race buttons expected');
              await page.locator('#venues button').nth(11).click();
              await page.locator('#races button').nth(4).click();
              if(!((await page.locator('#activeRaceLabel').innerText()).includes('住之江')&&(await page.locator('#activeRaceLabel').innerText()).includes('5R')))throw Error('race selection failed');
              await page.locator('.view-tabs [data-view="forecast"]').click();
              for(const n of [3,5,10]){
                await page.locator('[data-top="'+n+'"]').click();
                if(!await page.locator('[data-top="'+n+'"]').evaluate(el=>el.classList.contains('on')))throw Error('Top tab failed: '+n);
              }
              if(await page.locator('a[href*="boatrace.jp"]').count())throw Error('unwanted official link');
              // Verified fixture: the UI must render real-format pre-result data, not a placeholder.
              const sha='a'.repeat(40), key='20261022-12-01';
              const racePath='data/races/'+key+'.json', predPath='data/site_prediction_snapshots/'+key+'.json';
              const racers=Array.from({length:6},(_,i)=>({lane:i+1,registration_no:String(4101+i),name:'テスト選手'+(i+1),class:'B1',avg_st:0.16,F:0,L:0,national:{win_rate:i===0?'5.10':5.1,quinella_rate:i===0?'35.00':35,trio_rate:52},local:{win_rate:5.2,quinella_rate:33,trio_rate:51},motor:{no:i+10,quinella_rate:32,trio_rate:50},boat:{no:i+20,quinella_rate:30,trio_rate:49}}));
              const race={schema_version:'boat-edge-race-v5',race_key:key,meta:{date:'2026-10-22',venue_code:'12',race_no:1,deadline:'15:16',phase:'PRE_RESULT',results_seen:false,unlock:false,scoring:false},source_audit:{race_card:{status:'ok',fetched_at:'2026-10-22T15:11:00+09:00'},beforeinfo:{status:'ok',fetched_at:'2026-10-22T15:11:00+09:00'}},racers,beforeinfo:{racers:racers.map(r=>({lane:r.lane,exhibition_time:6.8,tilt:-0.5})),start_exhibition:racers.map(r=>({lane:r.lane,st:r.lane===2?0.05:'.05'}))}};
              const combos=['1-2-3','1-2-4','1-3-2','1-3-4','1-4-2','1-4-3','2-1-3','2-1-4','2-3-1','2-3-4'];
              const pred={race_key:key,schema_version:'boat-edge-server-site-final-v123',prediction_kind:'SITE_REFERENCE_V122',venue_code:'12',race_no:1,deadline:'15:16',first_saved_at:'2026-10-22T06:11:00Z',race_sha256:'b'.repeat(64),odds_sha256:'c'.repeat(64),guards:{results_seen:false,unlock:false,scoring:false},default_display_mode:'tail',modes:{tail:{tickets:combos.map((combo,i)=>({combo,p:10-i,odds:10+i}))}}};
              let raceText=JSON.stringify(race);const predText=JSON.stringify(pred);let predictionUnavailable=false,predictionHttpFailure=false;
              await page.route('https://raw.githubusercontent.com/**',route=>{
                const url=route.request().url();
                const body=url.includes('/data/today.json')?JSON.stringify({date:'2026-10-22',phase:'PRE_RESULT',results_seen:false,unlock:false,scoring:false,venues:[{jcd:'12',venue:'住之江',races:[{race_no:1,deadline:'15:16'}]}]}):url.includes(racePath)?raceText:url.includes(predPath)?(predictionUnavailable||predictionHttpFailure?null:predText):null;
                return route.fulfill(predictionHttpFailure&&url.includes(predPath)?{status:503,headers:cors,body:'temporary outage'}:body?{status:200,contentType:'application/json',headers:cors,body}:{status:404,headers:cors,body:'{}'});
              });
              await page.route('https://api.github.com/**',route=>{
                const url=route.request().url(),path=url.includes(encodeURIComponent(racePath))||url.includes(racePath)?racePath:predPath;
                const body=url.includes('/commits?')?[{sha}]:{files:[{filename:path,status:'added'}],commit:{committer:{date:'2026-10-22T06:13:00Z'}}};
                return route.fulfill({status:200,contentType:'application/json',headers:cors,body:JSON.stringify(body)});
              });
              await page.goto('file://'+process.cwd()+'/index.html?date=2026-10-22&venue=12&race=1');
              await page.waitForFunction(()=>document.querySelector('#venues button:nth-child(12)')?.classList.contains('on'),null,{timeout:12000});
              if(!await page.locator('#venues button').nth(11).evaluate(el=>el.classList.contains('held')))throw Error('active venue not highlighted');
              await page.goto('file://'+process.cwd()+'/index.html?date=2026-10-22&venue=12&race=1');
              // Chronological race navigation is built from saved race deadlines.
              await page.waitForFunction(()=>document.querySelector('#deadlineStatus')?.textContent.includes('締切前レースは終了しました'),null,{timeout:12000});
              if(await page.locator('#deadlineList .deadline-item').count()!==0)throw Error('past deadline was incorrectly shown as upcoming');
              // Forecast is the default tab; activating race cards starts their data request.
              await page.locator('.view-tabs [data-view="card"]').click();
              await page.locator('#raceDataRows tr').first().waitFor({state:'attached',timeout:12000});
              if(await page.locator('#raceDataRows tr').count()!==6)throw Error('six-lane data render failed');
              if(!(await page.locator('#raceDataRows tr').first().innerText()).includes('35.00%'))throw Error('numeric-string statistics missing');
              await page.locator('.view-tabs [data-view="result"]').click();
              if(!await page.locator('#resultSection').isVisible())throw Error('result tab missing');
              await page.waitForFunction(()=>document.querySelector('#resultStatus')?.textContent.includes('CLEAN確定結果は未取得です'),null,{timeout:12000});
              await page.locator('.view-tabs [data-view="exhibit"]').click();
              if(!await page.locator('#raceDataSection').isVisible())throw Error('exhibition tab failed');
              if(await page.locator('#exhibitionGrid .exhibition-boat').count()!==6)throw Error('six exhibition cards missing');
              // Verified real pre-result values from 2026-10-22 Suminoe 1R, not invented fixture readings.
              raceText=JSON.stringify({...race,beforeinfo:{racers:race.beforeinfo.racers.map((x,i)=>i===0?{...x,exhibition_time:6.89,tilt:-0.5}:x),start_exhibition:race.beforeinfo.start_exhibition.map((x,i)=>i===0?{...x,st:'F.04'}:x)}});
              await page.locator('#retryPrediction').click();
              await page.waitForFunction(()=>document.querySelector('#exhibitionGrid .exhibition-boat .exhibition-metric strong')?.textContent==='6.89');
              const realEx=await page.locator('#exhibitionGrid .exhibition-boat').first().innerText();
              if(!realEx.includes('F.04')||!realEx.includes('-0.5'))throw Error('verified real exhibition values not rendered');

              const exhibitionCols=await page.locator('#exhibitionGrid').evaluate(el=>getComputedStyle(el).gridTemplateColumns.trim().split(/\s+/).length);
              if(exhibitionCols!==1)throw Error('exhibition must be vertical single-column at 390px: columns='+exhibitionCols);
              if(!(await page.locator('#exhibitionGrid .exhibition-boat').nth(1).innerText()).includes('0.05'))throw Error('numeric exhibition ST hidden');
              if(await page.locator('#raceDataSection .race-data-scroll').isVisible())throw Error('wide racecard table visible in exhibition tab');
              await page.locator('.view-tabs [data-view="forecast"]').click();
              if(!await page.locator('#forecast').isVisible())throw Error('prediction tab failed');
              await page.locator('#predictionRows .prediction-row').first().waitFor({timeout:12000});
              for(const n of [3,5,10]){
                await page.locator('[data-top="'+n+'"]').click();
                if(await page.locator('#predictionRows .prediction-row').count()!==n)throw Error('Top'+n+' rendered count mismatch');
              }
              // Outside the exhibition collection window is not the same as a permanent absence.
              raceText=JSON.stringify({...race,source_audit:{...race.source_audit,beforeinfo:{status:'not_in_window'}},beforeinfo:null});
              await page.locator('.view-tabs [data-view="exhibit"]').click();
              await page.locator('#retryPrediction').click();
              await page.waitForFunction(()=>document.querySelector('#raceDataStatus')?.textContent.includes('展示を表示中'),null,{timeout:12000});
              if(await page.locator('#exhibitionGrid .exhibition-boat').count()!==6)throw Error('out-of-window exhibition removed lane cards');
              // Real saved PRE_RESULT values from 2026-10-22 Suminoe 1R:
              // lane 1 exhibition 6.89, tilt -0.5 and ST F.04.
              raceText=JSON.stringify({...race,beforeinfo:{...race.beforeinfo,racers:race.beforeinfo.racers.map((r,i)=>i===0?{...r,exhibition_time:6.89,tilt:-0.5}:r),start_exhibition:race.beforeinfo.start_exhibition.map((r,i)=>i===0?{...r,st:'F.04'}:r)}});
              await page.locator('.view-tabs [data-view="exhibit"]').click();
              await page.locator('#retryPrediction').click();
              await page.waitForFunction(()=>document.querySelector('#raceDataStatus')?.textContent.includes('展示を表示中'));
              const realFirst=await page.locator('#exhibitionGrid .exhibition-boat').first().innerText();
              if(!realFirst.includes('6.89')||!realFirst.includes('-0.5')||!realFirst.includes('F.04'))throw Error('saved real exhibition values not rendered in vertical card');
              // Partial venue coverage: missing beforeinfo and two racer records must not hide the racecard.
              // An incomplete exhibition row must not clear an otherwise valid card.
              const oddPreview={...race,beforeinfo:{...race.beforeinfo,racers:[null,...race.beforeinfo.racers]}};
              raceText=JSON.stringify(oddPreview);
              await page.locator('#retryPrediction').click();
              await page.waitForFunction(()=>document.querySelectorAll('#raceDataRows tr').length===6&&document.querySelector('#raceDataStatus').textContent.includes('展示を表示中'));
              // A rejected incomplete racer card must not replace the last verified six-racer view.
              raceText=JSON.stringify({...race,source_audit:{...race.source_audit,beforeinfo:{status:'missing'}},racers:[race.racers[0],null,race.racers[2],race.racers[3]],beforeinfo:null});
              await page.locator('.view-tabs [data-view="card"]').click();
              await page.locator('#retryPrediction').click();
              await page.waitForFunction(()=>document.querySelector('#raceDataStatus')?.textContent.includes('前回表示'),null,{timeout:12000});
              if(await page.locator('#raceDataRows tr').count()!==6)throw Error('incomplete racer card cleared verified six lanes');
              if((await page.locator('#raceDataRows').innerText()).includes('未提供'))throw Error('unverified partial racer replaced verified six-lane data');
              await page.locator('.view-tabs [data-view="exhibit"]').click();
              if(!await page.locator('#raceDataSection').isVisible())throw Error('rejected refresh hid verified race card');
              // Rechecking an already verified prediction must not duplicate its metadata.
              await page.locator('#retryPrediction').click();
              await page.waitForFunction(()=>document.querySelector('#predictionStatus')?.textContent.includes('初回Git記録照合済'));
              if(await page.locator('#sourceMeta .source-chip').count()!==1)throw Error('duplicate prediction metadata chips');
              // Temporary prediction outage retains verified tickets only for the current race.
              predictionHttpFailure=true;
              await page.locator('.view-tabs [data-view="forecast"]').click();
              await page.locator('#retryPrediction').click();
              await page.waitForFunction(()=>document.querySelector('#predictionStatus')?.textContent.includes('最新データではありません'));
              if(await page.locator('#predictionRows .prediction-row').count()!==10)throw Error('transient prediction outage erased verified tickets');
              predictionHttpFailure=false;
              // Missing prediction must not clear a previously rendered racecard.
              predictionUnavailable=true;
              await page.locator('.view-tabs [data-view="forecast"]').click();
              await page.locator('#retryPrediction').click();
              await page.waitForFunction(()=>document.querySelector('#predictionStatus')?.textContent.includes('初回Git記録照合済')||document.querySelector('#predictionStatus')?.textContent.includes('検証済み'),null,{timeout:12000});
              await page.locator('.view-tabs [data-view="card"]').click();
              if(await page.locator('#raceDataRows tr').count()!==6)throw Error('missing prediction cleared racecard');
              // A failed forced refresh must retain an already shown six-lane table.
              await page.route('https://raw.githubusercontent.com/**',route=>{
                if(route.request().url().includes(racePath))return route.fulfill({status:503,headers:cors,body:'temporary outage'});
                return route.fallback();
              });
              await page.locator('.view-tabs [data-view="exhibit"]').click();
              await page.locator('#retryPrediction').click();
              await page.waitForFunction(()=>document.querySelector('#raceDataStatus').textContent.includes('前回表示した出走表'));
              if(await page.locator('#raceDataRows tr').count()!==6)throw Error('failed refresh erased racecard');

              // Switching races during pending requests must leave only the latest selection on screen.
              await page.locator('#races button').nth(1).click();
              await page.locator('#races button').first().click();
              await page.waitForFunction(()=>document.querySelector('#activeRaceLabel')?.textContent.includes('1R'));
              if(!(await page.locator('#activeRaceLabel').innerText()).includes('住之江'))throw Error('stale race selection');
              if(await page.locator('#races button.on').count()!==1)throw Error('multiple selected race buttons');
              if(await page.locator('#venues button.on').count()!==1)throw Error('multiple selected venue buttons');

              if(errors.length)throw Error('Browser JavaScript errors: '+errors.join('; '));
              console.log('BROWSER_SMOKE_PASS 24 venues, 12 races, race change, Top3/5/10 toggles, no official links');
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Verify real saved Suminoe exhibition JSON in browser
        continue-on-error: false
        timeout-minutes: 2
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage({viewport:{width:390,height:844}});
              await page.route('https://api.github.com/**',r=>r.fulfill({status:404,headers:{'access-control-allow-origin':'*'},body:'{}'}));
              const url=new URL(process.env.PAGE_URL);
              url.searchParams.set('date','2026-10-22');url.searchParams.set('venue','12');url.searchParams.set('race','1');
              await page.goto(url.toString(),{waitUntil:'domcontentloaded',timeout:30000});
              await page.locator('.view-tabs [data-view="exhibit"]').click();
              await page.waitForFunction(()=>document.querySelector('#exhibitionGrid .exhibition-boat .exhibition-metric strong')?.textContent==='6.89',null,{timeout:30000});
              const first=await page.locator('#exhibitionGrid .exhibition-boat').first().innerText();
              if(!first.includes('F.04')||!first.includes('-0.5'))throw Error('Real Suminoe JSON mismatch');
              if(await page.locator('#exhibitionGrid .exhibition-boat').count()!==6)throw Error('Real JSON six lanes missing');
              if(await page.locator('#exhibitionGrid').evaluate(el=>getComputedStyle(el).gridTemplateColumns.trim().split(/\s+/).length)!==1)throw Error('Real JSON exhibition is not vertical at 390px');
              // Result tab now reads CLEAN-owned immutable archives, not legacy 2026-10-22 payouts.
              // Assert a genuinely committed 2026-10-27 result, then return to exhibition checks.
              url.searchParams.set('date','2026-10-27');url.searchParams.set('venue','1');url.searchParams.set('race','1');
              await page.goto(url.toString(),{waitUntil:'domcontentloaded',timeout:30000});
              await page.locator('.view-tabs [data-view="result"]').click();
              await page.waitForFunction(()=>document.querySelector('#resultStatus')?.textContent==='CLEAN保存済み結果',null,{timeout:30000});
              const result=await page.locator('#resultDetail').innerText();
              const winningLanes=await page.locator('#resultDetail .result-combo .boat-num').allTextContents();
              if(winningLanes.join('-')!=='3-4-1'||!result.includes('CLEAN保存済み結果'))throw Error('CLEAN result mismatch: lanes='+winningLanes.join('-')+' result='+result);
              if(await page.locator('#resultComparison').innerText().then(t=>!t.includes('的中・不的中の判定は行いません')))throw Error('Unsafe formal scoring on CLEAN archive');
              console.log('REAL_CLEAN_STORED_RESULT_BROWSER_PASS',url.toString());
              console.log('REAL_SAVED_EXHIBITION_BROWSER_PASS Suminoe 2026-10-22');
              url.searchParams.set('date','2026-10-22');
              // A second venue confirms real source readings are not fixture-specific.
              url.searchParams.set('venue','4');url.searchParams.set('race','9');
              await page.goto(url.toString(),{waitUntil:'domcontentloaded',timeout:30000});
              await page.locator('.view-tabs [data-view="exhibit"]').click();
              await page.waitForFunction(()=>document.querySelector('#exhibitionGrid .exhibition-boat .exhibition-metric strong')?.textContent==='6.85',null,{timeout:30000});
              const heiwajima=await page.locator('#exhibitionGrid .exhibition-boat').first().innerText();
              if(!heiwajima.includes('.02')||!heiwajima.includes('6.85'))throw Error('Real Heiwajima exhibition mismatch');
              if(await page.locator('#exhibitionGrid .exhibition-boat').count()!==6)throw Error('Heiwajima six lanes missing');
              console.log('REAL_SECOND_VENUE_EXHIBITION_PASS',url.toString());
              // Genuine saved Edogawa race with published_wait: do not display unverified exhibition.
              url.searchParams.set('venue','3');url.searchParams.set('race','1');
              await page.goto(url.toString(),{waitUntil:'domcontentloaded',timeout:30000});
              await page.locator('.view-tabs [data-view="exhibit"]').click();
              await page.waitForFunction(()=>document.querySelector('#raceDataStatus')?.textContent.includes('展示が未提供・未検証'),null,{timeout:30000});
              if(await page.locator('#exhibitionGrid .exhibition-boat').count()!==6)throw Error('Edogawa missing-data lanes');
              const previewReadings=await page.locator('#exhibitionGrid .exhibition-boat').evaluateAll(cards=>cards.flatMap(card=>[...card.querySelectorAll('.exhibition-metric')].filter(metric=>['展示タイム','展示ST','チルト'].includes(metric.querySelector('span')?.textContent?.trim())).map(metric=>metric.querySelector('strong')?.textContent?.trim())));
              if(previewReadings.length!==18||previewReadings.some(v=>v!=='—'))throw Error('Edogawa unverified preview leaked: '+JSON.stringify(previewReadings));
              console.log('REAL_MISSING_EXHIBITION_BROWSER_PASS',url.toString());
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Browser-check deployed page
        timeout-minutes: 2
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node - <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            if(!process.env.PAGE_URL)throw Error('No deployed page URL');
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage();
              const faults=[];
              page.on('pageerror',e=>faults.push(e.message));
              await page.route('https://raw.githubusercontent.com/**',r=>r.fulfill({status:404,contentType:'application/json',body:'{}'}));
              await page.route('https://api.github.com/**',r=>r.fulfill({status:404,contentType:'application/json',body:'{}'}));
              const res=await page.goto(process.env.PAGE_URL,{waitUntil:'domcontentloaded',timeout:30000});
              if(!res||res.status()!==200)throw Error('Deployed page HTTP '+res?.status());
              await page.locator('#venues button').first().waitFor();
              if(await page.locator('#venues button').count()!==24)throw Error('Public 24 venue buttons missing');
              if(await page.locator('#races button').count()!==12)throw Error('Public 12 race buttons missing');
              for(const view of ['card','exhibit','forecast']){
                await page.locator('.view-tabs [data-view="'+view+'"]').click();
                const visible=view==='forecast'?await page.locator('#forecast').isVisible():await page.locator('#raceDataSection').isVisible();
                if(!visible)throw Error('Public tab broken: '+view);
              }
              if(faults.length)throw Error('Public JS errors: '+faults.join('; '));
              console.log('DEPLOYED_BROWSER_PASS',process.env.PAGE_URL);
              require('node:fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Public browser navigation: **PASS** (24 venues, 12 races, 3 tabs)\n');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
