name: Research staging smoke test
on:
  push:
    branches:
      - research-capture-v142-isolated-20261025
  workflow_dispatch:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  validate-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Offline syntax and staging audit
        shell: bash
        run: |
          mkdir -p audit-output
          set +e
          python3 -m compileall -q research-capture > audit-output/compile.log 2>&1
          compile_status=$?
          python3 research-capture/staging_audit.py > audit-output/staging-audit.log 2>&1
          audit_status=$?
          printf '{"compile_exit_code":%d,"staging_audit_exit_code":%d,"forecast_generated":false,"scoring":"NOT_RUN"}\n' "$compile_status" "$audit_status" > audit-output/exit-status.json
          if [ "$compile_status" -ne 0 ] || [ "$audit_status" -ne 0 ]; then
            echo "Offline staging verification failed; inspect archived evidence"
            exit 1
          fi
      - name: DNS and HTTPS preflight (no race pages)
        shell: bash
        run: |
          python3 - <<'PY' > audit-output/network-preflight.json
          import socket,ssl,json,datetime
          from urllib.request import Request,urlopen
          hosts=["v-select.jp","www.boatrace.jp","github.com"]
          out=[]
          for host in hosts:
            entry={"host":host,"dns":"unverified","https":"unverified"}
            try:
              socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)
              entry["dns"]="success"
              if host=="github.com":
                req=Request("https://github.com/",headers={"User-Agent":"ResearchNetworkPreflight/1.0"})
                with urlopen(req,timeout=8) as r:
                  entry["https"]="success" if r.status==200 else "status_"+str(r.status)
            except Exception as e:
              entry["error_type"]=type(e).__name__
            out.append(entry)
          print(json.dumps({"checked_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"results":out,"race_pages_requested":0,"forecast_generated":False,"scoring":"NOT_RUN"},indent=2))
          PY
      - name: Safe HTTPS homepage preflight (no race pages)
        shell: bash
        run: |
          python3 - <<'PY' > audit-output/https-preflight.json
          import urllib.request,urllib.error,json,datetime
          rows=[]
          for host in ["v-select.jp","www.boatrace.jp"]:
            rec={"host":host,"homepage_only":True,"tls_http":"unverified"}
            try:
              req=urllib.request.Request("https://"+host+"/",headers={"User-Agent":"ResearchConnectivityCheck/1.0"},method="HEAD")
              with urllib.request.urlopen(req,timeout=12) as res:
                rec["http_status"]=res.status
                rec["tls_http"]="connected"
            except urllib.error.HTTPError as e:
              rec["http_status"]=e.code
              rec["tls_http"]="connected_http_error"
            except Exception as e:
              rec["error_type"]=type(e).__name__
              rec["error"]=str(e)[:120]
            rows.append(rec)
          print(json.dumps({"checked_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"results":rows,"race_pages_requested":0,"results_endpoint_requested":False,"forecast_generated":False},ensure_ascii=False,indent=2))
          PY
      - name: Diagnose official pre-race page structure without result content
        shell: bash
        run: |
          python3 - <<'PY' > audit-output/beforeinfo-structure.json
          import datetime as dt, json, urllib.request, urllib.parse, re, hashlib, html
          from html.parser import HTMLParser
          now=dt.datetime.now(dt.timezone(dt.timedelta(hours=9)))
          day=now.strftime("%Y%m%d")
          url="https://www.boatrace.jp/owpc/pc/race/beforeinfo?"+urllib.parse.urlencode({"rno":"12","jcd":"12","hd":day})
          report={"checked_at_jst":now.isoformat(),"race_id":day+"1212","source_type":"official_beforeinfo","result_endpoint_requested":False,"forecast_generated":False,"scoring":"NOT_RUN"}
          try:
            request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
            with urllib.request.urlopen(request,timeout=15) as resp:
              raw=resp.read(500001)
              charset=resp.headers.get_content_charset() or "utf-8"
              report.update({"http_status":resp.status,"content_type":resp.headers.get("Content-Type",""),"charset":charset,"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest(),"final_path":urllib.parse.urlsplit(resp.url).path})
            decoded=raw.decode(charset,"replace")
            class Structure(HTMLParser):
              def __init__(self):super().__init__();self.tags={};self.tables=0;self.titles=[]
              def handle_starttag(self,tag,attrs):
                self.tags[tag]=self.tags.get(tag,0)+1
                if tag=="table":self.tables+=1
            structure=Structure();structure.feed(decoded)
            report.update({"html_tables":structure.tables,"html_rows":structure.tags.get("tr",0),"html_cells":structure.tags.get("td",0),"page_is_html":"<html" in decoded.lower(),"has_exhibition_token":"展示" in decoded,"has_entry_token":"進入" in decoded,"has_javascript":structure.tags.get("script",0)>0,"has_result_related_token":bool(re.search("払戻金|確定結果|着順結果",decoded)),"safe_for_forecast":False,"raw_page_persisted":False})
          except Exception as exc:report.update({"error_type":type(exc).__name__,"error":str(exc)[:100]})
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Check page identity and redirect without storing page text
        shell: bash
        run: |
          python3 - <<'PY' > audit-output/page-identity.json
          import urllib.request,urllib.parse,urllib.error,datetime,json,hashlib,re
          today=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).strftime("%Y%m%d")
          queries=[
            ("beforeinfo","https://www.boatrace.jp/owpc/pc/race/beforeinfo?"+urllib.parse.urlencode({"rno":"12","jcd":"12","hd":today})),
            ("raceindex","https://www.boatrace.jp/owpc/pc/race/raceindex?"+urllib.parse.urlencode({"jcd":"12","hd":today}))
          ]
          entries=[]
          for label,url in queries:
            row={"endpoint":label,"requested_path":urllib.parse.urlsplit(url).path}
            try:
              request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(request,timeout=15) as r:
                data=r.read(250000); final=urllib.parse.urlsplit(r.url)
                row.update({"status":r.status,"final_path":final.path,"redirected":r.url!=url,"content_type":r.headers.get("Content-Type",""),"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()})
                sample=data.decode("utf-8","replace")
                titles=re.findall(r"<title[^>]*>(.*?)</title\s*>",sample,re.I|re.S)
                row.update({"title_length":len(titles[0].strip()) if titles else 0,"html_tag_count":sample.lower().count("<html"),"body_tag_count":sample.lower().count("<body"),"table_tag_count":sample.lower().count("<table"),"status_403_word":("403 Forbidden" in sample),"status_maintenance_word":("maintenance" in sample.lower())})
            except Exception as e:row.update({"error_type":type(e).__name__,"error":str(e)[:100]})
            entries.append(row)
          print(json.dumps({"checked_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"page_identity_checks":entries,"results_endpoint_requested":False,"forecast_generated":False,"scoring":"NOT_RUN"},ensure_ascii=False,indent=2))
          PY
      - name: Detect official site interstitial without saving page text
        shell: bash
        run: |
          python3 - <<'PY' > audit-output/response-classification.json
          import urllib.request,urllib.parse,json,datetime,hashlib,re
          now=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9)))
          day=now.strftime("%Y%m%d")
          url="https://www.boatrace.jp/owpc/pc/race/beforeinfo?"+urllib.parse.urlencode({"rno":"12","jcd":"12","hd":day})
          info={"at_jst":now.isoformat(),"request_kind":"beforeinfo","result_endpoint_requested":False,"forecast_generated":False}
          try:
            with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=15) as response:
              data=response.read(500000);headers=response.headers
              info.update({"status":response.status,"mime":headers.get("Content-Type"),"server":headers.get("Server"),"cache_control":headers.get("Cache-Control"),"body_sha256":hashlib.sha256(data).hexdigest(),"bytes":len(data)})
            page=data.decode("utf-8","replace")
            hints={"access_denied":r"Access Denied|Forbidden|アクセスが集中|アクセスできません","javascript_challenge":r"enable javascript|JavaScriptを有効|challenge-platform|cf-chl","captcha":r"captcha|reCAPTCHA|hcaptcha","maintenance":r"メンテナンス|maintenance|ただいまご利用いただけません","error":r"エラーが発生|システムエラー|Error 403|Error 404","exhibition":r"展示タイム|展示情報","race_title":r"直前情報|レース一覧"}
            info["hint_matches"]={k:bool(re.search(v,page,re.I)) for k,v in hints.items()}
            info["text_length"]=len(re.sub(r"<[^>]+>","",page))
            info["table_count"]=len(re.findall(r"<table\b",page,re.I))
          except Exception as ex:info["error"]=type(ex).__name__
          print(json.dumps(info,ensure_ascii=False,indent=2))
          PY
      - name: Always publish audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-staging-audit
          path: audit-output/
          if-no-files-found: warn
          retention-days: 30
