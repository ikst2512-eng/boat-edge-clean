name: Publish BOAT EDGE CLEAN
on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: boat-edge-clean-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout published source
        uses: actions/checkout@v4
      - name: Validate CLEAN entry point
        run: |
          test -s index.html
          grep -q 'BOAT EDGE' index.html
          ! grep -q "status==='research'" index.html
      - name: Validate inline JavaScript and TopK UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          page = Path('index.html').read_text()
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', page)
          if len(scripts) != 1:
              raise SystemExit('Expected exactly one inline script')
          for size in (3, 5, 10):
              if f'data-top="{size}"' not in page:
                  raise SystemExit(f'Missing Top{size} selector')
          if "status==='research'" in scripts[0]:
              raise SystemExit('Unverified research prediction fallback')
          Path('/tmp/clean-inline.js').write_text(scripts[0])
          PY
          node --check /tmp/clean-inline.js
      - name: Stage only public files
        run: |
          mkdir -p public
          cp index.html public/index.html
          test -s public/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
