name: Historical version-stratified TopN research
on:
  pull_request:
    paths:
      - four_mode_version_topn_audit.py
      - four_mode_nov05_08_daily_reference_audit.py
      - four_mode_result_raw_csv_audit.py
      - research/four_mode_nov05_08_official_non_scoreable_reference.json
      - test_four_mode_result_raw_csv_audit.py
      - test_four_mode_nov05_08_daily_reference_audit.py
      - test_four_mode_version_topn_audit.py
      - four_mode_forward_paired_score.py
      - four_mode_all_mode_same_job_shadow.py
      - test_four_mode_all_mode_same_job_shadow.py
      - four_mode_all_shadow_reference_review.py
      - test_four_mode_all_shadow_reference_review.py
      - four_mode_all_shadow_durable_ledger.py
      - test_four_mode_all_shadow_durable_ledger.py
      - test_four_mode_forward_paired_score.py
      - research/four_mode_all_modes_forward_protocol_20261106.json
      - research/four_mode_top1_pair_forward_protocol_20261108.json
      - four_mode_top1_forward_reference.py
      - four_mode_top1_head_exposure_audit.py
      - test_four_mode_top1_head_exposure_audit.py
      - test_four_mode_top1_forward_reference.py
      - four_mode_top1_bias_input_audit.py
      - four_mode_nov09_main_original_input_readiness.py
      - four_mode_official_feature_sensitivity_audit.py
      - four_mode_official_future_lineage_preflight.py
      - four_mode_official_raw_semantic_replay.py
      - four_mode_official_exhibition_exploratory.py
      - test_four_mode_official_exhibition_exploratory.py
      - test_four_mode_official_raw_semantic_replay.py
      - test_four_mode_official_future_lineage_preflight.py
      - test_four_mode_official_feature_sensitivity_audit.py
      - test_four_mode_nov09_main_original_input_readiness.py
      - four_mode_top1_head_prior_shadow.py
      - test_four_mode_top1_head_prior_shadow.py
      - research/four_mode_hit_head_prior_forward_protocol_20261108.json
      - test_four_mode_top1_bias_input_audit.py
      - four_mode_top1_capture_run_inventory.py
      - four_mode_capture_attempt_inventory.py
      - test_four_mode_capture_attempt_inventory.py
      - four_mode_candidate_ledger_readiness.py
      - four_mode_main_shadow_deployment_audit.py
      - test_four_mode_main_shadow_deployment_audit.py
      - test_four_mode_candidate_ledger_readiness.py
      - test_four_mode_top1_capture_run_inventory.py
      - docs/research/four_mode_forward_all_modes_20261106.md
      - .github/workflows/version-stratified-topn-research.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  read-only-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce preregistered Top1 selector byte pin before research replay
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          policy = json.loads(Path("research/four_mode_top1_pair_forward_protocol_20261108.json").read_bytes())
          selector = Path("four_mode_all_mode_same_job_shadow.py").read_bytes()
          git_blob = hashlib.sha1(b"blob " + str(len(selector)).encode("ascii") + b"\0" + selector).hexdigest()
          if (policy.get("schema") != "FOUR_MODE_TOP1_PAIR_FORWARD_PREREGISTRATION_V1"
                  or policy.get("selector_file") != "four_mode_all_mode_same_job_shadow.py"
                  or policy.get("pinned_selector_git_blob_sha1") != git_blob
                  or policy.get("eligible_deadline_start_jst") != "2026-11-09T00:00:00+09:00"
                  or policy.get("eligible_deadline_end_jst") != "2026-12-31T23:59:59+09:00"
                  or policy.get("promotion_allowed") is not False
                  or policy.get("formal_count") != 0):
              raise SystemExit("preregistered_top1_selector_or_cohort_drift")
          print("TOP1_SELECTOR_PREREGISTERED_BLOB_VERIFIED:" + git_blob)
          PY
      - name: Validate independent HIT-head prior selector source pin
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          p = json.loads(Path("research/four_mode_hit_head_prior_forward_protocol_20261108.json").read_bytes())
          src = Path("four_mode_top1_head_prior_shadow.py").read_bytes()
          sha = hashlib.sha1(b"blob " + str(len(src)).encode("ascii") + b"\0" + src).hexdigest()
          dependency_pins = p.get("pinned_dependency_git_blob_sha1")
          if not isinstance(dependency_pins, dict) or set(dependency_pins) != {
                  "research_model.py", "four_mode_all_mode_same_job_shadow.py", "clean_four_modes.py"}:
              raise SystemExit("head_prior_dependency_pin_missing")
          for name, expected in dependency_pins.items():
              data = Path(name).read_bytes()
              actual = hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
              if actual != expected:
                  raise SystemExit("head_prior_dependency_drift:" + name)
          if (p.get("schema") != "FOUR_MODE_HIT_WINNER_HEAD_PRIOR_FORWARD_PREREGISTRATION_V1"
                  or p.get("selector_file") != "four_mode_top1_head_prior_shadow.py"
                  or p.get("pinned_selector_git_blob_sha1") != sha
                  or p.get("registered_jst_date") != "2026-11-08"
                  or p.get("eligible_deadline_start_jst") != "2026-11-09T00:00:00+09:00"
                  or p.get("primary_metric") != "paired_HIT_Top1_exact_trifecta_original_versus_head_prior_shadow"
                  or p.get("pilot_races") != 300 or p.get("confirmation_races") != 300
                  or p.get("formal_count") != 0 or p.get("promotion_allowed") is not False):
              raise SystemExit("head_prior_source_or_registration_drift")
          print("HIT_HEAD_PRIOR_SELECTOR_BLOB_VERIFIED:" + sha)
          PY
      - name: Validate audit logic
        run: python -m unittest -v test_four_mode_version_topn_audit
      - name: Check frozen future-only four-mode study policy and leakage refusal
        run: python -m unittest -v test_four_mode_forward_paired_score
      # Bounded REAL Nov10 #1694 audit report, not model/forecast evidence.
      # Reuse its immutable upstream zip+report SHA rather than reimplement
      # the official HTTP/racelist parser in this evaluation-only owner.
      - name: Cross-check actual pinned official T12 audit artifact and four-mode blockers (read-only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import io
          import json
          import os
          import pathlib
          import zipfile
          from urllib.parse import urlsplit
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          repo = "ikst2512-eng/boat-edge-clean"
          run_id = 42777088623
          artifact_id = 13743674560
          zip_sha = "7a5a22c43108a889429d673b9a83d935d1152b543d7d83e225eccf2740080329"
          member_name = "official_t12_nov10_pair_frozen.json"
          member_sha = "9e243d93c62886ed6a6d3a1f31a5a1c309a3dd25d4308f2d29bc7c78f5854742"
          api = f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}"
          token = os.environ["GH_TOKEN"]

          class DropAuthOnCrossHostRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  redirected = super().redirect_request(
                      request, fp, code, msg, headers, newurl)
                  if redirected is None:
                      return None
                  if (urlsplit(redirected.full_url).scheme != "https"
                          or urlsplit(redirected.full_url).hostname is None):
                      raise SystemExit("unsafe_github_artifact_redirect")
                  # GitHub API may redirect to a time-limited signed artifact
                  # URL. Do not forward the GitHub bearer token to that host.
                  if (urlsplit(redirected.full_url).hostname !=
                          urlsplit(request.full_url).hostname):
                      return Request(redirected.full_url, headers={
                          "User-Agent": "four-mode-research-readonly-audit"})
                  return redirected

          opener = build_opener(DropAuthOnCrossHostRedirect())

          def get(url):
              request = Request(url, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "four-mode-research-readonly-audit",
              })
              with opener.open(request, timeout=45) as reply:
                  result = reply.read(2_000_001)
              if len(result) > 2_000_000:
                  raise SystemExit("bounded_upstream_t12_artifact_too_large")
              return result

          # A same-named artifact from a different workflow/branch must not
          # borrow the identity of the audited #1694 immutable CI run.
          upstream_run = json.loads(get(
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}"))
          if (upstream_run.get("id") != run_id
                  or upstream_run.get("workflow_id") != 410481101
                  or upstream_run.get("name") !=
                  "Audit official-pair schedule continuity (read only)"
                  or upstream_run.get("event") != "pull_request"
                  or upstream_run.get("status") != "completed"
                  or upstream_run.get("conclusion") != "success"
                  or upstream_run.get("head_branch") !=
                  "audit/t12-nov06-day-isolation-20261106"
                  or upstream_run.get("head_sha") !=
                  "50073744ca927b728e0eb766a4d392e97a7436da"
                  or (upstream_run.get("head_repository") or {}).get(
                      "full_name") != repo):
              raise SystemExit("untrusted_upstream_t12_ci_workflow_run")
          meta = json.loads(get(api))
          if (meta.get("id") != artifact_id
                  or meta.get("name") != f"official-pair-schedule-audit-{run_id}"
                  or meta.get("digest") != "sha256:" + zip_sha
                  or meta.get("expired") is not False
                  or (meta.get("workflow_run") or {}).get("id") != run_id):
              raise SystemExit("unverified_or_expired_independent_audit_artifact")
          raw_zip = get(api + "/zip")
          if hashlib.sha256(raw_zip).hexdigest() != zip_sha:
              raise SystemExit("source_audit_zip_digest_drift")
          with zipfile.ZipFile(io.BytesIO(raw_zip)) as z:
              names = z.namelist()
              if names.count(member_name) != 1 or len(names) != len(set(names)):
                  raise SystemExit("source_audit_zip_member_missing_or_duplicate")
              for item in z.infolist():
                  if (item.file_size > 2_000_000
                          or ".." in pathlib.PurePosixPath(item.filename).parts
                          or item.filename.startswith("/")):
                      raise SystemExit("unsafe_source_audit_zip_member")
              if z.testzip() is not None:
                  raise SystemExit("source_audit_zip_crc_failed")
              report_bytes = z.read(member_name)
          if hashlib.sha256(report_bytes).hexdigest() != member_sha:
              raise SystemExit("source_audit_report_member_digest_drift")
          report = json.loads(report_bytes)
          if (report.get("schema") != "T12_PINNED_SCHEDULED_PAIR_FROZEN_REPLAY_V1"
                  or report.get("source_run_id") != 42769768447
                  or report.get("source_artifact_id") != 13740574410
                  or report.get("source_original_zip_sha256_from_metadata") !=
                  "cdfdeae53222a5b7852ba5cf5b6b44080247ec074c8d3dbaf53c4a32fe9706dd"
                  or report.get("pinned_forecast_ref") !=
                  "c4d39245cbc96b6c680585a68c3b9adf6ddeb921"
                  or report.get("github_server_source_archive_published_at_utc") !=
                  "2026-11-10T06:38:25+00:00"
                  or report.get("day_jst") != "20261110"
                  or report.get("formal") is not False):
              raise SystemExit("unexpected_pinned_upstream_audit_report")
          pathlib.Path("four_mode_upstream_t12_20261110.json").write_bytes(report_bytes)

          # A distinct, later #1694 audit run witnessed the EXISTENCE of the
          # unchanged original forecast Git blobs before their official raw
          # sources arrived. It did NOT witness FIRST Git remote acceptance.
          witness_run_id = 42785714984
          witness_artifact_id = 13749521670
          witness_zip_sha = "9f8cf0276695dc93e8febb378cac5507bb8caed94bf624e3a22d0a6f4a256239"
          witness_member = "official_t12_nov10_remote_added_blob_witness.json"
          witness_member_sha = "f25deb06ea42af6be22d89226467c3809a090959a85b09d7fe79663c04eb0e7a"
          witness_run = json.loads(get(
              f"https://api.github.com/repos/{repo}/actions/runs/{witness_run_id}"))
          if (witness_run.get("id") != witness_run_id
                  or witness_run.get("workflow_id") != 410481101
                  or witness_run.get("name") !=
                  "Audit official-pair schedule continuity (read only)"
                  or witness_run.get("event") != "pull_request"
                  or witness_run.get("status") != "completed"
                  or witness_run.get("conclusion") != "success"
                  or witness_run.get("head_branch") !=
                  "audit/t12-nov06-day-isolation-20261106"
                  or witness_run.get("head_sha") !=
                  "e7ad91a833e9de8a5d2f376e84d2d8beeeac7bff"
                  or (witness_run.get("head_repository") or {}).get(
                      "full_name") != repo):
              raise SystemExit("untrusted_upstream_added_blob_witness_ci_run")
          witness_api = (
              f"https://api.github.com/repos/{repo}/actions/artifacts/{witness_artifact_id}")
          witness_meta = json.loads(get(witness_api))
          if (witness_meta.get("id") != witness_artifact_id
                  or witness_meta.get("name") !=
                  f"official-pair-schedule-audit-{witness_run_id}"
                  or witness_meta.get("digest") != "sha256:" + witness_zip_sha
                  or witness_meta.get("expired") is not False
                  or (witness_meta.get("workflow_run") or {}).get("id") !=
                  witness_run_id):
              raise SystemExit("untrusted_remote_existence_witness_artifact")
          witness_zip = get(witness_api + "/zip")
          if hashlib.sha256(witness_zip).hexdigest() != witness_zip_sha:
              raise SystemExit("remote_existence_witness_zip_sha_drift")
          with zipfile.ZipFile(io.BytesIO(witness_zip)) as z:
              names = z.namelist()
              if (len(names) != len(set(names))
                      or names.count(witness_member) != 1
                      or names.count(member_name) != 1):
                  raise SystemExit("remote_witness_members_missing_or_duplicate")
              for item in z.infolist():
                  if (item.file_size > 2_000_000
                          or ".." in pathlib.PurePosixPath(item.filename).parts
                          or item.filename.startswith("/")):
                      raise SystemExit("unsafe_remote_witness_zip_member")
              if z.testzip() is not None:
                  raise SystemExit("remote_witness_zip_crc_failed")
              witness_bytes = z.read(witness_member)
              upstream_same_bytes = z.read(member_name)
          if (hashlib.sha256(witness_bytes).hexdigest() != witness_member_sha
                  or upstream_same_bytes != report_bytes):
              raise SystemExit("remote_witness_not_bound_to_same_source_replay_bytes")
          witness = json.loads(witness_bytes)
          if (witness.get("schema") != "T12_NOV10_REMOTE_ADDED_BLOB_WITNESS_V1"
                  or witness.get("source_races") != 2
                  or witness.get("immutable_forecast_blobs_witnessed") != 4
                  or witness.get("remote_commit_existed_before_official_sources") != 4
                  or witness.get("exact_first_remote_git_acceptance_instants_verified") != 0
                  or witness.get("forecasts_proven_to_consume_official_originals") != 0
                  or witness.get("new_formal_certifications") != 0
                  or witness.get("formal") is not False):
              raise SystemExit("witness_first_remote_or_post_source_forgery")
          pathlib.Path("four_mode_upstream_remote_witness_20261110.json").write_bytes(
              witness_bytes)
          print("NOV10_UPSTREAM_WITNESS_RUN_PIN_VERIFIED:" + str(witness_run_id))
          print("NOV10_REMOTE_EXISTENCE_WITNESS_JSON_SHA256_VERIFIED:" +
                witness_member_sha)
          print("NOV10_UPSTREAM_AUDIT_RUN_PIN_VERIFIED:" + str(run_id))
          print("NOV10_UPSTREAM_AUDIT_ZIP_SHA256_VERIFIED:" + zip_sha)
          print("NOV10_UPSTREAM_AUDIT_JSON_SHA256_VERIFIED:" + member_sha)
          PY
          python four_mode_forward_paired_score.py --upstream-t12-report four_mode_upstream_t12_20261110.json > four_mode_t12_blockers_20261110.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("four_mode_t12_blockers_20261110.json").read_text(encoding="utf-8"))
          rows = {r["race_code"]: r for r in report["race_rows"]}
          if (report.get("schema") != "FOUR_MODE_OFFICIAL_T12_UPSTREAM_HANDOFF_BLOCKERS_V1"
                  or set(rows) != {"202611101202", "202611102211"}
                  or report.get("upstream_race_count") != 2
                  or report.get("formal_candidate_pairs_added") != 0
                  or report.get("pilot_added") != 0
                  or report.get("confirmation_added") != 0
                  or report.get("formal") is not False
                  or report.get("model_promotion_allowed") is not False):
              raise SystemExit("unsafe_or_incomplete_real_nov10_handoff")
          if (rows["202611101202"]["official_two_source_pair_complete_by_t12_reference_only"] is not True
                  or rows["202611102211"]["official_two_source_pair_complete_by_t12_reference_only"] is not False
                  or not all("same_race_official_racelist_original_missing" in r["blocking_gates"]
                             for r in rows.values())
                  or any(r.get("candidate_admitted_to_registered_600") is not False
                         for r in rows.values())):
              raise SystemExit("real_nov10_official_blockers_hidden_or_reclassified")
          print("NOV10_REAL_PINNED_SOURCE_TO_FOUR_MODE_BLOCKERS_PASS:2:FORMAL=0")
          PY
          python four_mode_forward_paired_score.py --upstream-t12-report four_mode_upstream_t12_20261110.json --upstream-remote-witness four_mode_upstream_remote_witness_20261110.json > four_mode_prior_remote_existence_20261110.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(
              "four_mode_prior_remote_existence_20261110.json").read_text(encoding="utf-8"))
          rows = {r["race_code"]: r for r in report["race_rows"]}
          if (report.get("schema") !=
                  "FOUR_MODE_PRIOR_REMOTE_EXISTENCE_CAUSAL_ORDER_HANDOFF_V1"
                  or set(rows) != {"202611101202", "202611102211"}
                  or report.get("old_forecast_commit_existence_upper_bounds") != 4
                  or report.get("first_remote_git_acceptance_instants_proven") != 0
                  or report.get("new_source_consuming_candidate_forecasts") != 0
                  or report.get("pilot_added") != 0
                  or report.get("confirmation_added") != 0
                  or report.get("formal") is not False
                  or report.get("model_promotion_allowed") is not False):
              raise SystemExit("remote_existence_misclassified_as_first_remote_or_formal")
          for race, detail in rows.items():
              if (detail.get("existing_forecast_disqualified_from_post_source_study")
                      is not True or
                      set(detail.get("prior_forecast_remote_existence_bounds", {}))
                      != {"clean", "v2_four_mode"}):
                  raise SystemExit("missing_same_race_prior_remote_existence:" + race)
              for mode, f in detail["prior_forecast_remote_existence_bounds"].items():
                  if (f.get("original_blob_existed_before_official_pair_reference_only")
                          is not True or
                          f.get("independent_first_remote_acceptance_instant_verified")
                          is not False or
                          f.get("candidate_eligible_for_registered_600") is not False):
                      raise SystemExit("misclassified_immutable_pre_source_forecast:" + mode)
          print("NOV10_OLD_REMOTE_EXISTS_PRE_SOURCE:4:FIRST_RECEIPT=0:FORMAL=0")
          PY
      - name: Test pre-result frozen all-mode candidate invariants
        run: python -m unittest -v test_four_mode_all_mode_same_job_shadow
      - name: Test standalone HIT-head prior proposal without any outcomes
        run: python -m unittest -v test_four_mode_top1_head_prior_shadow
      - name: Replay Nov8 original HIT-head proposal input only
        run: python four_mode_top1_head_prior_shadow.py --day 20261108 | tee hit_head_prior_nov8_input_only.json
      - name: Refuse incomplete or result-leaking HIT-head proposal input
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("hit_head_prior_nov8_input_only.json").read_text())
          if (x.get("status") != "historical_input_replay_no_outcome_access"
                  or x.get("original_forecasts") < 116
                  or x.get("results_read") is not False
                  or x.get("non_hit_modes_unchanged") is not True
                  or x.get("formal") is not False
                  or x.get("model_improvement_proven") is not False
                  or x.get("model_promotion_allowed") is not False):
              raise SystemExit("incomplete_or_unsafe_head_prior_input_replay")
          print("HIT_HEAD_PRIOR_INPUT_ONLY_VERIFIED:" + str(x["original_forecasts"]))
          PY
      - name: Unit-test Top1 first-boat versus third-boat change accounting
        run: python -m unittest -v test_four_mode_top1_head_exposure_audit
      - name: Replay real Nov 5 original forecasts without reading results
        run: python four_mode_all_mode_same_job_shadow.py --audit-historical-input-day 20261105
      # Historical input-only check. This mode never opens confirmed results,
      # so it cannot turn a settled Nov 6-8 race into prospective evidence.
      - name: Replay saved Nov 6-8 V2 inputs without any result reads
        shell: bash
        run: |
          set -euo pipefail
          python four_mode_all_mode_same_job_shadow.py --audit-historical-input-day 20261106 | tee four_mode_shadow_input_replay_20261106.log
          python four_mode_all_mode_same_job_shadow.py --audit-historical-input-day 20261107 | tee four_mode_shadow_input_replay_20261107.log
          python four_mode_all_mode_same_job_shadow.py --audit-historical-input-day 20261108 | tee four_mode_shadow_input_replay_20261108.log
      - name: Reject incomplete real V2 replays and protected-rank drift
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          # Nov 8 had 116 initial forecasts; additional same-day first-adds
          # must be included rather than causing an obsolete hardcoded count.
          for day, minimum in (("20261106", 130), ("20261107", 122), ("20261108", 116)):
              lines = Path(f"four_mode_shadow_input_replay_{day}.log").read_text(
                  encoding="utf-8"
              ).splitlines()
              prefix = "FOUR_MODE_SHADOW_HISTORICAL_INPUT="
              if len(lines) != 1 or not lines[0].startswith(prefix):
                  raise SystemExit(f"unverifiable_input_replay:{day}")
              report = json.loads(lines[0][len(prefix):])
              count = report.get("original_v2_races")
              if (report.get("day") != day
                      or type(count) is not int or count < minimum
                      or (day != "20261108" and count != minimum)
                      or report.get("excluded") != {}
                      or report.get("formal") is not False
                      or report.get("result_files_read") is not False
                      or report.get("status") != "historical_input_replay_only"):
                  raise SystemExit(f"incomplete_or_result_leaking_replay:{day}")
              modes = report.get("changes")
              if type(modes) is not dict or set(modes) != {
                  "narrow", "hit", "balance", "hole"
              }:
                  raise SystemExit(f"missing_mode_replay:{day}")
              for mode, changes in modes.items():
                  if (changes.get("changed_all_tickets") != count
                          or changes.get("changed_top1") != 0):
                      raise SystemExit(f"method_or_top1_drift:{day}:{mode}")
              top1 = report.get("top1_pair_changes")
              if (type(top1) is not dict or set(top1) != set(modes)
                      or any(type(x.get("changed_top1")) is not int
