name: Official JS dependency probe (temporary)
on:
  pull_request:
    paths: ['.github/workflows/official-js-dependency-experiment.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Download declared official JS and identify network endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import urllib.request,re,json,hashlib
          from pathlib import Path
          out={}
          for kind in ("beforeinfo_c","beforeinfo_m","beforeinfo_v"):
              url=f"https://www.boatrace.jp/owsp/js/beforeinfo/{kind}.js"
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"BOAT-EDGE-CLEAN-EVIDENCE/1.0"}),timeout=18) as r:
                      raw=r.read(1000001)
                  if len(raw)>1000000: raise ValueError("script too large")
                  Path(f"evidence/{kind}.js").write_bytes(raw)
                  txt=raw.decode("utf-8",errors="replace")
                  lines=[line.strip()[:250] for line in txt.splitlines() if any(s in line for s in ("ajax","fetch(",".get(",".post(","url:","/owsp/","race/beforeinfo"))][:40]
                  out[kind]={"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest(),"candidates":lines}
              except Exception as e:
                  out[kind]={"error":type(e).__name__}
          Path("evidence/report.json").write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False)[:6500])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-beforeinfo-js-dependency
          path: evidence/
          retention-days: 7
