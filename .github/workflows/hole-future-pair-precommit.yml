name: Hole future pair precommit research (nonformal)
on:
  pull_request:
    paths:
      - hole_future_pair_precommit.py
      - hole_pair_remote_receipt_evidence.py
      - hole_pair_write_once_candidate_ledger.py
      - research/hole_pair_first_receipt_worker.mjs
      - research/hole_pair_first_receipt_schema.sql
      - research/test_hole_pair_first_receipt_worker.mjs
      - research/test_hole_pair_first_receipt_sql.py
      - docs/research/hole_pair_cloudflare_first_acceptance_draft.md
      - test_hole_pair_write_once_candidate_ledger.py
      - research/hole_pair_capture_launch_audit.py
      - research/test_hole_pair_capture_launch_audit.py
      - research/hole_pair_d1_receipt_chain_audit.py
      - research/test_hole_pair_d1_receipt_chain_audit.py
      - research/hole_pair_universe_coverage.py
      - research/test_hole_pair_universe_coverage.py
      - research/hole_pair_cross_batch_roster.py
      - research/test_hole_pair_cross_batch_roster.py
      - research/hole_pair_manual_capture.py
      - research/test_hole_pair_manual_capture.py
      - test_hole_pair_remote_receipt_evidence.py
      - research/hole_pair_future_holdout_protocol_20261109.json
      - test_hole_future_pair_precommit.py
      - hole_future_pair_pinned92_score.py
      - test_hole_future_pair_pinned92_score.py
      - .github/workflows/hole-future-pair-precommit.yml
  workflow_dispatch:
    inputs:
      capture_day_jst:
        description: 'Current JST YYYYMMDD only; 20261109+; no retrospective backfill'
        required: true
        type: string
      acknowledgement:
        description: 'Type CAPTURE_UNVERIFIED_RESEARCH; never formal or production'
        required: true
        type: string
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify new predeclared research policies
        run: python -m unittest -v test_hole_future_pair_precommit.py test_hole_future_pair_pinned92_score.py test_hole_pair_remote_receipt_evidence.py test_hole_pair_write_once_candidate_ledger.py
      - name: Validate un-deployed Cloudflare D1 first-acceptance receiver offline
        run: |
          node --test research/test_hole_pair_first_receipt_worker.mjs
          python -m unittest -v research/test_hole_pair_first_receipt_sql.py
      - name: Fail closed on purported D1 receipt chain (offline, nonformal)
        run: python -m unittest -v research/test_hole_pair_d1_receipt_chain_audit.py
      - name: Audit immutable-main source snapshot ID coverage (synthetic, read-only)
        run: python -m unittest -v research/test_hole_pair_universe_coverage.py
      - name: Audit overlapping research runs and repeated race IDs (synthetic, read-only)
        run: python -m unittest -v research/test_hole_pair_cross_batch_roster.py
      - name: Test manual-only research capture driver (no real dispatch)
        run: python -m unittest -v research/test_hole_pair_manual_capture.py
      - name: Audit default-branch manual-dispatch registration (read-only)
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v research/test_hole_pair_capture_launch_audit.py
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          python research/hole_pair_capture_launch_audit.py --default-ref origin/main > research_capture_launch_readiness.json
          python - <<'PY'
          import json
          r=json.load(open('research_capture_launch_readiness.json'))
          assert r['formal'] is False
          assert r['production_promotion_allowed'] is False
          assert r['capture_run_executed_by_this_audit'] is False
          assert r['candidate_artifact_created_by_this_audit'] is False
          assert r['main_or_production_modified'] is False
          print('DISPATCH_PREREQUISITE',r['default_branch_dispatch_prerequisite_satisfied'])
          print('BLOCKERS',r['blockers'])
          PY
      - name: Prove Nov 5 is excluded before opening any forecast
        run: |
          python hole_future_pair_precommit.py 202611050101 > research_not_eligible.json
          python - <<'PY'
          import json
          data=json.load(open('research_not_eligible.json'))
          assert data['status']=='not_yet_eligible_or_invalid_code'
          assert data['formal'] is False
          assert data['production_forecast_changed'] is False
          print(data['status'])
          PY
      - name: Freeze future race candidates from immutable main forecasts (research only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          HOLE_RESEARCH_CAPTURE_DAY: ${{ inputs.capture_day_jst }}
          HOLE_RESEARCH_MANUAL_ACK: ${{ inputs.acknowledgement }}
        run: |
          set -euo pipefail
          # Manual gateway on the default branch requires separate review.
          # Read immutable main forecasts only. Never read race results or push.
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          python research/hole_pair_manual_capture.py --capture-day "$HOLE_RESEARCH_CAPTURE_DAY" --output research_candidate_freeze.json
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: hole-future-pair-precutoff-candidates
          path: research_candidate_freeze.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: hole-future-pair-precommit-readiness
          path: |
            research_not_eligible.json
            research_capture_launch_readiness.json
