name: One-date Shimonoseki 10R joint official T12 evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/official-shimonoseki10-joint-oneoff-20261102.yml'
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect original official evidence
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          python - <<'PY'
          import datetime,json,os,re
          from pathlib import Path
          from scripts.capture_official_beforeinfo_json import capture as before
          from scripts.capture_official_odds_receipt import capture as odds
          from scripts.audit_joint_official_receipts import audit_pair
          jst=datetime.timezone(datetime.timedelta(hours=9))
          if datetime.datetime.now(jst).date().isoformat()!='2026-11-02':
              raise SystemExit('Outside one-date experiment')
          race='202611021910'
          Path('reports').mkdir()
          import time
          for attempt in range(1, 4):
              a=before(race,'evidence','before'+os.environ['GITHUB_RUN_ID']+'_'+str(attempt))
              Path(f'reports/before_{attempt}.json').write_text(json.dumps(a,ensure_ascii=False,indent=2))
              if a.get('status')!='official_json_observed_not_t12_certified' or not re.fullmatch(r'\d{2}:\d{2}',str(a.get('deadline_display'))):
                  raise SystemExit('Official beforeinfo failed')
              deadline=datetime.datetime.fromisoformat('2026-11-02T'+a['deadline_display']+':00+09:00')
              b=odds(race,deadline.isoformat(),'evidence','odds'+os.environ['GITHUB_RUN_ID']+'_'+str(attempt))
              Path(f'reports/odds_{attempt}.json').write_text(json.dumps(b,ensure_ascii=False,indent=2))
              cutoff=deadline-datetime.timedelta(minutes=12)
              before_dir=Path('evidence')/'observations'/('before'+os.environ['GITHUB_RUN_ID']+'_'+str(attempt))/race[:8]/race
              odds_dir=Path('evidence')/'observations'/('odds'+os.environ['GITHUB_RUN_ID']+'_'+str(attempt))/race[:8]/race
              # Reopen both originals and independently recheck hashes, race, and cutoff.
              summary=audit_pair(before_dir,odds_dir)
              summary['attempt']=attempt
              complete=summary['both_complete_before_t12']
              Path(f'reports/joint_{attempt}.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
              print('JOINT_SUMMARY',json.dumps(summary,ensure_ascii=False))
              if complete:
                  break
              if attempt < 3 and datetime.datetime.now(jst) + datetime.timedelta(seconds=65) < cutoff:
                  time.sleep(60)
              else:
                  break
          PY
      - name: Regress independent collectors
        run: |
          python -m unittest discover -s tests -p 'test_capture_official_beforeinfo_json.py' -v
          python -m unittest discover -s tests -p 'test_capture_official_odds_receipt.py' -v
          python -m unittest discover -s tests -p 'test_audit_joint_official_receipts.py' -v
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name != 'pull_request' }}
        with:
          name: shimonoseki10-joint-t12-${{ github.run_id }}
          path: |
            reports/
            evidence/
          retention-days: 14
