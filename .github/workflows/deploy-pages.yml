name: Publish BOAT EDGE CLEAN
on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: boat-edge-clean-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout published source
        uses: actions/checkout@v4
      - name: Validate inline JavaScript and TopK UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          page = Path('index.html').read_text()
          if not page.strip() or 'BOAT EDGE' not in page:
              raise SystemExit('Missing or invalid CLEAN home page')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', page)
          if len(scripts) != 1:
              raise SystemExit('Expected exactly one inline script')
          if 'id="predictionStatus"' not in page:
              raise SystemExit('Missing research prediction status')
          if any(f'data-mode="{mode}"' in page for mode in ('hit', 'balance', 'hole', 'narrow')):
              raise SystemExit('Old prediction selectors must not appear')
          if "status==='research'" in scripts[0]:
              raise SystemExit('Unverified research prediction fallback')
          ids = re.findall(r'\bid="([^"]+)"', page)
          if len(ids) != len(set(ids)):
              raise SystemExit('Duplicate HTML id')
          referenced = re.findall(r"getElementById\('([^']+)'\)", scripts[0])
          missing = sorted(set(referenced) - set(ids))
          if missing:
              raise SystemExit(f'Missing DOM targets: {missing}')
          if 'cleanFourModeForecast' not in scripts[0]:
              raise SystemExit('CLEAN independent four-mode forecast loader missing')
          Path('/tmp/clean-inline.js').write_text(scripts[0])
          PY
          node --check /tmp/clean-inline.js
      - name: Stage only public files
        run: |
          mkdir -p public
          cp index.html public/index.html
          test -s public/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record deployed revision
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "### BOAT EDGE CLEAN deployed revision"
            echo "Commit: \`$GITHUB_SHA\`"
            echo "Pages URL: $PAGE_URL"
            echo "Browser diagnostics run after publication; their failures are reported separately."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify deployed public page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 "$PAGE_URL" -o /tmp/clean-deployed.html; then
              if cmp -s public/index.html /tmp/clean-deployed.html; then
                echo "Public page byte-identical PASS: $PAGE_URL"
                echo "Public HTML: **PASS** (byte-identical to deployed revision)" >> "$GITHUB_STEP_SUMMARY"
                sha256sum public/index.html
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Public HTML: **FAIL / UNCONFIRMED** (unavailable or differs from deployed revision)" >> "$GITHUB_STEP_SUMMARY"
          echo "Public page verification FAIL: deployed HTML differs from current index.html or is unavailable: $PAGE_URL" >&2
          exit 1
      - name: Browser interaction smoke test
        timeout-minutes: 5
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
          node - <<'JS'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({viewport:{width:390,height:844}});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              await page.route('https://raw.githubusercontent.com/**',r=>r.fulfill({status:404,headers:{'access-control-allow-origin':'*'},body:'{}'}));
              await page.route('https://api.github.com/**',r=>r.fulfill({status:404,headers:{'access-control-allow-origin':'*'},body:'{}'}));
              await page.goto('file://'+process.cwd()+'/index.html',{waitUntil:'domcontentloaded'});
              await page.locator('#venues button').first().waitFor({timeout:15000});
              if(await page.locator('#venues button').count()!==24)throw Error('home must offer 24 venues');
              if(await page.locator('#races button').count()!==12)throw Error('home must offer 12 race choices');
              await page.locator('#venues button').nth(11).click();
              // Venue selection can navigate to the forecast; restore the home picker before a second selection.
              await page.evaluate(()=>setView('home'));
              await page.locator('#races button').nth(4).click();
              if(!(await page.locator('#activeRaceLabel').innerText()).includes('5R'))throw Error('race selection failed');
              await page.evaluate(()=>setView('forecast'));
              if(await page.locator('[data-home-only]:visible').count()!==0)throw Error('venue list leaked into forecast page');
              if(await page.locator('#forecast [data-mode]').count()!==0)throw Error('legacy mode controls must be absent on forecast');
              if(await page.locator('#forecast .legacy-mode-comparison').count()!==0)throw Error('legacy comparison should not appear in forecast');
              if(await page.locator('#predictionStatus').count()!==1)throw Error('research prediction status missing');
              for(const view of ['exhibit','card','result','review']){
                await page.evaluate(v=>setView(v),view);
                if(await page.locator('[data-home-only]:visible').count()!==0)throw Error('home grid leaked into '+view);
              }
              if(errors.length)throw Error('JavaScript errors: '+errors.join('; '));
              console.log('CLEAN_BROWSER_SMOKE_PASS: four modes, home-only venues, mobile navigation');
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Verify published CLEAN confirmed result in browser
        timeout-minutes: 3
        continue-on-error: false
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage({viewport:{width:390,height:844}});
              const key='202610272301';
              const archive='https://raw.githubusercontent.com/ikst2512-eng/boat-edge-clean/main/confirmed_results/'+key+'.json';
              const archived=await page.request.get(archive,{timeout:30000});
              if(!archived.ok())throw Error('CLEAN committed result not available: HTTP '+archived.status());
              const expected=await archived.json();
              if(expected.race_code!==key||expected.status!=='confirmed'||expected.finish_order?.join('-')!=='1-2-5')throw Error('CLEAN archived race inconsistent with published result');
              const url=new URL(process.env.PAGE_URL);
              url.searchParams.set('date','2026-10-27');
              url.searchParams.set('venue','23');
              url.searchParams.set('race','1');
              url.searchParams.set('view','result');
              await page.goto(url.toString(),{waitUntil:'domcontentloaded',timeout:30000});
              await page.evaluate(() => {setView('result');loadResult();});
              await page.waitForFunction(()=>document.querySelector('#resultStatus')?.textContent?.startsWith('CLEAN保存済み結果'),null,{timeout:30000});
              const shown=await page.locator('#resultDetail .result-combo .boat-num').allTextContents();
              if(shown.join('-')!==expected.finish_order.join('-'))throw Error('Result UI differs from committed CLEAN archive: '+shown.join('-'));
              if(await page.locator('#resultComparison .comparison-hit, #resultComparison .comparison-miss').count())throw Error('Unverified formal forecast was scored');
              console.log('CLEAN_RESULT_PUBLISHED_BROWSER_PASS',url.toString(),shown.join('-'));
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Browser-check deployed page
        timeout-minutes: 2
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node - <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            if(!process.env.PAGE_URL)throw Error('No deployed page URL');
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage();
              const faults=[];
              page.on('pageerror',e=>faults.push(e.message));
              await page.route('https://raw.githubusercontent.com/**',r=>r.fulfill({status:404,contentType:'application/json',body:'{}'}));
              await page.route('https://api.github.com/**',r=>r.fulfill({status:404,contentType:'application/json',body:'{}'}));
              const res=await page.goto(process.env.PAGE_URL,{waitUntil:'domcontentloaded',timeout:30000});
              if(!res||res.status()!==200)throw Error('Deployed page HTTP '+res?.status());
              const leaked=await page.evaluate(()=>{
                const text=document.body.innerText;
                return ['if(item.state!==', 'verifiedFourModeRace(key)', 'predictionModes=confirmed.modes', 'if(token!==resultListRequestId'].find(marker=>text.includes(marker))||null;
              });
              if(leaked)throw Error('Public page displays raw JavaScript source: '+leaked);
              const source=await page.content();
              if(!/<\/body>\s*<\/html>\s*$/i.test(source))throw Error('Public HTML closing tags invalid');
              if(await page.locator('script:not([src])').count()!==1)throw Error('Published inline script count invalid');
              await page.locator('#venues button').first().waitFor();
              if(await page.locator('#venues button').count()!==24)throw Error('Public 24 venue buttons missing');
              if(await page.locator('#races button').count()!==12)throw Error('Public 12 race buttons missing');
              for(const view of ['card','exhibit','forecast']){
                await page.evaluate(view => setView(view), view);
                const visible=view==='forecast'?await page.locator('#forecast').isVisible():await page.locator('#raceDataSection').isVisible();
                if(!visible)throw Error('Public tab broken: '+view);
              }
              if(faults.length)throw Error('Public JS errors: '+faults.join('; '));
              console.log('DEPLOYED_BROWSER_PASS',process.env.PAGE_URL);
              require('node:fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Public browser navigation: **PASS** (24 venues, 12 races, 3 tabs)\n');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
