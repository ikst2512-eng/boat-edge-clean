name: CLEAN advanced V392 reference checks
on:
  pull_request:
    paths:
      - advanced_card_preview_v392.py
      - test_advanced_card_preview_v392.py
      - .github/workflows/advanced-v392.yml
  push:
    branches: [main]
    paths:
      - advanced_card_preview_v392.py
      - test_advanced_card_preview_v392.py
      - .github/workflows/advanced-v392.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_advanced_card_preview_v392
