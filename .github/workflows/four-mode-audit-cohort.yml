name: Four-mode historical chronology cohort (research only)
on:
  pull_request:
    paths:
      - 'audit_four_mode_cohort.py'
      - 'audit_four_mode_first_add.py'
      - '.github/workflows/four-mode-audit-cohort.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify full Git history is present
        run: test "$(git rev-parse --is-shallow-repository)" = false
      - name: Print local Git chronology audit counts; not formal accuracy
        run: python audit_four_mode_cohort.py
