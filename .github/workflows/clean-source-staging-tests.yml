name: CLEAN isolated source staging tests
on:
  pull_request:
    paths:
      - clean_source_staging.py
      - test_clean_source_staging.py
      - clean_csv_staging.py
      - test_clean_csv_staging.py
      - clean_source_comparison.py
      - test_clean_source_comparison.py
      - clean_preview_staging.py
      - test_clean_preview_staging.py
      - clean_live_source_probe.py
      - test_clean_live_source_probe.py
      - clean_snapshot_provenance_audit.py
      - test_clean_snapshot_provenance_audit.py
      - .github/workflows/clean-source-staging-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify isolated staging safety
        run: |
          python -m unittest -v test_clean_source_staging test_clean_csv_staging test_clean_source_comparison test_clean_preview_staging test_clean_live_source_probe test_clean_snapshot_provenance_audit
          python clean_snapshot_provenance_audit.py --directory research_snapshots
