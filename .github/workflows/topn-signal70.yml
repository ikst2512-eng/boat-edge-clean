name: CLEAN observational 70-signal top-N comparison
on:
  pull_request:
    paths:
      - compare_topn_signal70.py
      - test_compare_topn_signal70.py
      - .github/workflows/topn-signal70.yml
  push:
    branches: [main]
    paths:
      - compare_topn_signal70.py
      - test_compare_topn_signal70.py
      - .github/workflows/topn-signal70.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_compare_topn_signal70
      - name: Require strict and selective audit cohorts to agree
        run: |
          python - <<'PY'
          from aggregate_prospective_topn import summary
          from compare_topn_signal70 import compare
          days = ("20261029", "20261030")
          strict = summary(days)
          reported = sum(group["evaluated"] for day in days for group in compare(day)["groups"].values())
          print("STRICT_EVALUATED", strict["counts"]["evaluated"], "SELECTIVE_EVALUATED", reported)
          if strict["counts"]["evaluated"] != reported:
              raise SystemExit("AUDIT_COHORT_MISMATCH: selective hit rates cannot be treated as verified")
          PY
      - name: Compare observed signal groups Oct 29
        run: python compare_topn_signal70.py 20261029
      - name: Compare observed signal groups Oct 30
        run: python compare_topn_signal70.py 20261030
      - name: Reconcile October 31 audited cohort and payout coverage
        run: |
          python - <<'PY'
          import json
          from aggregate_prospective_topn import summary
          from compare_topn_signal70 import compare
          strict = summary(("20261031",))
          observed = compare("20261031")
          groups = observed["groups"]
          evaluated = sum(g["evaluated"] for g in groups.values())
          pending = sum(g["awaiting_result"] for g in groups.values())
          rejected = sum(g["rejected"] for g in groups.values())
          if (evaluated, pending, rejected) != tuple(strict["counts"][k] for k in ("evaluated", "awaiting_result", "audit_rejected")):
              raise SystemExit("OCT31_COHORT_MISMATCH")
          print(json.dumps({"day":"20261031","archived":strict["counts"]["archives"],
              "evaluated":evaluated,"pending":pending,"rejected":rejected,
              "payout_verified":sum(g["payout_verified"] for g in groups.values()),
              "top10_hits":sum(g["hits"]["top10"] for g in groups.values())},sort_keys=True))
          PY
      - name: October 31 independent follow-up (pending excluded)
        run: python compare_topn_signal70.py 20261031

      - name: Probe live payout CSV with confirmed-result join
        run: |
          python - <<'PY'
          import csv,io
          from urllib.request import urlopen,Request
          from urllib.error import HTTPError,URLError
          from collect_clean_payouts import parse
          url="https://boatracecsv.github.io/data/results/payouts/2026/10/30.csv"
          try:
              with urlopen(Request(url,headers={"User-Agent":"BOAT-EDGE-CLEAN-PAYOUTS/1.0"}),timeout=20) as r:
                  data=r.read(2000001)
              print("PAYOUT_SOURCE_COLUMNS",csv.DictReader(io.StringIO(data.decode("utf-8-sig"))).fieldnames)
              joined=parse("20261030",data)
              print("PAYOUT_JOINED_RACES",len(joined))
              if not joined:raise SystemExit("NO_PAYOUT_JOIN")
          except (HTTPError,URLError) as err:
              print("PAYOUT_SOURCE_ERROR",repr(err))
              raise
          PY
