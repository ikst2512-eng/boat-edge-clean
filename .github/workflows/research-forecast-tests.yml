      - 'advanced_card_preview_v392.py'
      - 'test_advanced_card_preview_v392.py'
      - 'fresh_*.py'
      - 'test_fresh_*.py'
      - '.github/workflows/fresh-prospective-capture.yml'
  pull_request:
    paths:
      - 'four_mode_frozen_diagnostic.py'
      - 'test_four_mode_frozen_diagnostic.py'
      - 'four_mode_raw_source_match.py'
      - 'test_four_mode_raw_source_match.py'
      - 'audit_four_mode_first_add.py'
      - 'test_audit_four_mode_first_add.py'
      - 'research_model.py'
      - 'aggregate_prospective_topn.py'
      - 'scripts/verify_legacy_preservation_samples.py'
      - 'legacy_preservation/samples/**'
