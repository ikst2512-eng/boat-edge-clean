name: Actual five-day CLEAN research validation
on:
  pull_request:
    paths:
      - validate_multiday_actual.py
      - .github/workflows/validate-multiday-actual.yml
  push:
    branches: [main]
    paths:
      - validate_multiday_actual.py
      - .github/workflows/validate-multiday-actual.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare archived predictions with actual independent results
        run: python validate_multiday_actual.py
      - uses: actions/upload-artifact@v4
        with:
          name: five-day-real-research-validation
          path: multiday_actual_validation.json
          if-no-files-found: error
