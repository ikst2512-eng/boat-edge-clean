name: Hole donor ranking exploratory study
on:
  pull_request:
    paths:
      - hole_donor_ranking_research.py
      - test_hole_donor_ranking_research.py
      - .github/workflows/hole-donor-ranking.yml
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v test_hole_donor_ranking_research.py
      - run: python hole_donor_ranking_research.py > hole_donor_ranking.json
      - name: Check evidence limits and show metrics
        run: |
          python - <<'PY'
          import json
          r=json.load(open('hole_donor_ranking.json'))
          assert r['formal'] is False and r['independent_holdout'] is False
          assert r['prospective_validation'] is False and r['production_forecast_changed'] is False
          print('EARLIER',r['earlier'])
          print('LATER',r['later'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hole-donor-ranking
          path: hole_donor_ranking.json
