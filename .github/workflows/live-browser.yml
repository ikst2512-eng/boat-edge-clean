name: CLEAN live browser smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      # Re-test public Pages/Render when release-critical UI or CORS code changes.
      - index.html
      - navigation.js
      - server.py
      - tests/live-racecard-navigation.cjs
      - tests/live-verified-payout.cjs
      - tests/live-archived-forecast.cjs
      - tests/webkit-history-regression.cjs
      - tests/render-http-reachability.sh
      - .github/workflows/live-browser.yml
  schedule:
    - cron: '25 1 * * *'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax before installing browsers
        run: |
          node --check tests/live-racecard-navigation.cjs
          node --check tests/live-archived-forecast.cjs
          node --check tests/webkit-history-regression.cjs
      - name: Capture Render connection timing (non-gating diagnostic)
        shell: bash
        run: |
          set -o pipefail
          bash tests/render-http-reachability.sh 2>&1 | tee render-reachability.log
      - name: Install browser runner
        timeout-minutes: 12
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps --only-shell chromium
          npx playwright install --with-deps webkit
      - name: Check Draft-only WebKit navigation history (offline, no Render calls)
        shell: bash
        run: node tests/webkit-history-regression.cjs
      - name: Test real published Pages and Render API
        shell: bash
        run: |
          set -o pipefail
          node tests/live-racecard-navigation.cjs 2>&1 | tee browser-smoke.log
          node tests/live-verified-payout.cjs 2>&1 | tee -a browser-smoke.log
          node tests/live-archived-forecast.cjs 2>&1 | tee -a browser-smoke.log
      # Existing read-only WebKit/Chromium mobile check; not physical iPhone Safari.
      # Distinct from the Pages->Render CORS release gate.
      - name: Verify iPhone-size WebKit four-mode forecast, odds and race switching
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/smoke_four_mode_mobile.cjs 2>&1 | tee mobile-webkit-smoke.log
      # Browser-engine-specific four-tab assertions on the public Pages UI.
      # PR-simulated CORS is NOT equivalent to production cross-origin success.
      - name: Verify public four tabs with WebKit (simulated CORS clearly labeled)
        if: ${{ success() || failure() }}
        shell: bash
        env:
          BROWSER_ENGINE: webkit
        run: |
          set -o pipefail
          node tests/live-archived-forecast.cjs 2>&1 | tee webkit-public-tabs.log
      # The initial /healthz probe can be 200 even when the live instance
      # fails during this browser run. Never conflate early readiness with
      # post-load public API health. These are two small read-only GETs.
      - name: Recheck Render HTTP after browser work
        if: always()
        shell: bash
        run: |
          failures=0
          for spec in "health|https://boat-edge-clean.onrender.com/healthz" "archive|https://boat-edge-clean.onrender.com/api/four-mode-archive?code=202611061006"; do
            name=${spec%%|*}
            url=${spec#*|}
            if result=$(curl --silent --show-error --location --max-redirs 2 --retry 0 --connect-timeout 5 --max-time 15 --output /dev/null --write-out 'http=%{http_code} ttfb=%{time_starttransfer} total=%{time_total}' "$url" 2>&1); then
              rc=0
            else
              rc=$?
            fi
            echo "RENDER_POST_BROWSER_PROBE name=$name curl_exit=$rc $result"
            if [[ "$rc" -ne 0 || "$result" != *"http=200 "* ]]; then
              failures=$((failures+1))
              echo "::error::Post-browser $name HTTP 200 not verified; initial /healthz pass must not hide an in-run outage."
            fi
          done
          if [[ "$failures" -gt 0 ]]; then exit 1; fi
          echo 'PASS_POST_BROWSER_RENDER_HTTP_ONLY: no claim about real CORS, idle wake or physical Safari.'
      - name: Preserve browser test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-browser-pages-${{ github.run_id }}
          path: |
            browser-smoke.log
            render-reachability.log
            mobile-webkit-smoke.log
            webkit-public-tabs.log
            test-results/
          if-no-files-found: warn
      # This checks the UNSIMULATED live response. A PR-only browser route
      # fulfilling a fake ACAO header can never satisfy production readiness.
      # Intentionally remains red until a separately approved live deployment.
      - name: Gate actual public archive CORS independently of browser simulation
        if: always()
        shell: bash
        run: |
          if ! grep -Eq '^RENDER_DIAG_RELEASE_GATES .*live_archive_cors=pass([[:space:]]|$)' render-reachability.log; then
            echo '::error::Public archive CORS not verified on actual Render response. A PR-simulated ACAO header is not production evidence.'
            grep -E '^RENDER_DIAG_(PROBE name=archive-get|RELEASE_GATES )' render-reachability.log || true
            exit 1
          fi
          echo 'PASS_UNSIMULATED_LIVE_ARCHIVE_CORS_ONLY: actual Pages Origin header returned by Render.'
      # A later data-driven redeploy may make browser tests green after a genuine cold-wake outage.
      # Preserve all logs first, then fail this job if the initial live /healthz probe failed.
      - name: Gate HTTP transport independently of late browser recovery
        if: always()
        shell: bash
        run: |
          if ! grep -Eq '^RENDER_DIAG_RELEASE_GATES health_http=pass([[:space:]]|$)' render-reachability.log; then
            echo '::error::Render /healthz was not HTTP 200 during the initial transport diagnostic; late browser success or data-only redeploy cannot erase this outage.'
            grep -E '^RENDER_DIAG_(PROBE name=health-|RELEASE_GATES )' render-reachability.log || true
            exit 1
          fi
          echo 'PASS_INITIAL_RENDER_HTTP_TRANSPORT_ONLY: live CORS, predeadline exhibition and idle-wake stability require separate proof.'
