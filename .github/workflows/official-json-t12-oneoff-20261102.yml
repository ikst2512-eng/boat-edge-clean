name: One-date official JSON predeadline evidence (research only)
on:
  schedule:
    # Two independent one-date observations: earlier slot protects against
    # GitHub Actions schedule delays; 19:52 JST remains the near-cutoff slot.
    # Both are research-only and cannot certify T-12 eligibility.
    - cron: '48 10 2 11 *'  # 2026-11-02 19:48 JST
    - cron: '52 10 2 11 *'  # 2026-11-02 19:52 JST
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/official-json-t12-oneoff-20261102.yml'
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regression tests
        run: |
          python -m unittest discover -s tests -p 'test_capture_official_beforeinfo_json.py' -v
          python -m unittest discover -s tests -p 'test_inspect_official_beforeinfo_json.py' -v
      - name: Capture immutable official JSON near real deadline
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          # Fail closed if Actions unexpectedly starts on another date.
          [[ "$(TZ=Asia/Tokyo date +%Y-%m-%d)" == "2026-11-02" ]] || { echo 'Outside experiment date'; exit 1; }
          mkdir -p reports
          for i in 1 2 3 4; do
            python -m scripts.capture_official_beforeinfo_json 202611021511 --root official_json_evidence --observation-id "run${GITHUB_RUN_ID}_attempt${i}" > "reports/attempt${i}.json" || true
            if [[ "$i" -lt 4 ]]; then sleep 60; fi
          done
      - name: Audit receipt times and exhibition coverage
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          python - <<'PY'
          import json,datetime,os
          from pathlib import Path
          jst=datetime.timezone(datetime.timedelta(hours=9))
          planned_cutoff=datetime.datetime(2026,11,2,19,54,tzinfo=jst)
          rows=[]
          for p in sorted(Path('reports').glob('attempt*.json')):
              x=json.loads(p.read_text())
              received=x.get('received_at_jst')
              try: t=datetime.datetime.fromisoformat(received)
              except (ValueError,TypeError): t=None
              # The deadline is an independent source value. If it changes,
              # never classify the observation against the previously noted cutoff.
              deadline_matches=x.get('deadline_display')=='20:06'
              rows.append({
                'attempt':p.stem,'status':x.get('status'),
                'received_at_jst':received,
                'before_planned_cutoff':bool(t and t.utcoffset()==datetime.timedelta(hours=9) and t<=planned_cutoff and deadline_matches),
                'source_deadline_matches_plan':deadline_matches,
                'six_unique_boats':x.get('six_unique_boats'),
                'six_exhibition_values':x.get('exhibition_time_nonempty_six'),
                'exhibition_time_observed_boats':x.get('exhibition_time_observed_boats'),
                'tilt_observed_boats':x.get('tilt_observed_boats'),
                'start_exhibition_rows':x.get('start_exhibition_rows'),
                't12_certified':False,'forecast_usable':False
              })
          complete=[r for r in rows if r['status']=='official_json_observed_not_t12_certified'
                    and r['six_unique_boats'] and r['six_exhibition_values']
                    and r['source_deadline_matches_plan']]
          pre_cutoff=[r for r in complete if r['before_planned_cutoff']]
          # The earliest observed complete snapshot is NOT the actual publication time.
          # Never infer T-12 certification from the existence of this record.
          first_complete=min(complete,key=lambda r:r['received_at_jst']) if complete else None
          first_complete_before_cutoff=min(pre_cutoff,key=lambda r:r['received_at_jst']) if pre_cutoff else None
          Path('reports/first_complete_observation.json').write_text(json.dumps({
            'first_complete_observed_at_jst':first_complete['received_at_jst'] if first_complete else None,
            'first_complete_observed_before_planned_cutoff_jst':first_complete_before_cutoff['received_at_jst'] if first_complete_before_cutoff else None,
            't12_certified':False,'forecast_usable':False
          },ensure_ascii=False,indent=2))
          Path('reports/chronology.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          summary=['### Official beforeinfo near-deadline snapshots',
                   'Research only: not T-12 certified and not forecast usable.',
                   f'- First observed six-boat complete receipt: {first_complete["received_at_jst"] if first_complete else "none"}',
                   f'- First observed complete receipt before planned cutoff: {first_complete_before_cutoff["received_at_jst"] if first_complete_before_cutoff else "none"}',
                   '|Attempt|Receipt JST|Before planned 19:54 cutoff|Exhibition values / 6|Tilt values / 6|ST rows|',
                   '|---|---|---|---|---|---|']
          for r in rows:
              summary.append(f"|{r['attempt']}|{r['received_at_jst']}|{r['before_planned_cutoff']}|{r['exhibition_time_observed_boats']}|{r['tilt_observed_boats']}|{r['start_exhibition_rows']}|")
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write(chr(10).join(summary)+chr(10))
          print(json.dumps(rows,ensure_ascii=False))
          if not any(r['status']=='official_json_observed_not_t12_certified' for r in rows):
              raise SystemExit('No official JSON acquired')
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name != 'pull_request' }}
        with:
          name: official-beforeinfo-t12-window-${{ github.run_id }}
          path: |
            reports/
            official_json_evidence/
          if-no-files-found: warn
          retention-days: 14
