name: Entry course missed-cron activation watchdog
on:
  # Separate schedule events for the original jobs remain the primary path.
  # Push, independent CLEAN/V236 and existing read-only audit completions
  # can wake rescue. Audit completion is NOT an on-time T12 schedule run.
  # Delayed GitHub schedule events may still miss a T12 selection window.
  # Ten-minute fallback ticks fit every 12-minute T-12 selection window
  # on the 2026-11-10 schedule; a Cron event is NOT guaranteed to start.
  push:
    branches: [main]
  pull_request:
    paths:
      - scripts/entry_course_activation_watchdog.py
      - tests/test_entry_course_activation_watchdog.py
      - .github/workflows/entry-course-activation-watchdog.yml
  schedule:
    - cron: '3,13,23,33,43,53 23,0-13 * * *'
  workflow_run:
    workflows:
      - "Four-mode prospective capture (research only)"
      - "CLEAN prospective pre-cutoff capture"
      - "CLEAN V236 verification queue"
      # Existing unrelated read-only schedules give independent wakeups if
      # the T12/watchdog own cron does not fire; dispatch remains cooldown-
      # guarded, same-repo/main/schedule-only and research-only.
      - "AI operations read-only audit"
      - "Cross-model content audit"
    types: [completed]
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: entry-course-activation-watchdog-main
  cancel-in-progress: false
jobs:
  recover-missing-schedule:
    # Only same-repo main/schedule parent events may wake this fallback.
    if: >-
      github.repository == 'ikst2512-eng/boat-edge-clean' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.ref == 'refs/heads/main' &&
        (github.event_name != 'workflow_run' ||
         (github.event.workflow_run.event == 'schedule' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (github.event.workflow_run.name != 'CLEAN V236 verification queue' ||
           contains(github.event.workflow_run.created_at, 'T23:') ||
           contains(github.event.workflow_run.created_at, 'T10:'))))))
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate fallback dispatch policy
        run: python -m unittest discover -s tests -p test_entry_course_activation_watchdog.py -v
      - name: Dispatch missing T12/T2 plus independent preview research (not scheduled proof)
        if: github.event_name != 'pull_request'
        run: python scripts/entry_course_activation_watchdog.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Retain fallback decision independently of research capture
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: entry-course-activation-watchdog-${{ github.run_id }}-${{ github.run_attempt }}
          path: entry-course-evidence/activation-watchdog.json
          if-no-files-found: warn
          retention-days: 7
