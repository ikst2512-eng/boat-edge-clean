name: Four-mode scheduled run inventory (read only)
on:
  pull_request:
    paths:
      - 'scripts/inventory_four_mode_capture_runs.py'
      - 'scripts/report_four_mode_schedule_publications.py'
      - 'scripts/report_four_mode_dispatch_publications.py'
      - 'scripts/audit_four_mode_daily_main_archives.py'
      - 'scripts/inventory_four_mode_watchdog_dispatch.py'
      - 'scripts/report_four_mode_watchdog_artifact_decisions.py'
      - 'tests/test_inventory_four_mode_capture_runs.py'
      - 'tests/test_report_four_mode_schedule_publications.py'
      - 'tests/test_report_four_mode_dispatch_publications.py'
      - 'tests/test_audit_four_mode_daily_main_archives.py'
      - 'tests/test_inventory_four_mode_watchdog_dispatch.py'
      - 'tests/test_report_four_mode_watchdog_artifact_decisions.py'
      - '.github/workflows/four-mode-schedule-inventory.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/inventory_four_mode_capture_runs.py'
      - 'scripts/report_four_mode_schedule_publications.py'
      - 'scripts/inventory_four_mode_watchdog_dispatch.py'
      - 'scripts/report_four_mode_source_links.py'
      - 'scripts/audit_four_mode_daily_main_archives.py'
      - '.github/workflows/four-mode-prospective-capture.yml'
      - '.github/workflows/four-mode-capture-watchdog.yml'
      - '.github/workflows/four-mode-schedule-inventory.yml'
  # Read-only daily audit after the morning JST capture window starts.
  # Cron is UTC: 00:20 UTC = 09:20 JST. Does not dispatch captures.
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v tests.test_inventory_four_mode_capture_runs tests.test_report_four_mode_schedule_publications tests.test_report_four_mode_dispatch_publications tests.test_inventory_four_mode_watchdog_dispatch tests.test_report_four_mode_watchdog_artifact_decisions tests.test_audit_four_mode_daily_main_archives
      - name: Check real scheduled run history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.inventory_four_mode_capture_runs --repo "${{ github.repository }}" --output reports/four_mode_schedule_history.json
      - name: Inspect recent capture artifacts without inferring remote push proof
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.report_four_mode_schedule_publications --repo "${{ github.repository }}" --history reports/four_mode_schedule_history.json --output reports/four_mode_schedule_publications.json
      - name: Compare scheduled runs with fallback dispatch and watchdog history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.inventory_four_mode_watchdog_dispatch --repo "${{ github.repository }}" --output reports/four_mode_watchdog_dispatch.json
      - name: Audit fallback dispatch publication artifacts using existing evidence checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.report_four_mode_dispatch_publications --repo "${{ github.repository }}" --history reports/four_mode_watchdog_dispatch.json --output reports/four_mode_dispatch_publications.json
      - name: Audit watchdog decision artifacts and subsequent capture timing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.report_four_mode_watchdog_artifact_decisions --repo "${{ github.repository }}" --history reports/four_mode_watchdog_dispatch.json --output reports/four_mode_watchdog_artifact_decisions.json
      - name: Confirm today's first-add archive presence in checked-out Git main
        run: python -m scripts.audit_four_mode_daily_main_archives --output reports/four_mode_daily_main_archives.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-mode-schedule-history
          path: |
            reports/four_mode_schedule_history.json
            reports/four_mode_schedule_publications.json
            reports/four_mode_watchdog_dispatch.json
            reports/four_mode_dispatch_publications.json
            reports/four_mode_watchdog_artifact_decisions.json
            reports/four_mode_daily_main_archives.json
          if-no-files-found: warn
