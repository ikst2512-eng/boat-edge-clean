              "future_300_plus_300_cohort_admitted":0,
              "hypothesis_calibration_or_improvement_proven":False,
              "results_read_only_in_last_step_after_model_math":True,
              "results_used_to_change_model":False,
              "formal":False,"production_changed":False,
              "by_mode_and_topN_hit_counts":stats,"rows":rows}
          output=tmp/"research-historical-three-race-result-last-DESCRIPTIVE.json"
          output.write_text(json.dumps(result,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          assert json.loads(output.read_text())==result
          print("LOCKED_HISTORICAL_RESULT_LAST_NOT_ACCURACY_PROOF",
                json.dumps({"races":3,"hit_counts":stats,"formal":False},
                           ensure_ascii=False))
