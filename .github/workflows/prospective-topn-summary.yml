name: Prospective Top-N multiday summary
on:
  pull_request:
    paths: [aggregate_prospective_topn.py, test_aggregate_prospective_topn.py, .github/workflows/prospective-topn-summary.yml, 'payout_evidence/**', 'confirmed_results/**', 'prospective_predictions/**']
  push:
    branches: [main]
    paths: [aggregate_prospective_topn.py, test_aggregate_prospective_topn.py, .github/workflows/prospective-topn-summary.yml, 'payout_evidence/**', 'confirmed_results/**', 'prospective_predictions/**']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v test_aggregate_prospective_topn
      - name: Report actual archived Top-N results for Oct 29 and Oct 30
        run: python aggregate_prospective_topn.py 20261029 20261030
      - name: Report October 31 verified result and payout gap
        run: |
          python - <<'PY'
          import json
          from evaluate_clean_prospective_cohort import cohort
          r=cohort("20261031")
          print(json.dumps({"day":"20261031","counts":r["counts"],"payout_unavailable":r["payout_unavailable"],"verified_payout_races":r["roi"]["top10"]["races"],"topn_hit_rate_pct":r["hit_rate_pct"],"topn_roi_pct":{key:value["roi_pct"] for key,value in r["roi"].items()}},sort_keys=True))
          if r["counts"]["archives"] != sum(r["counts"][key] for key in ("evaluated","awaiting_result","audit_rejected")):
              raise SystemExit("COHORT_COUNT_MISMATCH")
          if r["payout_unavailable"] + r["roi"]["top10"]["races"] != r["counts"]["evaluated"]:
              raise SystemExit("PAYOUT_COVERAGE_MISMATCH")
          from pathlib import Path
          import os
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as summary:
              summary.write("## Oct 31 prospective TopN — verified evidence only\\n")
              summary.write(f"- Saved: {r['counts']['archives']}; evaluated: {r['counts']['evaluated']}; pending: {r['counts']['awaiting_result']}; rejected: {r['counts']['audit_rejected']}\\n")
              summary.write(f"- Payout verified: {r['roi']['top10']['races']}; payout unavailable: {r['payout_unavailable']}\\n")
              for n in (3,5,10):
                  key=f"top{n}"
                  summary.write(f"- {key}: hits {r['hits'][key]}/{r['counts']['evaluated']}; hit rate {r['hit_rate_pct'][key]}%; ROI {r['roi'][key]['roi_pct']}% on {r['roi'][key]['races']} payout-verified races\\n")
              summary.write("Research simulations only; missing payout never counts as a loss or a zero return.\\n")

          PY
